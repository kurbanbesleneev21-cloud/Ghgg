<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #000; color: #fff; margin: 0; }
        .gold-text { color: #bf953f; }
        
        /* ТОТ САМЫЙ БЕГУЩИЙ ЗОЛОТОЙ ОБОДОК */
        .premium-card {
            position: relative;
            background: #0d0d0d;
            border-radius: 24px;
            padding: 2px; /* Толщина светящейся линии */
            overflow: hidden;
            margin-bottom: 16px;
        }
        .premium-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent 70%, #bf953f 100%);
            animation: rotate-border 4s linear infinite;
        }
        @keyframes rotate-border { 100% { transform: rotate(360deg); } }
        
        .card-content {
            background: #0d0d0d;
            border-radius: 22px;
            padding: 20px;
            z-index: 1;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ЦВЕТНЫЕ ОПЕРАТОРЫ (ЯРКИЕ ПЛАШКИ) */
        .op-badge { font-size: 10px; padding: 4px 12px; border-radius: 8px; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; display: inline-block; }
        .tag-МЕГАФОН { background: #00B956; color: #fff; } /* Зеленый */
        .tag-МТС { background: #E30613; color: #fff; }     /* Красный */
        .tag-БИЛАЙН { background: #FFD800; color: #000; }  /* Желтый */
        .tag-ТЕЛЕ2 { background: #fff; color: #000; }      /* Белый/Черный */

        /* РЕКЛАМНЫЙ БЛОК (ИЗ АДМИНКИ) */
        #promo-box {
            background: linear-gradient(135deg, rgba(191,149,63,0.1) 0%, rgba(0,0,0,0) 100%);
            border: 1px solid rgba(191,149,63,0.3);
            border-radius: 20px;
            padding: 15px;
            margin: 10px 15px 25px;
        }

        .btn-buy { background: #bf953f; color: #000; font-weight: 800; padding: 12px 20px; border-radius: 14px; font-size: 11px; text-transform: uppercase; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        input { background: #151515!important; border: 1px solid #222!important; color: #fff!important; padding: 16px; border-radius: 16px; width: 100%; outline: none; margin-bottom: 10px; }
        
        .filter-btn { padding: 8px 16px; border-radius: 10px; font-size: 10px; font-weight: 800; background: #111; border: 1px solid #222; text-transform: uppercase; }
        .filter-btn.active { background: #bf953f; color: #000; border-color: #bf953f; }
    </style>
</head>
<body>

    <header class="p-6 flex justify-between items-center sticky top-0 bg-black/90 backdrop-blur-md z-50 border-b border-white/5">
        <h1 class="text-xl font-black italic gold-text">SIM <span class="text-white">MARKET</span></h1>
        <div id="auth-section">
            <button onclick="openM('auth-m')" class="text-[9px] font-black uppercase bg-white text-black px-5 py-2.5 rounded-full">Вход / Рег</button>
        </div>
        <div id="user-info" class="hidden flex items-center gap-3">
            <div class="text-right">
                <p id="u-name" class="text-[10px] font-black uppercase white"></p>
                <p id="u-phone" class="text-[9px] gold-text font-bold"></p>
            </div>
            <button onclick="logout()" class="text-[18px] opacity-30">✕</button>
        </div>
    </header>

    <!-- БЛОК РЕКЛАМЫ ИЗ АДМИНКИ -->
    <div id="promo-box" class="hidden">
        <p class="text-[9px] font-black gold-text uppercase mb-1 tracking-widest">Акция дня</p>
        <h2 id="promo-title" class="text-sm font-bold mb-1"></h2>
        <p id="promo-text" class="text-xs opacity-60"></p>
    </div>

    <!-- ФИЛЬТР ОПЕРАТОРОВ -->
    <div class="flex gap-2 px-4 pb-4 overflow-x-auto no-scrollbar">
        <button onclick="filterBy('ВСЕ')" class="filter-btn active" id="f-all">Все</button>
        <button onclick="filterBy('МЕГАФОН')" class="filter-btn">Мегафон</button>
        <button onclick="filterBy('МТС')" class="filter-btn">МТС</button>
        <button onclick="filterBy('БИЛАЙН')" class="filter-btn">Билайн</button>
        <button onclick="filterBy('ТЕЛЕ2')" class="filter-btn">Tele2</button>
    </div>

    <main class="p-4 pb-24">
        <div id="numbers-grid" class="space-y-1"></div>
    </main>

    <!-- МОДАЛКА АВТОРИЗАЦИИ -->
    <div id="auth-m" class="modal">
        <div class="bg-[#0d0d0d] p-8 rounded-3xl w-full max-w-sm border border-white/10">
            <h3 class="text-xl font-black gold-text mb-6 uppercase italic">Авторизация</h3>
            <div class="space-y-2">
                <input type="text" id="l-phone" placeholder="Ваш номер (928...)">
                <input type="text" id="l-name" placeholder="Ваше Имя (для регистрации)">
                <input type="password" id="l-pass" placeholder="Пароль">
                <button onclick="doAuth()" class="btn-buy w-full py-4 text-xs mt-4">Войти / Создать</button>
                <button onclick="closeM()" class="w-full text-[9px] opacity-20 uppercase mt-4">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        const conf = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(conf);
        const db = firebase.database();

        let activeFilter = "ВСЕ";

        function openM(id) { document.getElementById(id).classList.add('active'); }
        function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }

        // ЗАГРУЗКА РЕКЛАМЫ (БЛОГА)
        function loadPromo() {
            db.ref('blog').limitToLast(1).on('value', snap => {
                const box = document.getElementById('promo-box');
                if(snap.exists()) {
                    box.classList.remove('hidden');
                    snap.forEach(p => {
                        const d = p.val();
                        document.getElementById('promo-title').innerText = d.title;
                        document.getElementById('promo-text').innerText = d.text;
                    });
                }
            });
        }

        // ЗАГРУЗКА НОМЕРОВ С ЦВЕТНЫМИ ОПЕРАТОРАМИ
        function loadNumbers() {
            db.ref('inventory').on('value', snap => {
                const grid = document.getElementById('numbers-grid');
                grid.innerHTML = "";
                snap.forEach(c => {
                    const i = c.val();
                    const op = (i.op || 'МЕГАФОН').toUpperCase();

                    // Логика фильтра
                    if(activeFilter !== "ВСЕ" && op !== activeFilter) return;

                    // Логика исправления букв вместо цифр (берем поле num, если в ключе буквы)
                    let displayNum = i.num || c.key;

                    grid.innerHTML += `
                        <div class="premium-card">
                            <div class="card-content">
                                <div>
                                    <span class="op-badge tag-${op}">${op}</span>
                                    <h4 class="text-2xl font-black italic tracking-tighter">+7 ${displayNum}</h4>
                                    <p class="gold-text font-black text-lg mt-1">${i.price} ₽</p>
                                </div>
                                <button onclick="buy('${displayNum}', '${op}')" class="btn-buy">Купить</button>
                            </div>
                        </div>`;
                });
            });
        }

        function filterBy(op) {
            activeFilter = op;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            loadNumbers();
        }

        function doAuth() {
            const p = document.getElementById('l-phone').value.replace(/\D/g, "");
            const pass = document.getElementById('l-pass').value;
            const name = document.getElementById('l-name').value;
            if(p.length < 10 || pass.length < 3) return alert("Проверьте данные");

            db.ref('users/' + p).once('value', snap => {
                const u = snap.val();
                if(u) {
                    if(u.pass === pass) {
                        localStorage.setItem('user', p);
                        localStorage.setItem('userName', u.name || "Клиент");
                        location.reload();
                    } else alert("Неверный пароль");
                } else {
                    if(!name) return alert("Введите имя для регистрации");
                    db.ref('users/' + p).set({ name: name, pass: pass, role: 'user', regDate: Date.now() }).then(() => {
                        localStorage.setItem('user', p);
                        localStorage.setItem('userName', name);
                        location.reload();
                    });
                }
            });
        }

        function buy(num, op) {
            const uPhone = localStorage.getItem('user');
            const uName = localStorage.getItem('userName');
            if(!uPhone) return openM('auth-m');
            db.ref('orders/' + Date.now()).set({
                clientName: uName, clientPhone: uPhone, wantedNum: num, operator: op, date: new Date().toLocaleString(), status: 'new'
            }).then(() => alert(uName + ", заявка на номер " + num + " принята!"));
        }

        function logout() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            const u = localStorage.getItem('user');
            if(u) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('u-phone').innerText = "+7 " + u;
                document.getElementById('u-name').innerText = localStorage.getItem('userName');
            }
            loadPromo();
            loadNumbers();
        };
    </script>
</body>
</html>
