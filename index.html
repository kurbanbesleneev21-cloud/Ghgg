<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | FULL WORKING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap');
        :root { --gold: #bf953f; --gold-light: #fcf6ba; }
        body { font-family: 'Manrope', sans-serif; background: #000; color: #fff; min-height: 100vh; }
        .gold-text { background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200%; animation: shine 3s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
        .glass-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(191,149,63,0.1); border-radius: 24px; backdrop-filter: blur(10px); position: relative; }
        .tab { padding: 8px 16px; border-radius: 100px; font-size: 10px; font-weight: 800; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .tab.active { background: var(--gold); color: #000; border-color: var(--gold); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(15px); }
        .input-dark { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 15px; color: #fff; outline: none; }
    </style>
</head>
<body class="p-4 pb-32">

    <header class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-black italic gold-text uppercase">SIM MARKET</h1>
        <div id="user-ui" class="hidden flex items-center gap-3 bg-white/5 p-1 pr-4 rounded-full border border-white/10" onclick="openProfile()">
            <div class="w-8 h-8 bg-[#bf953f] rounded-full flex items-center justify-center text-black font-black">К</div>
            <span id="points-display" class="text-xs font-black">0 XP</span>
        </div>
        <button id="login-btn" onclick="openModal('auth-modal')" class="border border-[#bf953f]/40 px-6 py-2 rounded-full text-[10px] font-black uppercase gold-text">Вход</button>
    </header>

    <div class="space-y-4 mb-8">
        <input type="text" id="search-input" oninput="renderItems()" placeholder="Поиск (777, 05)..." class="input-dark">
        <div class="flex gap-2 overflow-x-auto no-scrollbar" id="tabs-container">
            <div class="tab active" onclick="filterOp('ALL', this)">Все</div>
            <div class="tab" onclick="filterOp('МТС', this)">МТС</div>
            <div class="tab" onclick="filterOp('БИЛАЙН', this)">Билайн</div>
            <div class="tab" onclick="filterOp('МЕГАФОН', this)">Мегафон</div>
            <div class="tab" onclick="filterOp('FAV', this)">❤️ Избранное</div>
        </div>
    </div>

    <div id="list" class="grid gap-4"></div>

    <div id="auth-modal" class="modal">
        <div class="bg-[#111] p-8 rounded-[30px] border border-white/5 w-full max-w-xs space-y-4">
            <h2 class="text-xl font-black text-center gold-text uppercase">Вход / Регистрация</h2>
            <input type="tel" id="auth-phone" placeholder="Ваш номер" class="input-dark">
            <button onclick="fakeLogin()" class="w-full bg-[#bf953f] text-black p-3 rounded-xl font-black uppercase text-[11px]">Войти</button>
            <button onclick="closeModals()" class="w-full text-[10px] opacity-40 uppercase font-black">Закрыть</button>
        </div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="bg-[#111] p-8 rounded-[30px] w-full max-w-xs space-y-4 text-center">
            <h2 class="text-xl font-black gold-text italic">ВАШ ПРОФИЛЬ</h2>
            <div class="bg-white/5 p-4 rounded-2xl">
                <p class="text-[10px] opacity-40 uppercase">Бонусы</p>
                <p id="profile-xp" class="text-3xl font-black gold-text">0 XP</p>
            </div>
            <button onclick="logout()" class="text-red-500 font-bold text-xs uppercase">Выйти</button>
            <button onclick="closeModals()" class="w-full text-[10px] opacity-40 uppercase font-black">Назад</button>
        </div>
    </div>

    <script>
        const fbCfg = { apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com" };
        firebase.initializeApp(fbCfg);
        const db = firebase.database();

        let user = JSON.parse(localStorage.getItem('sim_user_omni')) || null;
        let favs = JSON.parse(localStorage.getItem('sim_favs')) || [];
        let inventory = {};
        let currentFilter = 'ALL';

        if(user) updateUI();

        // ФУНКЦИИ ОТКРЫТИЯ ОКОН
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
        function openProfile() { openModal('profile-modal'); }

        // ЛОГИКА ВХОДА
        function fakeLogin() {
            const ph = document.getElementById('auth-phone').value;
            if(!ph) return alert("Введите номер!");
            user = { phone: ph, points: 50 }; // Даем 50 бонусов при входе
            localStorage.setItem('sim_user_omni', JSON.stringify(user));
            updateUI();
            closeModals();
        }

        function logout() { localStorage.removeItem('sim_user_omni'); location.reload(); }

        function updateUI() {
            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('user-ui').classList.remove('hidden');
            document.getElementById('points-display').innerText = user.points + " XP";
            document.getElementById('profile-xp').innerText = user.points + " XP";
        }

        // ФИЛЬТРАЦИЯ
        function filterOp(op, el) {
            currentFilter = op;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderItems();
        }

        // ИЗБРАННОЕ
        function toggleFav(num, event) {
            event.stopPropagation();
            if(favs.includes(num)) {
                favs = favs.filter(n => n !== num);
            } else {
                favs.push(num);
            }
            localStorage.setItem('sim_favs', JSON.stringify(favs));
            renderItems();
        }

        // ПОЛУЧЕНИЕ ДАННЫХ И РЕНДЕР
        db.ref('inventory').on('value', s => {
            inventory = s.val() || {};
            renderItems();
        });

        function renderItems() {
            const list = document.getElementById('list');
            const search = document.getElementById('search-input').value.toLowerCase();
            list.innerHTML = "";

            Object.values(inventory).reverse().forEach(i => {
                const isFav = favs.includes(i.num);
                const op = (i.op || 'SIM').toUpperCase();

                // Проверка фильтров
                if(currentFilter !== 'ALL' && currentFilter !== 'FAV' && op !== currentFilter) return;
                if(currentFilter === 'FAV' && !isFav) return;
                if(search && !i.num.includes(search)) return;

                list.innerHTML += `
                    <div class="glass-card p-5">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[9px] font-black opacity-30 uppercase tracking-[3px]">${op}</span>
                            <span onclick="toggleFav('${i.num}', event)" class="text-xl cursor-pointer">${isFav ? '❤️' : '🤍'}</span>
                        </div>
                        <h3 class="text-3xl font-black italic tracking-tighter mb-1 text-white">+7 ${i.num}</h3>
                        <div class="flex justify-between items-center mt-4">
                            <span class="text-xl font-black gold-text">${i.price} ₽</span>
                            <button onclick="alert('Заказ оформляется через поддержку')" class="bg-white text-black px-4 py-2 rounded-xl text-[10px] font-black uppercase">Купить</button>
                        </div>
                    </div>
                `;
            });

            if(list.innerHTML === "") {
                list.innerHTML = '<p class="text-center opacity-20 py-10 uppercase text-xs font-bold tracking-widest">Ничего не найдено</p>';
            }
        }
    </script>
</body>
</html>
