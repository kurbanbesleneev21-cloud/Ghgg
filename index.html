<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | TOTAL STYLE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Manrope', sans-serif; 
            margin: 0;
            background: linear-gradient(135deg, #0a0a0a, #111111, #0a0a0a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-shine {
            font-weight: 800; font-size: 32px; text-transform: uppercase;
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite; font-style: italic;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .tab-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px; border-radius: 12px;
            font-size: 11px; font-weight: 800; text-transform: uppercase;
            color: #888; transition: 0.3s;
        }
        .tab-active { background: #bf953f; color: #000; border-color: #bf953f; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* ВРАЩАЮЩАЯСЯ РАМКА */
        .neon-card {
            position: relative; background: rgba(191, 149, 63, 0.1);
            border-radius: 24px; padding: 2px; overflow: hidden; margin-bottom: 25px;
        }
        .neon-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, #bf953f, #fcf6ba, #bf953f, transparent);
            animation: rotate 3s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .card-content {
            position: relative; background: #0d0d0d; border-radius: 22px;
            padding: 30px 20px; z-index: 1; display: flex; flex-direction: column; align-items: center;
        }

        .price-text { font-size: 28px; font-weight: 800; color: #bf953f; margin: 10px 0 20px 0; }

        .buy-btn {
            background: #bf953f; color: #000; font-weight: 800;
            font-size: 12px; text-transform: uppercase; padding: 18px;
            border-radius: 16px; width: 100%; border: none;
        }

        /* --- СТИЛЬНОЕ ОКНО ЗАКАЗА --- */
        #order-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 100; align-items: center; justify-content: center; padding: 20px;
            backdrop-filter: blur(10px);
        }
        .modal-box {
            background: #0d0d0d; width: 100%; max-width: 350px;
            border-radius: 30px; border: 1px solid #bf953f;
            padding: 30px; text-align: center;
            box-shadow: 0 0 40px rgba(191, 149, 63, 0.2);
        }
        .modal-input {
            background: #151515; border: 1px solid rgba(191, 149, 63, 0.3);
            border-radius: 15px; padding: 15px; width: 100%; color: #fff;
            margin-bottom: 15px; outline: none; text-align: center;
        }
        .modal-input:focus { border-color: #bf953f; }
        .close-btn { color: #888; font-size: 10px; text-transform: uppercase; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body class="p-6">

    <header class="flex flex-col items-center py-10">
        <h1 class="logo-shine italic">SIM MARKET</h1>
        <p class="text-[10px] font-bold opacity-30 tracking-[5px] mt-2 uppercase">Elite Stock</p>
    </header>

    <div class="max-w-md mx-auto mb-8">
        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2">
            <button onclick="setFilter('all', this)" class="tab-btn tab-active">Все</button>
            <button onclick="setFilter('mts', this)" class="tab-btn">МТС</button>
            <button onclick="setFilter('megafon', this)" class="tab-btn">Мегафон</button>
            <button onclick="setFilter('beeline', this)" class="tab-btn">Билайн</button>
            <button onclick="setFilter('tele2', this)" class="tab-btn">Tele2</button>
            <button onclick="setFilter('yota', this)" class="tab-btn">Yota</button>
        </div>
    </div>

    <div id="list" class="max-w-md mx-auto pb-20"></div>

    <div id="order-modal">
        <div class="modal-box">
            <h2 class="text-xl font-black mb-1 gold-text" id="m-num">Номер</h2>
            <p class="text-[10px] opacity-40 uppercase tracking-widest mb-6 italic">Оформление заказа</p>
            
            <input type="text" id="fio" placeholder="Ваше Имя" class="modal-input">
            <input type="tel" id="contact" placeholder="Ваш телефон" class="modal-input">
            
            <button onclick="confirmOrder()" class="buy-btn">Подтвердить заказ</button>
            <div onclick="closeModal()" class="close-btn">Отмена</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44",
            authDomain: "nnnmb-a0b52.firebaseapp.com",
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com",
            projectId: "nnnmb-a0b52"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentFilter = 'all';
        let allNumbers = {};
        let selectedNum = '';

        function openModal(num) {
            selectedNum = num;
            document.getElementById('m-num').innerText = '+7 ' + num;
            document.getElementById('order-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('order-modal').style.display = 'none';
        }

        function confirmOrder() {
            const f = document.getElementById('fio').value;
            const c = document.getElementById('contact').value;
            if(!f || !c) return alert("Заполни данные");

            db.ref('leads').push({ num: selectedNum, fio: f, contact: c, ts: Date.now() })
            .then(() => {
                alert("Заявка принята!");
                closeModal();
                document.getElementById('fio').value = '';
                document.getElementById('contact').value = '';
            });
        }

        function setFilter(op, el) {
            currentFilter = op;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            el.classList.add('tab-active');
            render();
        }

        function render() {
            const list = document.getElementById('list');
            list.innerHTML = "";
            const keys = Object.keys(allNumbers).reverse();
            keys.forEach(k => {
                const item = allNumbers[k];
                if (currentFilter !== 'all' && item.op !== currentFilter) return;
                list.innerHTML += `
                    <div class="neon-card">
                        <div class="card-content">
                            <div class="w-full flex justify-between items-center opacity-40 px-1 text-[9px] font-bold uppercase mb-4">
                                <span>${item.op.toUpperCase()}</span><span style="color:#bf953f" class="italic">Elite</span>
                            </div>
                            <div class="text-3xl font-black italic tracking-tighter mb-1">+7 ${item.num}</div>
                            <div class="price-text">${parseInt(item.price).toLocaleString('ru-RU')} ₽</div>
                            <button onclick="openModal('${item.num}')" class="buy-btn">Заказать номер</button>
                        </div>
                    </div>`;
            });
        }

        db.ref('inventory').on('value', s => { allNumbers = s.val() || {}; render(); });
    </script>
</body>
</html>
