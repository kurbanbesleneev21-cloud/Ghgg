<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | LUXURY STOCK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #0a0a0a; color: #fff; margin: 0; overflow-x: hidden; }
        
        .gold-grad { background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* БЕГУЩАЯ СТРОКА */
        #banner-box { display: none; background: rgba(191,149,63,0.1); border-top: 1px solid #bf953f; border-bottom: 1px solid #bf953f; padding: 12px 0; overflow: hidden; margin-bottom: 25px; }
        .marquee { display: inline-block; white-space: nowrap; animation: marquee 20s linear infinite; color: #fcf6ba; font-weight: 800; font-size: 11px; text-transform: uppercase; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* ВРАЩАЮЩАЯСЯ НЕОНОВАЯ РАМКА КАРТОЧКИ */
        .neon-card { position: relative; background: rgba(191, 149, 63, 0.1); border-radius: 28px; padding: 2px; overflow: hidden; margin-bottom: 30px; }
        .neon-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, #bf953f, #fcf6ba, #bf953f, transparent); animation: rotate 4s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .card-content { position: relative; background: #0d0d0d; border-radius: 26px; padding: 30px 20px; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        .price-text { font-size: 32px; font-weight: 800; color: #bf953f; margin: 15px 0; }
        .buy-btn { background: linear-gradient(135deg, #bf953f, #fcf6ba); color: #000; font-weight: 900; font-size: 11px; text-transform: uppercase; padding: 18px; border-radius: 18px; width: 100%; border: none; cursor: pointer; }

        /* МОДАЛЬНОЕ ОКНО ОФОРМЛЕНИЯ */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); }
        .modal-content { position: relative; background: #0d0d0d; width: 100%; max-width: 350px; border-radius: 30px; padding: 30px; border: 1px solid #bf953f; box-shadow: 0 0 30px rgba(191,149,63,0.2); }
        
        /* КРАСИВЫЕ ПОЛЯ ВВОДА */
        .input-box { position: relative; margin-bottom: 20px; width: 100%; }
        .input-box input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(191,149,63,0.3); padding: 15px; border-radius: 15px; color: #fff; outline: none; font-size: 14px; transition: 0.3s; }
        .input-box input:focus { border-color: #bf953f; background: rgba(191,149,63,0.05); box-shadow: 0 0 15px rgba(191,149,63,0.2); }
        .input-label { font-size: 9px; font-weight: 800; color: #bf953f; text-transform: uppercase; margin-bottom: 6px; display: block; letter-spacing: 1px; }

        /* ЧАТ */
        @keyframes bounceChat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .chat-trigger { animation: bounceChat 3s ease-in-out infinite; background: #bf953f; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; position: fixed; bottom: 25px; right: 25px; z-index: 1000; border: none; }
    </style>
</head>
<body class="p-5 pb-32">

    <header class="text-center py-12">
        <h1 class="text-4xl font-black italic gold-grad tracking-tighter">SIM MARKET</h1>
        <p class="text-[9px] tracking-[5px] opacity-30 uppercase mt-2 font-extrabold">Premium Numbers</p>
    </header>

    <div id="banner-box"><div class="marquee" id="banner-txt"></div></div>

    <div class="max-w-md mx-auto flex gap-2 overflow-x-auto no-scrollbar mb-8 pb-2">
        <button onclick="setFilter('all', this)" class="bg-[#bf953f] text-black px-4 py-2 rounded-xl text-[10px] font-bold">Все</button>
        <button onclick="setFilter('mts', this)" class="bg-white/5 text-white px-4 py-2 rounded-xl text-[10px] font-bold">МТС</button>
        <button onclick="setFilter('megafon', this)" class="bg-white/5 text-white px-4 py-2 rounded-xl text-[10px] font-bold">Мегафон</button>
    </div>

    <div id="list" class="max-w-md mx-auto"></div>

    <div id="modal">
        <div class="modal-content">
            <h2 id="m-num" class="text-2xl font-black text-center mb-1"></h2>
            <p class="text-center text-[9px] opacity-40 uppercase mb-8 gold-grad font-bold">Оформление заявки</p>
            
            <div class="input-box">
                <span class="input-label">Фамилия Имя Отчество</span>
                <input type="text" id="fio" placeholder="Иванов Иван Иванович">
            </div>
            
            <div class="input-box">
                <span class="input-label">Контактный телефон</span>
                <input type="tel" id="contact" placeholder="+7 (___) ___-__-__">
            </div>

            <button onclick="sendOrder()" class="buy-btn mt-4">Отправить данные</button>
            <p onclick="closeModal()" class="text-center mt-6 text-[10px] opacity-30 uppercase font-bold cursor-pointer hover:opacity-100">Отмена</p>
        </div>
    </div>

    <button class="chat-trigger" onclick="alert('Чат открывается...')">💬</button>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            authDomain: "nnnmb-a0b52.firebaseapp.com", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com", 
            projectId: "nnnmb-a0b52" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allNumbers = {};
        let selNum = '';

        db.ref('inventory').on('value', s => { allNumbers = s.val() || {}; render(); });
        db.ref('stats/visits').transaction(c => (c || 0) + 1);

        function render() {
            const list = document.getElementById('list');
            list.innerHTML = "";
            Object.keys(allNumbers).reverse().forEach(k => {
                const item = allNumbers[k];
                list.innerHTML += `
                    <div class="neon-card">
                        <div class="card-content">
                            <div class="w-full flex justify-between items-center opacity-30 text-[9px] font-bold uppercase mb-4 px-1">
                                <span>${item.op}</span><span class="gold-grad italic">Elite Number</span>
                            </div>
                            <div class="text-4xl font-black italic tracking-tighter text-white">+7 ${item.num}</div>
                            <div class="price-text">${parseInt(item.price).toLocaleString()} ₽</div>
                            <button class="buy-btn" onclick="openModal('${item.num}')">Оформить номер</button>
                        </div>
                    </div>`;
            });
        }

        function openModal(n) {
            selNum = n;
            document.getElementById('m-num').innerText = '+7 ' + n;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function sendOrder() {
            const fio = document.getElementById('fio').value;
            const con = document.getElementById('contact').value;
            if(!fio || !con) return alert("Пожалуйста, заполните все поля!");

            db.ref('leads').push({
                num: selNum,
                fio: fio,
                contact: con,
                ts: Date.now()
            }).then(() => {
                alert("Заявка успешно отправлена! Мы свяжемся с вами.");
                closeModal();
            });
        }
    </script>
</body>
</html>
