<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | ORDER PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #000; color: #fff; min-height: 100vh; }
        .gold-grad { background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* КАРТОЧКА НОМЕРА */
        .neon-card { position: relative; background: #0a0a0a; border-radius: 28px; overflow: hidden; z-index: 1; }
        .neon-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, #bf953f, #fcf6ba, transparent 70%); animation: rotate 4s linear infinite; z-index: -2; }
        .neon-card::after { content: ''; position: absolute; inset: 2px; background: #0d0d0d; border-radius: 26px; z-index: -1; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .tab { padding: 10px 20px; border-radius: 18px; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.05); color: rgba(255,255,255,0.4); cursor: pointer; }
        .tab.active { background: #bf953f; color: #000; border-color: #bf953f; }

        .input-dark { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 16px; border-radius: 20px; color: #fff; outline: none; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 5000; display: none; overflow-y: auto; padding: 20px; backdrop-filter: blur(20px); }
        .btn-gold { background: linear-gradient(135deg, #bf953f, #fcf6ba); color: #000; font-weight: 900; text-transform: uppercase; padding: 16px; border-radius: 20px; width: 100%; font-size: 12px; }
    </style>
</head>
<body class="p-4 pb-20">

    <header class="flex justify-between items-center mb-10 pt-2">
        <h1 class="text-2xl font-black italic gold-grad uppercase">SIM MARKET</h1>
        <div id="user-ui" class="hidden flex items-center gap-3 bg-white/5 p-1 pr-5 rounded-full border border-white/10 cursor-pointer" onclick="openProfile()">
            <div class="w-10 h-10 bg-[#bf953f] rounded-full flex items-center justify-center text-black font-black">К</div>
            <div class="flex flex-col"><span id="balance-display" class="text-xs font-black gold-grad">0 М</span><span class="text-[7px] opacity-40 uppercase">Монеты</span></div>
        </div>
        <button id="login-btn" onclick="openModal('auth-modal')" class="border border-[#bf953f]/30 px-6 py-2 rounded-full text-[10px] font-black uppercase gold-grad">Вход</button>
    </header>

    <div class="space-y-6 mb-10">
        <input type="text" id="search-input" oninput="renderItems()" placeholder="Поиск номера..." class="input-dark">
        <div class="flex gap-2 overflow-x-auto no-scrollbar">
            <div class="tab active" onclick="filterOp('ALL', this)">Все</div>
            <div class="tab" onclick="filterOp('МТС', this)">МТС</div>
            <div class="tab" onclick="filterOp('БИЛАЙН', this)">Билайн</div>
            <div class="tab" onclick="filterOp('МЕГАФОН', this)">Мегафон</div>
            <div class="tab" onclick="filterOp('FAV', this)">❤️ Избранное</div>
        </div>
    </div>

    <div id="list" class="grid gap-6"></div>

    <div id="order-modal" class="modal flex items-center">
        <div class="bg-[#0d0d0d] p-8 rounded-[40px] border border-white/5 w-full max-w-sm mx-auto space-y-5">
            <h2 class="text-xl font-black gold-grad uppercase italic text-center">Оформление заказа</h2>
            <div class="bg-white/5 p-4 rounded-2xl text-center border border-white/5">
                <p class="text-[10px] opacity-30 uppercase mb-1">Выбранный номер</p>
                <p id="order-num-display" class="text-2xl font-black italic text-white"></p>
            </div>
            <div class="space-y-3">
                <input type="text" id="order-name" placeholder="Ваше имя" class="input-dark">
                <input type="tel" id="order-phone" placeholder="Ваш телефон для связи" class="input-dark">
            </div>
            <button onclick="confirmOrder()" class="btn-gold">Подтвердить заказ</button>
            <p onclick="closeModals()" class="text-center text-[10px] opacity-30 uppercase font-black cursor-pointer">Отмена</p>
        </div>
    </div>

    <div id="profile-modal" class="modal"><div class="max-w-md mx-auto w-full pt-10 space-y-8">
        <div class="flex justify-between items-center"><h2 class="text-2xl font-black gold-grad uppercase">Кабинет</h2><span onclick="closeModals()" class="text-3xl opacity-20 cursor-pointer">✕</span></div>
        <div class="bg-white/5 p-8 rounded-[40px] text-center"><p class="text-[10px] opacity-30 mb-2 uppercase">Ваш баланс</p><p id="profile-balance" class="text-5xl font-black gold-grad">0</p></div>
        <div class="bg-white/5 p-6 rounded-[30px] border border-[#bf953f]/20">
            <p class="text-xs font-black gold-grad mb-2 italic">РЕФЕРАЛЬНЫЙ КОД (+100 монет)</p>
            <div class="bg-black p-4 rounded-xl border border-dashed border-[#bf953f]/40 flex justify-between items-center"><span id="ref-code" class="text-lg font-black tracking-widest">---</span><button onclick="copyRef()" class="text-[9px] font-black gold-grad uppercase">Копировать</button></div>
        </div>
        <button onclick="logout()" class="w-full text-red-500 font-bold text-[10px] uppercase">Выйти</button>
    </div></div>

    <div id="auth-modal" class="modal flex items-center"><div class="bg-[#0d0d0d] p-8 rounded-[40px] w-full max-w-sm mx-auto space-y-4">
        <div class="flex bg-white/5 p-1 rounded-2xl mb-2"><button id="tab-reg" onclick="toggleAuthTab('reg')" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase bg-[#bf953f] text-black">Регистрация</button><button id="tab-login" onclick="toggleAuthTab('login')" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase opacity-40">Вход</button></div>
        <input type="tel" id="r-phone" placeholder="Номер телефона" class="input-dark">
        <input type="password" id="r-pass" placeholder="Пароль" class="input-dark">
        <input type="text" id="r-word" placeholder="Кодовое слово" class="input-dark">
        <button onclick="handleAuth()" id="auth-main-btn" class="btn-gold">Присоединиться</button>
    </div></div>

    <script>
        const fbCfg = { apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com" };
        firebase.initializeApp(fbCfg);
        const db = firebase.database();

        let user = JSON.parse(localStorage.getItem('sim_user_pro')) || null;
        let favs = JSON.parse(localStorage.getItem('sim_favs')) || [];
        let inventory = {};
        let currentFilter = 'ALL';
        let authMode = 'reg';
        let selectedNum = null;

        if(user) updateUI();

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
        function openProfile() { openModal('profile-modal'); }

        function toggleAuthTab(mode) {
            authMode = mode;
            document.getElementById('tab-reg').className = mode === 'reg' ? 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase bg-[#bf953f] text-black' : 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase opacity-40';
            document.getElementById('tab-login').className = mode !== 'reg' ? 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase bg-[#bf953f] text-black' : 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase opacity-40';
            document.getElementById('r-word').style.display = mode === 'reg' ? 'block' : 'none';
        }

        function handleAuth() {
            const ph = document.getElementById('r-phone').value;
            const ps = document.getElementById('r-pass').value;
            if(!ph || !ps) return alert("Заполни поля!");
            user = { phone: ph, coins: 100, orders: 0 };
            localStorage.setItem('sim_user_pro', JSON.stringify(user));
            updateUI(); closeModals();
        }

        function logout() { localStorage.removeItem('sim_user_pro'); location.reload(); }
        function updateUI() {
            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('user-ui').classList.remove('hidden');
            document.getElementById('balance-display').innerText = user.coins + " М";
            document.getElementById('profile-balance').innerText = user.coins;
            document.getElementById('ref-code').innerText = user.phone;
        }

        function openOrderForm(num) {
            selectedNum = num;
            document.getElementById('order-num-display').innerText = "+7 " + num;
            if(user) document.getElementById('order-phone').value = user.phone;
            openModal('order-modal');
        }

        function confirmOrder() {
            const name = document.getElementById('order-name').value;
            const phone = document.getElementById('order-phone').value;
            if(!name || !phone) return alert("Пожалуйста, заполните имя и телефон!");

            // Начисляем бонус за покупку
            if(user) {
                user.coins += 50; 
                user.orders += 1;
                localStorage.setItem('sim_user_pro', JSON.stringify(user));
                updateUI();
            }

            alert(`Спасибо, ${name}! Заявка на номер +7 ${selectedNum} принята. Мы свяжемся с вами по номеру ${phone}.`);
            closeModals();
        }

        function filterOp(op, el) {
            currentFilter = op;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderItems();
        }

        function toggleFav(num, e) {
            e.stopPropagation();
            if(favs.includes(num)) favs = favs.filter(n => n !== num);
            else favs.push(num);
            localStorage.setItem('sim_favs', JSON.stringify(favs));
            renderItems();
        }

        db.ref('inventory').on('value', s => { inventory = s.val() || {}; renderItems(); });

        function renderItems() {
            const list = document.getElementById('list');
            const search = document.getElementById('search-input').value.toLowerCase();
            list.innerHTML = "";
            Object.values(inventory).reverse().forEach(i => {
                const isFav = favs.includes(i.num);
                const op = (i.op || 'SIM').toUpperCase();
                if(currentFilter !== 'ALL' && currentFilter !== 'FAV' && op !== currentFilter) return;
                if(currentFilter === 'FAV' && !isFav) return;
                if(search && !i.num.includes(search)) return;

                list.innerHTML += `
                    <div class="neon-card">
                        <div class="p-7 relative z-10">
                            <div class="flex justify-between items-start mb-6">
                                <span class="text-[9px] font-black opacity-30 tracking-[4px] uppercase">${op}</span>
                                <span onclick="toggleFav('${i.num}', event)" class="text-2xl cursor-pointer">${isFav ? '❤️' : '🤍'}</span>
                            </div>
                            <h3 class="text-4xl font-black italic tracking-tighter mb-8">+7 ${i.num}</h3>
                            <div class="flex justify-between items-center">
                                <span class="text-2xl font-black gold-grad">${i.price} ₽</span>
                                <button onclick="openOrderForm('${i.num}')" class="bg-white text-black px-6 py-3 rounded-2xl text-[10px] font-black uppercase active:scale-95 transition">Купить</button>
                            </div>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
