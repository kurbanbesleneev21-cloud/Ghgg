<script>
    const TG_TOKEN = '8624578892:AAEr7CLID8dkEM0zCPAoIOkn6anZff8w2pE';

    });
    const db = firebase.database();

    let numbers = [];
    let selected = null;
    let currentUser = null;

    // Прелоадер
    window.addEventListener('load', () => {
        const progress = document.getElementById('progress');
        let width = 0;
        const interval = setInterval(() => {
            width += Math.random() * 30;
            if (width >= 100) {
                width = 100;
                clearInterval(interval);
                setTimeout(() => {
                    document.getElementById('preloader').style.opacity = '0';
                    setTimeout(() => document.getElementById('preloader').style.display = 'none', 800);
                }, 400);
            }
            progress.style.width = width + '%';
        }, 180);
        initAuthSystem();
    });

    // АВТОРИЗАЦИЯ
    async function initAuthSystem() {
        const saved = localStorage.getItem('smarket_user');
        if(saved) {
            try {
                const data = JSON.parse(saved);
                const snap = await db.ref(`users/${data.uid}`).once('value');
                if(snap.exists()) {
                    currentUser = snap.val();
                    currentUser.uid = data.uid;
                    updateUI();
                } else localStorage.removeItem('smarket_user');
            } catch(e) { localStorage.removeItem('smarket_user'); }
        }
        updateUI();
    }

    function updateUI() {
        const label = document.getElementById('authLabel');
        if(currentUser) {
            label.innerText = currentUser.name.split(' ')[0] + ' ✦';
            document.getElementById('authButton').setAttribute('onclick', 'openProfileModal()');
        } else {
            label.innerText = 'ВОЙТИ';
            document.getElementById('authButton').setAttribute('onclick', 'openAuthModal()');
        }
    }

    window.registerUser = async function() {
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const pwd = document.getElementById('regPassword').value;
        if(!name || !email || !phone || !pwd) return showToast('Заполните все поля!', false);
        if(pwd.length < 4) return showToast('Пароль от 4 символов', false);
        const uid = btoa(email).replace(/[^a-z0-9]/gi, '').slice(0, 22);
        const check = await db.ref(`users/${uid}`).once('value');
        if(check.exists()) return showToast('Email уже используется', false);
        const userData = { name, email, phone, password: pwd, registeredAt: new Date().toISOString(), orders: [] };
        await db.ref(`users/${uid}`).set(userData);
        currentUser = { ...userData, uid };
        localStorage.setItem('smarket_user', JSON.stringify({ uid, email }));
        showToast(`✨ Добро пожаловать, ${name}!`, true);
        closeModal('authModal');
        updateUI();
    };

    window.loginUser = async function() {
        const email = document.getElementById('loginEmail').value.trim();
        const pwd = document.getElementById('loginPassword').value;
        if(!email || !pwd) return showToast('Введите email и пароль', false);
        const snapshot = await db.ref('users').orderByChild('email').equalTo(email).once('value');
        let found = null, uid = null;
        snapshot.forEach(snap => { found = snap.val(); uid = snap.key; });
        if(!found || found.password !== pwd) return showToast('Неверный email или пароль', false);
        currentUser = { ...found, uid };
        localStorage.setItem('smarket_user', JSON.stringify({ uid, email }));
        showToast(`С возвращением, ${found.name}!`, true);
        closeModal('authModal');
        updateUI();
    };

    window.logoutUser = function() {
        currentUser = null;
        localStorage.removeItem('smarket_user');
        closeModal('profileModal');
        updateUI();
        showToast('Вы вышли из аккаунта', true);
    };

    window.openProfileModal = async function() {
        if(!currentUser) { openAuthModal(); return; }
        document.getElementById('profileName').innerText = currentUser.name;
        document.getElementById('profileEmail').innerText = currentUser.email;
        document.getElementById('profilePhone').innerText = currentUser.phone;
        const ordersSnap = await db.ref('orders').orderByChild('clientEmail').equalTo(currentUser.email).once('value');
        const histDiv = document.getElementById('orderHistoryList');
        if(!ordersSnap.exists()) histDiv.innerHTML = '<div class="text-gray-400 italic">У вас пока нет покупок</div>';
        else {
            let html = '';
            ordersSnap.forEach(o => {
                const ord = o.val();
                html += `<div class="history-item"><span class="text-gold text-[10px]">${ord.date || 'Новый заказ'}</span><br/>📱 +7 ${ord.item}<br/>💰 ${ord.price} ₽</div>`;
            });
            histDiv.innerHTML = html;
        }
        document.getElementById('profileModal').style.display = 'flex';
    };

    window.openAuthModal = () => {
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('tabRegister').classList.add('tab-active');
        document.getElementById('tabLogin').classList.remove('tab-active');
        document.getElementById('authModal').style.display = 'flex';
    };

    document.getElementById('tabRegister')?.addEventListener('click', () => {
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('tabRegister').classList.add('tab-active');
        document.getElementById('tabLogin').classList.remove('tab-active');
    });
    document.getElementById('tabLogin')?.addEventListener('click', () => {
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('tabLogin').classList.add('tab-active');
        document.getElementById('tabRegister').classList.remove('tab-active');
    });

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function showToast(msg, ok = true) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.background = ok ? 'linear-gradient(135deg, #d4af37, #b8921e)' : '#aa2e2e';
        t.style.display = 'block';
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => { t.style.display = 'none'; t.style.opacity = '1'; }, 400); }, 2700);
    }

    // Данные из Firebase
    db.ref('settings/banner').on('value', s => {
        const d = s.val() || { title: "Элитные номера", sub: "Только для избранных" };
        document.getElementById('bTitle').innerText = d.title;
        document.getElementById('bSub').innerText = d.sub;
    });
    db.ref('inventory').on('value', s => {
        numbers = [];
        s.forEach(c => numbers.push(c.val()));
        render(numbers);
    });

    function render(data) {
        const container = document.getElementById('list');
        if(!data.length) { container.innerHTML = `<div class="text-center py-16 text-gray-500 text-sm">Нет доступных номеров</div>`; return; }
        container.innerHTML = data.map((item, idx) => `
            <div class="glass-card p-5 flex justify-between items-center animate__animated animate__fadeInUp" style="animation-delay: ${idx*0.05}s">
                <div>
                    <span class="text-[9px] text-gold font-black tracking-wider uppercase">${item.op || 'PREMIUM'}</span>
                    <h3 class="text-xl md:text-2xl font-black tracking-tight mt-1">+7 ${item.num}</h3>
                </div>
                <div class="text-right">
                    <p class="text-xl font-black gold-text">${Number(item.price).toLocaleString()} ₽</p>
                    <button onclick="openOrder('${item.num}', '${item.price}')" class="btn-buy mt-2">КУПИТЬ</button>
                </div>
            </div>
        `).join('');
    }

    window.openOrder = function(num, price) {
        if(!currentUser) { showToast('Сначала войдите в аккаунт', false); openAuthModal(); return; }
        selected = { num, price };
        document.getElementById('orderInfo').innerHTML = `+7 ${num} &nbsp;•&nbsp; ${Number(price).toLocaleString()} ₽`;
        document.getElementById('orderModal').style.display = 'flex';
    };

    window.confirmOrder = async function() {
        const name = document.getElementById('userName').value.trim();
        const phone = document.getElementById('userPhone').value.trim();
        if(!name || !phone) return showToast('Заполните имя и телефон', false);
        const msg = `👑 НОВЫЙ ЗАКАЗ\nКлиент: ${currentUser.email}\nИмя: ${name}\nТел: ${phone}\nНомер: +7 ${selected.num}\nСумма: ${selected.price} ₽`;
        await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({chat_id: CHAT_ID, text: msg})
        });
        await db.ref('orders').push({ name, phone, item: selected.num, price: selected.price, clientEmail: currentUser.email, date: new Date().toLocaleString() });
        closeModal('orderModal');
        showToast('Заказ оформлен! Свяжемся скоро', true);
        document.getElementById('userName').value = '';
        document.getElementById('userPhone').value = '';
    };

    document.getElementById('search').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        render(numbers.filter(n => n.num.includes(query)));
    });
    
    window.closeModal = closeModal;
</script>
</body>
</html>
