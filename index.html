                 <!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>SIM MARKET | КРАСИВЫЕ НОМЕРА</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><style>

@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;900&display=swap');

body{
font-family:'Manrope',sans-serif;
background:#050505;
color:#fff;
}

.gold-text{
color:#bf953f;
}

.gold-bg{
background:#bf953f;
color:#000;
}

.glass{
background:rgba(255,255,255,0.03);
border:1px solid rgba(255,255,255,0.1);
border-radius:15px;
backdrop-filter:blur(6px);
}

.num-card{
border-left:4px solid #bf953f;
transition:.3s;
cursor:pointer;
}

.num-card:hover{
transform:scale(1.03);
background:rgba(255,255,255,0.05);
}

.toast{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
background:#111;
padding:12px 20px;
border-radius:12px;
border:1px solid #333;
opacity:0;
transition:.3s;
}

.toast.show{
opacity:1;
}

</style></head><body><header class="p-5 border-b border-white/5 bg-[#050505] flex justify-between items-center"><h1 class="text-xl font-black italic gold-text">
SIM<span class="text-white">MARKET</span>
</h1><input
id="search"
placeholder="Поиск номера..."
class="bg-[#111] border border-white/10 px-4 py-2 rounded-lg text-sm outline-none"
oninput="searchNumbers()">

</header><section class="py-10 px-5 max-w-6xl mx-auto"><h3 class="text-2xl font-black uppercase mb-6 italic">
Номера в наличии
</h3><div id="numbers-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4"><p class="opacity-20 text-sm">
Загрузка номеров...
</p></div></section><section id="order" class="py-10 px-5 max-w-md mx-auto"><div class="glass p-6 space-y-4"><h3 class="text-xl font-black uppercase text-center">
Оформить заказ
</h3><input
type="text"
id="order-num"
placeholder="Номер телефона"
class="w-full bg-[#111] border border-white/10 p-4 rounded-xl text-[#bf953f] font-bold outline-none">

<input
type="text"
id="order-name"
placeholder="Ваше имя"
class="w-full bg-[#111] border border-white/10 p-4 rounded-xl text-white outline-none">

<input
type="tel"
id="order-phone"
placeholder="Ваш контактный телефон"
class="w-full bg-[#111] border border-white/10 p-4 rounded-xl text-white outline-none">

<button
onclick="sendOrder()"
class="gold-bg w-full py-4 rounded-xl font-black uppercase">

Заказать номер

</button></div></section><div id="toast" class="toast"></div><script>

const firebaseConfig = {
apiKey:"AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44",
databaseURL:"https://nnnmb-a0b52-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


function toast(text){

const el=document.getElementById('toast');

el.innerText=text;

el.classList.add('show');

setTimeout(()=>{
el.classList.remove('show');
},2500);

}


let allNumbers=[];


/* ЗАГРУЗКА НОМЕРОВ */

function loadNumbers(){

db.ref('inventory').on('value',snap=>{

const grid=document.getElementById('numbers-grid');

grid.innerHTML="";

if(!snap.exists()){

grid.innerHTML="<p class='opacity-40'>База номеров пуста.</p>";

return;

}

allNumbers=[];

snap.forEach(child=>{

const data=child.val();

const phoneDigit=child.key;

const price=data.price || "Договорная";

const category=data.category || "VIP";

allNumbers.push({
num:phoneDigit,
price:price,
category:category
});

renderCard(phoneDigit,price,category);

});

});

}


/* ОТОБРАЖЕНИЕ */

function renderCard(num,price,category){

const grid=document.getElementById('numbers-grid');

let vip = /777|888|000|111/.test(num);

grid.innerHTML+=`

<div class="glass p-5 num-card flex justify-between items-center active:scale-95 transition"

onclick="selectNum('${num}')">

<div>

<p class="text-2xl font-black tracking-tight text-white">
${num}
</p>

<p class="text-[10px] font-bold gold-text uppercase">
${category}
${vip ? '⭐ VIP' : ''}
</p>

</div>

<div class="text-right">

<p class="text-lg font-black">
${price} ₽
</p>

<div class="flex gap-2 justify-end">

<button onclick="copyNum('${num}');event.stopPropagation()">
📋
</button>

<p class="text-[9px] text-green-500 font-bold">
ВЫБРАТЬ
</p>

</div>

</div>

</div>

`;

}


/* ПОИСК */

function searchNumbers(){

const q=document.getElementById('search').value;

const grid=document.getElementById('numbers-grid');

grid.innerHTML="";

allNumbers.forEach(n=>{

if(!n.num.includes(q)) return;

renderCard(n.num,n.price,n.category);

});

}


/* КОПИРОВАНИЕ */

function copyNum(n){

navigator.clipboard.writeText(n);

toast("Номер скопирован");

}


/* ВЫБОР НОМЕРА */

function selectNum(num){

document.getElementById('order-num').value=num;

window.scrollTo({
top:document.getElementById('order').offsetTop-50,
behavior:'smooth'
});

}


/* ЗАКАЗ */

function sendOrder(){

const num=document.getElementById('order-num').value;

const name=document.getElementById('order-name').value;

const phone=document.getElementById('order-phone').value;

if(!name||!phone||!num){

toast("Заполните все поля");

return;

}

db.ref('orders').push({

wantedNum:num,

clientName:name,

clientPhone:phone,

date:new Date().toLocaleString('ru-RU')

})

.then(()=>{

toast("Заявка отправлена");

document.getElementById('order-name').value="";
document.getElementById('order-phone').value="";

});

}


window.onload=loadNumbers;

</script></body>
</html>
