<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | V2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #000; color: #fff; font-family: 'Manrope', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .gold-bg { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* КАРТОЧКА С ДИЗАЙНОМ */
        .card { background: #0a0a0a; border: 1px solid rgba(255,255,255,0.05); border-radius: 28px; transition: 0.3s; margin-bottom: 20px; }
        .badge { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 4px 8px; font-size: 9px; font-weight: 800; text-transform: uppercase; color: #fff; }
        .price-tag { background: rgba(251, 191, 36, 0.1); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.2); border-radius: 12px; padding: 6px 12px; font-weight: 800; }
        
        .tab-btn { transition: 0.3s; white-space: nowrap; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #71717a; border: 1px solid rgba(255,255,255,0.05); }
        .tab-active { background: #fff !important; color: #000 !important; border-color: #fff !important; }
        
        /* МИГАЮЩАЯ ТОЧКА ДЛЯ ПРОВЕРКИ ОБНОВЛЕНИЯ */
        .dot { width: 8px; height: 8px; background: #fbbf24; border-radius: 50%; display: inline-block; margin-right: 8px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        #order-modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; padding: 20px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-20">

    <header class="p-6 sticky top-0 z-50 glass flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black uppercase italic"><span class="dot"></span>SIM <span class="gold-text">MARKET</span></h1>
            <div class="text-[10px] opacity-40 font-bold mt-1">ОБНОВЛЕНО 2026</div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <input type="text" id="q" oninput="draw()" placeholder="Поиск номера..." class="w-full p-6 rounded-3xl bg-zinc-900/50 border border-zinc-800 outline-none text-base focus:border-amber-500 mb-8">

        <div class="flex gap-3 overflow-x-auto no-scrollbar mb-8 pb-2">
            <button onclick="setFilter('all', this)" class="tab-btn tab-active px-8 py-3 rounded-2xl bg-zinc-900">Все</button>
            <button onclick="setFilter('mts', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">МТС</button>
            <button onclick="setFilter('megafon', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">Мегафон</button>
            <button onclick="setFilter('beeline', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">Билайн</button>
            <button onclick="setFilter('tele2', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">Теле2</button>
        </div>

        <div id="list" class="space-y-5">
            </div>
    </main>

    <script>
        // ТВОИ ДАННЫЕ
        const TOKEN = "8279695581:AAGuQgQhmgq9QaTX4rULywq6o18MeT3XIUw";
        const MY_ID = "8768514374"; 
        const BIN = "69c9d640aaba882197a65742"; 
        const KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW"; 

        let db = [], activeFilter = 'all';

        async function init() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN}/latest`, { headers: {'X-Master-Key': KEY} });
                const data = await res.json();
                db = data.record.record || data.record;
                // ЕСЛИ ВДРУГ БАЗА ПУСТАЯ - ПОКАЖЕМ ТЕСТ
                if (!db || db.length === 0) {
                   db = [{n: "+7 (999) 000-00-00", t: "999", op: "mts", tarif: "VIP"}];
                }
                draw();
            } catch(e) {
                document.getElementById('list').innerHTML = '<div class="text-center py-20 text-amber-500 font-bold uppercase text-xs">Ошибка загрузки данных из JSONBin</div>';
            }
        }

        function setFilter(val, btn) {
            activeFilter = val.toLowerCase();
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            btn.classList.add('tab-active');
            draw();
        }

        function draw() {
            const list = document.getElementById('list');
            const q = document.getElementById('q').value.toLowerCase();
            
            let filtered = db.filter(i => {
                const n = String(i.n || "").toLowerCase();
                const op = String(i.op || "").toLowerCase();
                // Показываем всё во вкладке "Все", либо фильтруем по оператору
                return n.includes(q) && (activeFilter === 'all' || op === activeFilter);
            });

            if (filtered.length === 0) {
                list.innerHTML = '<div class="text-center py-20 opacity-20 uppercase font-bold text-[10px]">Номера не найдены</div>';
                return;
            }

            list.innerHTML = filtered.map(i => `
                <div class="card p-7">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex gap-2">
                            <span class="badge italic text-white">${i.op || 'SIM'}</span>
                            <span class="badge text-amber-500 border-amber-500/20">${i.tarif || 'VIP'}</span>
                        </div>
                        <div class="price-tag">${i.t} ₽</div>
                    </div>
                    <div class="flex justify-between items-end">
                        <div class="text-3xl font-black tracking-tighter text-white">${i.n}</div>
                        <button class="px-6 py-3 gold-bg text-black font-black rounded-xl text-[10px] uppercase">Забрать</button>
                    </div>
                </div>
            `).reverse().join('');
        }

        init();
    </script>
</body>
</html>
