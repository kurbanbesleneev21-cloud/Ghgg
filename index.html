<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">SIM MARKET | КРАСИВЫЕ НОМЕРА</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;900&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #050505; color: #fff; }
        .gold-text { color: #bf953f; }
        .gold-bg { background: #bf953f; color: #000; }
        .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; }
        .num-card { transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
        .num-card:hover { transform: scale(1.05); border-color: #bf953f; background: rgba(191, 149, 63, 0.05); }
        .category-btn { padding: 8px 20px; border-radius: 99px; font-size: 12px; font-weight: 800; border: 1px solid rgba(255,255,255,0.1); }
        .category-btn.active { background: #bf953f; color: #000; border-color: #bf953f; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="p-6 flex justify-between items-center max-w-6xl mx-auto sticky top-0 bg-[#050505]/80 backdrop-blur-lg z-50">
        <h1 class="text-2xl font-black italic gold-text">SIM<span class="text-white">MARKET</span></h1>
        <a href="#order" class="text-[10px] font-black uppercase tracking-widest border border-white/10 px-4 py-2 rounded-lg">Заказать подбор</a>
    </header>

    <!-- Hero -->
    <section class="py-16 px-6 text-center">
        <h2 id="hero-title" class="text-4xl md:text-6xl font-black mb-4 uppercase leading-tight">ЭКСКЛЮЗИВНЫЕ <br><span class="gold-text">НОМЕРА</span></h2>
        <p id="hero-desc" class="text-gray-500 max-w-xl mx-auto text-sm">Официальное переоформление, лучшие цены в Дагестане.</p>
    </section>

    <!-- КАТАЛОГ НОМЕРОВ (ТО ЧТО МЫ ВЕРНУЛИ) -->
    <section class="py-10 px-6 max-w-6xl mx-auto">
        <div class="flex justify-between items-end mb-8">
            <h3 class="text-2xl font-black uppercase italic">В наличии</h3>
            <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                <button class="category-btn active">ВСЕ</button>
                <button class="category-btn">VIP</button>
                <button class="category-btn">GOLD</button>
            </div>
        </div>

        <div id="numbers-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- НОМЕРА БУДУТ ТУТ -->
            <p class="opacity-20 animate-pulse">Загрузка витрины...</p>
        </div>
    </section>

    <!-- Блог (Новости) -->
    <section id="blog" class="py-20 px-6 max-w-6xl mx-auto border-t border-white/5">
        <h3 class="text-xl font-black mb-8 uppercase gold-text">Новости</h3>
        <div id="blog-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- Order Form -->
    <section id="order" class="py-20 px-6 max-w-lg mx-auto">
        <div class="glass p-8 space-y-5 text-center">
            <h3 class="text-2xl font-black uppercase">Купить номер</h3>
            <p class="text-xs text-gray-500">Оставьте данные, и мы свяжемся с вами для оформления</p>
            <input type="text" id="order-name" placeholder="Имя" class="w-full bg-[#111] border border-white/5 p-4 rounded-xl text-white outline-none">
            <input type="tel" id="order-phone" placeholder="+7 (928) 000-00-00" class="w-full bg-[#111] border border-white/5 p-4 rounded-xl text-white outline-none">
            <input type="text" id="order-num" placeholder="Выбранный номер" class="w-full bg-[#111] border border-white/5 p-4 rounded-xl text-white outline-none">
            <button onclick="sendOrder()" class="gold-bg w-full py-4 rounded-xl font-black uppercase text-sm">Оформить заказ</button>
        </div>
    </section>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
        databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. ЗАГРУЗКА НОМЕРОВ ИЗ БАЗЫ
    function loadNumbers() {
        db.ref('inventory').on('value', snap => {
            const grid = document.getElementById('numbers-grid');
            grid.innerHTML = "";
            
            if(!snap.exists()) {
                grid.innerHTML = "<p class='opacity-40'>Номера скоро появятся...</p>";
                return;
            }

            snap.forEach(child => {
                const n = child.val();
                grid.innerHTML += `
                    <div class="glass p-6 num-card flex justify-between items-center border-l-4 border-[#bf953f]" onclick="selectNum('${n.phone}')">
                        <div>
                            <p class="text-2xl font-black tracking-tighter">${n.phone}</p>
                            <span class="text-[10px] opacity-40 font-bold uppercase">${n.category || 'Без категории'}</span>
                        </div>
                        <div class="text-right">
                            <p class="text-lg font-black gold-text">${n.price} ₽</p>
                            <p class="text-[9px] uppercase font-bold text-green-500">В наличии</p>
                        </div>
                    </div>`;
            });
        });
    }

    function selectNum(num) {
        document.getElementById('order-num').value = num;
        document.getElementById('order').scrollIntoView({ behavior: 'smooth' });
    }

    // 2. ЗАГРУЗКА БЛОГА
    function loadBlog() {
        db.ref('blog').on('value', snap => {
            const container = document.getElementById('blog-container');
            container.innerHTML = "";
            snap.forEach(post => {
                const d = post.val();
                container.innerHTML += `
                    <div class="glass p-5">
                        <p class="text-[9px] gold-text font-bold mb-1 uppercase">${d.date}</p>
                        <h4 class="font-bold mb-2">${d.title}</h4>
                        <p class="text-xs text-gray-500">${d.text.substring(0, 100)}...</p>
                    </div>`;
            });
        });
    }

    // 3. ОТПРАВКА ЗАКАЗА
    function sendOrder() {
        const name = document.getElementById('order-name').value;
        const phone = document.getElementById('order-phone').value;
        const num = document.getElementById('order-num').value;

        if(!name || !phone) return alert("Введите имя и телефон!");

        db.ref('orders').push({
            clientName: name,
            clientPhone: phone,
            wantedNum: num,
            date: new Date().toLocaleString(),
            status: 'new'
        }).then(() => {
            alert("Заявка принята! Ожидайте звонка.");
        });
    }

    window.onload = () => { loadNumbers(); loadBlog(); };
</script>
</body>
</html>
