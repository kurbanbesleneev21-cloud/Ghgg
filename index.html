<!DOCTYPE html>
<html lang="ru">
<head>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #0a0a0a; color: #fff; margin: 0; overflow-x: hidden; }
        .gold-grad { background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #banner-box { display: none; background: rgba(191,149,63,0.1); border-y: 1px solid #bf953f; padding: 10px 0; overflow: hidden; }
        .marquee { display: inline-block; white-space: nowrap; animation: marquee 15s linear infinite; color: #fcf6ba; font-weight: 800; font-size: 11px; text-transform: uppercase; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .tab-btn { background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 12px; font-size: 10px; font-weight: 800; color: #555; }
        .tab-active { background: #bf953f; color: #000; }
        .neon-card { position: relative; background: rgba(191,149,63,0.1); border-radius: 24px; padding: 2px; overflow: hidden; margin-bottom: 20px; }
        .neon-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, #bf953f, #fcf6ba, #bf953f, transparent); animation: rotate 4s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .card-content { position: relative; background: #0d0d0d; border-radius: 22px; padding: 25px; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        .buy-btn { background: #bf953f; color: #000; font-weight: 900; width: 100%; padding: 15px; border-radius: 15px; text-transform: uppercase; font-size: 12px; }
        #chat-window { hidden; position: fixed; bottom: 85px; right: 20px; w: 300px; height: 400px; background: #0d0d0d; border: 1px solid #bf953f; border-radius: 20px; z-index: 1000; }
    </style>
</head>
<body class="p-5 pb-24">
    <header class="text-center py-10">

        <p class="text-[9px] tracking-[4px] opacity-30 uppercase mt-2 font-bold">Premium Numbers Only</p>

    <div id="banner-box" class="mb-6"><div class="marquee" id="banner-txt"></div></div>

    <div class="flex gap-2 overflow-x-auto no-scrollbar mb-8">

            <div id="chat-msgs" class="flex-1 p-3 overflow-y-auto space-y-2 text-xs"></div>
            <div class="p-2 border-t border-white/5 flex gap-1">

            });
