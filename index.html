<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | LUXURY STOCK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #0a0a0a; color: #fff; margin: 0; overflow-x: hidden; }
        
        /* АНИМИРОВАННЫЙ ПЕРЕЛИВ ЗАГОЛОВКА */
        .gold-grad {
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f, #fcf6ba, #bf953f);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gold-flow 4s linear infinite;
        }
        @keyframes gold-flow { to { background-position: 200% center; } }
        
        /* БЕГУЩАЯ СТРОКА */
        #banner-box { display: none; background: rgba(191,149,63,0.1); border-top: 1px solid #bf953f; border-bottom: 1px solid #bf953f; padding: 12px 0; overflow: hidden; margin-bottom: 25px; }
        .marquee { display: inline-block; white-space: nowrap; animation: marquee 20s linear infinite; color: #fcf6ba; font-weight: 800; font-size: 11px; text-transform: uppercase; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* ФИЛЬТРЫ ОПЕРАТОРОВ */
        .tab-btn { background: rgba(255,255,255,0.05); padding: 10px 18px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; color: #555; transition: 0.3s; border: 1px solid transparent; flex-shrink: 0; }
        .tab-active { background: #bf953f; color: #000; box-shadow: 0 5px 15px rgba(191,149,63,0.4); border-color: #fcf6ba; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* ВРАЩАЮЩАЯСЯ РАМКА КАРТОЧКИ */
        .neon-card { position: relative; background: rgba(191, 149, 63, 0.1); border-radius: 28px; padding: 2px; overflow: hidden; margin-bottom: 30px; }
        .neon-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, #bf953f, #fcf6ba, #bf953f, transparent); animation: rotate 4s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .card-content { position: relative; background: #0d0d0d; border-radius: 26px; padding: 30px 20px; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        .price-text { font-size: 32px; font-weight: 800; color: #bf953f; margin: 15px 0; }
        .buy-btn { background: linear-gradient(135deg, #bf953f, #fcf6ba); color: #000; font-weight: 900; font-size: 11px; text-transform: uppercase; padding: 18px; border-radius: 18px; width: 100%; border: none; cursor: pointer; }

        /* МОДАЛЬНОЕ ОКНО */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); }
        .modal-content { position: relative; background: #0d0d0d; width: 100%; max-width: 350px; border-radius: 30px; padding: 30px; border: 1px solid #bf953f; box-shadow: 0 0 40px rgba(191,149,63,0.2); }
        .input-box { margin-bottom: 20px; }
        .input-box input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(191,149,63,0.3); padding: 16px; border-radius: 16px; color: #fff; outline: none; font-size: 14px; transition: 0.3s; }
        .input-box input:focus { border-color: #bf953f; background: rgba(191,149,63,0.05); }
        .label { font-size: 9px; font-weight: 800; color: #bf953f; text-transform: uppercase; margin-bottom: 8px; display: block; letter-spacing: 1px; }

        /* ЧАТ */
        @keyframes bounceChat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .chat-trigger { animation: bounceChat 3s ease-in-out infinite; background: #bf953f; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; position: fixed; bottom: 30px; right: 25px; z-index: 1000; border: none; box-shadow: 0 10px 30px rgba(191,149,63,0.4); cursor: pointer; }
        #chat-window { display: none; position: fixed; bottom: 110px; right: 25px; width: 330px; height: 480px; background: #0d0d0d; border: 1px solid #bf953f; border-radius: 30px; z-index: 1000; flex-direction: column; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.9); }
        .chat-header { background: #bf953f; padding: 18px; color: #000; font-weight: 900; font-size: 11px; text-transform: uppercase; display: flex; justify-content: space-between; }
        #chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 14px; font-weight: 700; line-height: 1.4; }
        .msg-user { align-self: flex-end; background: #bf953f; color: #000; border-bottom-right-radius: 4px; }
        .msg-admin { align-self: flex-start; background: rgba(255,255,255,0.1); color: #fff; border-bottom-left-radius: 4px; }
    </style>
</head>
<body class="p-5 pb-32">

    <header class="text-center py-12">
        <h1 class="text-4xl font-black italic gold-grad tracking-tighter">SIM MARKET</h1>
        <p class="text-[9px] tracking-[5px] opacity-30 uppercase mt-2 font-extrabold">Exclusive Selection</p>
    </header>

    <div id="banner-box"><div class="marquee" id="banner-txt"></div></div>

    <div class="max-w-md mx-auto flex gap-2 overflow-x-auto no-scrollbar mb-10 pb-2">
        <button onclick="setFilter('all', this)" class="tab-btn tab-active">Все</button>
        <button onclick="setFilter('mts', this)" class="tab-btn">МТС</button>
        <button onclick="setFilter('megafon', this)" class="tab-btn">Мегафон</button>
        <button onclick="setFilter('beeline', this)" class="tab-btn">Билайн</button>
        <button onclick="setFilter('tele2', this)" class="tab-btn">Tele2</button>
    </div>

    <div id="list" class="max-w-md mx-auto"></div>

    <div id="modal">
        <div class="modal-content">
            <h2 id="m-num" class="text-2xl font-black text-center mb-1 text-white"></h2>
            <p class="text-center text-[9px] opacity-40 uppercase mb-8 gold-grad font-bold">Оформление заявки</p>
            <div class="input-box">
                <span class="label">Фамилия Имя Отчество</span>
                <input type="text" id="fio" placeholder="Иванов Иван Иванович">
            </div>
            <div class="input-box">
                <span class="label">Ваш контактный телефон</span>
                <input type="tel" id="contact" placeholder="+7 (___) ___-__-__">
            </div>
            <button onclick="sendOrder()" class="buy-btn mt-4">Отправить заявку</button>
            <p onclick="closeModal()" class="text-center mt-6 text-[10px] opacity-30 uppercase font-bold cursor-pointer hover:opacity-100">Закрыть</p>
        </div>
    </div>

    <button class="chat-trigger" onclick="toggleChat()">💬</button>
    
    <div id="chat-window">
        <div class="chat-header">
            <span>VIP Поддержка</span>
            <button onclick="toggleChat()" style="background:none; border:none; font-weight:bold; cursor:pointer;">✕</button>
        </div>
        <div id="chat-messages"></div>
        <div class="p-4 border-t border-white/5 flex gap-2">
            <input type="text" id="chat-input" placeholder="Напишите нам..." class="flex-1 bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white outline-none text-sm">
            <button onclick="sendMessage()" class="bg-[#bf953f] text-black px-5 rounded-2xl font-black">></button>
        </div>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            authDomain: "nnnmb-a0b52.firebaseapp.com", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com", 
            projectId: "nnnmb-a0b52" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allNumbers = {};
        let selNum = '';
        let currentFilter = 'all';

        // Загрузка данных
        db.ref('inventory').on('value', s => { allNumbers = s.val() || {}; render(); });
        db.ref('settings/banner').on('value', s => {
            const box = document.getElementById('banner-box');
            if(s.val()) { box.style.display = 'block'; document.getElementById('banner-txt').innerText = s.val() + " • " + s.val(); }
            else { box.style.display = 'none'; }
        });
        db.ref('stats/visits').transaction(c => (c || 0) + 1);

        function setFilter(op, btn) {
            currentFilter = op;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            btn.classList.add('tab-active');
            render();
        }

        function render() {
            const list = document.getElementById('list');
            list.innerHTML = "";
            Object.keys(allNumbers).reverse().forEach(k => {
                const item = allNumbers[k];
                if(currentFilter !== 'all' && item.op !== currentFilter) return;
                list.innerHTML += `
                    <div class="neon-card">
                        <div class="card-content">
                            <div class="w-full flex justify-between items-center opacity-30 text-[9px] font-bold uppercase mb-4 px-1">
                                <span>${item.op}</span><span class="gold-grad italic">Elite Status</span>
                            </div>
                            <div class="text-4xl font-black italic tracking-tighter text-white">+7 ${item.num}</div>
                            <div class="price-text">${parseInt(item.price).toLocaleString()} ₽</div>
                            <button class="buy-btn" onclick="openModal('${item.num}')">Оформить номер</button>
                        </div>
                    </div>`;
            });
        }

        function openModal(n) {
            selNum = n;
            document.getElementById('m-num').innerText = '+7 ' + n;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function sendOrder() {
            const fio = document.getElementById('fio').value.trim();
            const con = document.getElementById('contact').value.trim();
            if(!fio || !con) return alert("Пожалуйста, заполните все поля!");
            db.ref('leads').push({ num: selNum, fio, contact: con, ts: Date.now() }).then(() => {
                alert("Заявка успешно отправлена! Мы свяжемся с вами.");
                closeModal();
            });
        }

        // ЛОГИКА ЧАТА
        let userId = localStorage.getItem('user_chat_id') || 'u' + Math.floor(Math.random() * 10000);
        localStorage.setItem('user_chat_id', userId);

        function toggleChat() {
            const win = document.getElementById('chat-window');
            const isHidden = win.style.display === 'none' || win.style.display === '';
            win.style.display = isHidden ? 'flex' : 'none';
            if(isHidden) {
                db.ref('chats/' + userId + '/messages').on('value', s => {
                    const container = document.getElementById('chat-messages');
                    container.innerHTML = "";
                    Object.values(s.val() || {}).forEach(m => {
                        container.innerHTML += `<div class="msg ${m.role === 'user' ? 'msg-user' : 'msg-admin'}">${m.text}</div>`;
                    });
                    container.scrollTop = container.scrollHeight;
                });
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            db.ref('chats/' + userId + '/messages').push({ text, role: 'user', ts: Date.now() });
            db.ref('chats/' + userId + '/metadata').set({ lastMsg: text, ts: Date.now(), id: userId });
            input.value = "";
        }
    </script>
</body>
</html>
