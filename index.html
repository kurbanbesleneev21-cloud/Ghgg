<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | PREMIUM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #000; color: #fff; font-family: 'Manrope', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .gold-bg { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: #0a0a0a; border: 1px solid rgba(255,255,255,0.05); border-radius: 28px; transition: 0.3s; position: relative; overflow: hidden; }
        .card:active { transform: scale(0.97); background: #111; }
        .badge { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 4px 10px; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #a1a1aa; }
        .price-tag { background: rgba(251, 191, 36, 0.1); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.2); border-radius: 12px; padding: 6px 14px; font-weight: 800; font-size: 14px; }
        .tab-btn { transition: 0.3s; white-space: nowrap; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #71717a; border: 1px solid transparent; }
        .tab-active { background: #fff !important; color: #000 !important; border-radius: 16px; }
        #order-modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.96); align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type="file"]::file-selector-button { display: none; }
    </style>
</head>
<body class="pb-24">

    <header class="p-6 sticky top-0 z-50 glass flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black uppercase tracking-tighter italic">SIM <span class="gold-text">MARKET</span></h1>
            <div class="h-1 w-12 gold-bg rounded-full mt-1"></div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <div class="relative mb-6">
            <input type="text" id="q" oninput="draw()" placeholder="Найти красивый номер..." class="w-full p-6 rounded-3xl bg-zinc-900 border border-zinc-800 outline-none text-base focus:border-amber-500 transition-all">
        </div>

        <div class="flex gap-2 overflow-x-auto no-scrollbar mb-8 pb-2">
            <button onclick="setFilter('all', this)" class="tab-btn tab-active px-8 py-3 rounded-2xl bg-zinc-900">Все</button>
            <button onclick="setFilter('mts', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">МТС</button>
            <button onclick="setFilter('megafon', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">Мегафон</button>
            <button onclick="setFilter('beeline', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">Билайн</button>
            <button onclick="setFilter('tele2', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">Теле2</button>
            <button onclick="setFilter('yota', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">Yota
