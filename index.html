<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #000; color: #fff; font-family: 'Manrope', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .gold-bg { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: #0a0a0a; border: 1px solid rgba(255,255,255,0.05); border-radius: 28px; transition: 0.3s; }
        .card:active { transform: scale(0.97); background: #111; }
        .badge { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 4px 8px; font-size: 9px; font-weight: 800; text-transform: uppercase; color: #a1a1aa; }
        .price-tag { background: rgba(251, 191, 36, 0.1); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.2); border-radius: 12px; padding: 6px 12px; font-weight: 800; }
        .tab-btn { transition: 0.3s; white-space: nowrap; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #71717a; border: 1px solid rgba(255,255,255,0.05); }
        .tab-active { background: #fff !important; color: #000 !important; border-color: #fff !important; }
        #order-modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; padding: 20px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-20">

    <header class="p-6 sticky top-0 z-50 glass flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black uppercase italic">SIM <span class="gold-text">MARKET</span></h1>
            <div class="h-1 w-12 gold-bg rounded-full mt-1"></div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <input type="text" id="q" oninput="draw()" placeholder="Найти красивый номер..." class="w-full p-6 rounded-3xl bg-zinc-900/50 border border-zinc-800 outline-none text-base focus:border-amber-500 mb-8 transition-all">

        <div class="flex gap-3 overflow-x-auto no-scrollbar mb-8 pb-2">
            <button onclick="setFilter('all', this)" class="tab-btn tab-active px-8 py-3 rounded-2xl bg-zinc-900">Все</button>
            <button onclick="setFilter('mts', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">МТС</button>
            <button onclick="setFilter('megafon', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">Мегафон</button>
            <button onclick="setFilter('beeline', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">Билайн</button>
            <button onclick="setFilter('tele2', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">Теле2</button>
            <button onclick="setFilter('yota', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">Yota</button>
        </div>

        <div id="list" class="space-y-5">
            <div class="text-center py-20 opacity-30 animate-pulse font-bold uppercase">Загрузка...</div>
        </div>
    </main>

    <div id="order-modal">
        <div class="bg-zinc-950 w-full max-w-sm p-8 rounded-[3rem] border border-zinc-800 space-y-5 relative">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-zinc-500">✕</button>
            <div class="text-center">
                <h2 id="target-num" class="text-3xl font-black text-white tracking-tighter"></h2>
            </div>
            
            <div class="space-y-3">
                <input type="text" id="client-fio" placeholder="ФИО полностью" class="w-full p-4 bg-zinc-900 border border-zinc-800 rounded-2xl outline-none focus:border-amber-500">
                <input type="tel" id="client-phone" placeholder="Ваш телефон" class="w-full p-4 bg-zinc-900 border border-zinc-800 rounded-2xl outline-none focus:border-amber-500">
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl text-center">
                        <label class="block text-[8px] uppercase font-black mb-2 text-zinc-500">Паспорт</label>
                        <input type="file" id="client-passport" accept="image/*" class="hidden">
                        <button onclick="document.getElementById('client-passport').click()" class="text-[10px] font-bold text-amber-500">ВЫБРАТЬ</button>
                    </div>
                    <div class="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl text-center">
                        <label class="block text-[8px] uppercase font-black mb-2 text-zinc-500">Прописка</label>
                        <input type="file" id="client-prodiska" accept="image/*" class="hidden">
                        <button onclick="document.getElementById('client-prodiska').click()" class="text-[10px] font-bold text-amber-500">ВЫБРАТЬ</button>
                    </div>
                </div>
            </div>

            <button onclick="submitOrder()" id="send-btn" class="w-full py-5 gold-bg text-black font-black rounded-2xl uppercase text-xs tracking-wider shadow-[0_10px_30px_rgba(217,119,6,0.3)]">Купить номер</button>
        </div>
    </div>

    <script>

        const MY_ID = "8768514374";

        const KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW"; 

        let db = [], activeFilter = 'all';

        async function init() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN}/latest`, { headers: {'X-Master-Key': KEY} });
                const data = await res.json();
                db = data.record.record || data.record;
                draw();
            } catch(e) { console.error("Data error"); }
        }

        function setFilter(val, btn) {
            activeFilter = val.toLowerCase();
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            btn.classList.add('tab-active');
            draw();
        }

        function draw() {
            const list = document.getElementById('list');
            const query = document.getElementById('q').value.toLowerCase();
            
            let filtered = db.filter(i => {
                const numStr = String(i.n || "").toLowerCase();
                const opStr = String(i.op || "").toLowerCase();
                // Показываем во "Все" даже без оператора. В категориях — только совпадение.
                return numStr.includes(query) && (activeFilter === 'all' || opStr === activeFilter);
            });

            if (filtered.length === 0) {
                list.innerHTML = '<div class="text-center py-20 opacity-20 uppercase font-bold text-xs">Номеров не найдено</div>';
                return;
            }

            list.innerHTML = filtered.map(i => `
                <div class="card p-7 shadow-xl">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex gap-2">
                            <span class="badge italic font-extrabold text-white">${i.op || 'SIM'}</span>
                            <span class="badge text-amber-500">${i.tarif || 'VIP'}</span>
                        </div>
                        <div class="price-tag">${i.t} ₽</div>
                    </div>
                    <div class="flex justify-between items-end">
                        <div class="text-3xl font-black tracking-tighter text-white drop-shadow-md">${i.n}</div>
                        <button onclick="openModal('${i.n}', '${i.t}')" class="px-6 py-3 gold-bg text-black font-black rounded-xl text-[10px] uppercase active:scale-90 transition-all">Забрать</button>
                    </div>
                </div>
            `).reverse().join('');
        }

        function openModal(n, t) {
            document.getElementById('target-num').innerText = n;
            document.getElementById('order-modal').style.display = 'flex';
            window.cN = n; window.cT = t;
        }

        function closeModal() { document.getElementById('order-modal').style.display = 'none'; }
