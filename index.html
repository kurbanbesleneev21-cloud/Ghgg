<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | Оформление</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #000; color: #fff; font-family: 'Manrope', sans-serif; }
        .glass { background: rgba(18, 18, 18, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .gold-bg { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-dark { background: #111; border: 1px solid #222; border-radius: 16px; padding: 16px; width: 100%; outline: none; color: white; }
        .input-dark:focus { border-color: #fbbf24; }
        #order-modal { display: none; position: fixed; inset: 0; z-index: 100; background: #000; overflow-y: auto; }
    </style>
</head>
<body class="bg-black pb-10">

    <header class="p-6 sticky top-0 z-40 glass flex justify-between items-center">
        <h1 class="text-xl font-black uppercase italic italic text-white">SIM <span class="gold-text">MARKET</span></h1>
        <span class="text-[10px] bg-white/5 px-3 py-1 rounded-full border border-white/10 uppercase font-bold">V3.0 Online</span>
    </header>

    <main id="main-page" class="max-w-2xl mx-auto p-4">
        <div class="mb-8">
            <h2 class="text-3xl font-black mb-2">ВЫБЕРИТЕ НОМЕР</h2>
            <p class="text-zinc-500 text-sm italic">Оформление официально по паспорту</p>
        </div>
        <div id="list" class="space-y-4">
            <p class="text-center py-10 opacity-20 uppercase font-bold text-xs">Загрузка базы...</p>
        </div>
    </main>

    <div id="order-modal">
        <div class="p-6 max-w-xl mx-auto">
            <button onclick="closeModal()" class="mb-6 text-zinc-500 font-bold uppercase text-[10px]">← Вернуться назад</button>
            
            <h2 class="text-2xl font-black mb-2 uppercase">ОФОРМЛЕНИЕ НОМЕРА</h2>
            <p id="selected-num-display" class="text-amber-500 font-black text-xl mb-8 tracking-tighter"></p>

            <form id="tg-form" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-bold uppercase mb-2 opacity-40">ФИО Клиента</label>
                    <input type="text" id="fio" placeholder="Иванов Иван Иванович" class="input-dark" required>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase mb-2 opacity-40">Контактный телефон</label>
                    <input type="tel" id="contact" placeholder="+7 (___) ___-__-__" class="input-dark" required>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold uppercase mb-2 opacity-40 italic text-amber-500">Лицевая сторона паспорта</label>
                        <input type="file" id="photo-main" accept="image/*" class="text-xs file:bg-zinc-800 file:text-white file:border-none file:rounded-lg file:px-4 file:py-2" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase mb-2 opacity-40 italic text-amber-500">Страница прописки</label>
                        <input type="file" id="photo-reg" accept="image/*" class="text-xs file:bg-zinc-800 file:text-white file:border-none file:rounded-lg file:px-4 file:py-2" required>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full gold-bg text-black p-5 rounded-2xl font-black uppercase text-sm shadow-xl shadow-amber-500/10">
                    ОТПРАВИТЬ ЗАЯВКУ КУРБАНУ
                </button>
            </form>
        </div>
    </div>

    <script>
        const API_TOKEN = '8279695581:AAGuQgQhmgq9QaTX4rULywq6o18MeT3XIUw';
        const ADMIN_ID = '8768514374'; 
        const BIN_ID = '69c9d640aaba882197a65742';
        const BIN_KEY = '$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW';

        let db = [], currentNumber = "";

        async function init() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: {'X-Master-Key': BIN_KEY} });
                const data = await res.json();
                db = data.record.record || data.record;
                draw();
            } catch(e) { console.error('Ошибка загрузки'); }
        }

        function draw() {
            const list = document.getElementById('list');
            list.innerHTML = db.map(i => `
                <div class="p-6 bg-zinc-900 rounded-[2rem] border border-white/5 flex justify-between items-center">
                    <div>
                        <div class="text-[9px] uppercase font-bold text-zinc-500 mb-1">${i.op} | ${i.tarif}</div>
                        <div class="text-xl font-black tracking-tighter">${i.n}</div>
                    </div>
                    <button onclick="openModal('${i.n}')" class="bg-white text-black font-black px-6 py-3 rounded-xl text-[10px] uppercase">Купить</button>
                </div>
            `).reverse().join('');
        }

        function openModal(num) {
            currentNumber = num;
            document.getElementById('selected-num-display').innerText = num;
            document.getElementById('order-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('order-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // ОТПРАВКА В TELEGRAM
        document.getElementById('tg-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "ОТПРАВКА...";
            btn.disabled = true;

            const fio = document.getElementById('fio').value;
            const contact = document.getElementById('contact').value;
            const photoMain = document.getElementById('photo-main').files[0];
            const photoReg = document.getElementById('photo-reg').files[0];

            const message = `🆕 <b>ЗАЯВКА С САЙТА</b>\n\n📱 <b>Номер:</b> <code>${currentNumber}</code>\n👤 <b>ФИО:</b> ${fio}\n📞 <b>Контакт:</b> ${contact}`;

            try {
                // 1. Отправляем текст
                await fetch(`https://api.telegram.org/bot${API_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chat_id: ADMIN_ID, text: message, parse_mode: 'HTML' })
                });

                // 2. Отправляем фото 1 (лицевая)
                const formData1 = new FormData();
                formData1.append('chat_id', ADMIN_ID);
                formData1.append('photo', photoMain);
                formData1.append('caption', `🖼 Паспорт: ${currentNumber}`);
                await fetch(`https://api.telegram.org/bot${API_TOKEN}/sendPhoto`, { method: 'POST', body: formData1 });

                // 3. Отправляем фото 2 (прописка)
                const formData2 = new FormData();
                formData2.append('chat_id', ADMIN_ID);
                formData2.append('photo', photoReg);
                formData2.append('caption', `🏠 Прописка: ${currentNumber}`);
                await fetch(`https://api.telegram.org/bot${API_TOKEN}/sendPhoto`, { method: 'POST', body: formData2 });

                alert('Заявка успешно отправлена! Курбан свяжется с вами.');
                closeModal();
                e.target.reset();
            } catch (err) {
                alert('Ошибка при отправке. Попробуйте еще раз.');
            } finally {
                btn.innerText = "ОТПРАВИТЬ ЗАЯВКУ КУРБАНУ";
                btn.disabled = false;
            }
        };

        init();
    </script>
</body>
</html>
