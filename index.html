<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-MARKET | Premium Numbers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap');
        
        :root {
            --gold: linear-gradient(135deg, #d4af37 0%, #f1d279 50%, #b8860b 100%);
            --bg: #080808;
            --card-bg: rgba(255, 255, 255, 0.03);
        }

        body { 
            background-color: var(--bg); 
            color: #fff; 
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .gold-text { background: var(--gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-border { border: 1px solid rgba(212, 175, 55, 0.3); }
        .glass { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        
        /* Кнопка купить */
        .btn-buy {
            background: var(--gold);
            color: #000;
            font-weight: 800;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        .btn-buy:active { transform: scale(0.95); }

        /* Поиск */
        .search-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 14px 20px;
            transition: 0.3s;
        }
        .search-box:focus-within { border-color: #d4af37; background: rgba(255,255,255,0.08); }

        /* Анимация появления */
        .fade-in { animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-10">

    <!-- HEADER -->
    <header class="p-6 sticky top-0 z-50 bg-[#080808]/90 backdrop-blur-xl">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tighter gold-text uppercase italic">S-MARKET</h1>
                <p class="text-[9px] text-gray-500 tracking-[4px] font-medium mt-1">KHASAVYURT ELITE</p>
            </div>
            <div class="w-12 h-12 rounded-2xl glass flex items-center justify-center gold-border">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1.5">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
        </div>

        <!-- SEARCH -->
        <div class="search-box flex items-center gap-3 mb-6">
            <svg width="20" height="20" fill="none" stroke="gray" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="searchInput" placeholder="Поиск номера..." class="bg-transparent border-none outline-none w-full text-sm font-medium text-white placeholder-gray-500">
        </div>

        <!-- FILTERS -->
        <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
            <button class="px-5 py-2 rounded-full glass text-xs font-bold whitespace-nowrap gold-border active" onclick="filterData('all', this)">Все номера</button>
            <button class="px-5 py-2 rounded-full glass text-xs font-bold whitespace-nowrap opacity-50" onclick="filterData('gold', this)">Золото</button>
            <button class="px-5 py-2 rounded-full glass text-xs font-bold whitespace-nowrap opacity-50" onclick="filterData('vip', this)">VIP</button>
        </div>
    </header>

    <!-- CATALOG -->
    <main id="catalog" class="px-6 space-y-4">
        <!-- Карточки будут здесь -->
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44",
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allData = [];

        db.ref('inventory').on('value', snapshot => {
            allData = [];
            snapshot.forEach(child => { allData.push(child.val()); });
            render(allData);
        });

        function render(items) {
            const container = document.getElementById('catalog');
            container.innerHTML = items.length ? items.map(item => `
                <div class="glass p-5 rounded-[30px] flex justify-between items-center fade-in">
                    <div class="space-y-1">
                        <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">${item.op || 'Оператор'}</span>
                        <h3 class="text-2xl font-extrabold tracking-tight text-white">+7 ${item.num}</h3>
                    </div>
                    <div class="text-right">
                        <p class="text-xl font-bold gold-text">${item.price} ₽</p>
                        <button onclick="window.open('https://t.me/kurban_smarket', '_blank')" class="btn-buy px-5 py-2 rounded-xl text-[10px] mt-2 uppercase">Купить</button>
                    </div>
                </div>
            `).join('') : '<p class="text-center text-gray-500 py-10">Ничего не найдено...</p>';
        }

        document.getElementById('searchInput').addEventListener('input', e => {
            const val = e.target.value.toLowerCase();
            const filtered = allData.filter(i => i.num.includes(val));
            render(filtered);
        });

        function filterData(cat, el) {
            document.querySelectorAll('button').forEach(b => b.classList.add('opacity-50', 'gold-border'));
            el.classList.remove('opacity-50');
            // Логика фильтрации по категориям (если они есть в базе)
            if(cat === 'all') render(allData);
        }
    </script>
</body>
</html>
