<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap');
        :root { --gold: #bf953f; }
        body { font-family: 'Manrope', sans-serif; background: #050505; color: #fff; overflow-x: hidden; }
        
        /* Тот самый эффект переливания */
        .num-card { 
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .num-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(191,149,63,0.1) 0%, transparent 70%);
            opacity: 0; transition: 0.5s;
        }
        .num-card:hover { transform: translateY(-5px); border-color: var(--gold); }
        .num-card:hover::before { opacity: 1; }

        .gold-text { color: var(--gold); }
        .btn-gold { background: var(--gold); color: #000; font-weight: 800; border-radius: 14px; transition: 0.3s; }
        
        input, select { background: #111!important; border: 1px solid #222!important; color: #fff!important; padding: 14px; border-radius: 14px; width: 100%; outline: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header class="p-5 flex justify-between items-center sticky top-0 bg-[#050505]/80 backdrop-blur-lg z-50">
        <h1 class="text-xl font-black italic gold-text">SIM<span class="text-white">MARKET</span></h1>
        <div id="user-status" class="text-[10px] font-bold uppercase tracking-widest border border-white/10 px-4 py-2 rounded-full">
            Войти
        </div>
    </header>

    <!-- Главный экран -->
    <section class="py-12 px-5 text-center">
        <h2 class="text-4xl font-black mb-2 uppercase italic leading-tight">Красивые <span class="gold-text">Номера</span></h2>
        <p class="text-gray-500 text-xs uppercase tracking-widest">Дагестан • Официальное оформление</p>
    </section>

    <!-- Витрина номеров -->
    <section class="px-5 max-w-5xl mx-auto pb-20">
        <div id="numbers-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Номера загружаются сюда -->
            <p class="text-center opacity-20 animate-pulse">Загрузка коллекции...</p>
        </div>
    </section>

    <!-- Модальное окно: Регистрация / Заказ -->
    <div id="modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[100] hidden flex items-center justify-center p-5">
        <div class="glass p-8 w-full max-w-md relative border border-white/10 rounded-[30px] bg-[#0a0a0a]">
            <button onclick="closeModal()" class="absolute top-5 right-5 opacity-50">✕</button>
            
            <div id="form-content">
                <h3 class="text-2xl font-black mb-2 uppercase text-center">Оформление</h3>
                <p class="text-gray-500 text-[10px] text-center mb-6 uppercase tracking-widest">Создайте профиль для покупки</p>
                
                <div class="space-y-3">
                    <input type="text" id="reg-name" placeholder="Ваше Имя">
                    <input type="tel" id="reg-phone" placeholder="Ваш номер телефона">
                    <input type="password" id="reg-pass" placeholder="Придумайте пароль">
                    
                    <select id="reg-op">
                        <option value="" disabled selected>Выберите оператора</option>
                        <option value="Мегафон">Мегафон</option>
                        <option value="Билайн">Билайн</option>
                        <option value="МТС">МТС</option>
                        <option value="Теле2">Теле2</option>
                    </select>

                    <div class="pt-4">
                        <p id="selected-num-display" class="text-center text-sm font-bold gold-text mb-4"></p>
                        <button onclick="handleAuthAndOrder()" class="btn-gold w-full py-4 shadow-xl shadow-[#bf953f]/20">ПОДТВЕРДИТЬ ЗАКАЗ</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
        databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let selectedNumber = "";

    // 1. ЗАГРУЗКА НОМЕРОВ (С переливающимися карточками)
    function loadNumbers() {
        db.ref('inventory').on('value', snap => {
            const grid = document.getElementById('numbers-grid');
            grid.innerHTML = "";
            
            snap.forEach(child => {
                const n = child.val();
                const phone = child.key; // Берем ключ как номер (цифры)
                
                // Форматируем для красоты: 9287777777 -> +7 (928) 777-77-77
                const fPhone = `+7 (${phone.substring(0,3)}) ${phone.substring(3,6)}-${phone.substring(6,8)}-${phone.substring(8,10)}`;

                grid.innerHTML += `
                    <div class="num-card p-6 flex justify-between items-center" onclick="openOrder('${fPhone}')">
                        <div>
                            <p class="text-2xl font-black tracking-tighter">${fPhone}</p>
                            <div class="flex gap-2 mt-1">
                                <span class="text-[9px] font-bold px-2 py-0.5 bg-white/5 rounded text-gray-400 uppercase">${n.category || 'VIP'}</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xl font-black gold-text">${n.price} ₽</p>
                            <p class="text-[8px] font-black text-green-500 uppercase tracking-widest mt-1">В наличии</p>
                        </div>
                    </div>`;
            });
        });
    }

    // 2. ЛОГИКА ЗАКАЗА И РЕГИСТРАЦИИ
    function openOrder(num) {
        selectedNumber = num;
        document.getElementById('selected-num-display').innerText = "Вы выбрали: " + num;
        document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('modal').classList.add('hidden');
    }

    function handleAuthAndOrder() {
        const name = document.getElementById('reg-name').value;
        const phone = document.getElementById('reg-phone').value;
        const pass = document.getElementById('reg-pass').value;
        const op = document.getElementById('reg-op').value;

        if(!name || !phone || !pass || !op) {
            return alert("Курбан, нужно заполнить все поля!");
        }

        // Чистим телефон клиента от лишних знаков
        const cleanPhone = phone.replace(/\D/g, '');

        // Сохраняем пользователя
        db.ref('users/' + cleanPhone).set({
            name: name,
            password: pass,
            operator: op,
            role: 'user',
            date: new Date().toLocaleDateString()
        });

        // Создаем заявку на номер
        db.ref('orders').push({
            clientName: name,
            clientPhone: cleanPhone,
            wantedNum: selectedNumber,
            operator: op,
            status: 'new',
            date: new Date().toLocaleString('ru-RU')
        }).then(() => {
            alert("Заказ принят! Мы свяжемся с вами.");
            closeModal();
        });
    }

    window.onload = loadNumbers;
</script>
</body>
</html>
