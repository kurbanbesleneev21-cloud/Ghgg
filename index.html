 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM MARKET | Premium Digital Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { background: #05070a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .gold-gradient { background: linear-gradient(135deg, #fcd34d 0%, #fbbf24 50%, #b45309 100%); }
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .glass-card:hover { border-color: #fbbf24; transform: translateY(-5px); box-shadow: 0 20px 40px -20px rgba(251, 191, 36, 0.3); }
        .search-input { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; }
        .search-input:focus { border-color: #fbbf24; box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.1); }
        .badge-new { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="sticky top-0 z-50 glass-card border-b border-white/5 px-6 py-4 mb-8">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex flex-col">
                <span class="text-2xl font-black tracking-tighter gold-gradient bg-clip-text text-transparent uppercase">SIM MARKET</span>
                <span class="text-[9px] text-gray-500 tracking-[3px] uppercase">Khasavyurt Edition</span>
            </div>
            <div class="flex gap-4">
                <div id="cart-count" class="bg-yellow-500 text-black text-[10px] font-bold px-2 py-1 rounded-full">0 НОМЕРОВ</div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4">
        <section class="mb-12">
            <div class="glass-card p-6 rounded-3xl">
                <div class="flex flex-col md:flex-row gap-4">
                    <input type="text" id="searchInput" oninput="filterNumbers()" placeholder="Поиск по цифрам (например: 777)..." class="search-input w-full p-4 rounded-2xl outline-none text-white">
                    <select id="filterTag" onchange="filterNumbers()" class="search-input p-4 rounded-2xl outline-none text-gray-400">
                        <option value="ALL">Все категории</option>
                        <option value="VIP">VIP</option>
                        <option value="GOLD">GOLD</option>
                        <option value="SILVER">SILVER</option>
                    </select>
                </div>
            </div>
        </section>

        <section id="catalog" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-20">
            </section>

        <section id="orderSection" class="max-w-2xl mx-auto">
            <div class="glass-card p-8 md:p-12 rounded-[3rem] border-t-2 border-yellow-500/30 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-500/5 blur-3xl rounded-full"></div>
                <h2 class="text-3xl font-extrabold mb-8 text-center italic">ОФОРМИТЬ <span class="gold-text">ЗАЯВКУ</span></h2>
                
                <form id="regForm" class="space-y-5">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="phone_num" placeholder="Выбранный номер" class="search-input p-5 rounded-2xl w-full text-yellow-500 font-bold" required readonly>
                        <input type="text" id="user_contact" placeholder="Ваш телефон для связи" class="search-input p-5 rounded-2xl w-full" required>
                    </div>
                    <input type="text" id="user_name" placeholder="Полное ФИО клиента" class="search-input p-5 rounded-2xl w-full" required>

                    <div class="grid grid-cols-2 gap-4">
                        <label class="group cursor-pointer">
                            <div class="glass-card p-4 rounded-2xl text-center group-hover:bg-white/5">
                                <input type="file" id="p1" class="hidden" required onchange="u('l1')">
                                <span id="l1" class="text-[10px] font-bold text-gray-500 uppercase">📸 ПАСПОРТ</span>
                            </div>
                        </label>
                        <label class="group cursor-pointer">
                            <div class="glass-card p-4 rounded-2xl text-center group-hover:bg-white/5">
                                <input type="file" id="p2" class="hidden" required onchange="u('l2')">
                                <span id="l2" class="text-[10px] font-bold text-gray-500 uppercase">🏠 ПРОПИСКА</span>
                            </div>
                        </label>
                    </div>

                    <button type="submit" id="mainBtn" class="w-full gold-gradient p-6 rounded-2xl text-black font-black uppercase tracking-widest hover:scale-[1.02] active:scale-95 transition-all shadow-2xl shadow-yellow-500/20">
                        Подтвердить регистрацию
                    </button>
                </form>
                <div id="statusMsg" class="mt-6 text-center text-sm font-bold"></div>
            </div>
        </section>
    </main>
