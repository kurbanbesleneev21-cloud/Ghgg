<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #000; color: #fff; min-height: 100vh; margin: 0; padding: 0; }
        .gold-grad { background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* КАРТОЧКИ НОМЕРОВ */
        .neon-card { position: relative; background: #0a0a0a; border-radius: 28px; overflow: hidden; z-index: 1; margin-bottom: 20px; }
        .neon-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, #bf953f, #fcf6ba, transparent 70%); animation: rotate 4s linear infinite; z-index: -2; }
        .neon-card::after { content: ''; position: absolute; inset: 2px; background: #0d0d0d; border-radius: 26px; z-index: -1; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .tab { padding: 10px 20px; border-radius: 18px; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.05); color: rgba(255,255,255,0.4); cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .tab.active { background: #bf953f; color: #000; border-color: #bf953f; box-shadow: 0 4px 15px rgba(191,149,63,0.3); }

        .input-dark { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 16px; border-radius: 20px; color: #fff; outline: none; transition: 0.3s; }
        .input-dark:focus { border-color: #bf953f; background: rgba(255,255,255,0.08); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 5000; display: none; overflow-y: auto; padding: 20px; backdrop-filter: blur(20px); align-items: center; justify-content: center; }
        .btn-gold { background: linear-gradient(135deg, #bf953f, #fcf6ba); color: #000; font-weight: 900; text-transform: uppercase; padding: 16px; border-radius: 20px; width: 100%; font-size: 11px; transition: 0.2s; }
        .btn-gold:active { transform: scale(0.97); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 pb-24">

    <header class="flex justify-between items-center mb-8 pt-4">
        <div>
            <h1 class="text-2xl font-black italic gold-grad uppercase leading-tight">SIM MARKET</h1>
            <p class="text-[8px] tracking-[3px] opacity-30 font-bold uppercase">Hasavyurt Premium</p>
        </div>
        
        <div id="user-ui" class="hidden flex items-center gap-3 cursor-pointer" onclick="openProfile()">
            <div class="text-right"><p class="text-[10px] font-black gold-grad uppercase tracking-widest">Кабинет</p></div>
            <div class="w-10 h-10 bg-gradient-to-tr from-[#bf953f] to-[#fcf6ba] rounded-full flex items-center justify-center text-black font-black">К</div>
        </div>
        
        <button id="login-btn" onclick="openModal('auth-modal')" class="border border-[#bf953f]/30 px-6 py-2 rounded-full text-[10px] font-black uppercase gold-grad">Войти</button>
    </header>

    <div class="space-y-6 mb-8">
        <input type="text" id="search-input" oninput="renderItems()" placeholder="Поиск по цифрам (например: 777)..." class="input-dark shadow-2xl">
        <div class="flex gap-2 overflow-x-auto no-scrollbar">
            <div class="tab active" onclick="filterOp('ALL', this)">Все</div>
            <div class="tab" onclick="filterOp('МТС', this)">МТС</div>
            <div class="tab" onclick="filterOp('БИЛАЙН', this)">Билайн</div>
            <div class="tab" onclick="filterOp('МЕГАФОН', this)">Мегафон</div>
            <div class="tab" onclick="filterOp('FAV', this)">⭐ Избранное</div>
        </div>
    </div>

    <div id="list" class="grid gap-2"></div>

    <div id="auth-modal" class="modal">
        <div class="bg-[#0d0d0d] p-8 rounded-[40px] border border-white/5 w-full max-w-sm space-y-4 shadow-2xl">
            <div class="flex bg-white/5 p-1 rounded-2xl mb-2">
                <button id="tab-reg" onclick="toggleAuthTab('reg')" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase bg-[#bf953f] text-black transition">Регистрация</button>
                <button id="tab-login" onclick="toggleAuthTab('login')" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase opacity-40 transition">Вход</button>
            </div>
            <div class="space-y-3">
                <input type="tel" id="auth-phone" placeholder="Номер телефона" class="input-dark">
                <input type="password" id="auth-pass" placeholder="Пароль" class="input-dark">
            </div>
            <button onclick="handleAuth()" id="auth-main-btn" class="btn-gold">Создать аккаунт</button>
            <p onclick="closeModals()" class="text-center text-[9px] opacity-20 uppercase font-black pt-2 cursor-pointer">Закрыть</p>
        </div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="max-w-md mx-auto w-full text-center p-6">
            <h2 class="text-2xl font-black gold-grad italic uppercase mb-10">Личный Кабинет</h2>
            <div class="bg-white/5 p-10 rounded-[50px] border border-white/5 mb-8">
                <p id="profile-phone-display" class="text-xl font-black mb-2 text-white"></p>
                <p class="text-[9px] opacity-30 uppercase font-bold tracking-[3px]">Статус: Постоянный клиент</p>
            </div>
            <div class="bg-white/5 p-6 rounded-3xl border border-white/5 text-left mb-8">
                <p class="text-[10px] opacity-40 uppercase mb-4 font-black">Ваши возможности:</p>
                <p class="text-xs mb-2">✅ Быстрое оформление заказов</p>
                <p class="text-xs">✅ Доступ к редким номерам</p>
            </div>
            <button onclick="logout()" class="text-red-500 font-bold text-[10px] uppercase tracking-widest mt-4">Выйти из системы</button>
            <p onclick="closeModals()" class="mt-8 opacity-20 uppercase text-[10px] font-black">Вернуться назад</p>
        </div>
    </div>

    <div id="order-modal" class="modal">
        <div class="bg-[#0d0d0d] p-8 rounded-[40px] border border-white/5 w-full max-w-sm space-y-5">
            <h2 class="text-xl font-black gold-grad uppercase italic text-center">Оформить заказ</h2>
            <div class="bg-white/5 p-6 rounded-3xl text-center border border-white/5">
                <p class="text-[10px] opacity-30 uppercase mb-1">Выбранный номер:</p>
                <p id="order-num-display" class="text-2xl font-black italic gold
