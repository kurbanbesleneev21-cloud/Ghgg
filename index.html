<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #09090b; color: #f4f4f5; font-family: 'Manrope', sans-serif; }
        .glass { background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; transition: 0.2s; }
        .tab-active { background: #f59e0b !important; color: #000 !important; }
    </style>
</head>
<body class="pb-24">

    <header class="p-6 sticky top-0 z-50 glass border-b border-white/5">
        <h1 class="text-xl font-extrabold uppercase leading-none">SIM <span class="gold-text">MARKET</span></h1>
        <div class="flex gap-2 overflow-x-auto mt-4 no-scrollbar">
            <button onclick="setF('all', this)" class="tab-btn tab-active px-4 py-2 rounded-full bg-zinc-900 text-[10px] font-black uppercase border border-white/5">Все</button>
            <button onclick="setF('vip', this)" class="tab-btn px-4 py-2 rounded-full bg-zinc-900 text-[10px] font-black uppercase border border-white/5 text-amber-500">VIP</button>
            <button onclick="setF('megafon', this)" class="tab-btn px-4 py-2 rounded-full bg-zinc-900 text-[10px] font-black uppercase border border-white/5">Мегафон</button>
            <button onclick="setF('mts', this)" class="tab-btn px-4 py-2 rounded-full bg-zinc-900 text-[10px] font-black uppercase border border-white/5">МТС</button>
        </div>
    </header>

    <main id="list" class="p-4 space-y-3 max-w-2xl mx-auto">
        </main>

    <div class="fixed bottom-6 right-6 z-[200]">
        <button onclick="toggleChat()" class="w-14 h-14 bg-amber-500 rounded-full shadow-2xl flex items-center justify-center border-4 border-black/50">
            <span id="chat-icon">💬</span>
        </button>

        <div id="chat-window" class="hidden absolute bottom-16 right-0 w-[280px] h-[400px] glass rounded-[2rem] border border-white/10 flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 bg-amber-500/10 border-b border-white/5 text-[10px] font-bold uppercase text-amber-500">Поддержка LIVE</div>
            <div id="chat-msgs" class="flex-1 p-4 overflow-y-auto space-y-3 text-[11px]">
                </div>
            <div class="p-3 bg-zinc-900/90 border-t border-white/5 flex gap-2">
                <input type="text" id="chat-in" placeholder="Ваш вопрос..." class="flex-1 bg-zinc-800 p-2 rounded-xl outline-none text-[11px]">
                <button onclick="sendChat()" class="bg-amber-500 text-black px-3 rounded-xl font-bold">➤</button>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = "69c9d640aaba882197a65742"; 
        const KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW";
        const BOT_TOKEN = "8569235049:AAEsaW4ME-Ql6036i04tIbj--IPNT6JdroE";
        const CHAT_ID = "8768514374";

        let fullData = {};
        let filter = 'all';
        let clientId = localStorage.getItem('sim_client_id') || 'u' + Math.floor(Math.random()*10000);
        localStorage.setItem('sim_client_id', clientId);

        async function load() {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: {'X-Master-Key': KEY} });
            const data = await res.json();
            fullData = data.record;
            draw();
            updateChatUI();
        }

        function draw() {
            const list = document.getElementById('list');
            let items = fullData.record || [];
            if(filter === 'vip') items = items.filter(i => i.cat === 'vip');
            else if(filter !== 'all') items = items.filter(i => i.op === filter);

            list.innerHTML = items.map(i => `
                <div class="card p-5 flex justify-between items-center">
                    <div>
                        <div class="text-xl font-black">${i.n}</div>
                        <div class="text-[9px] text-zinc-500 uppercase">${i.op} • ${i.tarif}</div>
                    </div>
                    <div class="text-amber-500 font-black">${i.t} ₽</div>
                </div>
            `).reverse().join('');
        }

        function setF(val, btn) {
            filter = val;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            btn.classList.add('tab-active');
            draw();
        }

        function toggleChat() { document.getElementById('chat-window').classList.toggle('hidden'); }

        async function sendChat() {
            const inp = document.getElementById('chat-in');
            if(!inp.value.trim()) return;

            const msg = { from: 'client', text: inp.value, time: new Date().toLocaleTimeString(), id: clientId };
            
            // Сохраняем в базу (в раздел support)
            if(!fullData.support) fullData.support = [];
            fullData.support.push(msg);

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT', headers: {'Content-Type': 'application/json', 'X-Master-Key': KEY},
                body: JSON.stringify(fullData)
            });

            // Дублируем в Telegram Курбану
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chat_id: CHAT_ID, text: `💬 ЧАТ (${clientId}): ${inp.value}` })
            });

            inp.value = '';
            updateChatUI();
        }

        function updateChatUI() {
            const box = document.getElementById('chat-msgs');
            const msgs = (fullData.support || []).filter(m => m.id === clientId || m.to === clientId);
            box.innerHTML = msgs.map(m => `
                <div class="${m.from === 'admin' ? 'bg-zinc-800' : 'bg-amber-500/20 ml-auto border border-amber-500/10'} p-3 rounded-2xl max-w-[90%]">
                    <div class="text-[10px] opacity-50 mb-1">${m.from === 'admin' ? 'КУРБАН' : 'ВЫ'}</div>
                    ${m.text}
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        setInterval(load, 4000); // Проверка новых сообщений каждые 4 секунды
        load();
    </script>
</body>
</html>
