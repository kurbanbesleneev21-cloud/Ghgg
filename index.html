<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-MARKET | LUXURY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        
        :root {
            --gold: linear-gradient(90deg, #b8860b, #f1d279, #d4af37, #b8860b);
            --bg: #050505;
        }

        body { background-color: var(--bg); color: #fff; font-family: 'Manrope', sans-serif; }
        
        /* ЗОЛОТАЯ ПЕРЕЛИВАЮЩАЯСЯ РАМКА */
        .gold-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 1px; /* Толщина рамки */
            overflow: hidden;
            z-index: 1;
        }

        .gold-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, #d4af37, transparent 30%);
            animation: rotate 4s linear infinite;
            z-index: -1;
        }

        .card-inner {
            background: #0f0f0f;
            border-radius: 23px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        /* БАННЕР */
        .banner-box {
            background: linear-gradient(135deg, #111 0%, #000 100%);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.1);
        }

        .gold-text { background: linear-gradient(135deg, #d4af37, #f1d279); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* МОДАЛКА */
        #orderModal {
            display: none; position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            align-items: center; justify-content: center; padding: 20px;
        }

        input { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 12px; width: 100%; color: #fff; margin-bottom: 12px; outline: none; }
        input:focus { border-color: #d4af37; }

        #statusToast {
            position: fixed; top: 20px; left: 20px; right: 20px;
            background: #d4af37; color: #000; padding: 15px; border-radius: 15px;
            font-weight: 800; text-align: center; display: none; z-index: 2000;
        }
    </style>
</head>
<body class="pb-10">

    <div id="statusToast">Заявка принята! Ожидайте звонка.</div>

    <div id="orderModal">
        <div class="bg-[#0f0f0f] border border-[#d4af37]/30 p-8 rounded-[32px] w-full max-w-sm text-center">
            <h2 class="text-xl font-black gold-text mb-4">ОФОРМИТЬ ЗАКАЗ</h2>
            <input type="text" id="cName" placeholder="Ваше Имя">
            <input type="tel" id="cPhone" placeholder="Ваш Телефон">
            <button onclick="sendOrder()" class="bg-[#d4af37] text-black w-full py-3 rounded-xl font-black mt-2">ПОДТВЕРДИТЬ</button>
            <button onclick="closeModal()" class="text-gray-500 text-xs mt-4 uppercase">Закрыть</button>
        </div>
    </div>

    <header class="p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black gold-text italic tracking-tighter">S-MARKET</h1>
            <span class="text-[10px] bg-[#d4af37]/10 text-[#d4af37] px-3 py-1 rounded-full border border-[#d4af37]/20 font-bold uppercase">Online</span>
        </div>

        <!-- ДИНАМИЧЕСКИЙ БАННЕР -->
        <div id="mainBanner" class="banner-box rounded-[30px] p-6 mb-8">
            <h2 id="bannerTitle" class="text-2xl font-extrabold mb-1">Загрузка...</h2>
            <p id="bannerSub" class="text-gray-500 text-xs"></p>
        </div>

        <input type="text" id="search" placeholder="Поиск номера..." class="bg-white/5 border-none p-4 rounded-2xl w-full text-sm">
    </header>

    <main id="list" class="px-6 space-y-5"></main>

    <script>
        const TG_TOKEN = '8624578892:AAEr7CLID8dkEM0zCPAoIOkn6anZff8w2pE';
        const CHAT_ID = '8768514374';

        firebase.initializeApp({
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44",
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com"
        });
        const db = firebase.database();

        let numbers = [];
        let activeItem = null;

        // Загрузка настроек баннера
        db.ref('settings/banner').on('value', s => {
            const data = s.val() || { title: "S-MARKET ELITE", sub: "Лучшие номера здесь" };
            document.getElementById('bannerTitle').innerText = data.title;
            document.getElementById('bannerSub').innerText = data.sub;
        });

        // Загрузка номеров
        db.ref('inventory').on('value', s => {
            numbers = [];
            s.forEach(c => { numbers.push(c.val()); });
            draw(numbers);
        });

        function draw(data) {
            document.getElementById('list').innerHTML = data.map(i => `
                <div class="gold-card">
                    <div class="card-inner">
                        <div>
                            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1">${i.op}</p>
                            <h3 class="text-xl font-black tracking-tight text-white">+7 ${i.num}</h3>
                        </div>
                        <div class="text-right">
                            <p class="text-lg font-black gold-text">${i.price} ₽</p>
                            <button onclick="openForm('${i.num}', '${i.price}')" class="bg-white/10 px-4 py-2 rounded-xl text-[10px] font-black uppercase mt-1">Купить</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openForm(num, price) {
            activeItem = { num, price };
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('orderModal').style.display = 'none'; }

        async function sendOrder() {
            const name = document.getElementById('cName').value;
            const phone = document.getElementById('cPhone').value;
            if(!name || !phone) return;

            const msg = `👑 НОВЫЙ ЗАКАЗ!\n\n👤 Имя: ${name}\n📞 Тел: ${phone}\n💎 Номер: +7 ${activeItem.num}\n💰 Цена: ${activeItem.price} ₽`;

            await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: CHAT_ID, text: msg})
            });

            await db.ref('orders').push({ name, phone, item: activeItem.num, date: new Date().toLocaleString() });

            closeModal();
            const t = document.getElementById('statusToast');
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 4000);
        }

        document.getElementById('search').oninput = (e) => {
            const v = e.target.value.toLowerCase();
            draw(numbers.filter(n => n.num.includes(v)));
        };
    </script>
</body>
</html>
