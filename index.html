<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | ВИТРИНА</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #09090b; color: #f4f4f5; font-family: 'Manrope', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { transition: 0.2s; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; }
        .card:active { transform: scale(0.97); background: rgba(255,255,255,0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tab-active { background: #f59e0b !important; color: #000 !important; border-color: #f59e0b !important; }
    </style>
</head>
<body class="pb-24">

    <header class="p-6 sticky top-0 z-50 glass border-b border-white/5 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-extrabold tracking-tighter uppercase leading-none">SIM <span class="gold-text">MARKET</span></h1>
            <p class="text-[8px] font-bold text-zinc-500 uppercase tracking-[0.3em] mt-1">Premium SIM Dagestan</p>
        </div>
        <button onclick="location.reload()" class="w-10 h-10 rounded-full bg-zinc-900 border border-white/5 flex items-center justify-center text-xs">🔄</button>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <input type="text" id="q" oninput="draw()" placeholder="Поиск номера..." 
               class="w-full p-5 mb-6 rounded-2xl bg-zinc-900 border border-zinc-800 outline-none focus:border-amber-500 text-sm">

        <div class="flex gap-2 overflow-x-auto no-scrollbar mb-8 pb-2">
            <button onclick="setF('all', this)" class="tab-btn tab-active px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase tracking-widest border border-white/5 whitespace-nowrap">Все</button>
            <button onclick="setF('vip', this)" class="tab-btn px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase tracking-widest border border-white/5 text-amber-500 whitespace-nowrap">VIP</button>
            <button onclick="setF('mts', this)" class="tab-btn px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase tracking-widest border border-white/5 whitespace-nowrap">МТС</button>
            <button onclick="setF('megafon', this)" class="tab-btn px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase tracking-widest border border-white/5 whitespace-nowrap">Мегафон</button>
            <button onclick="setF('beeline', this)" class="tab-btn px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase tracking-widest border border-white/5 whitespace-nowrap">Билайн</button>
            <button onclick="setF('yota', this)" class="tab-btn px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase tracking-widest border border-white/5 whitespace-nowrap text-cyan-400">Yota</button>
        </div>

        <div id="list" class="space-y-4">
            <div class="p-20 text-center opacity-20 text-[10px] font-black uppercase tracking-widest">Загрузка...</div>
        </div>
    </main>

    <div class="fixed bottom-6 right-6 z-[200]">
        <button onclick="toggleChat()" class="w-16 h-16 bg-amber-500 rounded-full shadow-2xl flex items-center justify-center border-4 border-black/50 active:scale-90 transition-all">
            <span id="chat-icon" class="text-2xl">💬</span>
        </button>

        <div id="chat-window" class="hidden absolute bottom-20 right-0 w-[300px] h-[420px] glass rounded-[2.5rem] border border-white/10 flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 bg-amber-500/10 border-b border-white/5 flex justify-between items-center">
                <span class="text-[9px] font-black uppercase text-amber-500 tracking-widest">Поддержка</span>
                <button onclick="toggleChat()" class="text-zinc-500">✕</button>
            </div>
            <div id="chat-msgs" class="flex-1 p-4 overflow-y-auto space-y-3 text-[11px] no-scrollbar">
                <div class="bg-zinc-800/80 p-3 rounded-2xl rounded-tl-none border border-white/5 text-zinc-300">Салам алейкум! Напишите ваш вопрос и номер для связи, чтобы мы могли вам ответить.</div>
            </div>
            <div class="p-4 bg-zinc-900/90 border-t border-white/5 space-y-2">
                <input type="text" id="chat-contact" placeholder="Ваш телефон или @ник" class="w-full bg-zinc-800 p-2.5 rounded-xl border border-white/5 outline-none text-[10px]">
                <div class="flex gap-2">
                    <input type="text" id="chat-in" placeholder="Ваш вопрос..." class="flex-1 bg-zinc-800 p-3 rounded-xl border border-white/5 outline-none text-[11px]">
                    <button onclick="sendChat()" class="bg-amber-500 text-black w-12 rounded-xl font-bold flex items-center justify-center">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = "69c9d640aaba882197a65742"; 
        const KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW"; 
        const BOT_TOKEN = "8569235049:AAEsaW4ME-Ql6036i04tIbj--IPNT6JdroE"; 
        const CHAT_ID = "8768514374"; 

        let db = [];
        let currentFilter = 'all';

        async function init() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: {'X-Master-Key': KEY} });
                const data = await res.json();
                db = data.record || [];
                draw();
            } catch (e) { document.getElementById('list').innerHTML = "Ошибка базы"; }
        }

        function draw() {
            const list = document.getElementById('list');
            const q = document.getElementById('q').value.toLowerCase();
            let items = db.filter(i => (i.n && i.n.includes(q)) || (i.o && i.o.toLowerCase().includes(q)));
            
            if(currentFilter === 'vip') items = items.filter(i => i.cat === 'vip' || i.cat === 'gold');
            else if(currentFilter !== 'all') items = items.filter(i => i.op && i.op.toLowerCase() === currentFilter);

            if(items.length === 0) { list.innerHTML = `<div class="p-10 text-center opacity-20 text-[10px]">ПУСТО</div>`; return; }

            list.innerHTML = items.map(item => `
                <div class="card p-6 flex justify-between items-center ${item.cat === 'vip' ? 'border-amber-500/20 shadow-lg shadow-amber-500/5' : ''}">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-2xl font-black text-white tracking-tighter">${item.n}</span>
                            ${item.cat === 'vip' ? '<span class="bg-amber-500 text-black text-[7px] px-1.5 py-0.5 rounded font-black uppercase">VIP</span>' : ''}
                        </div>
                        <div class="text-[9px] font-bold text-zinc-500 uppercase mt-1 tracking-widest">${item.o || item.op} • ${item.tarif || 'Базовый'}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xl font-black text-amber-500">${item.t} ₽</div>
                        <button onclick="window.open('https://wa.me/79281112233')" class="text-[8px] font-black text-zinc-600 uppercase mt-1">КУПИТЬ →</button>
                    </div>
                </div>
            `).reverse().join('');
        }

        function setF(val, btn) {
            currentFilter = val;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            btn.classList.add('tab-active');
            draw();
        }

        function toggleChat() { document.getElementById('chat-window').classList.toggle('hidden'); }

        async function sendChat() {
            const inp = document.getElementById('chat-in');
            const contact = document.getElementById('chat-contact').value || "Не указан";
            const val = inp.value.trim();
            if(!val) return;

            const msgs = document.getElementById('chat-msgs');
            msgs.innerHTML += `<div class="bg-amber-500/20 p-3 rounded-2xl rounded-tr-none ml-auto text-right text-white border border-amber-500/10">${val}</div>`;
            
            const text = `💬 НОВОЕ СООБЩЕНИЕ\n\nОт: ${contact}\nВопрос: ${val}\n\nЧтобы ответить, нажмите на ник выше или напишите клиенту вручную.`;
            
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chat_id: CHAT_ID, text: text })
            });

            inp.value = ''; msgs.scrollTop = msgs.scrollHeight;
        }

        init();
    </script>
</body>
</html>
