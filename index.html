<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | NEXT GEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;800&display=swap');
        
        :root { --gold: #f59e0b; --dark: #09090b; }
        body { background: var(--dark); color: #fafafa; font-family: 'Manrope', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        .card-blur { background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .gold-glow { box-shadow: 0 0 20px rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.2); }
        
        /* Анимация появления */
        .reveal { animation: reveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes reveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        input::placeholder { color: #52525b; text-transform: uppercase; font-size: 10px; letter-spacing: 1px; }
    </style>
</head>
<body class="safe-top">

    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-amber-500/10 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] right-[10%] w-[30%] h-[30%] bg-amber-600/5 blur-[100px] rounded-full"></div>
    </div>

    <nav class="sticky top-0 z-40 px-6 py-5 flex justify-between items-center card-blur">
        <div>
            <h1 class="text-xl font-[800] tracking-tighter leading-none">SIM <span class="text-amber-500">MARKET</span></h1>
            <p class="text-[8px] font-medium text-zinc-500 uppercase tracking-[0.3em] mt-1">Premium Assets</p>
        </div>
        <button onclick="window.location.reload()" class="p-2 rounded-full bg-zinc-900 border border-zinc-800 active:scale-90 transition-transform">
            <i data-lucide="refresh-cw" class="w-4 h-4 text-amber-500"></i>
        </button>
    </nav>

    <main class="px-6 pt-6 pb-24 max-w-2xl mx-auto">
        
        <div class="relative mb-8 reveal" style="animation-delay: 0.1s;">
            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-600"></i>
            <input type="text" id="search" oninput="render()" placeholder="Найти свой номер..." 
                   class="w-full pl-11 pr-4 py-4 bg-zinc-900/50 border border-zinc-800 rounded-2xl outline-none focus:border-amber-500 transition-colors">
        </div>

        <div class="flex gap-3 overflow-x-auto no-scrollbar mb-8 reveal" style="animation-delay: 0.2s;">
            <button onclick="setFilter('all')" class="filter-btn active px-6 py-2.5 rounded-full bg-amber-500 text-black text-xs font-bold uppercase tracking-wider">Все</button>
            <button onclick="setFilter('vip')" class="filter-btn px-6 py-2.5 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 text-xs font-bold uppercase tracking-wider">VIP</button>
            <button onclick="setFilter('megafon')" class="filter-btn px-6 py-2.5 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 text-xs font-bold uppercase tracking-wider">Мегафон</button>
        </div>

        <div id="grid" class="grid gap-4">
            <div class="h-24 bg-zinc-900/50 animate-pulse rounded-3xl"></div>
            <div class="h-24 bg-zinc-900/50 animate-pulse rounded-3xl"></div>
        </div>
    </main>

    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md h-16 card-blur rounded-3xl flex justify-around items-center px-4 border border-zinc-800 z-50">
        <button class="flex flex-col items-center gap-1 text-amber-500">
            <i data-lucide="layout-grid" class="w-5 h-5"></i>
            <span class="text-[8px] font-bold uppercase">Витрина</span>
        </button>
        <button onclick="window.open('https://t.me/твой_ник')" class="flex flex-col items-center gap-1 text-zinc-500">
            <i data-lucide="message-circle" class="w-5 h-5"></i>
            <span class="text-[8px] font-bold uppercase">Связь</span>
        </button>
        <button onclick="alert('В разработке')" class="flex flex-col items-center gap-1 text-zinc-500">
            <i data-lucide="info" class="w-5 h-5"></i>
            <span class="text-[8px] font-bold uppercase">О нас</span>
        </button>
    </div>

    <script>
        // Инициализация иконок
        lucide.createIcons();

        const API_URL = "69c9d640aaba882197a65742";
        const KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW";
        let db = [];
        let filter = 'all';

        async function init() {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${API_URL}/latest`, {
                headers: { 'X-Master-Key': KEY }
            });
            const data = await res.json();
            db = data.record || [];
            render();
        }

        function render() {
            const container = document.getElementById('grid');
            const q = document.getElementById('search').value.toLowerCase();
            
            let items = db.filter(i => i.n.includes(q));
            if(filter === 'vip') items = items.filter(i => i.cat === 'vip' || i.cat === 'gold');
            else if(filter !== 'all') items = items.filter(i => i.op === filter);

            container.innerHTML = items.map((item, idx) => {
                const isVip = item.cat === 'vip' || item.cat === 'gold';
                return `
                <div class="p-5 rounded-3xl bg-zinc-900/40 border border-zinc-800/50 flex justify-between items-center reveal ${isVip ? 'gold-glow' : ''}" style="animation-delay: ${idx * 0.05}s">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-2xl bg-zinc-800 flex items-center justify-center">
                            <i data-lucide="phone" class="w-4 h-4 ${isVip ? 'text-amber-500' : 'text-zinc-600'}"></i>
                        </div>
                        <div>
                            <h3 class="text-lg font-extrabold tracking-tight text-white">${item.n}</h3>
                            <div class="flex items-center gap-2 mt-0.5">
                                <span class="text-[8px] font-black uppercase text-zinc-500 tracking-wider">${item.o || item.op}</span>
                                <span class="w-1 h-1 rounded-full bg-zinc-700"></span>
                                <span class="text-[8px] font-bold text-amber-500/80 uppercase">${item.tarif || 'Базовый'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-black text-white">${Number(item.t).toLocaleString()} ₽</p>
                        <button onclick="order('${item.n}')" class="mt-1 text-[9px] font-black text-amber-500 uppercase tracking-widest active:opacity-50 transition-opacity">Забрать →</button>
                    </div>
                </div>
                `;
            }).reverse().join('');
            lucide.createIcons();
        }

        function setFilter(val) {
            filter = val;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.replace('bg-amber-500', 'bg-zinc-900');
                b.classList.replace('text-black', 'text-zinc-400');
            });
            event.target.classList.replace('bg-zinc-900', 'bg-amber-500');
            event.target.classList.replace('text-zinc-400', 'text-black');
            render();
        }

        function order(num) {
            const msg = encodeURIComponent(`Привет, Курбан! Хочу купить номер: ${num}`);
            window.open(`https://wa.me/79281112233?text=${msg}`); // Поставь свой номер
        }

        init();
    </script>
</body>
</html>
