<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | Элитные номера</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #0a0a0f; color: #fff; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .gold-grad { background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-gold { background: linear-gradient(90deg, #bf953f, #aa8332); color: #000; font-weight: 800; border-radius: 12px; transition: 0.3s; }
        .btn-gold:active { transform: scale(0.95); }
    </style>
</head>
<body class="p-4">

    <header class="flex justify-between items-center py-6 mb-8">
        <div>
            <h1 class="text-2xl font-black gold-grad italic">SIM MARKET</h1>
            <p class="text-[10px] uppercase tracking-widest opacity-40">Elite Numbers Store</p>
        </div>
    </header>

    <div id="catalog" class="space-y-4">
        <div class="glass p-6 rounded-3xl flex justify-between items-center">
            <div>
                <div class="text-2xl font-black tracking-tighter">+7 999 000 77 77</div>
                <div class="text-sm opacity-50 font-bold">МТС • 150 000 ₽</div>
            </div>
            <button onclick="sendOrder('+7 999 000 77 77')" class="btn-gold px-6 py-3 text-xs uppercase">Заказать</button>
        </div>
        
        <div class="glass p-6 rounded-3xl flex justify-between items-center">
            <div>
                <div class="text-2xl font-black tracking-tighter">+7 777 555 11 22</div>
                <div class="text-sm opacity-50 font-bold">Билайн • 85 000 ₽</div>
            </div>
            <button onclick="sendOrder('+7 777 555 11 22')" class="btn-gold px-6 py-3 text-xs uppercase">Заказать</button>
        </div>
    </div>

    <div class="mt-12 p-6 glass rounded-3xl text-center">
        <p class="text-sm opacity-40 mb-2 uppercase font-bold tracking-widest">Связь с нами</p>
        <a href="https://t.me/kurban_sim" class="text-xl font-black gold-grad underline">@kurban_sim</a>
    </div>

    <script>
        // ТВОИ НОВЫЕ КЛЮЧИ (База «Нннмб»)
        const firebaseConfig = {
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44",
            authDomain: "nnnmb-a0b52.firebaseapp.com",
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com",
            projectId: "nnnmb-a0b52",
            storageBucket: "nnnmb-a0b52.firebasestorage.app",
            messagingSenderId: "289986339050",
            appId: "1:289986339050:web:0e6a5e801e102379d63793",
            measurementId: "G-HWXYJQZSE3"
        };

        // Инициализация
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Функция отправки заказа
        function sendOrder(number) {
            db.ref('leads').push({
                num: number,
                ts: Date.now(),
                status: 'new'
            }).then(() => {
                alert('Заявка на номер ' + number + ' успешно отправлена! Ожидайте звонка.');
            }).catch((error) => {
                alert('Ошибка: ' + error.message);
            });
        }
    </script>
</body>
</html>
