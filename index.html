                    <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | Магазин красивых номеров</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #000; color: #fff; margin: 0; }
        .gold { color: #bf953f; }
        .bg-gold { background: #bf953f; }
        .card { background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 24px; padding: 20px; transition: 0.3s; }
        .input-style { background: #151515!important; border: 1px solid #222!important; color: #fff!important; padding: 15px; border-radius: 15px; width: 100%; outline: none; }
        .btn-main { background: #bf953f; color: #000; font-weight: 800; padding: 15px; border-radius: 15px; width: 100%; text-transform: uppercase; font-size: 12px; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
    </style>
</head>
<body>

    <header class="p-6 flex justify-between items-center sticky top-0 bg-black/80 backdrop-blur-lg z-50">
        <h1 class="text-xl font-black italic gold uppercase">SIM <span class="text-white">MARKET</span></h1>
        <div id="auth-buttons">
            <button onclick="openModal('reg-modal')" class="text-[10px] font-black uppercase border border-white/10 px-4 py-2 rounded-full">Регистрация</button>
            <button onclick="openModal('login-modal')" class="text-[10px] font-black uppercase bg-white text-black px-4 py-2 rounded-full ml-2">Вход</button>
        </div>
        <div id="user-profile" class="hidden flex items-center gap-2">
            <span id="display-phone" class="text-xs font-bold gold"></span>
            <button onclick="logout()" class="text-[8px] opacity-30 uppercase">Выйти</button>
        </div>
    </header>

    <main class="p-4 space-y-6">
        <div class="text-center py-10">
            <h2 class="text-4xl font-black uppercase italic leading-none">Найди свой <br> <span class="gold">эксклюзивный</span> номер</h2>
            <p class="text-[10px] opacity-40 uppercase tracking-[3px] mt-4">Лучшие предложения в Хасавюрте</p>
        </div>

        <div class="grid grid-cols-1 gap-4" id="inventory-list">
            <p class="text-center opacity-20 py-20">Загрузка номеров...</p>
        </div>
    </main>

    <div id="reg-modal" class="modal">
        <div class="card w-full max-w-sm">
            <h3 class="text-2xl font-black gold mb-6 uppercase italic">Регистрация</h3>
            <div class="space-y-4">
                <input type="text" id="reg-phone" placeholder="Номер телефона (без +7)" class="input-style">
                <input type="text" id="reg-name" placeholder="Ваше имя" class="input-style">
                <input type="password" id="reg-pass" placeholder="Придумайте пароль" class="input-style">
                <button onclick="handleRegister()" class="btn-main">Создать аккаунт</button>
                <button onclick="closeModal()" class="w-full text-[10px] opacity-30 uppercase mt-2">Закрыть</button>
            </div>
        </div>
    </div>

    <div id="login-modal" class="modal">
        <div class="card w-full max-w-sm">
            <h3 class="text-2xl font-black gold mb-6 uppercase italic">Вход</h3>
            <div class="space-y-4">
                <input type="text" id="log-phone" placeholder="Номер телефона" class="input-style">
                <input type="password" id="log-pass" placeholder="Пароль" class="input-style">
                <button onclick="handleLogin()" class="btn-main">Войти</button>
                <button onclick="closeModal()" class="w-full text-[10px] opacity-30 uppercase mt-2">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        // ТВОЯ КОНФИГУРАЦИЯ FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44",
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // УПРАВЛЕНИЕ ОКНАМИ
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }

        // --- ЛОГИКА РЕГИСТРАЦИИ ---
        function handleRegister() {
            const phone = document.getElementById('reg-phone').value.replace(/\D/g, "");
            const name = document.getElementById('reg-name').value;
            const pass = document.getElementById('reg-pass').value;

            if(!phone || !name || !pass) return alert("Заполните все поля!");

            db.ref('users/' + phone).set({
                name: name,
                pass: pass,
                role: 'user',
                regDate: Date.now()
            }).then(() => {
                alert("Успешно! Теперь войдите.");
                closeModal();
            });
        }

        // --- ЛОГИКА ВХОДА (С ПРОВЕРКОЙ БАНА) ---
        function handleLogin() {
            const phone = document.getElementById('log-phone').value.replace(/\D/g, "");
            const pass = document.getElementById('log-pass').value;

            db.ref('users/' + phone).once('value').then(snap => {
                const user = snap.val();
                if(!user) return alert("Пользователь не найден!");

                // ПРОВЕРКА НА БАН
                if(user.banned) {
                    if(user.banned === 'forever') {
                        alert("Ваш аккаунт ЗАБАНЕН НАВСЕГДА 🚫");
                        return;
                    }
                    if(Date.now() < user.banned) {
                        const h = Math.round((user.banned - Date.now()) / 3600000);
                        alert("Вы временно заблокированы. Осталось: " + h + " ч.");
                        return;
                    }
                }

                if(user.pass === pass) {
                    localStorage.setItem('loggedUser', phone);
                    localStorage.setItem('userName', user.name);
                    checkAuth();
                    closeModal();
                } else {
                    alert("Неверный пароль!");
                }
            });
        }

        // --- ВЫХОД ---
        function logout() {
            localStorage.clear();
            location.reload();
        }

        // --- ПРОВЕРКА АВТОРИЗАЦИИ ---
        function checkAuth() {
            const user = localStorage.getItem('loggedUser');
            if(user) {
                document.getElementById('auth-buttons').classList.add('hidden');
                document.getElementById('user-profile').classList.remove('hidden');
                document.getElementById('display-phone').innerText = "+7 " + user;
            }
        }

        // --- ЗАГРУЗКА НОМЕРОВ ИЗ АДМИНКИ ---
        db.ref('inventory').on('value', snap => {
            const list = document.getElementById('inventory-list');
            list.innerHTML = "";
            snap.forEach(child => {
                const i = child.val();
                list.innerHTML += `
                    <div class="card flex justify-between items-center">
                        <div>
                            <p class="text-[10px] opacity-30 font-black uppercase">${i.op || 'Оператор'}</p>
                            <h4 class="text-2xl font-black italic">+7 ${i.num}</h4>
                            <p class="gold font-black text-lg">${i.price} ₽</p>
                        </div>
                        <button onclick="buyNum('${i.num}')" class="bg-white text-black px-6 py-3 rounded-2xl font-black uppercase text-[10px]">Купить</button>
                    </div>
                `;
            });
        });

        // --- ПОКУПКА (ОТПРАВЛЯЕТ ЗАЯВКУ В АДМИНКУ) ---
        function buyNum(number) {
            const user = localStorage.getItem('loggedUser');
            const name = localStorage.getItem('userName');
            if(!user) return alert("Сначала войдите в аккаунт!");

            const orderId = Date.now();
            db.ref('orders/' + orderId).set({
                clientPhone: user,
                clientName: name,
                wantedNum: number,
                date: Date.now()
            }).then(() => {
                alert("Заявка отправлена! Менеджер свяжется с вами.");
            });
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
