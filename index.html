<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="site-title">SIM MARKET | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #000; color: #fff; margin: 0; overflow-x: hidden; }
        .gold-text { color: #bf953f; }
        
        /* АНИМИРОВАННЫЙ ОБОДОК (Бегущая полоса) */
        .premium-card {
            position: relative;
            background: #0d0d0d;
            border-radius: 24px;
            padding: 2px; /* Толщина ободка */
            overflow: hidden;
            margin-bottom: 16px;
            transition: transform 0.3s ease;
        }
        .premium-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            /* Полоска, которая ползает по кругу */
            background: conic-gradient(from 0deg, transparent 70%, #bf953f 100%);
            animation: border-crawl 3s linear infinite;
        }
        @keyframes border-crawl { 100% { transform: rotate(360deg); } }
        
        .card-content {
            background: #0d0d0d;
            border-radius: 22px;
            padding: 20px;
            z-index: 1;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ЦВЕТОВЫЕ СТИЛИ ОПЕРАТОРОВ */
        .op-tag { font-size: 9px; padding: 4px 12px; border-radius: 8px; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; display: inline-block; }
        
        /* МТС: Красный фон, белые буквы */
        .tag-МТС { background: #E30613; color: #fff; box-shadow: 0 0 15px rgba(227, 6, 19, 0.3); }
        /* Билайн: Желтый фон, черные буквы */
        .tag-БИЛАЙН { background: #FFD800; color: #000; box-shadow: 0 0 15px rgba(255, 216, 0, 0.3); }
        /* Мегафон: Зеленый фон, белые буквы */
        .tag-МЕГАФОН { background: #00B956; color: #fff; box-shadow: 0 0 15px rgba(0, 185, 86, 0.3); }
        /* Tele2: Черный фон, белые буквы (инверсия) */
        .tag-ТЕЛЕ2 { background: #fff; color: #000; border: 1px solid #fff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }

        /* ВКЛАДКИ ВЫБОРА ОПЕРАТОРА */
        .filter-tab {
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            white-space: nowrap;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        .filter-tab.active {
            background: #bf953f;
            color: #000;
            border-color: #bf953f;
            box-shadow: 0 5px 15px rgba(191, 149, 63, 0.4);
        }

        .btn-buy { background: #bf953f; color: #000; font-weight: 800; padding: 12px 20px; border-radius: 14px; font-size: 11px; text-transform: uppercase; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        input { background: #151515!important; border: 1px solid #222!important; color: #fff!important; padding: 18px; border-radius: 16px; width: 100%; outline: none; margin-bottom: 12px; }
    </style>
</head>
<body>

    <header class="p-6 flex justify-between items-center sticky top-0 bg-black/95 backdrop-blur-md z-50 border-b border-white/5">
        <h1 class="text-xl font-black italic gold-text" id="logo-text">SIM <span class="text-white">MARKET</span></h1>
        <div id="auth-section">
            <button onclick="openM('auth-m')" class="text-[9px] font-black uppercase bg-white text-black px-5 py-2.5 rounded-full">Личный кабинет</button>
        </div>
        <div id="user-info" class="hidden flex items-center gap-3">
            <div class="text-right">
                <p id="u-name" class="text-[10px] font-black uppercase white"></p>
                <p id="u-phone" class="text-[9px] gold-text font-bold"></p>
            </div>
            <button onclick="logout()" class="text-[18px] opacity-40">✕</button>
        </div>
    </header>

    <!-- ВКЛАДКИ ОПЕРАТОРОВ -->
    <div class="flex gap-2 p-4 overflow-x-auto no-scrollbar bg-black/50">
        <button onclick="filterOp('ВСЕ')" class="filter-tab active" id="btn-all">Все</button>
        <button onclick="filterOp('МЕГАФОН')" class="filter-tab">Мегафон</button>
        <button onclick="filterOp('БИЛАЙН')" class="filter-tab">Билайн</button>
        <button onclick="filterOp('МТС')" class="filter-tab">МТС</button>
        <button onclick="filterOp('ТЕЛЕ2')" class="filter-tab">Tele2</button>
    </div>

    <main class="p-4 pb-20">
        <div id="numbers-grid" class="space-y-2">
            <!-- Загрузка номеров -->
        </div>
    </main>

    <!-- Модалка авторизации -->
    <div id="auth-m" class="modal">
        <div class="bg-[#0d0d0d] p-8 rounded-3xl w-full max-w-sm border border-white/10 shadow-2xl">
            <h3 class="text-2xl font-black gold-text mb-6 uppercase italic">Вход / Регистрация</h3>
            <div id="auth-form" class="space-y-1">
                <input type="tel" id="l-phone" placeholder="Ваш номер (928...)">
                <input type="text" id="l-name" placeholder="Ваше Имя">
                <input type="password" id="l-pass" placeholder="Пароль">
                <button onclick="doAuth()" class="btn-buy w-full py-5 text-sm mt-4">Продолжить</button>
                <button onclick="closeM()" class="w-full text-[10px] opacity-30 uppercase mt-6 tracking-widest">Вернуться назад</button>
            </div>
        </div>
    </div>

    <script>
        const conf = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(conf);
        const db = firebase.database();

        let currentFilter = "ВСЕ";

        function openM(id) { document.getElementById(id).classList.add('active'); }
        function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }

        // ФИЛЬТРАЦИЯ
        function filterOp(op) {
            currentFilter = op;
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toUpperCase() === op) btn.classList.add('active');
            });
            if(op === 'ВСЕ') document.getElementById('btn-all').classList.add('active');
            loadNumbers();
        }

        // ЗАГРУЗКА НОМЕРОВ С ЦВЕТНЫМИ ТЕГАМИ
        function loadNumbers() {
            db.ref('inventory').on('value', snap => {
                const grid = document.getElementById('numbers-grid');
                grid.innerHTML = "";
                snap.forEach(c => {
                    const i = c.val();
                    const op = (i.op || 'МЕГАФОН').toUpperCase();

                    // Фильтр
                    if(currentFilter !== "ВСЕ" && op !== currentFilter) return;

                    grid.innerHTML += `
                        <div class="premium-card">
                            <div class="card-content">
                                <div>
                                    <span class="op-tag tag-${op}">${op}</span>
                                    <h4 class="text-2xl font-black italic tracking-tighter">+7 ${i.num}</h4>
                                    <p class="gold-text font-black text-lg mt-1">${i.price} ₽</p>
                                </div>
                                <button onclick="buy('${i.num}', '${op}')" class="btn-buy">Купить</button>
                            </div>
                        </div>`;
                });
            });
        }

        function doAuth() {
            const p = document.getElementById('l-phone').value.replace(/\D/g, "");
            const pass = document.getElementById('l-pass').value;
            const name = document.getElementById('l-name').value;
            if(p.length < 10 || pass.length < 3) return alert("Заполните данные");

            db.ref('users/' + p).once('value', snap => {
                const u = snap.val();
                if(u) {
                    if(u.pass === pass) {
                        localStorage.setItem('user', p);
                        localStorage.setItem('userName', u.name || "Клиент");
                        location.reload();
                    } else alert("Пароль неверный");
                } else {
                    if(!name) return alert("Введите имя");
                    db.ref('users/' + p).set({ name: name, pass: pass, role: 'user' }).then(() => {
                        localStorage.setItem('user', p);
                        localStorage.setItem('userName', name);
                        location.reload();
                    });
                }
            });
        }

        function buy(num, op) {
            const uPhone = localStorage.getItem('user');
            const uName = localStorage.getItem('userName');
            if(!uPhone) return openM('auth-m');

            db.ref('orders/' + Date.now()).set({
                clientName: uName, clientPhone: uPhone, wantedNum: num, operator: op, date: new Date().toLocaleString(), status: 'new'
            }).then(() => alert(uName + ", заявка принята!"));
        }

        function logout() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            const u = localStorage.getItem('user');
            if(u) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('u-phone').innerText = "+7 " + u;
                document.getElementById('u-name').innerText = localStorage.getItem('userName');
            }
            loadNumbers();
        };
    </script>
</body>
</html>
