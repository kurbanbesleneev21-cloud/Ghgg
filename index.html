<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | OFFICIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #000; color: #fff; min-height: 100vh; margin: 0; padding: 0; overflow-x: hidden; }
        .gold-grad { background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .neon-card { position: relative; background: #0a0a0a; border-radius: 28px; overflow: hidden; z-index: 1; margin-bottom: 16px; }
        .neon-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, #bf953f, #fcf6ba, transparent 70%); animation: rotate 4s linear infinite; z-index: -2; }
        .neon-card::after { content: ''; position: absolute; inset: 2px; background: #0d0d0d; border-radius: 26px; z-index: -1; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .tab { padding: 10px 20px; border-radius: 18px; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.05); color: rgba(255,255,255,0.4); cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .tab.active { background: #bf953f; color: #000; border-color: #bf953f; box-shadow: 0 4px 15px rgba(191,149,63,0.3); }

        .input-dark { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 16px; border-radius: 20px; color: #fff; outline: none; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 9999; display: none; overflow-y: auto; padding: 20px; backdrop-filter: blur(20px); align-items: center; justify-content: center; }
        .btn-gold { background: linear-gradient(135deg, #bf953f, #fcf6ba); color: #000; font-weight: 900; text-transform: uppercase; padding: 16px; border-radius: 20px; width: 100%; font-size: 11px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 pb-24">

    <header class="flex justify-between items-center mb-8 pt-4">
        <div>
            <h1 class="text-2xl font-black italic gold-grad uppercase leading-tight">SIM MARKET</h1>
            <p class="text-[8px] tracking-[3px] opacity-30 font-bold uppercase">Hasavyurt Premium</p>
        </div>
        
        <div id="user-ui" style="display: none;" class="flex items-center gap-3 cursor-pointer" onclick="openProfile()">
            <div class="text-right"><p class="text-[10px] font-black gold-grad uppercase">Кабинет</p></div>
            <div class="w-10 h-10 bg-gradient-to-tr from-[#bf953f] to-[#fcf6ba] rounded-full flex items-center justify-center text-black font-black">К</div>
        </div>
        
        <button id="login-btn" onclick="showModal('auth-modal')" class="border border-[#bf953f]/30 px-6 py-2 rounded-full text-[10px] font-black uppercase gold-grad">Вход</button>
    </header>

    <div class="space-y-6 mb-8">
        <input type="text" id="search-input" oninput="renderItems()" placeholder="Поиск цифр..." class="input-dark shadow-2xl">
        <div class="flex gap-2 overflow-x-auto no-scrollbar">
            <div class="tab active" onclick="filterOp('ALL', this)">Все</div>
            <div class="tab" onclick="filterOp('МТС', this)">МТС</div>
            <div class="tab" onclick="filterOp('БИЛАЙН', this)">Билайн</div>
            <div class="tab" onclick="filterOp('МЕГАФОН', this)">Мегафон</div>
            <div class="tab" onclick="filterOp('FAV', this)">⭐</div>
        </div>
    </div>

    <div id="list" class="grid gap-2">
        <p class="text-center opacity-10 py-20 uppercase text-[10px] font-black tracking-widest">Загрузка...</p>
    </div>

    <div id="auth-modal" class="modal">
        <div class="bg-[#0d0d0d] p-8 rounded-[40px] border border-white/5 w-full max-w-sm space-y-4 shadow-2xl">
            <div class="flex bg-white/5 p-1 rounded-2xl mb-2">
                <button id="tab-reg" onclick="setAuthMode('reg')" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase bg-[#bf953f] text-black transition">Регистрация</button>
                <button id="tab-login" onclick="setAuthMode('login')" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase opacity-40 transition">Вход</button>
            </div>
            <div class="space-y-3">
                <input type="tel" id="auth-phone" placeholder="Номер телефона" class="input-dark">
                <input type="password" id="auth-pass" placeholder="Пароль" class="input-dark">
            </div>
            <button onclick="doAuth()" id="auth-main-btn" class="btn-gold">Создать аккаунт</button>
            <p onclick="hideModals()" class="text-center text-[9px] opacity-20 uppercase font-black pt-2 cursor-pointer">Закрыть</p>
        </div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="max-w-md mx-auto w-full text-center p-6">
            <h2 class="text-2xl font-black gold-grad italic uppercase mb-10">Ваш Профиль</h2>
            <div class="bg-white/5 p-10 rounded-[50px] border border-white/5 mb-8 shadow-2xl">
                <p id="profile-phone" class="text-xl font-black mb-2 text-white"></p>
                <p class="text-[9px] opacity-30 uppercase font-bold tracking-[3px]">VIP Статус Активен</p>
            </div>
            <button onclick="doLogout()" class="text-red-500 font-bold text-[10px] uppercase tracking-widest mt-4">Выйти из системы</button>
            <p onclick="hideModals()" class="mt-8 opacity-20 uppercase text-[10px] font-black cursor-pointer">Вернуться назад</p>
        </div>
    </div>

    <div id="order-modal" class="modal">
        <div class="bg-[#0d0d0d] p-8 rounded-[40px] border border-white/5 w-full max-w-sm space-y-5">
            <h2 class="text-xl font-black gold-grad uppercase italic text-center">Оформить заказ</h2>
            <div class="bg-white/5 p-6 rounded-3xl text-center border border-white/5">
                <p id="order-num-text" class="text-2xl font-black italic gold-grad"></p>
            </div>
            <input type="text" id="order-name" placeholder="Ваше имя" class="input-dark">
            <button onclick="sendOrder()" class="btn-gold">Подтвердить покупку</button>
            <p onclick="hideModals()" class="text-center text-[10px] opacity-20 uppercase font-black cursor-pointer">Отмена</p>
        </div>
    </div>

    <script>
        // FIREBASE (Используем твою базу)
        const fbCfg = { apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com" };
        firebase.initializeApp(fbCfg);
        const rdb = firebase.database();

        let currentUser = JSON.parse(localStorage.getItem('active_user')) || null;
        let favs = JSON.parse(localStorage.getItem('sim_favs')) || [];
        let items = {};
        let currentFilter = 'ALL';
        let authTab = 'reg';
        let currentOrderNum = "";

        if(currentUser) refreshUI();

        function showModal(id) { document.getElementById(id).style.display = 'flex'; }
        function hideModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
        function openProfile() { if(currentUser) showModal('profile-modal'); }

        function setAuthMode(mode) {
            authTab = mode;
            const isReg = mode === 'reg';
            document.getElementById('tab-reg').className = isReg ? 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase bg-[#bf953f] text-black' : 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase opacity-40';
            document.getElementById('tab-login').className = !isReg ? 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase bg-[#bf953f] text-black' : 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase opacity-40';
            document.getElementById('auth-main-btn').innerText = isReg ? 'Создать аккаунт' : 'Войти в кабинет';
        }

        // УМНАЯ АВТОРИЗАЦИЯ: ОДИН НОМЕР — ОДНА РЕГИСТРАЦИЯ
        function doAuth() {
            const ph = document.getElementById('auth-phone').value.trim();
            const ps = document.getElementById('auth-pass').value.trim();
            if(!ph || !ps) return alert("Заполните все поля!");

            let dbUsers = JSON.parse(localStorage.getItem('user_db')) || {};

            if(authTab === 'reg') {
                if(dbUsers[ph]) {
                    alert("Этот номер уже зарегистрирован! Попробуйте войти.");
                    setAuthMode('login');
                    return;
                }
                dbUsers[ph] = { phone: ph, pass: ps };
                localStorage.setItem('user_db', JSON.stringify(dbUsers));
                currentUser = dbUsers[ph];
                alert("Успешная регистрация!");
            } else {
                if(!dbUsers[ph] || dbUsers[ph].pass !== ps) {
                    return alert("Неверный номер или пароль!");
                }
                currentUser = dbUsers[ph];
            }

            localStorage.setItem('active_user', JSON.stringify(currentUser));
            refreshUI(); 
            hideModals();
        }

        function doLogout() { 
            if(confirm("Выйти из аккаунта?")) {
                localStorage.removeItem('active_user'); 
                location.reload(); 
            }
        }

        function refreshUI() {
            if(!currentUser) return;
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('user-ui').style.display = 'flex';
            document.getElementById('profile-phone').innerText = "+7 " + currentUser.phone;
        }

        function openBuy(num) {
            if(!currentUser) return showModal('auth-modal');
            currentOrderNum = num;
            document.getElementById('order-num-text').innerText = "+7 " + num;
            showModal('order-modal');
        }

        function sendOrder() {
            const name = document.getElementById('order-name').value;
            if(!name) return alert("Введите имя!");
            alert(`Курбан принял ваш заказ! Мы свяжемся с вами по номеру +7 ${currentUser.phone}`);
            hideModals();
        }

        function filterOp(op, el) {
            currentFilter = op;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderItems();
        }

        function toggleFav(num, e) {
            e.stopPropagation();
            if(favs.includes(num)) favs = favs.filter(n => n !== num);
            else favs.push(num);
            localStorage.setItem('sim_favs', JSON.stringify(favs));
            renderItems();
        }

        // ЗАГРУЗКА ИЗ БАЗЫ
        rdb.ref('inventory').on('value', snap => {
            items = snap.val() || {};
            renderItems();
        });

        function renderItems() {
            const list = document.getElementById('list');
            const search = document.getElementById('search-input').value.toLowerCase();
            list.innerHTML = "";
            const data = Object.values(items).reverse();

            data.forEach(i => {
                const isFav = favs.includes(i.num);
                const op = (i.op || 'SIM').toUpperCase();
                if(currentFilter !== 'ALL' && currentFilter !== 'FAV' && op !== currentFilter) return;
                if(currentFilter === 'FAV' && !isFav) return;
                if(search && !i.num.includes(search)) return;

                list.innerHTML += `
                    <div class="neon-card">
                        <div class="p-7 relative z-10">
                            <div class="flex justify-between items-start mb-6">
                                <span class="text-[9px] font-black opacity-30 tracking-[4px] uppercase">${op}</span>
                                <span onclick="toggleFav('${i.num}', event)" class="text-2xl cursor-pointer">${isFav ? '⭐' : '☆'}</span>
                            </div>
                            <h3 class="text-4xl font-black italic tracking-tighter mb-8">+7 ${i.num}</h3>
                            <div class="flex justify-between items-center">
                                <span class="text-2xl font-black gold-grad">${i.price} ₽</span>
                                <button onclick="openBuy('${i.num}')" class="bg-white text-black px-6 py-3 rounded-2xl text-[10px] font-black uppercase active:scale-95 transition">Купить</button>
                            </div>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
