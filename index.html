<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | PREMIUM HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;600;800&family=Playfair+Display:wght@700&display=swap');
        
        body { font-family: 'Manrope', sans-serif; background: #030303; color: #fff; margin:0; }

        /* ЛОГОТИП */
        .logo-shine {
            font-weight: 800; font-size: 36px; text-transform: uppercase;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fcf6ba, #bf953f);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite; font-style: italic; letter-spacing: -1px;
        }
        @keyframes shine { to { background-position: 200% center; } }

        /* ВКЛАДКИ ОПЕРАТОРОВ */
        .tab-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px 18px; border-radius: 14px;
            font-size: 10px; font-weight: 800; text-transform: uppercase;
            color: #71717a; white-space: nowrap; transition: 0.3s;
            letter-spacing: 1px;
        }
        .tab-active {
            background: #bf953f; color: #000; border-color: #bf953f;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.3);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* ЭЛИТНАЯ КАРТОЧКА */
        .elite-card {
            position: relative; background: rgba(10, 10, 10, 0.8);
            border-radius: 28px; margin-bottom: 25px;
            border: 1px solid rgba(191, 149, 63, 0.15);
            box-shadow: 0 0 15px rgba(191, 149, 63, 0.05);
            overflow: hidden;
        }
        .card-glass { padding: 30px 25px; display: flex; flex-direction: column; align-items: center; }

        .price-tag {
            font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700;
            background: linear-gradient(180deg, #fcf6ba 0%, #bf953f 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 10px 0 20px 0;
        }

        .order-btn {
            background: linear-gradient(90deg, #bf953f, #d4af37, #bf953f);
            background-size: 200% auto; color: #000; font-weight: 800;
            font-size: 11px; text-transform: uppercase; padding: 18px;
            border-radius: 16px; width: 100%; border: none;
            box-shadow: 0 5px 20px rgba(191, 149, 63, 0.3);
        }
        .order-btn:active { transform: scale(0.97); }

        .top-line { width: 40px; height: 2px; border-radius: 2px; margin-bottom: 15px; }
    </style>
</head>
<body class="p-6">

    <header class="flex flex-col items-center pt-12 pb-6">
        <h1 class="logo-shine italic">SIM MARKET</h1>
        <p class="text-[10px] font-bold opacity-30 tracking-[5px] mt-3 uppercase text-center">Elite Number Store</p>
    </header>

    <div class="max-w-md mx-auto mb-10">
        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2">
            <button onclick="setFilter('all', this)" class="tab-btn tab-active">Все</button>
            <button onclick="setFilter('mts', this)" class="tab-btn">МТС</button>
            <button onclick="setFilter('megafon', this)" class="tab-btn">Мегафон</button>
            <button onclick="setFilter('beeline', this)" class="tab-btn">Билайн</button>
            <button onclick="setFilter('tele2', this)" class="tab-btn">Tele2</button>
            <button onclick="setFilter('yota', this)" class="tab-btn">Yota</button>
        </div>
    </div>

    <div id="list" class="max-w-md mx-auto pb-24">
        <p class="text-center opacity-20 py-10 text-sm tracking-wider">Загрузка...</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44",
            authDomain: "nnnmb-a0b52.firebaseapp.com",
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com",
            projectId: "nnnmb-a0b52"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentFilter = 'all';
        let allNumbers = {};

        // ФУНКЦИЯ ФИЛЬТРАЦИИ
        function setFilter(op, el) {
            currentFilter = op;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            el.classList.add('tab-active');
            render();
        }

        function render() {
            const list = document.getElementById('list');
            if (!allNumbers || Object.keys(allNumbers).length === 0) {
                list.innerHTML = '<p class="text-center opacity-20 py-16 text-sm">Витрина пуста</p>';
                return;
            }

            list.innerHTML = "";
            const keys = Object.keys(allNumbers).reverse();
            
            keys.forEach(k => {
                const item = allNumbers[k];
                // Проверка фильтра
                if (currentFilter !== 'all' && item.op !== currentFilter) return;

                let opColor = '#bf953f';
                if(item.op === 'mts') opColor = '#ff3333';
                if(item.op === 'beeline') opColor = '#ffcc00';
                if(item.op === 'megafon') opColor = '#22cc22';
                if(item.op === 'tele2') opColor = '#9933ff';
                if(item.op === 'yota') opColor = '#00ccff';

                list.innerHTML += `
                    <div class="elite-card">
                        <div class="card-glass">
                            <div class="top-line" style="background:${opColor}; box-shadow: 0 0 10px ${opColor};"></div>
                            <div class="w-full flex justify-between items-center opacity-40 px-2 text-[9px] font-bold uppercase mb-3">
                                <span style="color:${opColor}">${item.op.toUpperCase()}</span>
                                <span style="color:#bf953f" class="italic">Premium</span>
                            </div>
                            <div class="text-3xl font-black italic tracking-tighter mb-1 text-white">+7 ${item.num}</div>
                            <div class="price-tag">${parseInt(item.price).toLocaleString('ru-RU')} ₽</div>
                            <button onclick="sendOrder('${item.num}')" class="order-btn">Заказать</button>
                        </div>
                    </div>`;
            });
        }

        // ЗАГРУЗКА ДАННЫХ
        db.ref('inventory').on('value', s => {
            allNumbers = s.val() || {};
            render();
        });

        function sendOrder(n) {
            const name = prompt("Ваше имя:");
            const tel = prompt("Ваш телефон:");
            if(name && tel) {
                db.ref('leads').push({ num: n, fio: name, contact: tel, ts: Date.now() })
                .then(() => alert("Заявка принята!"));
            }
        }
    </script>
</body>
</html>
