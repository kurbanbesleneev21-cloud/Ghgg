<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- ТЕГ ДЛЯ ПОДТВЕРЖДЕНИЯ В GOOGLE -->
    <meta name="google-site-verification" content="55029d66282a2673" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO ТЕГИ ДЛЯ ПОИСКОВИКОВ -->
    <title>SIM-MARKET — Купить красивые номера (Мегафон, МТС, Билайн, Теле2)</title>
    <meta name="description" content="Магазин красивых и золотых номеров S-MARKET. Огромный выбор VIP номеров по лучшим ценам.">
    <meta name="keywords" content="сим маркет, купить красивый номер, золотые номера, мегафон, билайн, мтс">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Manrope', sans-serif; padding-bottom: 80px; }
        .gold-text { background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        .card { background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 24px; padding: 20px; transition: 0.3s; }
        .card:active { transform: scale(0.98); border-color: #bf953f; }
        .btn-gold { background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728); color: #000; font-weight: 900; padding: 16px; border-radius: 18px; width: 100%; text-transform: uppercase; font-size: 13px; box-shadow: 0 4px 15px rgba(191,149,63,0.3); }
        .nav-bar { background: rgba(13,13,13,0.8); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md mx-auto">
        <!-- ШАПКА -->
        <header class="flex justify-between items-center my-6">
            <h1 class="text-2xl italic gold-text tracking-tighter">SIM-MARKET</h1>
            <div class="bg-white/5 px-4 py-1 rounded-full text-[10px] font-bold border border-white/10 uppercase tracking-widest">Online</div>
        </header>

        <!-- БЛОК АКЦИИ (ПРОМО) -->
        <div id="promo-banner" class="mb-8">
            <!-- Сюда данные подгрузятся из Firebase -->
        </div>

        <!-- ЗАГОЛОВОК КАТАЛОГА -->
        <div class="flex justify-between items-end mb-4">
            <h2 class="text-xl font-black uppercase italic">Витрина номеров</h2>
            <p class="text-[10px] opacity-40 font-bold mb-1 uppercase">Обновлено сегодня</p>
        </div>

        <!-- СПИСОК НОМЕРОВ -->
        <div id="numbers-list" class="space-y-3">
            <div class="text-center py-10 opacity-20 text-xs uppercase tracking-widest">Загрузка каталога...</div>
        </div>
    </div>

    <!-- КОНТЕЙНЕР ДЛЯ МОДАЛЬНОГО ОКНА (ЗАКАЗ) -->
    <div id="order-modal" class="fixed inset-0 bg-black/95 z-50 hidden p-6 flex flex-col justify-center">
        <div class="card space-y-4">
            <h3 class="text-xl font-black italic gold-text">ОФОРМИТЬ ЗАКАЗ</h3>
            <p id="selected-num-text" class="text-2xl font-bold mb-4"></p>
            <input type="text" id="user-name" placeholder="Ваше имя" class="w-full bg-[#111] border border-white/5 p-4 rounded-xl outline-none">
            <input type="tel" id="user-phone" placeholder="Ваш телефон для связи" class="w-full bg-[#111] border border-white/5 p-4 rounded-xl outline-none">
            <button onclick="sendOrder()" class="btn-gold">ПОДТВЕРДИТЬ ПОКУПКУ</button>
            <button onclick="closeModal()" class="w-full text-xs opacity-30 font-bold uppercase mt-2">Отмена</button>
        </div>
    </div>

    <script>
        // ТВОИ НАСТРОЙКИ FIREBASE
        const firebaseConfig = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentNum = "";

        // ЗАГРУЗКА РЕКЛАМЫ
        db.ref('blog/promo').on('value', snap => {
            const data = snap.val();
            if(data) {
                document.getElementById('promo-banner').innerHTML = `
                    <div class="card overflow-hidden p-0 relative border-0">
                        <img src="${data.image}" class="w-full h-48 object-cover opacity-80">
                        <div class="absolute bottom-0 left-0 p-5 bg-gradient-to-t from-black to-transparent w-full">
                            <h3 class="text-lg font-bold">${data.title}</h3>
                            <p class="text-xs opacity-60">${data.text || ''}</p>
                        </div>
                    </div>
                `;
            }
        });

        // ЗАГРУЗКА НОМЕРОВ
        db.ref('inventory').on('value', snap => {
            const list = document.getElementById('numbers-list');
            list.innerHTML = "";
            snap.forEach(child => {
                const item = child.val();
                list.innerHTML += `
                    <div class="card flex justify-between items-center" onclick="openOrder('${item.num}')">
                        <div>
                            <p class="text-[10px] font-bold opacity-40 uppercase tracking-widest">${item.op}</p>
                            <p class="text-xl font-black italic tracking-tighter">+7 ${item.num}</p>
                        </div>
                        <div class="text-right">
                            <p class="gold-text text-lg">${item.price} ₽</p>
                            <p class="text-[9px] font-bold opacity-50 uppercase">Купить</p>
                        </div>
                    </div>
                `;
            });
        });

        function openOrder(num) {
            currentNum = num;
            document.getElementById('selected-num-text').innerText = "+7 " + num;
            document.getElementById('order-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('order-modal').classList.add('hidden');
        }

        function sendOrder() {
            const name = document.getElementById('user-name').value;
            const phone = document.getElementById('user-phone').value;
            if(!name || !phone) return alert("Пожалуйста, заполните данные!");

            db.ref('orders').push({
                wantedNum: currentNum,
                clientName: name,
                clientPhone: phone,
                date: Date.now()
            }).then(() => {
                alert("Заявка принята! Мы свяжемся с вами.");
                closeModal();
            });
        }
    </script>
</body>
</html>
