<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM MARKET | КЛАССИКА ЛЮКС</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Manrope:wght@500;800&display=swap');
        
        body { 
            background-color: #05070a; 
            color: #ffffff; 
            font-family: 'Manrope', sans-serif;
            background-image: radial-gradient(circle at 50% -20%, #1a1c20 0%, #05070a 100%);
        }

        /* Эффект дорогого стекла */
        .premium-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .premium-card:hover {
            border-color: rgba(251, 191, 36, 0.4);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.05);
        }

        .gold-text {
            background: linear-gradient(135deg, #fcd34d 0%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .order-btn {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #000;
            font-weight: 800;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
        }

        .search-bar {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: white;
            transition: 0.3s;
        }

        .search-bar:focus {
            border-color: #fbbf24;
            outline: none;
            background: rgba(255, 255, 255, 0.08);
        }

        .operator-badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
        }

        /* Плавное появление */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="pb-10">

    <header class="py-10 px-6 text-center">
        <h1 class="text-4xl font-[900] tracking-tighter uppercase mb-2">
            <span class="gold-text">SIM</span> MARKET
        </h1>
        <p class="text-gray-500 text-[10px] font-bold tracking-[0.4em] uppercase">Эксклюзивные номера • Дагестан</p>
    </header>

    <main class="max-w-xl mx-auto px-4">
        
        <div class="mb-8">
            <input type="text" id="searchInput" oninput="render()" placeholder="Поиск номера (например: 000)" 
                   class="w-full p-5 search-bar text-sm">
        </div>

        <div class="flex gap-2 overflow-x-auto mb-8 no-scrollbar pb-2">
            <button onclick="filterBy('all')" class="px-5 py-2 rounded-full border border-white/10 text-[11px] font-bold uppercase hover:bg-white/5">Все</button>
            <button onclick="filterBy('vip')" class="px-5 py-2 rounded-full border border-yellow-600/30 text-[11px] font-bold uppercase text-yellow-500 hover:bg-yellow-600/10">VIP</button>
            <button onclick="filterBy('megafon')" class="px-5 py-2 rounded-full border border-white/10 text-[11px] font-bold uppercase hover:bg-white/5">Мегафон</button>
            <button onclick="filterBy('beeline')" class="px-5 py-2 rounded-full border border-white/10 text-[11px] font-bold uppercase hover:bg-white/5">Билайн</button>
        </div>

        <div id="numbersList" class="space-y-4">
            </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black/90 z-[100] hidden items-center justify-center p-6 backdrop-blur-md">
        <div class="premium-card p-8 w-full max-w-sm border-t-4 border-yellow-600 bg-[#0a0c10]">
            <h2 class="text-2xl font-black mb-1 gold-text uppercase">Заявка</h2>
            <p id="selectedNum" class="text-xl font-bold mb-6 text-white"></p>
            
            <form id="orderForm" class="space-y-4">
                <input type="text" id="name" placeholder="Ваше Имя" class="w-full p-4 search-bar text-sm" required>
                <input type="tel" id="phone" placeholder="Контактный номер" class="w-full p-4 search-bar text-sm" required>
                
                <div class="grid grid-cols-2 gap-3 text-center">
                    <div class="p-3 bg-white/5 rounded-xl border border-white/5">
                        <label class="text-[8px] text-gray-500 block mb-1 uppercase">Паспорт</label>
                        <input type="file" id="p1" class="text-[8px]" required>
                    </div>
                    <div class="p-3 bg-white/5 rounded-xl border border-white/5">
                        <label class="text-[8px] text-gray-500 block mb-1 uppercase">Прописка</label>
                        <input type="file" id="p2" class="text-[8px]" required>
                    </div>
                </div>

                <button type="submit" class="w-full py-5 order-btn uppercase tracking-widest text-xs active:scale-95 transition-all">Подтвердить заказ</button>
                <button type="button" onclick="closeModal()" class="w-full text-gray-600 text-[10px] font-bold uppercase mt-2">Закрыть</button>
            </form>
        </div>
    </div>

    <script>
        const BIN_ID = "69c9d640aaba882197a65742"; 
        const KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW";
        let db = [];
        let currentFilter = 'all';

        async function load() {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: {'X-Master-Key': KEY} });
            const data = await res.json();
            db = data.record || [];
            render();
        }

        function render() {
            const list = document.getElementById('numbersList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = db.filter(i => i.n.includes(search));
            if(currentFilter === 'vip') filtered = filtered.filter(i => i.cat === 'vip' || i.cat === 'gold');
            else if(currentFilter !== 'all') filtered = filtered.filter(i => i.op === currentFilter);

                <div onclick="openModal('${item.n}')" class="premium-card p-6 flex justify-between items-center fade-in cursor-pointer" style="animation-delay: ${idx * 0.05}s">
                    <div>
                        <div class="flex items-center gap-3 mb-1">
                            <span class="text-2xl font-black tracking-tighter">${item.n}</span>
                            ${(item.cat === 'vip' || item.cat === 'gold') ? '<span class="text-[8px] bg-yellow-600 text-black px-1.5 py-0.5 rounded font-black">VIP</span>' : ''}
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="operator-badge text-gray-400">${item.o || item.op}</span>
