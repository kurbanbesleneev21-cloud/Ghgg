<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | КУПИТЬ НОМЕР</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #09090b; color: #f4f4f5; font-family: 'Manrope', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-gold { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #000; font-weight: 800; }
        .card { transition: all 0.2s ease; border: 1px solid rgba(255,255,255,0.03); }
        .card:active { transform: scale(0.97); background: rgba(255,255,255,0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input::placeholder { color: #52525b; text-transform: uppercase; font-size: 10px; }
    </style>
</head>
<body class="pb-24">

    <header class="p-6 sticky top-0 z-50 glass border-b border-white/5">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-extrabold tracking-tighter uppercase leading-none">SIM <span class="gold-text">MARKET</span></h1>
                <p class="text-[8px] font-bold text-zinc-500 uppercase tracking-[0.3em] mt-1">Premium SIM Dagestan</p>
            </div>
            <button onclick="window.location.reload()" class="w-10 h-10 rounded-full bg-zinc-900 border border-white/5 flex items-center justify-center">🔄</button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <div class="mt-4 mb-6">
            <input type="text" id="q" oninput="draw()" placeholder="Поиск номера..." 
                   class="w-full p-5 rounded-2xl bg-zinc-900 border border-zinc-800 outline-none focus:border-amber-500 transition-all text-sm shadow-2xl">
        </div>

        <div class="flex gap-2 overflow-x-auto no-scrollbar mb-6 pb-2">
            <button onclick="setF('all')" class="px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase tracking-widest border border-white/5">Все</button>
            <button onclick="setF('vip')" class="px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase tracking-widest border border-amber-500/20 text-amber-500">VIP & GOLD</button>
            <button onclick="setF('megafon')" class="px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase tracking-widest border border-white/5">Мегафон</button>
        </div>

        <div id="list" class="space-y-3">
            <div class="p-20 text-center opacity-20 text-[10px] font-black uppercase tracking-[0.3em]">Загрузка данных...</div>
        </div>
    </main>

    <div id="modal" class="fixed inset-0 z-[100] bg-black/95 hidden items-center justify-center p-6 backdrop-blur-md">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-sm border-t-2 border-amber-500">
            <h2 class="text-2xl font-black mb-1 gold-text uppercase">Заказ</h2>
            <p id="target" class="text-lg font-bold text-white mb-6 border-b border-white/5 pb-2"></p>
            <form id="tg_form" class="space-y-4">
                <input type="text" id="u_name" placeholder="ФИО" class="w-full bg-zinc-900 p-4 rounded-xl border border-white/5 outline-none text-xs" required>
                <input type="tel" id="u_phone" placeholder="Телефон" class="w-full bg-zinc-900 p-4 rounded-xl border border-white/5 outline-none text-xs" required>
                <div class="grid grid-cols-2 gap-3 text-center">
                    <div class="p-3 bg-zinc-900 rounded-xl border border-white/5">
                        <label class="text-[7px] text-zinc-500 block mb-1 uppercase font-black">Паспорт</label>
                        <input type="file" id="img1" accept="image/*" class="text-[8px]" required>
                    </div>
                    <div class="p-3 bg-zinc-900 rounded-xl border border-white/5">
                        <label class="text-[7px] text-zinc-500 block mb-1 uppercase font-black">Прописка</label>
                        <input type="file" id="img2" accept="image/*" class="text-[8px]" required>
                    </div>
                </div>
                <button type="submit" id="send_btn" class="w-full btn-gold py-5 rounded-2xl uppercase tracking-widest text-[10px] mt-2 active:scale-95 transition-all">Купить номер</button>
                <button type="button" onclick="closeM()" class="w-full text-zinc-600 text-[9px] font-bold uppercase py-2">Назад</button>
            </form>
        </div>
    </div>

    <div id="chat-wrapper" class="fixed bottom-6 right-6 z-[200]">
        <button onclick="toggleChat()" class="w-14 h-14 bg-amber-500 rounded-full shadow-2xl flex items-center justify-center active:scale-90 transition-all border-4 border-black/50">
            <span id="chat-icon" class="text-2xl">💬</span>
        </button>

        <div id="chat-window" class="hidden absolute bottom-16 right
