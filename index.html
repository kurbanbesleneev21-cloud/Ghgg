<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #050505; color: #fff; }
        .logo-shine { font-weight: 800; font-size: 32px; background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 3s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
        .neon-card { position: relative; background: rgba(191, 149, 63, 0.1); border-radius: 24px; padding: 1.5px; overflow: hidden; margin-bottom: 20px; }
        .card-content { position: relative; background: #0a0a0a; border-radius: 22.5px; padding: 24px 20px; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        .buy-btn { background: #bf953f; color: #fff; font-weight: 800; font-size: 11px; text-transform: uppercase; padding: 16px; border-radius: 14px; width: 100%; margin-top: 16px; }
    </style>
</head>
<body>
    <header class="text-center py-12 border-b border-white/5">
        <h1 class="logo-shine italic">SIM MARKET</h1>
        <p class="text-[10px] font-bold opacity-30 tracking-[5px] mt-2 uppercase">Live Stock from Admin</p>
    </header>

    <main class="max-w-md mx-auto p-6">
        <div id="list" class="space-y-6 pb-20">
            <p class="text-center opacity-20 py-10">Загрузка номеров...</p>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44",
            authDomain: "nnnmb-a0b52.firebaseapp.com",
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com",
            projectId: "nnnmb-a0b52"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // СИНХРОНИЗАЦИЯ С АДМИНКОЙ
        db.ref('inventory').on('value', snapshot => {
            const list = document.getElementById('list');
            const data = snapshot.val();
            
            if (!data) {
                list.innerHTML = '<p class="text-center opacity-20 py-10">Товара пока нет в админке</p>';
                return;
            }

            list.innerHTML = "";
            Object.keys(data).reverse().forEach(key => {
                const item = data[key];
                list.innerHTML += `
                    <div class="neon-card">
                        <div class="card-content">
                            <div class="w-full flex justify-between items-center opacity-40 px-1 text-[9px] font-bold uppercase tracking-widest mb-3">
                                <span>${item.op}</span><span style="color:#bf953f italic">Elite</span>
                            </div>
                            <div class="text-3xl font-black italic tracking-tighter mb-1">+7 ${item.num}</div>
                            <div class="text-2xl font-bold" style="color: #bf953f">${item.price} ₽</div>
                            <button onclick="sendOrder('${item.num}')" class="buy-btn">Заказать номер</button>
                        </div>
                    </div>`;
            });
        });

        function sendOrder(num) {
            const name = prompt("Введите ваше имя:");
            const phone = prompt("Введите ваш контактный телефон:");
            if (name && phone) {
                db.ref('leads').push({
                    num: num,
                    fio: name,
                    contact: phone,
                    ts: Date.now()
                }).then(() => alert("Заявка отправлена!"));
            }
        }
    </script>
</body>
</html>
