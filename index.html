<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | КАТАЛОГ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #09090b; color: #f4f4f5; font-family: 'Manrope', sans-serif; }
        .glass { background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; }
        .input-dark { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 12px; width: 100%; color: white; outline: none; }
        .tab-btn { transition: 0.3s; white-space: nowrap; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .tab-active { background: #fbbf24 !important; color: #000 !important; border-color: #fbbf24 !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #order-modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="pb-10">

    <header class="p-6 sticky top-0 z-50 glass border-b border-white/5 flex justify-between items-center">
        <h1 class="text-xl font-extrabold uppercase tracking-tighter">SIM <span class="gold-text">MARKET</span></h1>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <input type="text" id="q" oninput="draw()" placeholder="Поиск номера..." class="w-full p-5 mb-6 rounded-2xl bg-zinc-900 border border-zinc-800 outline-none text-sm focus:border-amber-500">

        <div class="flex gap-2 overflow-x-auto no-scrollbar mb-8 pb-2">
            <button onclick="setFilter('all', this)" class="tab-btn tab-active px-6 py-2.5 rounded-full border border-white/10 bg-zinc-900">Все</button>
            <button onclick="setFilter('mts', this)" class="tab-btn px-6 py-2.5 rounded-full border border-white/10 bg-zinc-900">МТС</button>
            <button onclick="setFilter('megafon', this)" class="tab-btn px-6 py-2.5 rounded-full border border-white/10 bg-zinc-900">Мегафон</button>
            <button onclick="setFilter('beeline', this)" class="tab-btn px-6 py-2.5 rounded-full border border-white/10 bg-zinc-900">Билайн</button>
            <button onclick="setFilter('tele2', this)" class="tab-btn px-6 py-2.5 rounded-full border border-white/10 bg-zinc-900">Теле2</button>
            <button onclick="setFilter('yota', this)" class="tab-btn px-6 py-2.5 rounded-full border border-white/10 bg-zinc-900">Yota</button>
        </div>

        <div id="list" class="space-y-4"></div>
    </main>

    <div id="order-modal">
        <div class="glass w-full max-w-sm p-6 rounded-[2.5rem] space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h2 class="font-black uppercase text-xs tracking-widest">Заявка на <span id="target-num" class="gold-text"></span></h2>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-zinc-800 rounded-full text-xs">✕</button>
            </div>
            
            <input type="text" id="client-fio" placeholder="Ваше ФИО" class="input-dark">
            <input type="tel" id="client-phone" placeholder="Ваш телефон для связи" class="input-dark">
            
            <div class="p-4 bg-zinc-900/50 rounded-xl border border-dashed border-zinc-700">
                <label class="block text-[9px] uppercase font-bold opacity-40 mb-2">Прикрепите фото паспорта</label>
                <input type="file" id="client-passport" accept="image/*" class="text-[10px] text-zinc-500 file:bg-amber-500/10 file:text-amber-500 file:border-0 file:px-3 file:py-1 file:rounded-lg file:mr-3">
            </div>

            <button onclick="submitOrder()" id="send-btn" class="w-full py-4 bg-amber-500 text-black font-black rounded-2xl uppercase text-[10px] tracking-widest active:scale-95 transition-all">Отправить заявку</button>
        </div>
    </div>

    <script>
        const TOKEN = "8279695581:AAGuQgQhmgq9QaTX4rULywq6o18MeT3XIUw";
        const MY_ID = "8768514374"; 
        const BIN = "69c9d640aaba882197a65742"; 
        const KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW"; 

        let db = [], currentNum = "", currentPrice = "", activeFilter = 'all';

        async function init() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN}/latest`, { headers: {'X-Master-Key': KEY} });
                const data = await res.json();
                db = data.record.record || data.record;
                draw();
            } catch(e) { console.error("Load error"); }
        }

        function setFilter(val, btn) {
            activeFilter = val;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            btn.classList.add('tab-active');
            draw();
        }

        function draw() {
            const list = document.getElementById('list');
            const q = document.getElementById('q').value.toLowerCase();
            
            let filtered = db.filter(i => {
                const matchSearch = String(i.n).includes(q);
                const matchTab = activeFilter === 'all' || String(i.op).toLowerCase() === activeFilter;
                return matchSearch && matchTab;
            });

            if(filtered.length === 0) {
                list.innerHTML = `<div class="text-center py-20 opacity-20 text-[10px] font-bold uppercase tracking-widest">Номеров не найдено</div>`;
                return;
            }

            list.innerHTML = filtered.map(i => `
                <div class="card p-6 flex justify-between items-center border-white/5">
                    <div>
                        <div class="text-2xl font-black tracking-tighter">${i.n}</div>
                        <div class="text-[9px] opacity-40 uppercase font-bold mt-1">${i.op} • ${i.t} ₽</div>
                    </div>
                    <button onclick="openModal('${i.n}', '${i.t}')" class="bg-amber-500 text-black text-[10px] font-black px-5 py-2.5 rounded-xl uppercase">Купить</button>
                </div>
            `).reverse().join('');
        }

        function openModal(n, t) {
            currentNum = n; currentPrice = t;
            document.getElementById('target-num').innerText = n;
            document.getElementById('order-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('order-modal').style.display = 'none'; }

        async function submitOrder() {
            const fio = document.getElementById('client-fio').value;
            const phone = document.getElementById('client-phone').value;
            const fileInput = document.getElementById('client-passport');
            const btn = document.getElementById('send-btn');

            if(!fio || !phone) return alert("Заполните ФИО и телефон");

            btn.innerText = "ОТПРАВЛЯЕМ..."; btn.disabled = true;

            try {
                // 1. Текст в ТГ
                const msg = `🚀 *НОВЫЙ ЗАКАЗ*\n\n📱 Номер: \`${currentNum}\`\n💰 Цена: ${currentPrice} ₽\n👤 Клиент: ${fio}\n📞 Контакт: ${phone}`;
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: MY_ID, text: msg, parse_mode: 'Markdown' })
                });

                // 2. Фото в ТГ
                if(fileInput.files.length > 0) {
                    const formData = new FormData();
                    formData.append('chat_id', MY_ID);
                    formData.append('photo', fileInput.files[0]);
                    formData.append('caption', `Документ от: ${fio}`);
                    await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                }

                alert("Спасибо! Заявка отправлена Курбану.");
                closeModal();
            } catch (e) {
                alert("Ошибка связи с ботом.");
            } finally {
                btn.innerText = "Отправить заявку"; btn.disabled = false;
            }
        }

        init();
    </script>
</body>
</html>
