                    </label>
                </div>
                
                <button type="submit" id="sbtn" class="w-full bg-yellow-600 text-black font-black py-4 rounded-xl uppercase tracking-tighter">Забронировать</button>
                <button type="button" onclick="closeM()" class="w-full text-gray-500 text-xs uppercase mt-2">Отмена</button>
            </form>
