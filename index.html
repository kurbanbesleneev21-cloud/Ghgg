<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimMarket — электроника по лучшим ценам</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto&display=swap" rel="stylesheet"><style>
body {margin:0;font-family:Roboto;background:#F8FAFC;color:#0F172A;}
.header {background:#0F172A;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center;}
.logo {font-family:Inter;font-weight:800;font-size:22px;}
.logo span {color:#3B82F6;}
.search {padding:8px;border-radius:20px;border:none;width:200px;}
.container {padding:20px;max-width:1200px;margin:auto;}
.banner {background:#0F172A;color:white;padding:30px;border-radius:20px;margin-bottom:20px;}
.products {display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;}
.card {background:white;border-radius:15px;padding:15px;cursor:pointer;transition:0.2s;}
.card:hover {transform:translateY(-8px);box-shadow:0 20px 40px rgba(0,0,0,0.1);}
.card img {width:100%;height:150px;object-fit:contain;}
.price {color:#3B82F6;font-weight:bold;font-size:18px;}
.btn {background:#3B82F6;color:white;border:none;padding:8px;border-radius:20px;width:100%;margin-top:10px;}
.trust {margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;}

.modal {display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;}
.modal-content {background:white;padding:20px;border-radius:20px;max-width:500px;width:90%;}
.close {float:right;cursor:pointer;}
</style></head><body><div class="header">
<div class="logo">Sim<span>Market</span></div>
<input class="search" id="search" placeholder="Поиск...">
</div><div class="container"><div class="banner">
<h2>🔥 Смартфоны 2026</h2>
<p>Скидки до 30% • Быстрая доставка • Гарантия</p>
</div><div class="products" id="products"></div><div class="trust">
<div>🚚 Доставка 1–3 дня</div>
<div>🛡️ Гарантия 12 месяцев</div>
<div>💳 Оплата при получении</div>
<div>⭐ 1000+ клиентов</div>
</div></div><!-- MODAL --><div id="modal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">×</span>
<div id="modalBody"></div>
</div>
</div><script>
let products = [
{ id:1, name:"iPhone 15", price:79990, img:"https://images.pexels.com/photos/699122/pexels-photo-699122.jpeg", rating:4.8 },
{ id:2, name:"Samsung A54", price:27990, img:"https://images.pexels.com/photos/47261/pexels-photo-47261.jpeg", rating:4.6 },
{ id:3, name:"JBL 510BT", price:3990, img:"https://images.pexels.com/photos/3394659/pexels-photo-3394659.jpeg", rating:4.4 }
];

let cart = [];

function render(list){
document.getElementById("products").innerHTML = list.map(p=>`
<div class="card" onclick="openProduct(${p.id})">
<img src="${p.img}">
<h3>${p.name}</h3>
<div>⭐ ${p.rating}</div>
<div class="price">${p.price} ₽</div>
<div style="font-size:12px;color:green;">✔ В наличии • Доставка 1-3 дня</div>
<button class="btn" onclick="event.stopPropagation();addToCart(${p.id})">В корзину</button>
</div>
`).join("");
}

function openProduct(id){
let p = products.find(x=>x.id==id);
document.getElementById("modalBody").innerHTML = `
<h2>${p.name}</h2>
<img src="${p.img}" style="width:100%;max-height:200px;object-fit:contain;">
<p>⭐ ${p.rating}</p>
<h3>${p.price} ₽</h3>
<button class="btn" onclick="addToCart(${p.id})">Добавить в корзину</button>
`;
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function addToCart(id){
cart.push(id);
alert("Добавлено в корзину");
}

document.getElementById("search").oninput = (e)=>{
let val = e.target.value.toLowerCase();
render(products.filter(p=>p.name.toLowerCase().includes(val)));
};

render(products);
</script></body>
</html>
