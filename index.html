<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- НОВЫЙ ТЕГ GOOGLE ПРОВЕРКИ -->
    <meta name="google-site-verification" content="jyP0Po8jGw1Gc_gAck06U7vM7fIgBDYiqMpUykFBTxY" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-MARKET | МАГАЗИН НОМЕРОВ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Manrope', sans-serif; overflow-x: hidden; }
        .gold-text { background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { 
            background: linear-gradient(145deg, #0f0f0f, #050505);
            border: 1px solid rgba(255,255,255,0.03);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card:active { transform: scale(0.95); border-color: #bf953f; box-shadow: 0 0 20px rgba(191,149,63,0.2); }
        .btn-gold { 
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728); 
            color: #000; font-weight: 900;
        }
    </style>
</head>
<body class="p-5">

    <div class="max-w-md mx-auto">
        <!-- ШАПКА И ЛИЧНЫЙ КАБИНЕТ -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-black italic gold-text tracking-tighter">S-MARKET</h1>
                <p class="text-[9px] uppercase tracking-[3px] opacity-40 font-bold">Premium Numbers</p>
            </div>
            <button onclick="location.href='https://sim-admin.vercel.app'" class="p-3 bg-white/5 rounded-2xl border border-white/10 active:scale-90 transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#bf953f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </button>
        </div>

        <!-- РЕКЛАМА -->
        <div id="promo-section" class="mb-10"></div>

        <!-- КАТАЛОГ С ЭФФЕКТАМИ ПРИБЛИЖЕНИЯ -->
        <h2 class="text-sm font-black uppercase tracking-widest opacity-30 mb-5 ml-1 italic">Доступные лоты</h2>
        <div id="catalog" class="space-y-4"></div>
    </div>

    <!-- МОДАЛКА ЗАКАЗА -->
    <div id="modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-6">
        <div class="card w-full max-w-sm rounded-[32px] p-8 space-y-5">
            <h3 id="m-num" class="text-3xl font-black italic gold-text text-center"></h3>
            <input type="text" id="m-name" placeholder="Ваше имя" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl outline-none">
            <input type="tel" id="m-phone" placeholder="Ваш номер" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl outline-none">
            <button onclick="sendOrder()" class="btn-gold w-full py-5 rounded-2xl uppercase font-black">Заказать</button>
            <button onclick="closeModal()" class="w-full text-[10px] opacity-30 font-bold">ОТМЕНА</button>
        </div>
    </div>

    <script>
        const conf = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(conf);
        const db = firebase.database();
        let targetNum = "";

        // Загрузка рекламы
        db.ref('blog/promo').on('value', s => {
            const d = s.val();
            if(d) {
                document.getElementById('promo-section').innerHTML = `
                    <div class="card rounded-[30px] overflow-hidden relative border-0">
                        <img src="${d.image}" class="w-full h-56 object-cover opacity-60">
                        <div class="absolute inset-0 bg-gradient-to-t from-black p-6 flex flex-col justify-end">
                            <h3 class="text-xl font-black italic uppercase">${d.title}</h3>
                            <p class="text-[11px] opacity-70 mt-1">${d.text || ''}</p>
                        </div>
                    </div>`;
            }
        });

        // Загрузка каталога с анимацией карточек
        db.ref('inventory').on('value', s => {
            const cont = document.getElementById('catalog');
            cont.innerHTML = "";
            s.forEach(c => {
                const i = c.val();
                cont.innerHTML += `
                    <div class="card rounded-3xl p-5 flex justify-between items-center group cursor-pointer hover:scale-[1.02]" onclick="openOrder('${i.num}')">
                        <div>
                            <p class="text-[9px] font-black opacity-40 uppercase tracking-widest">${i.op}</p>
                            <p class="text-2xl font-black italic tracking-tighter group-active:gold-text">+7 ${i.num}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xl font-black gold-text">${i.price} ₽</p>
                            <p class="text-[8px] font-bold opacity-30 uppercase">Купить</p>
                        </div>
                    </div>`;
            });
        });

        function openOrder(n) {
            targetNum = n;
            document.getElementById('m-num').innerText = "+7 " + n;
            document.getElementById('modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function sendOrder() {
            const name = document.getElementById('m-name').value;
            const phone = document.getElementById('m-phone').value;
            if(!name || !phone) return alert("Заполни поля!");
            db.ref('orders').push({ wantedNum: targetNum, clientName: name, clientPhone: phone, date: Date.now() }).then(() => {
                alert("Заказ принят!"); closeModal();
            });
        }
    </script>
</body>
</html>
