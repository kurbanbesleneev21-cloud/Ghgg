<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM MARKET | Магазин</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0b0f1a; color: #fff; font-family: sans-serif; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid #334155; padding: 15px; border-radius: 15px; margin-bottom: 10px; }
        .gold { border-color: #fbbf24; }
    </style>
</head>
<body class="p-4">

    <script>
        const NOMERA = [
            { n: "+7 (928) 000-11-22", p: "5000₽", t: "GOLD" },
            { n: "+7 (938) 555-55-55", p: "25000₽", t: "VIP" },
            { n: "+7 (999) 111-22-33", p: "3000₽", t: "SILVER" }
        ];
    </script>

    <div class="max-w-md mx-auto">
        <h1 class="text-3xl font-black text-yellow-500 text-center mb-6">SIM MARKET</h1>
        
        <div id="list"></div>

        <div class="card gold mt-8">
            <h3 class="text-center font-bold mb-4">ОФОРМИТЬ ВЫБРАННЫЙ НОМЕР</h3>
            <form id="f" class="space-y-4">
                <input type="text" id="phone" placeholder="Номер телефона" class="w-full bg-gray-800 p-4 rounded-xl border-none outline-none text-yellow-500 font-bold" required>
                <button type="submit" id="b" class="w-full bg-yellow-500 text-black font-bold py-4 rounded-xl uppercase">Отправить заявку</button>
            </form>
        </div>
    </div>

    <script>
        const list = document.getElementById('list');
        NOMERA.forEach(item => {
            const d = document.createElement('div');
            d.className = 'card flex justify-between items-center';
            if(item.t === 'GOLD' || item.t === 'VIP') d.classList.add('gold');
            d.onclick = () => { document.getElementById('phone').value = item.n; };
            d.innerHTML = `<div><div class="text-xl font-mono">${item.n}</div><div class="text-xs text-yellow-500">${item.t} — ${item.p}</div></div><div class="text-yellow-500">➜</div>`;
            list.appendChild(d);
        });

        document.getElementById('f').onsubmit = async (e) => {
            e.preventDefault();
            const b = document.getElementById('b');
            b.disabled = true; b.innerText = "ОТПРАВКА...";
            const txt = `💎 ЗАЯВКА\n📱 Номер: ${document.getElementById('phone').value}`;
            
            await fetch(`https://api.telegram.org/bot8666944440:AAFAmQuYaYmnJjhuQ9AmdBQim9V-kxNnxAo/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: "8768514374", text: txt})
            });
            
            alert("Заявка отправлена!");
            location.reload();
        };
    </script>
</body>
</html>
