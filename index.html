<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; margin: 0; background: #0a0a0a; color: #fff; overflow-x: hidden; }
        
        /* БАННЕР */
        #banner-box { display: none; background: rgba(191,149,63,0.15); border-y: 1px solid #bf953f; padding: 12px 0; margin-bottom: 20px; overflow: hidden; }
        .marquee { display: inline-block; white-space: nowrap; animation: marquee 20s linear infinite; color: #fcf6ba; font-weight: 800; text-transform: uppercase; font-size: 11px; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .logo-shine { font-weight: 800; font-size: 32px; text-transform: uppercase; background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-style: italic; animation: shine 3s linear infinite; background-size: 200% auto; }
        @keyframes shine { to { background-position: 200% center; } }

        .tab-btn { background: rgba(255,255,255,0.05); padding: 10px 18px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; color: #666; border: 1px solid transparent; }
        .tab-active { background: #bf953f; color: #000; box-shadow: 0 5px 15px rgba(191,149,63,0.4); }

        .neon-card { position: relative; background: rgba(191,149,63,0.1); border-radius: 24px; padding: 2px; overflow: hidden; margin-bottom: 20px; }
        .neon-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, #bf953f, #fcf6ba, #bf953f, transparent); animation: rotate 4s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .card-content { position: relative; background: #0d0d0d; border-radius: 22px; padding: 25px 20px; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        .price-text { font-size: 26px; font-weight: 800; color: #bf953f; margin: 10px 0; }
        .buy-btn { background: #bf953f; color: #000; font-weight: 900; font-size: 12px; text-transform: uppercase; padding: 16px; border-radius: 16px; width: 100%; border: none; }
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-5">

    <header class="flex flex-col items-center py-8">
        <h1 class="logo-shine italic text-center">SIM MARKET</h1>
        <p class="text-[9px] font-bold opacity-20 tracking-[4px] uppercase mt-1">Premium Numbers</p>
    </header>

    <div id="banner-box">
        <div class="marquee" id="banner-txt"></div>
    </div>

    <div class="max-w-md mx-auto mb-6 flex gap-2 overflow-x-auto no-scrollbar pb-2">
        <button onclick="filter('all', this)" class="tab-btn tab-active">Все</button>
        <button onclick="filter('mts', this)" class="tab-btn">МТС</button>
        <button onclick="filter('megafon', this)" class="tab-btn">Мегафон</button>
        <button onclick="filter('beeline', this)" class="tab-btn">Билайн</button>
        <button onclick="filter('tele2', this)" class="tab-btn">Tele2</button>
    </div>

    <div id="list" class="max-w-md mx-auto pb-20"></div>

    <div id="modal">
        <div class="bg-[#0d0d0d] border border-[#bf953f] w-full max-w-sm rounded-[30px] p-8 text-center">
            <h2 id="m-num" class="text-2xl font-black mb-1"></h2>
            <p class="text-[10px] opacity-40 uppercase mb-6 italic">Оставить заявку</p>
            <input type="text" id="fio" placeholder="Ваше Имя" class="w-full bg-[#151515] border border-white/10 p-4 rounded-xl mb-3 outline-none focus:border-[#bf953f] text-white">
            <input type="tel" id="contact" placeholder="Ваш телефон" class="w-full bg-[#151515] border border-white/10 p-4 rounded-xl mb-6 outline-none focus:border-[#bf953f] text-white">
            <button onclick="sendOrder()" class="buy-btn">Заказать номер</button>
            <p onclick="closeM()" class="mt-4 text-[10px] opacity-30 uppercase font-bold cursor-pointer">Отмена</p>
        </div>
    </div>

    <script>
        const cfg = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            authDomain: "nnnmb-a0b52.firebaseapp.com", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com", 
            projectId: "nnnmb-a0b52" 
        };
        firebase.initializeApp(cfg);
        const db = firebase.database();

        // ФУНКЦИЯ СЧЕТЧИКА ПОСЕЩЕНИЙ
        function countVisit() {
            const visitRef = db.ref('stats/visits');
            visitRef.transaction((currentValue) => {
                return (currentValue || 0) + 1;
            });
        }
        countVisit(); // Запуск при загрузке

        // ПОЛУЧЕНИЕ БАННЕРА
        db.ref('settings/banner').on('value', s => {
            const val = s.val();
            const box = document.getElementById('banner-box');
            if(val && val.trim() !== "") {
                box.style.display = 'block';
                document.getElementById('banner-txt').innerText = val + " • " + val + " • " + val;
            } else { box.style.display = 'none'; }
        });

        // ПОЛУЧЕНИЕ НОМЕРОВ
        let allNums = {}; let curOp = 'all'; let selN = '';
        db.ref('inventory').on('value', s => { allNums = s.val() || {}; render(); });

        function filter(op, btn) {
            curOp = op;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            btn.classList.add('tab-active');
            render();
        }

        function render() {
            const list = document.getElementById('list');
            list.innerHTML = "";
            const keys = Object.keys(allNums).reverse();
            keys.forEach(k => {
                const item = allNums[k];
                if(curOp !== 'all' && item.op !== curOp) return;
                list.innerHTML += `
                    <div class="neon-card">
                        <div class="card-content">
                            <div class="w-full flex justify-between items-center opacity-30 text-[9px] font-bold uppercase mb-4">
                                <span>${item.op}</span><span>Premium</span>
                            </div>
                            <div class="text-3xl font-black italic tracking-tighter text-white">+7 ${item.num}</div>
                            <div class="price-text">${parseInt(item.price).toLocaleString()} ₽</div>
                            <button onclick="openM('${item.num}')" class="buy-btn">Оформить</button>
                        </div>
                    </div>`;
            });
        }

        function openM(n) { selN = n; document.getElementById('m-num').innerText = '+7 '+n; document.getElementById('modal').style.display = 'flex'; }
        function closeM() { document.getElementById('modal').style.display = 'none'; }
        function sendOrder() {
            const f = document.getElementById('fio').value;
            const c = document.getElementById('contact').value;
            if(!f || !c) return alert("Заполните данные!");
            db.ref('leads').push({ num: selN, fio: f, contact: c, ts: Date.now() }).then(() => {
                alert("Заявка принята!");
                closeM();
            });
        }
    </script>
</body>
</html>
