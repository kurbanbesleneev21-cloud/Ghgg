<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0A0E27">
    <title>SimMarket — Премиум Маркетплейс</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ТВОИ СТИЛИ БЕЗ ИЗМЕНЕНИЙ */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0A0E27 0%, #1a1f3a 50%, #0d1928 100%); color: #E8EAED; padding-bottom: 70px; position: relative; overflow-x: hidden; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%); pointer-events: none; z-index: 1; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 14, 39, 0.95); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 12px 20px 24px; border-top: 1px solid rgba(59, 130, 246, 0.2); z-index: 100; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: #94A3B8; cursor: pointer; background: none; border: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; padding: 8px 12px; }
        .nav-item i { font-size: 20px; transition: all 0.3s ease; }
        .nav-item.active { color: #3B82F6; transform: scale(1.1); }
        .nav-item.active::before { content: ''; position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 30px; height: 3px; background: linear-gradient(90deg, #3B82F6, #8B5CF6); border-radius: 2px; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .header { background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.7) 100%); backdrop-filter: blur(20px); padding: 16px; position: sticky; top: 0; z-index: 99; border-bottom: 1px solid rgba(59, 130, 246, 0.1); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); }
        .header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .logo { font-size: 24px; font-weight: 800; color: white; font-family: 'Poppins', sans-serif; letter-spacing: -1px; background: linear-gradient(135deg, #3B82F6, #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .logo span { color: #3B82F6; }
        .search-wrapper { flex: 1; position: relative; }
        .search-wrapper input { width: 100%; padding: 12px 40px 12px 16px; border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 50px; font-size: 14px; background: rgba(30, 41, 59, 0.6); color: white; outline: none; transition: all 0.3s ease; backdrop-filter: blur(10px); }
        .search-wrapper input:focus { background: rgba(30, 41, 59, 0.9); border-color: #3B82F6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
        .search-wrapper i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #3B82F6; }
        .header-icons { display: flex; gap: 16px; }
        .header-icons i { font-size: 20px; color: white; cursor: pointer; position: relative; transition: all 0.3s ease; }
        .badge-count { position: absolute; top: -8px; right: -10px; background: linear-gradient(135deg, #F59E0B, #F97316); color: white; font-size: 10px; font-weight: bold; padding: 3px 7px; border-radius: 20px; min-width: 18px; text-align: center; }
        .categories-wrapper { overflow-x: auto; padding: 16px; background: transparent; border-bottom: 1px solid rgba(59, 130, 246, 0.1); position: relative; z-index: 2; }
        .categories { display: flex; gap: 12px; }
        .cat-btn { padding: 10px 22px; background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 50px; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; color: #94A3B8; }
        .cat-btn.active { background: linear-gradient(135deg, #3B82F6, #2563EB); color: white; border-color: transparent; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 0 16px 20px; }
        .product-card { background: linear-gradient(135deg, rgba(30, 41, 59, 0.6), rgba(30, 41, 59, 0.3)); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 20px; overflow: hidden; cursor: pointer; transition: all 0.4s; backdrop-filter: blur(10px); }
        .product-img { padding: 16px; text-align: center; height: 150px; display: flex; align-items: center; justify-content: center; }
        .product-img img { max-width: 100%; max-height: 110px; object-fit: contain; }
        .product-info { padding: 14px; }
        .product-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #E8EAED; }
        .price { font-size: 16px; font-weight: 800; background: linear-gradient(135deg, #3B82F6, #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .old-price { font-size: 11px; text-decoration: line-through; color: #64748B; margin-left: 6px; }
        .badge-sale { position: absolute; top: 12px; left: 12px; background: linear-gradient(135deg, #F59E0B, #F97316); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; color: white; z-index: 3; }
        .btn-primary { background: linear-gradient(135deg, #3B82F6, #2563EB); color: white; border: none; padding: 16px; border-radius: 30px; font-weight: 600; width: 100%; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 300; align-items: flex-end; backdrop-filter: blur(5px); }
        .modal-content { background: linear-gradient(135deg, #0A0E27 0%, #1a1f3a 100%); width: 100%; max-height: 85vh; border-radius: 32px 32px 0 0; overflow-y: auto; padding: 24px; border: 1px solid rgba(59, 130, 246, 0.2); }
        .auth-input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 16px; background: rgba(30, 41, 59, 0.6); color: #E8EAED; }
        .product-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0A0E27 0%, #1a1f3a 100%); z-index: 200; overflow-y: auto; display: none; }
        .filter-btn { position: fixed; bottom: 90px; right: 16px; background: linear-gradient(135deg, #3B82F6, #8B5CF6); color: white; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 90; border: none; }
        .filters-drawer { position: fixed; left: -100%; top: 0; width: 80%; height: 100%; background: linear-gradient(135deg, #0A0E27 0%, #1a1f3a 100%); z-index: 301; transition: left 0.3s; padding: 24px; border-right: 1px solid rgba(59, 130, 246, 0.2); }
        .filters-drawer.open { left: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 300; display: none; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-top">
        <div class="logo">Sim<span>Market</span></div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Поиск...">
            <i class="fas fa-search"></i>
        </div>
        <div class="header-icons">
            <i class="far fa-user" id="userIconBtn"></i>
            <i class="fas fa-shopping-cart" id="cartHeaderBtn"><span id="cartBadge" class="badge-count">0</span></i>
        </div>
    </div>
</div>

<div class="categories-wrapper">
    <div class="categories" id="categoriesList"></div>
</div>

<div id="productsContainer" class="products-grid"></div>

<div class="bottom-nav">
    <button class="nav-item active" data-nav="home"><i class="fas fa-home"></i><span>Главная</span></button>
    <button class="nav-item" data-nav="cart"><i class="fas fa-shopping-cart"></i><span>Корзина</span></button>
    <button class="nav-item" data-nav="profile"><i class="fas fa-user"></i><span>Профиль</span></button>
</div>

<button class="filter-btn" id="filterBtn"><i class="fas fa-sliders-h"></i></button>

<div class="filters-drawer" id="filtersDrawer">
    <div style="display: flex; justify-content: space-between; margin-bottom: 24px; align-items: center;">
        <h3 style="color: #E8EAED; font-size: 22px;">Фильтры</h3>
        <button id="closeFilters" style="background:none; border:none; font-size:28px; color:#3B82F6;">✕</button>
    </div>
    <div style="margin-bottom:20px;">
        <label style="display:block; color:#94A3B8; margin-bottom:10px;">Цена (₽)</label>
        <input type="number" id="minPrice" placeholder="от 0" style="width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #334155; background:#1e293b; color:white;">
        <input type="number" id="maxPrice" placeholder="до 500000" style="width:100%; padding:12px; border-radius:10px; border:1px solid #334155; background:#1e293b; color:white;">
    </div>
    <div style="margin-bottom:20px;">
        <label style="display:block; color:#94A3B8; margin-bottom:10px;">Бренд</label>
        <select id="brandFilter" style="width:100%; padding:12px; border-radius:10px; border:1px solid #334155; background:#1e293b; color:white;">
            <option value="">Все бренды</option>
        </select>
    </div>
    <button id="applyFiltersBtn" class="btn-primary">Применить</button>
</div>
<div id="overlay" class="overlay"></div>

<div id="cartModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <span style="font-weight:700; font-size:20px;">🛒 Корзина</span>
            <span class="closeModal" style="cursor:pointer; font-size:20px;">✕</span>
        </div>
        <div id="cartItemsList"></div>
        <div id="cartTotal" style="margin-top:20px; font-weight:800; font-size:18px; border-top:1px solid #334155; padding-top:15px;"></div>
        <button id="checkoutBtn" class="btn-primary" style="margin-top:20px;">Оформить заказ</button>
    </div>
</div>

<div id="authModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <span>🔐 Вход</span>
            <span class="closeModal" style="cursor:pointer;">✕</span>
        </div>
        <input type="tel" id="authPhone" class="auth-input" placeholder="+7 (999) 000-00-00">
        <input type="password" id="authPassword" class="auth-input" placeholder="Пароль">
        <button id="loginBtn" class="btn-primary">Войти</button>
    </div>
</div>

<div id="productPage" class="product-page">
    <div style="padding:16px; border-bottom:1px solid #334155; display:flex; align-items:center; gap:15px;">
        <i class="fas fa-arrow-left" id="closeProductPage" style="font-size:20px; color:#3B82F6;"></i>
        <span style="font-weight:600;">Детали товара</span>
    </div>
    <div id="productPageContent"></div>
</div>

<script>
    // ИНИЦИАЛИЗАЦИЯ ДАННЫХ
    let products = JSON.parse(localStorage.getItem('sim_products')) || [
        {
            id: 1,
            name: "iPhone 15 Pro Max",
            price: 135000,
            oldPrice: 150000,
            category: "Смартфоны",
            brand: "Apple",
            image: "https://shop.mts.ru/upload/images/iphone-15-pro-finish-select-202309-6-7inch-naturaltitanium.png",
            specs: [{key: "Память", value: "256 ГБ"}, {key: "Цвет", value: "Титан"}]
        }
    ];

    let cart = JSON.parse(localStorage.getItem('sim_cart')) || [];
    let currentUser = JSON.parse(localStorage.getItem('sim_user')) || null;
    let currentCategory = "Все";
    let searchQuery = "";

    function save() {
        localStorage.setItem('sim_products', JSON.stringify(products));
        localStorage.setItem('sim_cart', JSON.stringify(cart));
        updateBadges();
    }

    function updateBadges() {
        document.getElementById('cartBadge').innerText = cart.reduce((s,i) => s + i.qty, 0);
    }

    function renderProducts() {
        let container = document.getElementById('productsContainer');
        let filtered = products.filter(p => {
            let matchCat = currentCategory === "Все" || p.category === currentCategory;
            let matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
            let min = parseInt(document.getElementById('minPrice').value) || 0;
            let max = parseInt(document.getElementById('maxPrice').value) || 999999;
            let matchPrice = p.price >= min && p.price <= max;
            let brand = document.getElementById('brandFilter').value;
            let matchBrand = !brand || p.brand === brand;
            return matchCat && matchSearch && matchPrice && matchBrand;
        });

        if(filtered.length === 0) {
            container.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:#64748B;">Ничего не найдено</div>';
            return;
        }

        container.innerHTML = filtered.map(p => `
            <div class="product-card" onclick="openProduct(${p.id})">
                ${p.oldPrice ? '<div class="badge-sale">Акция</div>' : ''}
                <div class="product-img"><img src="${p.image}" onerror="this.src='https://placehold.co/200x150?text=📦'"></div>
                <div class="product-info">
                    <div class="product-title">${p.name}</div>
                    <div class="price">${p.price.toLocaleString()} ₽ ${p.oldPrice ? `<span class="old-price">${p.oldPrice.toLocaleString()} ₽</span>` : ''}</div>
                </div>
            </div>
        `).join('');
    }

    function renderCategories() {
        let cats = ["Все", ...new Set(products.map(p => p.category))];
        document.getElementById('categoriesList').innerHTML = cats.map(c => `
            <button class="cat-btn ${c === currentCategory ? 'active' : ''}" onclick="setCat('${c}')">${c}</button>
        `).join('');
        
        // Обновляем фильтр брендов
        let brands = [...new Set(products.map(p => p.brand))];
        document.getElementById('brandFilter').innerHTML = '<option value="">Все бренды</option>' + brands.map(b => `<option value="${b}">${b}</option>`).join('');
    }

    function setCat(c) {
        currentCategory = c;
        renderCategories();
        renderProducts();
    }

    function openProduct(id) {
        let p = products.find(x => x.id === id);
        document.getElementById('productPage').style.display = 'block';
        let specsHtml = p.specs ? p.specs.map(s => `<div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #334155;"><span>${s.key}</span><span style="color:#3B82F6;">${s.value}</span></div>`).join('') : '';
        
        document.getElementById('productPageContent').innerHTML = `
            <div style="text-align:center; padding:30px; background:rgba(255,255,255,0.02);"><img src="${p.image}" style="max-height:250px;"></div>
            <div style="padding:20px;">
                <h2 style="margin-bottom:10px;">${p.name}</h2>
                <div class="price" style="font-size:28px;">${p.price.toLocaleString()} ₽</div>
                <button class="btn-primary" style="margin:20px 0;" onclick="addToCart(${p.id})">В корзину</button>
                <div style="background:rgba(30,41,59,0.5); padding:15px; border-radius:15px;">
                    <h4 style="margin-bottom:10px; color:#94A3B8;">Характеристики</h4>
                    ${specsHtml}
                </div>
            </div>
        `;
    }

    function addToCart(id) {
        let item = cart.find(i => i.id === id);
        if(item) item.qty++; else cart.push({id, qty: 1});
        save();
        alert('Товар в корзине!');
    }

    function showCart() {
        let modal = document.getElementById('cartModal');
        modal.style.display = 'flex';
        let list = document.getElementById('cartItemsList');
        if(cart.length === 0) {
            list.innerHTML = '<div style="text-align:center; padding:20px;">Пусто</div>';
            document.getElementById('cartTotal').innerText = '';
        } else {
            let total = 0;
            list.innerHTML = cart.map(i => {
                let p = products.find(x => x.id === i.id);
                total += p.price * i.qty;
                return `<div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <span>${p.name} (x${i.qty})</span>
                    <span>${(p.price * i.qty).toLocaleString()} ₽</span>
                </div>`;
            }).join('');
            document.getElementById('cartTotal').innerText = `Итого: ${total.toLocaleString()} ₽`;
        }
    }

    // Обработчики
    document.getElementById('searchInput').oninput = (e) => { searchQuery = e.target.value; renderProducts(); };
    document.getElementById('cartHeaderBtn').onclick = showCart;
    document.getElementById('closeProductPage').onclick = () => document.getElementById('productPage').style.display = 'none';
    document.getElementById('filterBtn').onclick = () => { document.getElementById('filtersDrawer').classList.add('open'); document.getElementById('overlay').style.display = 'block'; };
    document.getElementById('closeFilters').onclick = () => { document.getElementById('filtersDrawer').classList.remove('open'); document.getElementById('overlay').style.display = 'none'; };
    document.getElementById('applyFiltersBtn').onclick = () => { renderProducts(); document.getElementById('closeFilters').click(); };
    document.querySelectorAll('.closeModal').forEach(b => b.onclick = () => document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'));

    // Старт
    renderCategories();
    renderProducts();
    updateBadges();
</script>

</body>
</html>
