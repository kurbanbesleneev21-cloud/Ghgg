<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #09090b; color: #f4f4f5; font-family: 'Manrope', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-gold { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #000; font-weight: 800; }
        .card { transition: all 0.2s ease; border: 1px solid rgba(255,255,255,0.03); background: rgba(255,255,255,0.02); }
        .card:active { transform: scale(0.97); background: rgba(255,255,255,0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">

    <header class="p-6 sticky top-0 z-50 glass border-b border-white/5">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-extrabold tracking-tighter uppercase leading-none">SIM <span class="gold-text">MARKET</span></h1>
                <p class="text-[8px] font-bold text-zinc-500 uppercase tracking-[0.3em] mt-1">Premium SIM Dagestan</p>
            </div>
            <button onclick="window.location.reload()" class="w-10 h-10 rounded-full bg-zinc-900 border border-white/5 flex items-center justify-center">🔄</button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <div class="mt-4 mb-6">
            <input type="text" id="q" oninput="draw()" placeholder="Поиск номера..." 
                   class="w-full p-5 rounded-2xl bg-zinc-900 border border-zinc-800 outline-none focus:border-amber-500 transition-all text-sm shadow-2xl">
        </div>

        <div class="flex gap-2 overflow-x-auto no-scrollbar mb-6 pb-2">
            <button onclick="setF('all')" class="px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase tracking-widest border border-white/5">Все</button>
            <button onclick="setF('vip')" class="px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase tracking-widest border border-amber-500/20 text-amber-500">VIP & GOLD</button>
        </div>

        <div id="list" class="space-y-3">
            <div class="p-20 text-center opacity-20 text-[10px] font-black uppercase tracking-[0.3em]">Загрузка базы...</div>
        </div>
    </main>

    <div id="chat-wrapper" class="fixed bottom-6 right-6 z-[200]">
        <button onclick="toggleChat()" id="chat-btn" class="w-16 h-16 bg-amber-500 rounded-full shadow-2xl flex items-center justify-center active:scale-90 transition-all border-4 border-black/50">
            <span id="chat-icon" class="text-2xl">💬</span>
        </button>

        <div id="chat-window" class="hidden absolute bottom-20 right-0 w-[300px] h-[400px] glass rounded-[2.5rem] border border-white/10 flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-white/5 bg-amber-500/10 flex justify-between items-center">
                <span class="text-[9px] font-black uppercase text-amber-500 tracking-widest">Поддержка</span>
                <button onclick="toggleChat()" class="text-zinc-500">✕</button>
            </div>
            <div id="chat-msgs" class="flex-1 p-4 overflow-y-auto space-y-3 text-[11px] no-scrollbar">
                <div class="bg-zinc-800/80 p-3 rounded-2xl rounded-tl-none">👋 Салам алейкум! Чем помочь?</div>
            </div>
            <div class="p-4 bg-zinc-900/80 border-t border-white/5 flex gap-2">
                <input type="text" id="chat-in" placeholder="Ваш вопрос..." class="flex-1 bg-zinc-800 p-3 rounded-xl border border-white/5 outline-none text-[11px]">
                <button onclick="sendChat()" class="bg-amber-500 text-black w-10 h-10 rounded-xl font-bold flex items-center justify-center">➤</button>
            </div>
        </div>
    </div>

    <script>
        // Идентификатор твоей базы данных и ключ
        const BIN_ID = "69c9d640aaba882197a65742"; 
        const MASTER_KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW"; 
        const BOT_TOKEN = "8569235049:AAEsaW4ME-Ql6036i04tIbj--IPNT6JdroE"; 
        const CHAT_ID = "8768514374"; 

        let db = [];
        let filter = 'all';

        async function init() {
            try {
                // Прямой запрос к JSONBin
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await res.json();
                db = data.record || [];
                draw();
            } catch (e) {
                document.getElementById('list').innerHTML = `<div class="text-center p-10 opacity-50 text-[10px]">ОШИБКА БАЗЫ ДАННЫХ</div>`;
            }
        }

        function draw() {
            const list = document.getElementById('list');
            const q = document.getElementById('q').value.toLowerCase();
            let items = db.filter(i => (i.n && i.n.includes(q)) || (i.o && i.o.toLowerCase().includes(q)));
            
            if(filter === 'vip') items = items.filter(i => i.cat === 'vip' || i.cat === 'gold');
            
            if (items.length === 0) {
                list.innerHTML = `<div class="p-10 text-center opacity-30 text-xs">НИЧЕГО НЕ НАЙДЕНО</div>`;
                return;
            }

            list.innerHTML = items.map(item => `
                <div class="card p-5 rounded-[1.8rem] flex justify-between items-center ${item.cat === 'vip' ? 'border-amber-500/20' : ''}">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-xl font-black text-white tracking-tighter">${item.n}</span>
                            ${item.cat === 'vip' ? '<span class="bg-amber-500 text-black text-[7px] px-1.5 py-0.5 rounded font-black uppercase">VIP</span>' : ''}
                        </div>
                        <div class="text-[9px] font-bold text-zinc-500 uppercase mt-1 tracking-widest">${item.o || item.op || 'SIM'} • ${item.tarif || 'Базовый'}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-lg font-black text-amber-500">${item.t || 0} ₽</div>
                        <button onclick="window.open('https://t.me/твой_ник')" class="text-[8px] font-bold text-zinc-700 uppercase tracking-tighter">КУПИТЬ →</button>
                    </div>
                </div>
            `).reverse().join('');
        }

        function setF(v) { filter = v; draw(); }

        // ЧАТ ЛОГИКА
        function toggleChat() { 
            const w = document.getElementById('chat-window'); 
            w.classList.toggle('hidden'); 
            document.getElementById('chat-icon').innerText = w.classList.contains('hidden') ? '💬' : '✕';
        }

        async function sendChat() {
            const inp = document.getElementById('chat-in');
            const val = inp.value.trim();
            if(!val) return;
            const msgs = document.getElementById('chat-msgs');
            msgs.innerHTML += `<div class="bg-amber-500/20 p-3 rounded-2xl rounded-tr-none ml-auto text-right text-white border border-amber-500/10">${val}</div>`;
            inp.value = ''; msgs.scrollTop = msgs.scrollHeight;
            
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chat_id: CHAT_ID, text: `💬 ЧАТ С САЙТА:\n${val}` })
            });
        }

        init();
    </script>
</body>
</html>
