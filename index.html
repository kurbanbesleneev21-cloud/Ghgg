<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-MARKET | EXCLUSIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c5a059;
            --gold-dark: #8e6d2f;
            --bg: #080808;
        }

        body { 
            background-color: var(--bg); 
            color: #fff; 
            font-family: 'Manrope', sans-serif;
            letter-spacing: -0.01em;
        }

        .serif { font-family: 'Cormorant Garamond', serif; }

        .gold-gradient {
            background: linear-gradient(135deg, #f3e2bb 0%, #c5a059 50%, #8e6d2f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .glass-card:hover {
            border-color: var(--gold);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .search-input {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .search-input:focus {
            background: rgba(255,255,255,0.07);
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.2);
        }

        .btn-premium {
            background: linear-gradient(135deg, #fff 0%, #e0e0e0 100%);
            color: #000;
            font-weight: 800;
            letter-spacing: 0.05em;
            transition: all 0.3s;
        }

        .btn-premium:hover {
            background: var(--gold);
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
        }

        /* Анимация прелоадера */
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    </style>
</head>
<body class="antialiased">

<div id="preloader" class="fixed inset-0 z-[9999] bg-[#000] flex flex-col items-center justify-center">
    <h1 class="serif text-5xl gold-gradient mb-4 animate__animated animate__pulse animate__infinite">S-MARKET</h1>
    <div class="w-48 h-[1px] bg-white/10 relative overflow-hidden">
        <div id="progress" class="absolute inset-0 bg-gold w-0 transition-all duration-500"></div>
    </div>
</div>

<nav class="sticky top-0 z-50 px-6 py-4 backdrop-blur-md border-b border-white/5 bg-black/50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div>
            <span class="serif text-2xl font-bold gold-gradient tracking-widest">S-MARKET</span>
            <span class="block text-[8px] uppercase tracking-[0.5em] text-gray-500">Privé Digital Lounge</span>
        </div>
        
        <div class="flex items-center gap-6">
            <div id="authButton" onclick="openAuthModal()" class="cursor-pointer group">
                <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-tighter text-gray-400 group-hover:text-white transition-colors">
                    <span id="authLabel">Account</span>
                    <div class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center group-hover:border-gold/50">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

<header class="px-6 pt-12 pb-8 max-w-7xl mx-auto">
    <div class="relative rounded-[40px] overflow-hidden p-12 border border-white/5 bg-[url('https://images.unsplash.com/photo-1635776062127-d379bfcba9f8?auto=format&fit=crop&q=80&w=2000')] bg-cover bg-center">
        <div class="absolute inset-0 bg-black/80"></div>
        <div class="relative z-10">
            <h2 id="bTitle" class="serif text-4xl md:text-6xl mb-4 leading-tight">Collection <br><span class="gold-gradient">Elite Numbers</span></h2>
            <p id="bSub" class="text-gray-400 max-w-md text-sm leading-relaxed mb-8">Эксклюзивный доступ к самым редким цифровым активам. Только для тех, кто ценит статус.</p>
            
            <div class="relative max-w-xl">
                <input type="text" id="search" placeholder="Поиск по цифрам..." class="search-input w-full px-8 py-5 rounded-2xl outline-none text-white">
                <div class="absolute right-4 top-1/2 -translate-y-1/2 bg-gold/20 p-2 rounded-lg">
                    <svg class="w-5 h-5 text-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="px-6 pb-24 max-w-7xl mx-auto">
    <div class="flex justify-between items-end mb-8">
        <h3 class="text-xs uppercase tracking-[0.3em] text-gray-500 font-bold">Available lots</h3>
        <div class="h-[1px] flex-grow mx-8 bg-white/5"></div>
    </div>
    
    <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>
</main>

<div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[10000] px-8 py-4 rounded-2xl backdrop-blur-xl border border-white/10 hidden animate__animated animate__fadeInUp"></div>

<div id="orderModal" class="fixed inset-0 z-[1000] bg-black/95 backdrop-blur-xl flex items-center justify-center p-4 hidden">
    <div class="glass-card p-10 rounded-[40px] w-full max-w-md border-gold/20">
        <h2 class="serif text-3xl gold-gradient mb-2">Acquisition</h2>
        <p id="orderInfo" class="text-gray-500 text-sm mb-8"></p>
        <div class="space-y-4">
            <input type="text" id="userName" placeholder="Имя Фамилия" class="search-input w-full p-4 rounded-xl outline-none">
            <input type="tel" id="userPhone" placeholder="+7 (___) ___ __ __" class="search-input w-full p-4 rounded-xl outline-none">
        </div>
        <button onclick="confirmOrder()" class="w-full btn-premium py-5 rounded-2xl mt-8 uppercase text-xs">Подтвердить сделку</button>
        <button onclick="closeModal('orderModal')" class="w-full text-gray-600 text-[10px] mt-4 uppercase tracking-widest">Отмена</button>
    </div>
</div>

<div id="authModal" class="fixed inset-0 z-[1000] bg-black/95 backdrop-blur-xl flex items-center justify-center p-4 hidden">
    <div class="glass-card p-10 rounded-[40px] w-full max-w-md">
        <div class="flex gap-8 mb-8">
            <button id="tabRegister" class="serif text-2xl gold-gradient opacity-100 transition-all">Регистрация</button>
            <button id="tabLogin" class="serif text-2xl text-gray-600 hover:text-white transition-all">Вход</button>
        </div>
        
        <div id="registerForm" class="space-y-4">
            <input type="text" id="regName" placeholder="Логин" class="search-input w-full p-4 rounded-xl outline-none">
            <input type="email" id="regEmail" placeholder="Email" class="search-input w-full p-4 rounded-xl outline-none">
            <input type="password" id="regPassword" placeholder="Пароль" class="search-input w-full p-4 rounded-xl outline-none">
            <button onclick="registerUser()" class="w-full btn-premium py-5 rounded-2xl mt-4 uppercase text-xs">Создать профиль</button>
        </div>

        <div id="loginForm" class="space-y-4 hidden">
            <input type="email" id="loginEmail" placeholder="Email" class="search-input w-full p-4 rounded-xl outline-none">
            <input type="password" id="loginPassword" placeholder="Пароль" class="search-input w-full p-4 rounded-xl outline-none">
            <button onclick="loginUser()" class="w-full btn-premium py-5 rounded-2xl mt-4 uppercase text-xs">Войти</button>
        </div>
        <button onclick="closeModal('authModal')" class="w-full text-gray-600 text-[10px] mt-6 uppercase tracking-widest">Закрыть</button>
    </div>
</div>

<script>
    // Весь ваш JS остается рабочим, я только обновлю функцию render под новый дизайн
    function render(data) {
        const container = document.getElementById('list');
        if(!container) return;
        
        if(!data || data.length === 0) {
            container.innerHTML = `<div class="col-span-full text-center py-20 text-gray-500 serif text-2xl">No items found</div>`;
            return;
        }
        
        container.innerHTML = data.map((item, idx) => `
            <div class="glass-card p-8 animate__animated animate__fadeInUp" style="animation-delay: ${idx * 0.1}s">
                <div class="flex justify-between items-start mb-6">
                    <div class="bg-gold/10 px-3 py-1 rounded-md border border-gold/20">
                        <span class="text-[9px] font-black text-gold uppercase tracking-tighter">${item.op || 'Premium'}</span>
                    </div>
                    <span class="text-[10px] text-gray-600 font-bold uppercase tracking-widest">${item.category || 'Elite'}</span>
                </div>
                
                <h3 class="text-3xl font-light tracking-tighter mb-8 serif">
                    <span class="text-gray-500">+7</span> ${item.num}
                </h3>
                
                <div class="flex justify-between items-center pt-6 border-t border-white/5">
                    <div>
                        <p class="text-[10px] text-gray-500 uppercase mb-1">Price</p>
                        <p class="text-xl font-bold gold-gradient">${Number(item.price).toLocaleString()} ₽</p>
                    </div>
                    <button onclick="openOrder('${item.num}', '${item.price}')" class="btn-premium px-6 py-3 rounded-xl text-[10px]">КУПИТЬ</button>
                </div>
            </div>
        `).join('');
    }

    // [Остальной ваш оригинальный JS код от Firebase до поиска...]
    // (Я сохранил все ваши ID и логику, чтобы ничего не сломалось)
    
    // (Копируйте ваши функции loadNumbers, confirmOrder, registerUser сюда без изменений)
</script>
