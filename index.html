<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        
        /* ГЛАВНЫЙ АНИМИРОВАННЫЙ ФОН */
        body { 
            font-family: 'Manrope', sans-serif; 
            margin: 0; 
            overflow-x: hidden;
            background: linear-gradient(135deg, #000000 0%, #0c0c16 25%, #1a1a0f 50%, #0c0c16 75%, #000000 100%);
            background-size: 400% 400%;
            animation: auroraBackground 20s ease infinite;
            color: #fff;
            min-height: 100vh;
        }

        @keyframes auroraBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Переливающийся текст (золото) */
        .gold-grad { 
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fcf6ba, #bf953f);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-size: 200% auto; animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        /* Кнопки и инпуты */
        .buy-btn { background: linear-gradient(135deg, #bf953f, #fcf6ba); color: #000; font-weight: 900; padding: 14px; border-radius: 18px; width: 100%; text-transform: uppercase; font-size: 11px; transition: 0.2s; box-shadow: 0 4px 15px rgba(191,149,63,0.3); }
        .buy-btn:active { transform: scale(0.96); opacity: 0.8; }
        .input-dark { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 18px; color: #fff; outline: none; text-align: center; font-size: 14px; backdrop-filter: blur(5px); }
        .input-dark:focus { border-color: #bf953f; background: rgba(0,0,0,0.7); }

        /* Вкладки (Glassmorphism) */
        .tab { padding: 10px 20px; border-radius: 100px; font-size: 10px; font-weight: 800; border: 1px solid rgba(255,255,255,0.05); color: rgba(255,255,255,0.4); cursor: pointer; white-space: nowrap; transition: 0.3s; text-transform: uppercase; background: rgba(255,255,255,0.02); backdrop-filter: blur(5px); }
        .tab.active { background: #bf953f; color: #000; border-color: #bf953f; box-shadow: 0 0 15px rgba(191,149,63,0.5); }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* КАРТОЧКА НОМЕРА С ВРАЩАЮЩИМСЯ ЗОЛОТЫМ ОБОДКОМ */
        .neon-card { 
            position: relative; 
            background: rgba(255,255,255,0.03); 
            border-radius: 28px; 
            overflow: hidden; 
            margin-bottom: 15px; 
            cursor: pointer; 
            backdrop-filter: blur(10px);
            transition: 0.3s;
            z-index: 1;
        }
        .neon-card:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(191,149,63,0.3); }
        
        /* Сам вращающийся ободок (ЯРКИЙ) */
        .neon-card::before { 
            content: ''; 
            position: absolute; 
            top: -50%; 
            left: -50%; 
            width: 200%; 
            height: 200%; 
            /* Яркий золотой градиент */
            background: conic-gradient(
                transparent 10%, 
                #bf953f 20%, 
                #fcf6ba 30%, 
                #b38728 40%, 
                transparent 50%, 
                #bf953f 60%, 
                #fcf6ba 70%, 
                #b38728 80%, 
                transparent 90%
            ); 
            animation: rotate 6s linear infinite; 
            z-index: -2;
        }
        
        /* Задний фон карточки, чтобы скрыть лишний градиент */
        .neon-card::after {
            content: '';
            position: absolute;
            inset: 2px; /* Толщина ободка */
            background: rgba(10,10,15,0.98); 
            border-radius: 26px;
            z-index: -1;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .card-inner { position: relative; padding: 20px; z-index: 1; text-align: center; }
        
        /* Модальные окна (Glassmorphism) */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(20px); }
        .modal-content { background: rgba(20,20,25,0.8); border: 1px solid rgba(191,149,63,0.2); rounded-[30px]; width: 100%; max-w-xs; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
    </style>
</head>
<body class="p-4 pb-32">

    <header class="flex justify-between items-center mb-6 pt-2 px-2">
        <h1 class="text-2xl font-black italic gold-grad uppercase tracking-tighter">SIM MARKET</h1>
        <div id="user-info" onclick="openProfile()" class="hidden bg-[#bf953f]/10 px-4 py-2 rounded-full border border-[#bf953f]/20 cursor-pointer flex items-center gap-2 backdrop-blur-sm">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            <span id="user-phone-top" class="text-[10px] font-black text-[#bf953f]">Профиль</span>
        </div>
        <button id="login-btn" onclick="openAuth()" class="text-[10px] font-bold border border-[#bf953f]/30 px-5 py-2 rounded-full uppercase gold-grad backdrop-blur-sm">Вход</button>
    </header>

    <div class="flex gap-2 overflow-x-auto mb-6 no-scrollbar px-2">
        <div class="tab active" onclick="filterOp('ALL', this)">Все номера</div>
        <div class="tab" onclick="filterOp('МТС', this)">МТС</div>
        <div class="tab" onclick="filterOp('БИЛАЙН', this)">Билайн</div>
        <div class="tab" onclick="filterOp('МЕГАФОН', this)">Мегафон</div>
        <div class="tab" onclick="filterOp('ТЕЛЕ2', this)">Tele2</div>
    </div>

    <div id="list" class="max-w-md mx-auto space-y-4"></div>

    <div id="number-menu" class="modal">
        <div class="modal-content space-y-4 p-6">
            <h3 id="menu-num" class="text-3xl font-black text-center text-white italic tracking-tighter"></h3>
            <button onclick="startOrder()" class="buy-btn">Оформить покупку</button>
            <p onclick="closeModals()" class="text-center text-[9px] opacity-40 uppercase font-black cursor-pointer py-2 hover:opacity-100">Назад</p>
        </div>
    </div>

    <div id="order-modal" class="modal">
        <div class="modal-content space-y-4 p-6">
            <h2 class="text-xl font-black text-center gold-grad uppercase">Оформление</h2>
            <input type="text" id="order-name" placeholder="Ваше имя" class="input-dark">
            <input type="tel" id="order-contact" placeholder="Контактный телефон" class="input-dark">
            <button id="confirm-btn" onclick="confirmPurchase()" class="buy-btn">Подтвердить заказ</button>
            <p onclick="closeModals()" class="text-center text-[9px] opacity-40 uppercase font-black cursor-pointer mt-2 hover:opacity-100">Отмена</p>
        </div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="w-full max-w-sm h-[85vh] overflow-y-auto px-6 py-8 modal-content" style="max-width: 340px;">
            <h2 class="text-3xl font-black text-center gold-grad mb-6 uppercase">Кабинет</h2>
            
            <div class="space-y-3 mb-8">
                <h4 class="text-[10px] font-black opacity-40 uppercase ml-2 tracking-widest">История заказов</h4>
                <div id="history-list" class="space-y-3"></div>
            </div>

            <div class="space-y-3 mb-8">
                <h4 class="text-[10px] font-black opacity-40 uppercase ml-2 tracking-widest">Безопасность</h4>
                <button onclick="changeData('pass')" class="w-full py-4 bg-white/5 rounded-2xl text-[11px] uppercase font-bold border border-white/5 hover:bg-white/10 transition">Сменить пароль</button>
                <button onclick="changeData('word')" class="w-full py-4 bg-white/5 rounded-2xl text-[11px] uppercase font-bold border border-white/5 hover:bg-white/10 transition">Сменить кодовое слово</button>
            </div>

            <button onclick="logout()" class="w-full py-4 text-red-500 text-[10px] font-black uppercase opacity-60 hover:opacity-100">Выход из аккаунта</button>
            <p onclick="closeModals()" class="text-center mt-8 text-[9px] opacity-40 font-black cursor-pointer uppercase hover:opacity-100">Закрыть</p>
        </div>
    </div>

    <div id="auth-modal" class="modal">
        <div class="modal-content space-y-4 p-6">
            <h2 id="auth-title" class="text-2xl font-black text-center gold-grad uppercase">Регистрация</h2>
            <input type="tel" id="u-phone" placeholder="Номер телефона" class="input-dark">
            <input type="password" id="u-pass" placeholder="Пароль" class="input-dark">
            <input type="text" id="u-word" placeholder="Кодовое слово" class="input-dark">
            <button id="auth-main-btn" onclick="handleAuth()" class="buy-btn">Продолжить</button>
            <p onclick="toggleAuthMode()" id="auth-toggle" class="text-center text-[10px] opacity-40 uppercase font-black cursor-pointer hover:opacity-100">Уже есть аккаунт? Войти</p>
        </div>
    </div>

    <script>
        const fbCfg = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            authDomain: "nnnmb-a0b52.firebaseapp.com", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com", 
            projectId: "nnnmb-a0b52" 
        };
        firebase.initializeApp(fbCfg);
        const db = firebase.database();

        // TELEGRAM
        const TG_TOKEN = "7936166446:AAGZ752S6LqZ8C_v-m3_zU6WfXnE1wA0z6U";
        const TG_CHAT_ID = "6102604856";

        let user = JSON.parse(localStorage.getItem('sim_user_aurora'));
        let selectedNum = null;
        let isLoginMode = false;
        let currentFilter = 'ALL';
        let allNumbers = {};

        if(user) showUserUI();

        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
        function openAuth() { document.getElementById('auth-modal').style.display = 'flex'; }
        function openProfile() { document.getElementById('profile-modal').style.display = 'flex'; loadHistory(); }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "ВХОД" : "РЕГИСТРАЦИЯ";
            document.getElementById('auth-toggle').innerText = isLoginMode ? "Создать аккаунт" : "Уже есть аккаунт? Войти";
        }

        async function handleAuth() {
            const ph = document.getElementById('u-phone').value.trim();
            const ps = document.getElementById('u-pass').value.trim();
            const wd = document.getElementById('u-word').value.trim();
            const clean = ph.replace(/\D/g, '');
            
            if(!ph || !ps || !wd) return alert("Заполните все поля!");
            if(clean.length < 10) return alert("Введите корректный номер!");

            const userRef = db.ref('users/' + clean);
            const btn = document.getElementById('auth-main-btn');
            btn.disabled = true;

            userRef.once('value', s => {
                const existingData = s.val();

                if(isLoginMode) {
                    if(existingData && existingData.pass === ps && existingData.word === wd) {
                        user = existingData; saveUser();
                    } else { alert("Неверные данные для входа!"); }
                } else {
                    if(s.exists()) {
                        alert("Этот номер уже зарегистрирован! Войдите в аккаунт.");
                        toggleAuthMode();
                    } else {
                        const newData = {phone: ph, pass: ps, word: wd, clean: clean, date: new Date().toLocaleDateString()};
                        userRef.set(newData).then(() => { user = newData; saveUser(); });
                    }
                }
                btn.disabled = false;
            });
        }

        function saveUser() { localStorage.setItem('sim_user_aurora', JSON.stringify(user)); showUserUI(); closeModals(); }
        function showUserUI() { document.getElementById('login-btn').classList.add('hidden'); document.getElementById('user-info').classList.remove('hidden'); }
        function logout() { localStorage.removeItem('sim_user_aurora'); location.reload(); }

        function changeData(type) {
            const label = type === 'pass' ? 'новый пароль' : 'новое кодовое слово';
            const newVal = prompt("Введите " + label + ":");
            if(newVal && newVal.length > 2) {
                const update = {}; update[type] = newVal;
                db.ref('users/' + user.clean).update(update).then(() => {
                    user[type] = newVal;
                    localStorage.setItem('sim_user_aurora', JSON.stringify(user));
                    alert("Данные успешно обновлены!");
                });
            }
        }

        function filterOp(op, el) {
            currentFilter = op.toUpperCase();
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderItems();
        }

        function openNumMenu(num, price) {
            selectedNum = {num, price};
            document.getElementById('menu-num').innerText = "+7 " + num;
            document.getElementById('number-menu').style.display = 'flex';
        }

        function startOrder() {
            if(!user) return openAuth();
            document.getElementById('number-menu').style.display = 'none';
            document.getElementById('order-modal').style.display = 'flex';
        }

        async function confirmPurchase() {
            const name = document.getElementById('order-name').value;
            const contact = document.getElementById('order-contact').value;
            const btn = document.getElementById('confirm-btn');
            if(!name || !contact) return alert("Укажите имя и телефон!");

            btn.disabled = true; btn.innerText = "ОФОРМЛЯЕМ...";
            
            const order = {
                clientPhone: user.phone, clientName: name, clientContact: contact,
                number: selectedNum.num, price: selectedNum.price,
                date: new Date().toLocaleString(), status: 'Новый'
            };

            try {
                await db.ref('orders').push(order);
                await db.ref('user_history/' + user.clean).push(order);
                const text = `🚀 ЗАКАЗ!\n\nНомер: +7 ${order.number}\nЦена: ${order.price} ₽\n\nИмя: ${name}\nТел: ${contact}`;
                await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent(text)}`);
                alert("Заказ принят! Мы скоро свяжемся.");
                closeModals();
            } catch (e) { alert("Ошибка при оформлении."); }
            finally { btn.disabled = false; btn.innerText = "Подтвердить заказ"; }
        }

        function loadHistory() {
            const hList = document.getElementById('history-list');
            db.ref('user_history/' + user.clean).on('value', s => {
                hList.innerHTML = "";
                const data = s.val();
                if(!data) hList.innerHTML = '<p class="opacity-30 text-[10px] text-center py-4 uppercase tracking-widest">История пуста</p>';
                else {
                    Object.values(data).reverse().forEach(h => {
                        hList.innerHTML += `<div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center backdrop-blur-sm">
                            <div><div class="text-xs font-bold text-white">+7 ${h.number}</div><div class="text-[8px] opacity-40 mt-1">${h.date}</div></div>
                            <div class="text-[9px] gold-grad font-black uppercase tracking-tighter">${h.status}</div>
                        </div>`;
                    });
                }
            });
        }

        db.ref('inventory').on('value', s => { allNumbers = s.val() || {}; renderItems(); });

        function renderItems() {
            const list = document.getElementById('list');
            list.innerHTML = "";
            const items = Object.values(allNumbers).reverse();
            
            items.forEach(i => {
                if(currentFilter !== 'ALL' && (i.op || 'SIM').toUpperCase() !== currentFilter) return;
                list.innerHTML += `
                <div class="neon-card" onclick="openNumMenu('${i.num}', '${i.price}')">
                    <div class="card-inner">
                        <div class="text-[8px] font-black opacity-30 uppercase tracking-[3px] mb-2 text-gray-400">${i.op || 'SIM'}</div>
                        <div class="text-3xl font-black italic mb-1 text-white tracking-tighter">+7 ${i.num}</div>
                        <div class="text-xl font-bold gold-grad">${i.price} ₽</div>
                    </div>
                </div>`;
            });
            if(list.innerHTML === "") list.innerHTML = '<p class="text-center opacity-40 text-xs py-10 uppercase tracking-widest">Категория пуста</p>';
        }
    </script>
</body>
</html>
