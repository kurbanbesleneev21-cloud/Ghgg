 <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIM MARKET</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;900&display=swap');

body{
background:#050505;
color:white;
font-family:'Manrope',sans-serif;
-webkit-tap-highlight-color:transparent;
}

.glass{
background:rgba(15,15,15,0.9);
backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,255,255,0.06);
}

.gold-text{
background:linear-gradient(135deg,#fbbf24,#d97706);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.gold-btn{
background:linear-gradient(135deg,#fbbf24,#d97706);
transition:0.25s;
}

.gold-btn:hover{
transform:translateY(-2px);
box-shadow:0 8px 30px rgba(251,191,36,0.3);
}

.line-item{
background:#0b0b0b;
transition:0.25s;
border-bottom:1px solid rgba(255,255,255,0.03);
}

.line-item:hover{
background:#101010;
}

.badge-mini{
font-size:9px;
font-weight:800;
text-transform:uppercase;
color:#888;
border:1px solid rgba(255,255,255,0.08);
padding:2px 6px;
border-radius:6px;
}

.tab-btn{
font-size:11px;
font-weight:800;
text-transform:uppercase;
color:#666;
padding-bottom:12px;
transition:0.25s;
}

.tab-active{
color:#fbbf24;
border-bottom:2px solid #fbbf24;
}

#order-modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.92);
z-index:100;
align-items:center;
justify-content:center;
padding:20px;
}

.modal-box{
background:#0b0b0b;
border:1px solid rgba(255,255,255,0.07);
border-radius:30px;
}

input{
background:#0f0f0f;
border:1px solid #1e1e1e;
}

input:focus{
border-color:#fbbf24;
outline:none;
}

</style>
</head>

<body>

<header class="glass sticky top-0 z-50 p-5 flex justify-between items-center">
<h1 class="text-xl font-black italic">SIM <span class="gold-text">MARKET</span></h1>
<span class="text-xs opacity-40 uppercase">Premium numbers</span>
</header>


<main class="max-w-2xl mx-auto">

<div class="p-4">
<input
id="q"
oninput="draw()"
placeholder="Поиск номера..."
class="w-full p-4 rounded-xl text-sm"
/>
</div>

<div class="flex gap-6 overflow-x-auto px-6 border-b border-white/5">

<button onclick="setFilter('all',this)" class="tab-btn tab-active">Все</button>
<button onclick="setFilter('mts',this)" class="tab-btn">МТС</button>
<button onclick="setFilter('megafon',this)" class="tab-btn">Мегафон</button>
<button onclick="setFilter('beeline',this)" class="tab-btn">Билайн</button>
<button onclick="setFilter('tele2',this)" class="tab-btn">Tele2</button>
<button onclick="setFilter('yota',this)" class="tab-btn">Yota</button>

</div>

<div id="list"></div>

</main>


<div id="order-modal">

<div class="modal-box w-full max-w-sm p-8 space-y-4 relative">

<button onclick="closeModal()" class="absolute right-6 top-6 text-zinc-500">✕</button>

<h2 id="target-num" class="text-3xl font-black text-center"></h2>

<input id="client-fio" placeholder="ФИО полностью" class="w-full p-4 rounded-xl text-sm">

<input id="client-phone" placeholder="Телефон" class="w-full p-4 rounded-xl text-sm">

<div class="grid grid-cols-2 gap-2">

<button onclick="passport.click()" class="p-3 text-xs border border-zinc-800 rounded-xl text-amber-500 font-bold">Паспорт</button>
<button onclick="propiska.click()" class="p-3 text-xs border border-zinc-800 rounded-xl text-amber-500 font-bold">Прописка</button>

<input id="passport" type="file" accept="image/*" class="hidden">
<input id="propiska" type="file" accept="image/*" class="hidden">

</div>

<button onclick="submitOrder()" id="send-btn" class="gold-btn w-full py-4 rounded-xl text-black font-black text-xs">
Оформить заказ
</button>

</div>
</div>


<script>

const TOKEN="YOUR_BOT_TOKEN"
const MY_ID="YOUR_ID"

let db=[]
let activeFilter="all"

async function init(){

try{

const res=await fetch("db.json")
db=await res.json()

draw()

}catch{

document.getElementById("list").innerHTML=
"<div class='p-10 text-center opacity-40'>Ошибка загрузки</div>"

}

}

function setFilter(v,b){

activeFilter=v

document.querySelectorAll(".tab-btn")
.forEach(x=>x.classList.remove("tab-active"))

b.classList.add("tab-active")

draw()

}

function draw(){

const list=document.getElementById("list")

const q=document.getElementById("q").value.toLowerCase()

let filtered=db.filter(i=>{

let num=i.n.toLowerCase()

let op=(i.op||"").toLowerCase()

return num.includes(q)&&(activeFilter==="all"||op===activeFilter)

})

if(!filtered.length){

list.innerHTML="<div class='p-12 text-center opacity-30'>Ничего не найдено</div>"
return

}

list.innerHTML=filtered.map(i=>`

<div class="line-item p-4 flex justify-between items-center">

<div>

<div class="text-lg font-black">${i.n}</div>

<div class="flex gap-2 mt-1">
<span class="badge-mini">${i.op||"SIM"}</span>
<span class="text-xs text-amber-500">${i.tarif||"VIP"}</span>
</div>

</div>

<div class="flex items-center gap-4">

<span class="text-amber-500 font-black">${i.t} ₽</span>

<button
onclick="openModal('${i.n}','${i.t}')"
class="gold-btn w-8 h-8 rounded-lg flex items-center justify-center text-black font-bold"
>

→

</button>

</div>

</div>

`).reverse().join("")

}

function openModal(n,t){

target-num.innerText=n

order-modal.style.display="flex"

window.cN=n
window.cT=t

}

function closeModal(){

order-modal.style.display="none"

}

async function submitOrder(){

let fio=client-fio.value
let phone=client-phone.value

if(!fio||!phone){

alert("Заполните данные")
return

}

let msg=
`Новый заказ
Номер: ${cN}
Цена: ${cT}
Клиент: ${fio}
Телефон: ${phone}`

await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

chat_id:MY_ID,
text:msg

})

})

alert("Заказ отправлен")

closeModal()

}

init()

</script>

</body>
</html>
