     <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM MARKET | 14-14</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #05070a; color: #e2e8f0; font-family: sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .gold-text { background: linear-gradient(135deg, #fcd34d 0%, #b45309 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="pb-10">

    <header class="p-6 sticky top-0 z-50 glass flex justify-between items-center border-b border-white/5">
        <h1 class="text-2xl font-black gold-text uppercase tracking-tighter">SIM MARKET</h1>
        <div class="text-[10px] font-bold text-gray-500 tracking-widest uppercase">Khasavyurt</div>
    </header>

    <main class="max-w-3xl mx-auto p-4 pt-8">
        <div id="list" class="space-y-3">
            <div class="text-center p-10 text-gray-500 animate-pulse">Подключение к базе...</div>
        </div>
    </main>

    <script>
        const BIN_ID = "69c9d640aaba882197a65742"; 
        const MASTER_KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW"; 

        async function loadData() {
            const list = document.getElementById('list');
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                if (!response.ok) throw new Error();
                const resData = await response.json();
                render(resData.record);
            } catch (err) {
                list.innerHTML = `<div class="text-center p-10 text-red-500">Ошибка: Обновите данные в jsonbin</div>`;
            }
        }

        function render(items) {
            const list = document.getElementById('list');
            if (!items || items.length === 0) {
                list.innerHTML = '<div class="text-center p-10 text-gray-500">Список пуст</div>';
                return;
            }
            list.innerHTML = items.map(i => `
                <div class="glass p-5 rounded-2xl flex justify-between items-center border-l-4 ${getBorder(i.op)}">
                    <div>
                        <div class="text-xl font-mono font-bold tracking-tighter">${i.n}</div>
                        <div class="text-[10px] text-gray-400 uppercase font-bold">${i.o}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs text-yellow-600 font-black">от ${i.t}₽</div>
                    </div>
                </div>
            `).join('');
        }

        function getBorder(op) {
            const colors = {
                'megafon': 'border-green-500',
                'beeline': 'border-yellow-400',
                'mts': 'border-red-600',
                'tele2': 'border-gray-800'
            };
            return colors[op] || 'border-white/10';
        }

        window.onload = loadData;
    </script>
</body>
</html>
