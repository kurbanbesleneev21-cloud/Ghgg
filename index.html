 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM MARKET | Регистрация</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(251, 191, 36, 0.3); }
        .step-hidden { display: none; }
    </style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen">

    <div class="max-w-md w-full glass p-8 rounded-3xl shadow-2xl">
        <h1 class="text-3xl font-black text-yellow-500 text-center mb-2 uppercase">SIM MARKET</h1>
        <p class="text-center text-gray-400 text-xs mb-8 uppercase tracking-widest">Система регистрации номеров</p>

        <form id="regForm" class="space-y-6">
            <div id="step1">
                <label class="block text-xs text-gray-500 mb-2 font-bold uppercase">Шаг 1/5: Выбранный номер</label>
                <input type="text" id="chosen_num" placeholder="+7 (___) ___-__-__" class="w-full bg-slate-800 p-4 rounded-xl border border-slate-700 outline-none focus:border-yellow-500 text-white font-bold" required>
                <button type="button" onclick="nextStep(2)" class="w-full bg-yellow-500 text-black font-black py-4 rounded-xl mt-6 uppercase">Далее</button>
            </div>

            <div id="step2" class="step-hidden text-center">
                <label class="block text-xs text-gray-500 mb-4 font-bold uppercase text-left">Шаг 2/5: Фото паспорта (Лицо)</label>
                <div class="border-2 border-dashed border-slate-700 p-8 rounded-2xl bg-slate-800/50 relative cursor-pointer hover:border-yellow-500">
                    <input type="file" id="photo_main" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" required onchange="updateLabel('l1')">
                    <span id="l1" class="text-sm text-gray-400 font-medium">📸 Пришлите фото разворота</span>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-4">
                    <button type="button" onclick="nextStep(1)" class="bg-slate-700 text-white py-3 rounded-xl font-bold uppercase">Назад</button>
                    <button type="button" onclick="nextStep(3)" class="bg-yellow-500 text-black py-3 rounded-xl font-bold uppercase">Далее</button>
                </div>
            </div>

            <div id="step3" class="step-hidden text-center">
                <label class="block text-xs text-gray-500 mb-4 font-bold uppercase text-left">Шаг 3/5: Фото прописки</label>
                <div class="border-2 border-dashed border-slate-700 p-8 rounded-2xl bg-slate-800/50 relative cursor-pointer hover:border-yellow-500">
                    <input type="file" id="photo_reg" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" required onchange="updateLabel('l2')">
                    <span id="l2" class="text-sm text-gray-400 font-medium">🏠 Фото страницы с адресом</span>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-4">
                    <button type="button" onclick="nextStep(2)" class="bg-slate-700 text-white py-3 rounded-xl font-bold uppercase">Назад</button>
                    <button type="button" onclick="nextStep(4)" class="bg-yellow-500 text-black py-3 rounded-xl font-bold uppercase">Далее</button>
                </div>
            </div>

            <div id="step4" class="step-hidden">
                <label class="block text-xs text-gray-500 mb-2 font-bold uppercase">Шаг 4/5: Ваши ФИО полностью</label>
                <input type="text" id="user_name" placeholder="Иванов Иван Иванович" class="w-full bg-slate-800 p-4 rounded-xl border border-slate-700 outline-none focus:border-yellow-500 text-white" required>
