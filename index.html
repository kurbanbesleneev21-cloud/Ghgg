<div id="chat-wrapper" class="fixed bottom-24 right-6 z-[100]">
    <button onclick="toggleChat()" class="w-14 h-14 bg-amber-500 rounded-full shadow-2xl flex items-center justify-center animate-bounce active:scale-90 transition-all">
        <span id="chat-icon" class="text-2xl">💬</span>
    </button>

    <div id="chat-window" class="hidden absolute bottom-16 right-0 w-[320px] h-[450px] glass rounded-[2rem] border border-white/10 flex flex-col overflow-hidden shadow-2xl">
        <div class="p-4 border-b border-white/5 flex justify-between items-center bg-amber-500/10">
            <span class="text-xs font-black uppercase tracking-widest text-amber-500">Поддержка SIM MARKET</span>
            <button onclick="toggleChat()" class="text-zinc-500 text-lg">&times;</button>
        </div>
        
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-[11px] no-scrollbar">
            <div class="bg-zinc-800/50 p-3 rounded-2xl rounded-tl-none border border-white/5">
                Здравствуйте! 👋 Есть вопросы по номерам или тарифам? Пишите сюда!
            </div>
        </div>

        <div class="p-4 border-t border-white/5 bg-zinc-900/50">
            <div class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Ваш вопрос..." class="flex-1 bg-zinc-800 p-3 rounded-xl border border-white/5 outline-none text-[11px]">
                <button onclick="sendChatMessage()" class="bg-amber-500 text-black px-4 rounded-xl font-bold">></button>
            </div>
        </div>
    </div>
</div>

<script>
    // ЛОГИКА ЧАТА ПОДДЕРЖКИ
    function toggleChat() {
        const win = document.getElementById('chat-window');
        win.classList.toggle('hidden');
        document.getElementById('chat-icon').innerText = win.classList.contains('hidden') ? '💬' : '✕';
    }

    async function sendChatMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        // Отображаем сообщение клиента
        const msgDiv = document.getElementById('chat-messages');
        msgDiv.innerHTML += `<div class="bg-amber-500/20 p-3 rounded-2xl rounded-tr-none border border-amber-500/20 ml-auto text-right text-white">${text}</div>`;
        input.value = '';
        msgDiv.scrollTop = msgDiv.scrollHeight;

        // Отправляем в Telegram
        // Добавляем префикс [CHAT], чтобы ты знал, что это из чата
        const chatMsg = `💬 СООБЩЕНИЕ ИЗ ЧАТА\n\nТекст: ${text}\n\nЧтобы ответить, используйте функцию 'Reply' (Ответить) в Telegram.`;
        
        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chat_id: CHAT_ID, text: chatMsg })
            });
        } catch (e) { console.error("Ошибка чата"); }
    }

    // Слушатель для ответов из Telegram (Простая версия)
    // В бесплатной версии без сервера "слушать" ответы сложнее, 
    // поэтому для реальных ответов в реальном времени обычно нужен простой скрипт-прослойка.
    // Но ты можешь просто настроить в боте "Reply", и ты получишь уведомление.
</script>
