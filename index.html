<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | LUXURY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        
        body { 
            background: #050505; 
            color: #fff; 
            font-family: 'Manrope', sans-serif; 
            margin: 0; 
            overflow-x: hidden;
        }

        /* Золотой переливающийся логотип */
        .logo-shine {
            font-weight: 800; font-size: 32px; letter-spacing: -1px; text-transform: uppercase;
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fcf6ba, #bf953f);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite; font-style: italic;
        }
        @keyframes shine { to { background-position: 200% center; } }

        /* Стеклянные карточки */
        .glass-card { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 24px; 
            padding: 20px; 
            transition: 0.3s; 
        }

        .buy-btn { 
            background: #fff; 
            color: #000; 
            font-weight: 800; 
            font-size: 11px; 
            text-transform: uppercase; 
            padding: 16px; 
            border-radius: 14px; 
            width: 100%; 
            border: none; 
            cursor: pointer; 
        }

        .tab-btn { 
            background: rgba(255,255,255,0.02); 
            border: 1px solid rgba(255,255,255,0.05); 
            padding: 10px 18px; 
            border-radius: 12px; 
            font-size: 10px; 
            font-weight: 800; 
            text-transform: uppercase; 
            color: #71717a; 
            white-space: nowrap; 
        }
        .tab-active { background: #fff !important; color: #000 !important; }

        .input-luxury { 
            background: #0f0f0f; 
            border: 1px solid #1a1a1a; 
            border-radius: 18px; 
            padding: 18px; 
            width: 100%; 
            color: #fff; 
            text-align: center; 
            outline: none; 
        }

        #order-modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            z-index: 100; 
            background: rgba(0,0,0,0.98); 
            backdrop-filter: blur(10px); 
            align-items: center; 
            justify-content: center; 
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <header class="flex flex-col items-center py-12 border-b border-white/5">
        <h1 class="logo-shine">SIM MARKET</h1>
        <p class="text-[10px] font-bold opacity-30 tracking-[5px] mt-2 uppercase text-center">Elite Phone Numbers</p>
    </header>

    <main class="max-w-md mx-auto p-6">
        <input type="text" id="q" oninput="draw()" placeholder="Поиск по цифрам..." class="input-luxury mb-8">
        
        <div class="flex gap-2 overflow-x-auto no-scrollbar mb-10 pb-2">
            <button onclick="setFilter('all', this)" class="tab-btn tab-active">Все</button>
            <button onclick="setFilter('mts', this)" class="tab-btn">МТС</button>
            <button onclick="setFilter('megafon', this)" class="tab-btn">Мегафон</button>
            <button onclick="setFilter('beeline', this)" class="tab-btn">Билайн</button>
            <button onclick="setFilter('yota', this)" class="tab-btn">Yota</button>
            <button onclick="setFilter('tele2', this)" class="tab-btn">Tele2</button>
        </div>

        <div id="list" class="space-y-4">
            <div class="text-center py-20 opacity-20 uppercase font-bold text-[10px] tracking-widest animate-pulse">Загрузка коллекции...</div>
        </div>
    </main>

    <div id="order-modal">
        <div class="glass-card w-[92%] relative text-center border-white/10">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-xl opacity-30">✕</button>
            <h3 class="text-[10px] font-bold text-amber-500 uppercase tracking-widest mb-4">Бронирование</h3>
            <p id="selected-num" class="text-3xl font-black mb-8 italic tracking-tighter"></p>
            <form id="tg-form" class="space-y-4">
                <input type="text" id="fio" placeholder="Ваше ФИО" class="input-luxury" required>
