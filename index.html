<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #050505; color: #fff; margin: 0; }
        .gold-grad { background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .buy-btn { background: linear-gradient(135deg, #bf953f, #fcf6ba); color: #000; font-weight: 900; padding: 16px; border-radius: 20px; width: 100%; text-transform: uppercase; font-size: 11px; }
        .input-dark { width: 100%; background: #111; border: 1px solid #333; padding: 16px; border-radius: 20px; color: #fff; outline: none; font-size: 16px; }
        .neon-card { position: relative; background: rgba(191,149,63,0.1); border-radius: 28px; padding: 1.5px; overflow: hidden; margin-bottom: 20px; }
        .neon-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, #bf953f, transparent, #fcf6ba, transparent); animation: rotate 4s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .card-inner { position: relative; background: #0d0d0d; border-radius: 27px; padding: 25px; z-index: 1; text-align: center; }
    </style>
</head>
<body class="p-4 pb-32">

    <header class="flex justify-between items-center mb-8 pt-4 px-2">
        <h1 class="text-2xl font-black italic gold-grad uppercase">SIM MARKET</h1>
        <button id="auth-btn" onclick="openAuth()" class="text-[10px] font-bold border border-[#bf953f]/40 px-6 py-2.5 rounded-full uppercase gold-grad">Вход</button>
    </header>

    <div id="list" class="max-w-md mx-auto"></div>

    <div id="auth-modal" class="fixed inset-0 bg-black/98 z-[7000] hidden items-center justify-center p-8 backdrop-blur-xl">
        <div class="w-full max-w-xs space-y-6">
            <h2 id="atitle" class="text-3xl font-black text-center gold-grad">ВХОД</h2>
            <div id="fields" class="space-y-4">
                <input type="tel" id="aphone" placeholder="8928..." class="input-dark">
                <input type="tel" id="apass" placeholder="Пароль" class="input-dark">
            </div>
            <div id="code-box" class="hidden text-center space-y-4">
                <p class="text-[10px] font-black text-[#bf953f] uppercase">Ждите звонка...<br>Введите последние 4 цифры</p>
                <input type="number" id="acode" placeholder="0000" class="input-dark text-center tracking-[20px] text-2xl font-black">
            </div>
            <button id="main-btn" onclick="handleAuth()" class="buy-btn">Продолжить</button>
            <p id="toggle" onclick="swap()" class="text-center text-[10px] opacity-40 uppercase font-black cursor-pointer py-2">Регистрация</p>
            <p onclick="closeAuth()" class="text-center text-[9px] opacity-20 uppercase font-black cursor-pointer">Закрыть</p>
        </div>
    </div>

    <script>
        const API_ID = "C1E31980-AF45-CDCF-0DE2-F6B278C69D76";
        
        const fbCfg = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            authDomain: "nnnmb-a0b52.firebaseapp.com", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com", 
            projectId: "nnnmb-a0b52" 
        };
        firebase.initializeApp(fbCfg);
        const db = firebase.database();

        let isReg = false;
        let callCode = null;
        let authTimeout = null;

        function openAuth() { document.getElementById('auth-modal').style.display = 'flex'; }
        function closeAuth() { document.getElementById('auth-modal').style.display = 'none'; }
        function swap() {
            isReg = !isReg;
            document.getElementById('atitle').innerText = isReg ? "РЕГИСТРАЦИЯ" : "ВХОД";
            document.getElementById('code-box').classList.add('hidden');
            document.getElementById('main-btn').innerText = "Продолжить";
            callCode = null;
        }

        // Функция-приемник ответа от SMS.RU
        window.processSms = function(data) {
            clearTimeout(authTimeout);
            const btn = document.getElementById('main-btn');
            btn.disabled = false;
            
            if (data.status === "OK") {
                callCode = data.code;
                document.getElementById('code-box').classList.remove('hidden');
                btn.innerText = "ПОДТВЕРДИТЬ";
            } else {
                alert("Ошибка SMS.RU: " + data.status_text);
                btn.innerText = "Продолжить";
            }
        };

        async function handleAuth() {
            const ph = document.getElementById('aphone').value.trim();
            const ps = document.getElementById('apass').value.trim();
            const btn = document.getElementById('main-btn');
            const cleanPh = ph.replace(/\D/g, '');

            if(!ph || !ps) return alert("Введите номер и пароль!");

            if(isReg) {
                if(!callCode) {
                    btn.innerText = "СВЯЗЬ С СЕРВЕРОМ...";
                    btn.disabled = true;

                    // Если через 15 сек нет ответа - сбрасываем
                    authTimeout = setTimeout(() => {
                        if (btn.disabled) {
                            btn.disabled = false;
                            btn.innerText = "Продолжить";
                            alert("Сервер не ответил. Проверьте баланс или попробуйте позже.");
                        }
                    }, 15000);

                    // JSONP метод для обхода CORS блокировок
                    const script = document.createElement('script');
                    script.src = `https://sms.ru/code/call?phone=${cleanPh}&api_id=${API_ID}&format=json&callback=processSms`;
                    document.body.appendChild(script);
                } else {
                    if(document.getElementById('acode').value == callCode) {
                        db.ref('users/' + cleanPh).set({phone: ph, pass: ps}).then(() => location.reload());
                    } else { alert("Неверный код!"); }
                }
            } else {
                btn.innerText = "ВХОД...";
                db.ref('users/' + cleanPh).once('value', s => {
                    const d = s.val();
                    if(d && d.pass === ps) location.reload();
                    else { alert("Ошибка! Проверьте данные."); btn.innerText = "Продолжить"; }
                });
            }
        }

        // Загрузка номеров
        db.ref('inventory').on('value', s => {
            const list = document.getElementById('list'); list.innerHTML = "";
            const items = s.val() || {};
            Object.keys(items).reverse().forEach(id => {
                const i = items[id];
                list.innerHTML += `<div class="neon-card"><div class="card-inner">
                    <div class="text-3xl font-black italic text-white mb-2">+7 ${i.num}</div>
                    <div class="text-xl font-bold gold-grad mb-6">${i.price} ₽</div>
                    <button class="buy-btn" onclick="openAuth()">Купить</button>
                </div></div>`;
            });
        });
    </script>
</body>
</html>
