<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-MARKET | EXCLUSIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --bg: #080808; }
        body { background-color: var(--bg); color: #fff; font-family: 'Manrope', sans-serif; overflow-x: hidden; }
        .serif { font-family: 'Cormorant Garamond', serif; }
        .gold-gradient { background: linear-gradient(135deg, #f3e2bb 0%, #c5a059 50%, #8e6d2f 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-card { background: rgba(255,255,255,0.02); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.4s; }
        .glass-card:hover { border-color: var(--gold); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn-premium { background: #fff; color: #000; font-weight: 800; transition: all 0.3s; cursor: pointer; }
        .btn-premium:hover { background: var(--gold); transform: scale(1.05); }
        .search-input { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: #fff; outline: none; }
        #toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 1rem 2rem; border-radius: 1rem; display: none; }
    </style>
</head>
<body>

<div id="preloader" class="fixed inset-0 z-[9999] bg-[#000] flex flex-col items-center justify-center transition-opacity duration-700">
    <h1 class="serif text-5xl gold-gradient mb-4 animate__animated animate__pulse animate__infinite">S-MARKET</h1>
    <div class="w-48 h-[1px] bg-white/10 relative overflow-hidden">
        <div id="progress" class="absolute inset-0 bg-gold w-0 transition-all duration-300"></div>
    </div>
</div>

<nav class="sticky top-0 z-50 px-6 py-4 backdrop-blur-md border-b border-white/5 bg-black/50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div>
            <span class="serif text-2xl font-bold gold-gradient tracking-widest">S-MARKET</span>
        </div>
        <div id="authButton" onclick="openAuthModal()" class="cursor-pointer flex items-center gap-2">
            <span id="authLabel" class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Вход</span>
            <div class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></div>
        </div>
    </div>
</nav>

<header class="px-6 pt-10 pb-6 max-w-7xl mx-auto">
    <div class="relative rounded-[30px] overflow-hidden p-10 border border-white/5 bg-gradient-to-br from-[#111] to-black">
        <h2 id="bTitle" class="serif text-4xl md:text-5xl mb-2 gold-gradient">Exclusive Selection</h2>
        <p id="bSub" class="text-gray-500 text-sm mb-8">Элитные номера для вашего статуса</p>
        <div class="relative max-w-md">
            <input type="text" id="search" placeholder="Поиск номера..." class="search-input w-full px-6 py-4 rounded-xl">
        </div>
    </div>
</header>

<main class="px-6 pb-20 max-w-7xl mx-auto">
    <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</main>

<div id="orderModal" class="fixed inset-0 z-[1000] bg-black/90 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="glass-card p-8 rounded-[30px] w-full max-w-md">
        <h2 class="serif text-2xl gold-gradient mb-1">Оформление</h2>
        <p id="orderInfo" class="text-gray-500 text-xs mb-6"></p>
        <div class="space-y-4">
            <input type="text" id="userName" placeholder="Ваше Имя" class="search-input w-full p-4 rounded-xl">
            <input type="tel" id="userPhone" placeholder="Телефон" class="search-input w-full p-4 rounded-xl">
        </div>
        <button onclick="confirmOrder()" class="w-full btn-premium py-4 rounded-xl mt-6 uppercase text-xs">Купить номер</button>
        <button onclick="closeModal('orderModal')" class="w-full text-gray-600 text-[10px] mt-4 uppercase">Закрыть</button>
    </div>
</div>

<div id="authModal" class="fixed inset-0 z-[1000] bg-black/90 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="glass-card p-8 rounded-[30px] w-full max-w-md">
        <div class="flex gap-4 mb-6 border-b border-white/5">
            <button id="tabRegister" class="pb-2 text-gold border-b border-gold font-bold">Регистрация</button>
            <button id="tabLogin" class="pb-2 text-gray-500 font-bold">Вход</button>
        </div>
        <div id="registerForm" class="space-y-3">
            <input type="text" id="regName" placeholder="Имя" class="search-input w-full p-4 rounded-xl">
            <input type="email" id="regEmail" placeholder="Email" class="search-input w-full p-4 rounded-xl">
            <input type="password" id="regPassword" placeholder="Пароль" class="search-input w-full p-4 rounded-xl">
            <button onclick="registerUser()" class="w-full btn-premium py-4 rounded-xl mt-2">СОЗДАТЬ</button>
        </div>
        <div id="loginForm" class="space-y-3 hidden">
            <input type="email" id="loginEmail" placeholder="Email" class="search-input w-full p-4 rounded-xl">
            <input type="password" id="loginPassword" placeholder="Пароль" class="search-input w-full p-4 rounded-xl">
            <button onclick="loginUser()" class="w-full btn-premium py-4 rounded-xl mt-2">ВОЙТИ</button>
        </div>
        <button onclick="closeModal('authModal')" class="w-full text-gray-600 text-[10px] mt-6">ЗАКРЫТЬ</button>
    </div>
</div>

<div id="toast"></div>

<script>
    // КОНФИГ
    const firebaseConfig = {
        apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44",
        databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let numbers = [];
    let selected = null;
    let currentUser = null;

    // СКРЫТИЕ ПРЕЛОАДЕРА
    function hidePreloader() {
        const p = document.getElementById('preloader');
        if(!p) return;
        document.getElementById('progress').style.width = '100%';
        setTimeout(() => {
            p.style.opacity = '0';
            setTimeout(() => p.style.display = 'none', 700);
        }, 500);
    }

    // ЗАПУСК
    window.addEventListener('load', () => {
        setTimeout(hidePreloader, 3000); // Страховка
        initAuth();
    });

    async function initAuth() {
        const saved = localStorage.getItem('smarket_user');
        if(saved) {
            try {
                const data = JSON.parse(saved);
                const snap = await db.ref(`users/${data.uid}`).once('value');
                if(snap.exists()) {
                    currentUser = {...snap.val(), uid: data.uid};
                }
            } catch(e) {}
        }
        updateUI();
        loadData();
    }

    function loadData() {
        db.ref('inventory').on('value', snap => {
            numbers = [];
            if(snap.exists()) {
                snap.forEach(c => { numbers.push(c.val()); });
            } else {
                numbers = [
                    {num: "999-000-11-11", price: 15000, op: "BEELINE", category: "GOLD"},
                    {num: "900-777-77-77", price: 85000, op: "MTS", category: "VIP"}
                ];
            }
            render(numbers);
            hidePreloader();
        });
    }

    function render(data) {
        const container = document.getElementById('list');
        container.innerHTML = data.map((item, i) => `
            <div class="glass-card p-6 rounded-[24px] animate__animated animate__fadeInUp" style="animation-delay: ${i*0.1}s">
                <div class="flex justify-between items-start mb-4">
                    <span class="text-[9px] text-gold font-bold tracking-widest uppercase">${item.op || 'Premium'}</span>
                    <span class="text-[9px] text-gray-600 uppercase">${item.category || 'Elite'}</span>
                </div>
                <h3 class="serif text-3xl mb-6 tracking-tighter">+7 ${item.num}</h3>
                <div class="flex justify-between items-center border-t border-white/5 pt-4">
                    <span class="font-bold gold-gradient text-lg">${Number(item.price).toLocaleString()} ₽</span>
                    <button onclick="openOrder('${item.num}', '${item.price}')" class="btn-premium px-5 py-2 rounded-lg text-[10px]">КУПИТЬ</button>
                </div>
            </div>
        `).join('');
    }

    // ЛОГИКА ОКРЫТИЯ МОДАЛОК
    window.openOrder = (num, price) => {
        if(!currentUser) return openAuthModal();
        selected = {num, price};
        document.getElementById('orderInfo').innerText = `Лот: +7 ${num} | Цена: ${price} ₽`;
        document.getElementById('orderModal').style.display = 'flex';
    };

    window.confirmOrder = async () => {
        const name = document.getElementById('userName').value;
        const phone = document.getElementById('userPhone').value;
        if(!name || !phone) return showToast("Заполните данные", false);

        const msg = `🛍 НОВЫЙ ЗАКАЗ\n👤 ${name}\n📞 ${phone}\n💎 Номер: ${selected.num}`;
        
        try {
            await fetch(`https://api.telegram.org/bot8624578892:AAEr7CLID8dkEM0zCPAoIOkn6anZff8w2pE/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: '8768514374', text: msg})
            });
            showToast("Заказ отправлен!", true);
            closeModal('orderModal');
        } catch(e) { showToast("Ошибка сети", false); }
    };

    window.registerUser = async () => {
        const n = document.getElementById('regName').value;
        const e = document.getElementById('regEmail').value;
        const p = document.getElementById('regPassword').value;
        if(!n || !e || p.length < 4) return showToast("Проверьте поля", false);

        const uid = btoa(e).replace(/[^a-z]/g, '').slice(0,10);
        await db.ref(`users/${uid}`).set({name: n, email: e, password: p});
        currentUser = {name: n, uid};
        localStorage.setItem('smarket_user', JSON.stringify({uid, email: e}));
        updateUI();
        closeModal('authModal');
    };

    window.loginUser = async () => {
        const e = document.getElementById('loginEmail').value;
        const p = document.getElementById('loginPassword').value;
        const snap = await db.ref('users').once('value');
        let found = null;
        snap.forEach(c => { if(c.val().email === e && c.val().password === p) found = {...c.val(), uid: c.key}; });
        
        if(found) {
            currentUser = found;
            localStorage.setItem('smarket_user', JSON.stringify({uid: found.uid, email: e}));
            updateUI();
            closeModal('authModal');
        } else showToast("Ошибка входа", false);
    };

    window.openAuthModal = () => document.getElementById('authModal').style.display = 'flex';
    window.closeModal = (id) => document.getElementById(id).style.display = 'none';

    function updateUI() {
        document.getElementById('authLabel').innerText = currentUser ? currentUser.name : 'Account';
    }

    function showToast(m, s) {
        const t = document.getElementById('toast');
        t.innerText = m;
        t.style.background = s ? '#c5a059' : '#b91c1c';
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    // ПЕРЕКЛЮЧЕНИЕ ТАБОВ
    document.getElementById('tabLogin').onclick = () => {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('tabLogin').className = 'pb-2 text-gold border-b border-gold font-bold';
        document.getElementById('tabRegister').className = 'pb-2 text-gray-500 font-bold';
    };
    document.getElementById('tabRegister').onclick = () => {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('tabRegister').className = 'pb-2 text-gold border-b border-gold font-bold';
        document.getElementById('tabLogin').className = 'pb-2 text-gray-500 font-bold';
    };

    // ПОИСК
    document.getElementById('search').oninput = (e) => {
        const q = e.target.value.toLowerCase();
        render(numbers.filter(n => n.num.includes(q)));
    };
</script>

</body>
</html>
