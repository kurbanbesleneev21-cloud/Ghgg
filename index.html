.<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIM MARKET</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background: radial-gradient(circle at top,#0f172a,#020617);
color:white;
font-family:system-ui;
overflow-x:hidden;
}

/* animated background */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 30%,rgba(255,215,0,0.08),transparent 40%),
radial-gradient(circle at 80% 70%,rgba(59,130,246,0.08),transparent 40%);
animation:bgMove 15s infinite alternate;
z-index:-1;
}

@keyframes bgMove{
0%{transform:translateY(0)}
100%{transform:translateY(-80px)}
}

/* glass */

.glass{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.08);
}

/* header */

.header{
background:rgba(2,6,23,0.6);
backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,255,255,0.05);
}

/* cards */

.card{
transition:.35s;
}

.card:hover{
transform:translateY(-6px) scale(1.02);
box-shadow:
0 20px 40px rgba(0,0,0,0.6),
0 0 25px rgba(255,215,0,0.2);
}

.vip{
border:1px solid rgba(255,215,0,0.4);
background:rgba(255,215,0,0.05);
}

/* gold text */

.gold{
background:linear-gradient(135deg,#FFD700,#FF8C00);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* button */

.btn{
background:linear-gradient(135deg,#facc15,#f59e0b);
color:black;
font-weight:800;
transition:.25s;
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 0 25px rgba(255,200,0,0.5);
}

/* search */

.search{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
}

input{
outline:none;
}

</style>
</head>

<body class="pb-20">

<header class="header sticky top-0 z-50 px-6 py-5 flex justify-between items-center">

<div class="text-2xl font-black gold tracking-tight">
SIM MARKET
</div>

<div class="text-xs uppercase text-gray-400 tracking-widest">
premium numbers
</div>

</header>


<main class="max-w-4xl mx-auto p-6 space-y-6">

<!-- stats -->

<div class="grid grid-cols-3 gap-4">

<div class="glass p-4 rounded-xl text-center">
<div class="text-xl font-bold" id="count">0</div>
<div class="text-xs text-gray-400 uppercase">номеров</div>
</div>

<div class="glass p-4 rounded-xl text-center">
<div class="text-xl font-bold gold">VIP</div>
<div class="text-xs text-gray-400 uppercase">категория</div>
</div>

<div class="glass p-4 rounded-xl text-center">
<div class="text-xl font-bold">24/7</div>
<div class="text-xs text-gray-400 uppercase">оформление</div>
</div>

</div>

<!-- search -->

<div class="glass p-4 rounded-xl flex gap-3">

<input
id="search"
placeholder="поиск номера..."
class="search w-full p-3 rounded-lg text-sm"
/>

<select id="operator" class="search p-3 rounded-lg text-sm">

<option value="">все операторы</option>
<option value="mts">МТС</option>
<option value="megafon">Мегафон</option>
<option value="beeline">Билайн</option>
<option value="tele2">Tele2</option>

</select>

</div>


<!-- list -->

<div id="list" class="space-y-4"></div>

</main>



<!-- modal -->

<div id="modal" style="display:none"
class="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-6">

<div class="glass w-full max-w-md p-8 rounded-3xl space-y-5">

<h2 class="text-xl font-bold gold">Оформление номера</h2>

<div id="target-num" class="text-lg font-mono"></div>

<form id="regForm" class="space-y-4">

<input id="fio" placeholder="ФИО" class="w-full p-3 rounded-lg glass">

<input id="client_phone" placeholder="Телефон" class="w-full p-3 rounded-lg glass">

<input type="file" id="photo_pass">

<input type="file" id="photo_reg">

<button class="btn w-full py-3 rounded-xl">
ОТПРАВИТЬ
</button>

<button type="button" onclick="closeM()" class="w-full text-xs text-gray-400">
закрыть
</button>

</form>

</div>

</div>



<script>

const BIN_ID="69c9d640aaba882197a65742"
const MASTER_KEY="$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW"

let items=[]
let selectedNum=""

async function loadData(){

const r=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{
headers:{'X-Master-Key':MASTER_KEY}
})

const data=await r.json()

items=data.record||[]

document.getElementById("count").innerText=items.length

render(items)

}

function render(data){

const list=document.getElementById("list")

list.innerHTML=data.map(i=>{

const vip=i.cat==="vip"||i.cat==="gold"

return`

<div onclick="openM('${i.n}')"
class="card glass p-5 rounded-2xl flex justify-between cursor-pointer ${vip?'vip':''}">

<div>

<div class="flex items-center gap-2">

<div class="text-xl font-mono font-bold">${i.n}</div>

${vip?`<span class="text-[9px] bg-yellow-500 text-black px-2 py-0.5 rounded uppercase font-bold">${i.cat}</span>`:''}

</div>

<div class="text-xs text-gray-400 mt-1 uppercase">
${i.o}
</div>

</div>

<div class="text-right">

<div class="text-lg font-bold gold">${i.t}₽</div>

<div class="text-[10px] text-gray-500 uppercase">купить</div>

</div>

</div>

`

}).reverse().join("")

}

document.getElementById("search").oninput=filter
document.getElementById("operator").onchange=filter

function filter(){

const s=document.getElementById("search").value.toLowerCase()
const o=document.getElementById("operator").value

const filtered=items.filter(i=>{

return(!s||i.n.includes(s))&&(!o||i.op===o)

})

render(filtered)

}

function openM(num){

selectedNum=num
document.getElementById("target-num").innerText=num
document.getElementById("modal").style.display="flex"

}

function closeM(){

document.getElementById("modal").style.display="none"

}

window.onload=loadData

</script>

</body>
</html>
