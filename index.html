<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #0a0a0a; color: #fff; margin: 0; overflow-x: hidden; }
        .gold-grad { background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-dark { width: 100%; background: #151515; border: 1px solid #333; padding: 15px; border-radius: 15px; color: #fff; outline: none; font-size: 16px; }
        .btn-gold { background: linear-gradient(135deg, #bf953f, #fcf6ba); color: #000; font-weight: 800; padding: 15px; border-radius: 15px; width: 100%; text-transform: uppercase; font-size: 12px; }
        .neon-card { background: #0d0d0d; border: 1px solid rgba(191,149,63,0.2); border-radius: 25px; padding: 25px; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body class="p-5 pb-32">

    <header class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-black italic gold-grad">SIM MARKET</h1>
            <p class="text-[8px] tracking-[3px] opacity-30 uppercase font-bold">Premium Numbers</p>
        </div>
        <button id="auth-btn" onclick="openAuth()" class="text-[10px] font-bold border border-[#bf953f]/50 px-5 py-2 rounded-full uppercase gold-grad">Вход</button>
        <div id="user-info" class="hidden text-[10px] font-bold text-emerald-400 border border-emerald-400/30 px-4 py-2 rounded-full uppercase"></div>
    </header>

    <div id="list" class="max-w-md mx-auto space-y-4">
        </div>

    <div id="auth-modal" class="fixed inset-0 bg-black/95 z-[5000] hidden items-center justify-center p-6 backdrop-blur-md">
        <div class="w-full max-w-xs space-y-6">
            <h2 id="atitle" class="text-3xl font-black text-center gold-grad">ВХОД</h2>
            
            <div id="main-fields" class="space-y-4">
                <input type="tel" id="aphone" placeholder="Номер (+7...)" class="input-dark">
                <input type="tel" id="apass" placeholder="Пароль (6 цифр)" class="input-dark" maxlength="12">
            </div>

            <div id="code-box" class="hidden">
                <p class="text-[11px] text-center text-yellow-500 mb-3 uppercase font-bold">
                    Вам поступит звонок.<br>Введите последние 4 цифры:
                </p>
                <input type="number" id="acode" placeholder="0000" class="input-dark text-center tracking-[15px] text-xl">
            </div>

            <button id="main-btn" onclick="handleAction()" class="btn-gold">Продолжить</button>
            
            <p id="toggle" onclick="swap()" class="text-center text-[10px] opacity-40 uppercase cursor-pointer">Нет аккаунта? Регистрация</p>
            <p onclick="closeAuth()" class="text-center text-[9px] opacity-20 uppercase cursor-pointer">Закрыть</p>
        </div>
    </div>

    <script>
        // ТВОИ НАСТРОЙКИ
        const SMS_API_KEY = "C1E31980-AF45-CDCF-0DE2-F6B278C69D76"; 
        const TG_TOKEN = "8569235049:AAEsaW4ME-Ql6036i04tIbj--IPNT6JdroE"; 
        const TG_ID = "8768514374";

        const cfg = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            authDomain: "nnnmb-a0b52.firebaseapp.com", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com", 
            projectId: "nnnmb-a0b52" 
        };
        firebase.initializeApp(cfg);
        const db = firebase.database();

        let isReg = false;
        let flashCode = null;
        let currentUser = JSON.parse(localStorage.getItem('sim_user'));

        function openAuth() { document.getElementById('auth-modal').style.display='flex'; }
        function closeAuth() { document.getElementById('auth-modal').style.display='none'; }
        
        function swap() {
            isReg = !isReg;
            document.getElementById('atitle').innerText = isReg ? "РЕГИСТРАЦИЯ" : "ВХОД";
            document.getElementById('toggle').innerText = isReg ? "Есть аккаунт? Войти" : "Нет аккаунта? Регистрация";
            document.getElementById('code-box').classList.add('hidden');
            document.getElementById('main-btn').innerText = "Продолжить";
            flashCode = null;
        }

        async function handleAction() {
            const phone = document.getElementById('aphone').value.trim();
            const pass = document.getElementById('apass').value.trim();

            if(!phone || !pass) return alert("Заполните поля!");
            if(pass.length < 6) return alert("Минимум 6 цифр в пароле!");

            if(isReg) {
                if(!flashCode) {
                    const cleanPhone = phone.replace(/\D/g, '');
                    try {
                        const res = await fetch(`https://sms.ru/code/call?phone=${cleanPhone}&api_id=${SMS_API_KEY}`);
                        const data = await res.json();
                        if(data.status === "OK") {
                            flashCode = data.code;
                            document.getElementById('code-box').classList.remove('hidden');
                            document.getElementById('main-btn').innerText = "Подтвердить";
                        } else { alert("Ошибка: " + data.status_text); }
                    } catch (e) { alert("Проверьте баланс SMS.RU"); }
                } else {
                    if(document.getElementById('acode').value == flashCode) {
                        db.ref('users/' + phone.replace(/\D/g, '')).set({phone, pass, ts: Date.now()}).then(() => {
                            alert("Регистрация успешна!");
                            finishLogin(phone);
                        });
                    } else { alert("Неверный код!"); }
                }
            } else {
                db.ref('users/' + phone.replace(/\D/g, '')).once('value', s => {
                    const u = s.val();
                    if(u && u.pass === pass) finishLogin(phone);
                    else alert("Ошибка входа!");
                });
            }
        }

        function finishLogin(phone) {
            localStorage.setItem('sim_user', JSON.stringify({phone}));
            currentUser = {phone};
            document.getElementById('auth-btn').classList.add('hidden');
            const info = document.getElementById('user-info');
            info.classList.remove('hidden');
            info.innerText = phone;
            closeAuth();
        }

        // РЕНДЕР НОМЕРОВ
        db.ref('inventory').on('value', s => {
            const list = document.getElementById('list'); list.innerHTML = "";
            const data = s.val() || {};
            Object.keys(data).reverse().forEach(id => {
                const item = data[id];
                list.innerHTML += `<div class="neon-card">
                    <div class="text-3xl font-black italic mb-2">+7 ${item.num}</div>
                    <div class="text-xl font-bold gold-grad mb-4">${item.price} ₽</div>
                    <button onclick="buy('${item.num}')" class="btn-gold py-3 text-[10px]">Купить номер</button>
                </div>`;
            });
        });

        function buy(num) {
            if(!currentUser) return openAuth();
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_ID}&text=🚀 ЗАКАЗ: +7 ${num}\n👤 Клиент: ${currentUser.phone}`);
            alert("Заявка отправлена! Мы свяжемся с вами.");
        }

        if(currentUser) finishLogin(currentUser.phone);
    </script>
</body>
</html>
