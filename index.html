<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | ОФОРМЛЕНИЕ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #09090b; color: #f4f4f5; font-family: 'Manrope', sans-serif; }
        .glass { background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; }
        .input-dark { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 12px; width: 100%; color: white; outline: none; font-size: 14px; }
        .input-dark:focus { border-color: #fbbf24; }
        #order-modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="pb-10">

    <header class="p-6 sticky top-0 z-50 glass border-b border-white/5 flex justify-between items-center">
        <h1 class="text-xl font-extrabold uppercase">SIM <span class="gold-text">MARKET</span></h1>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <input type="text" id="q" oninput="draw()" placeholder="Поиск номера..." class="w-full p-5 mb-6 rounded-2xl bg-zinc-900 border border-zinc-800 outline-none text-sm">
        <div id="list" class="space-y-4"></div>
    </main>

    <div id="order-modal">
        <div class="glass w-full max-w-sm p-6 rounded-[2rem] space-y-4">
            <div class="flex justify-between items-center mb-2">
                <h2 class="font-black uppercase text-sm">Оформление <span id="target-num" class="gold-text"></span></h2>
                <button onclick="closeModal()" class="text-zinc-500">✕</button>
            </div>
            
            <input type="text" id="client-fio" placeholder="Ваше ФИО" class="input-dark">
            <input type="tel" id="client-phone" placeholder="Контактный телефон" class="input-dark">
            
            <div class="space-y-1">
                <label class="text-[10px] uppercase font-bold opacity-50 ml-1">Фото паспорта</label>
                <input type="file" id="client-passport" accept="image/*" class="text-xs text-zinc-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-zinc-300">
            </div>

            <button onclick="submitOrder()" id="send-btn" class="w-full py-4 bg-amber-500 text-black font-black rounded-xl uppercase text-xs">Подтвердить заказ</button>
        </div>
    </div>

    <script>
        const TOKEN = "8279695581:AAGuQgQhmgq9QaTX4rULywq6o18MeT3XIUw";
        const MY_ID = "8768514374"; 
        const BIN = "69c9d640aaba882197a65742"; 
        const KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW"; 

        let db = [], currentNum = "", currentPrice = "";

        async function init() {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN}/latest`, { headers: {'X-Master-Key': KEY} });
            const data = await res.json();
            db = data.record.record || data.record;
            draw();
        }

        function draw() {
            const q = document.getElementById('q').value.toLowerCase();
            const filtered = db.filter(i => String(i.n).includes(q));
            document.getElementById('list').innerHTML = filtered.map(i => `
                <div class="card p-6 flex justify-between items-center">
                    <div>
                        <div class="text-2xl font-black">${i.n}</div>
                        <div class="text-[9px] opacity-40 uppercase">${i.op || 'SIM'} • ${i.t} ₽</div>
                    </div>
                    <button onclick="openModal('${i.n}', '${i.t}')" class="bg-amber-500 text-black text-[10px] font-black px-5 py-2.5 rounded-xl uppercase">Купить</button>
                </div>
            `).reverse().join('');
        }

        function openModal(n, t) {
            currentNum = n; currentPrice = t;
            document.getElementById('target-num').innerText = n;
            document.getElementById('order-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('order-modal').style.display = 'none'; }

        async function submitOrder() {
            const fio = document.getElementById('client-fio').value;
            const phone = document.getElementById('client-phone').value;
            const fileInput = document.getElementById('client-passport');
            const btn = document.getElementById('send-btn');

            if(!fio || !phone) return alert("Заполните ФИО и телефон");

            btn.innerText = "ОТПРАВКА..."; btn.disabled = true;

            // 1. Отправляем текст
            const msg = `🚀 **НОВЫЙ ЗАКАЗ**\n\n📱 Номер: \`${currentNum}\`\n💰 Цена: ${currentPrice} ₽\n👤 Клиент: ${fio}\n📞 Контакт: ${phone}`;
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: MY_ID, text: msg, parse_mode: 'Markdown' })
            });

            // 2. Отправляем фото паспорта (если есть)
            if(fileInput.files.length > 0) {
                const formData = new FormData();
                formData.append('chat_id', MY_ID);
                formData.append('photo', fileInput.files[0]);
                formData.append('caption', `Паспорт клиента: ${fio}`);
                
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            }

            alert("Заказ успешно оформлен!");
            closeModal();
            btn.innerText = "Подтвердить заказ"; btn.disabled = false;
        }

        init();
    </script>
</body>
</html>
