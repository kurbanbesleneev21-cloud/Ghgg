<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | OMNI GOLD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }
        
        .gold-grad { background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* ВКЛАДКИ */
        .modern-tab { padding: 10px 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(191,149,63,0.1); border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; transition: 0.3s; color: rgba(255,255,255,0.4); white-space: nowrap; }
        .modern-tab.active { background: #bf953f; color: #000; box-shadow: 0 0 15px rgba(191,149,63,0.3); }

        /* ОБОДОК */
        .neon-card { position: relative; background: rgba(255,255,255,0.02); border-radius: 30px; overflow: hidden; z-index: 1; }
        .neon-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, #bf953f, #fcf6ba, transparent 70%); animation: rotateBorder 4s linear infinite; z-index: -2; }
        .neon-card::after { content: ''; position: absolute; inset: 2px; background: #0a0a0a; border-radius: 28px; z-index: -1; }
        @keyframes rotateBorder { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* ЧАТ-БОТ */
        #chat-window { display: none; position: fixed; bottom: 90px; right: 20px; width: 300px; height: 400px; background: #0d0d0d; border: 1px solid #bf953f; border-radius: 25px; z-index: 10000; flex-direction: column; overflow: hidden; box-shadow: 0 10px 50px rgba(0,0,0,0.8); }
        .msg { padding: 10px; border-radius: 15px; margin-bottom: 8px; font-size: 12px; max-width: 85%; }
        .msg-bot { background: rgba(191,149,63,0.1); align-self: flex-start; color: #fcf6ba; }
        .msg-user { background: #bf953f; align-self: flex-end; color: #000; font-weight: bold; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(15px); }
        .input-dark { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 18px; color: #fff; outline: none; }
    </style>
</head>
<body class="p-4 pb-24">

    <header class="flex justify-between items-center mb-8 pt-2">
        <h1 class="text-2xl font-black italic gold-grad uppercase">SIM MARKET</h1>
        <div id="user-ui" class="hidden flex items-center gap-3 bg-white/5 p-1 pr-4 rounded-full border border-white/10" onclick="openProfile()">
            <div class="w-9 h-9 bg-[#bf953f] rounded-full flex items-center justify-center text-black font-black">К</div>
            <span id="points-display" class="text-xs font-black">0 XP</span>
        </div>
        <button id="login-btn" onclick="openModal('auth-modal')" class="border border-[#bf953f]/30 px-6 py-2 rounded-full text-[10px] font-black uppercase gold-grad">Вход</button>
    </header>

    <div class="space-y-4 mb-8">
        <input type="text" id="search-input" oninput="renderItems()" placeholder="Умный поиск (777, 05, VIP)..." class="input-dark">
        <div class="flex gap-2 overflow-x-auto no-scrollbar">
            <div class="modern-tab active" onclick="filterOp('ALL', this)">Все</div>
            <div class="modern-tab" onclick="filterOp('МТС', this)">МТС</div>
            <div class="modern-tab" onclick="filterOp('МЕГАФОН', this)">Мегафон</div>
            <div class="modern-tab" onclick="filterOp('FAV', this)">❤️ Избранное</div>
        </div>
    </div>

    <div id="list" class="grid gap-6"></div>

    <div id="chat-window">
        <div class="bg-[#bf953f] p-4 text-black font-black text-xs uppercase flex justify-between">
            <span>AI Помощник</span>
            <span onclick="toggleChat()" class="cursor-pointer">✕</span>
        </div>
        <div id="chat-msgs" class="flex-1 p-4 overflow-y-auto flex flex-col">
            <div class="msg msg-bot">Салам! Я твой AI помощник. Какой номер ищем? Напиши "цены" или "МТС".</div>
        </div>
        <div class="p-3 bg-white/5 flex gap-2">
            <input type="text" id="chat-inp" placeholder="Спроси меня..." class="flex-1 bg-transparent text-xs outline-none">
            <button onclick="sendMsg()" class="text-[#bf953f] font-bold text-xs uppercase">Ok</button>
        </div>
    </div>

    <div onclick="toggleChat()" class="fixed bottom-6 right-6 w-14 h-14 bg-white rounded-full flex items-center justify-center text-2xl shadow-2xl z-50 cursor-pointer">🤖</div>

    <div id="auth-modal" class="modal">
        <div class="bg-[#0d0d0d] p-8 rounded-[35px] border border-white/5 w-full max-w-sm space-y-4">
            <h2 class="text-xl font-black text-center gold-grad uppercase">Регистрация</h2>
            <input type="tel" id="r-phone" placeholder="Номер телефона" class="input-dark">
            <input type="password" id="r-pass" placeholder="Пароль" class="input-dark">
            <input type="text" id="r-word" placeholder="Кодовое слово" class="input-dark">
            <button onclick="register()" class="w-full bg-[#bf953f] text-black p-4 rounded-xl font-black uppercase text-xs">Создать аккаунт</button>
            <button onclick="closeModals()" class="w-full text-[10px] opacity-30 uppercase font-black">Отмена</button>
        </div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="bg-[#0d0d0d] p-10 rounded-[35px] w-full max-w-sm text-center space-y-6 border border-white/5">
            <h2 class="text-xl font-black gold-grad italic">ПРОФИЛЬ</h2>
            <div class="bg-white/5 p-5 rounded-2xl">
                <p id="profile-xp" class="text-4xl font-black gold-grad">0 XP</p>
            </div>
            <button onclick="logout()" class="text-red-500 font-bold text-xs uppercase">Выйти</button>
            <button onclick="closeModals()" class="w-full text-[10px] opacity-30 uppercase font-black">Закрыть</button>
        </div>
    </div>

    <script>
        const fbCfg = { apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com" };
        firebase.initializeApp(fbCfg);
        const db = firebase.database();

        let user = JSON.parse(localStorage.getItem('sim_user_omni')) || null;
        let favs = JSON.parse(localStorage.getItem('sim_favs')) || [];
        let inventory = {};
        let currentFilter = 'ALL';

        if(user) updateUI();

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
        function openProfile() { openModal('profile-modal'); }

        function register() {
            const ph = document.getElementById('r-phone').value;
            const ps = document.getElementById('r-pass').value;
            const wd = document.getElementById('r-word').value;
            if(!ph || !ps || !wd) return alert("Заполни всё!");
            user = { phone: ph, points: 50 };
            localStorage.setItem('sim_user_omni', JSON.stringify(user));
            updateUI(); closeModals();
        }

        function logout() { localStorage.removeItem('sim_user_omni'); location.reload(); }
        function updateUI() {
            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('user-ui').classList.remove('hidden');
            document.getElementById('points-display').innerText = user.points + " XP";
            document.getElementById('profile-xp').innerText = user.points + " XP";
        }

        function filterOp(op, el) {
            currentFilter = op;
            document.querySelectorAll('.modern-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderItems();
        }

        function toggleFav(num, e) {
            e.stopPropagation();
            if(favs.includes(num)) favs = favs.filter(n => n !== num);
            else favs.push(num);
            localStorage.setItem('sim_favs', JSON.stringify(favs));
            renderItems();
        }

        // AI ЛОГИКА
        function toggleChat() { 
            const w = document.getElementById('chat-window');
            w.style.display = (w.style.display === 'flex') ? 'none' : 'flex';
        }

        function sendMsg() {
            const inp = document.getElementById('chat-inp');
            const box = document.getElementById('chat-msgs');
            if(!inp.value) return;
            box.innerHTML += `<div class="msg msg-user">${inp.value}</div>`;
            
            let reply = "Напишите Курбану напрямую для заказа!";
            const txt = inp.value.toLowerCase();
            if(txt.includes("цен")) reply = "Цены зависят от красоты номера. Стартуем от 3000р.";
            if(txt.includes("мтс")) reply = "У нас лучшие VIP номера МТС в Хасавюрте!";
            
            setTimeout(() => {
                box.innerHTML += `<div class="msg msg-bot">${reply}</div>`;
                box.scrollTop = box.scrollHeight;
            }, 600);
            inp.value = "";
        }

        db.ref('inventory').on('value', s => { inventory = s.val() || {}; renderItems(); });

        function renderItems() {
            const list = document.getElementById('list');
            const search = document.getElementById('search-input').value.toLowerCase();
            list.innerHTML = "";
            Object.values(inventory).reverse().forEach(i => {
                const isFav = favs.includes(i.num);
                const op = (i.op || 'SIM').toUpperCase();
                if(currentFilter !== 'ALL' && currentFilter !== 'FAV' && op !== currentFilter) return;
                if(currentFilter === 'FAV' && !isFav) return;
                if(search && !i.num.includes(search)) return;

                list.innerHTML += `
                    <div class="neon-card">
                        <div class="p-6 relative z-10">
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-[8px] font-black opacity-30 uppercase tracking-widest">${op}</span>
                                <span onclick="toggleFav('${i.num}', event)" class="text-xl cursor-pointer">${isFav ? '❤️' : '🤍'}</span>
                            </div>
                            <h3 class="text-3xl font-black italic tracking-tighter mb-1">+7 ${i.num}</h3>
                            <div class="flex justify-between items-center mt-4">
                                <span class="text-xl font-black gold-grad">${i.price} ₽</span>
                                <button onclick="alert('Оформляем заказ...') " class="bg-[#bf953f] text-black px-4 py-2 rounded-xl text-[10px] font-black">КУПИТЬ</button>
                            </div>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
