<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-MARKET | LUXURY ELITE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;600;800&display=swap');
        
        :root {
            --gold: #d4af37;
            --gold-light: #f1d279;
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
        }

        body { 
            background: linear-gradient(135deg, var(--bg) 0%, #0a0a0a 100%);
            color: #fff; 
            font-family: 'Manrope', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* УЛУЧШЕННЫЙ ПРЕЛОАДЕР */
        #preloader {
            position: fixed; inset: 0; z-index: 9999;
            background: radial-gradient(circle at center, #000 0%, var(--bg) 100%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 1s ease, visibility 1s;
        }

        .loader-logo {
            font-size: clamp(32px, 8vw, 48px); 
            font-weight: 900; 
            letter-spacing: -2px;
            background: linear-gradient(135deg, #fff, var(--gold), #fff);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px; 
            animation: pulseGlow 2s infinite;
        }

        .loader-bar {
            width: clamp(200px, 40vw, 300px); 
            height: 3px; 
            background: rgba(212, 175, 55, 0.1);
            border-radius: 10px; 
            overflow: hidden; 
            position: relative;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }

        .loader-progress {
            position: absolute; left: 0; top: 0; height: 100%;
            width: 0%; 
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            box-shadow: 0 0 20px var(--gold);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 10px;
        }

        @keyframes pulseGlow {
            0%, 100% { 
                opacity: 1; 
                transform: scale(1); 
                filter: drop-shadow(0 0 10px var(--gold));
            }
            50% { 
                opacity: 0.8; 
                transform: scale(1.02); 
                filter: drop-shadow(0 0 30px var(--gold));
            }
        }

        /* УЛУЧШЕННЫЙ ДИЗАЙН */
        .gold-text { 
            background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            background-size: 200% auto; 
            animation: shine 4s linear infinite;
        }

        @keyframes shine { to { background-position: 200% center; } }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .glass-card:hover::before { left: 100%; }

        .glass-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 40px rgba(212, 175, 55, 0.2);
        }

        .btn-buy, .btn-regen {
            background: linear-gradient(135deg, #fff, #f0f0f0);
            color: #000;
            padding: 12px 28px; 
            border-radius: 20px;
            font-weight: 800; 
            font-size: 11px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .btn-buy:hover, .btn-regen:hover { 
            background: linear-gradient(135deg, var(--gold), var(--gold-light)); 
            transform: scale(1.08) translateY(-2px);
            color: #000;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }

        /* МОДАЛКА */
        .modal-overlay {
            display: none; 
            position: fixed; 
            inset: 0; 
            z-index: 1000;
            background: rgba(0,0,0,0.95); 
            backdrop-filter: blur(30px);
            align-items: center; 
            justify-content: center; 
            padding: 20px;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        input {
            background: rgba(255,255,255,0.06); 
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px; 
            padding: 18px 20px; 
            width: 100%; 
            color: #fff;
            outline: none; 
            transition: all 0.3s;
            font-size: 16px;
        }

        input:focus { 
            border-color: var(--gold); 
            background: rgba(255,255,255,0.12); 
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            transform: scale(1.02);
        }

        input::placeholder { color: rgba(255,255,255,0.4); }

        #toast {
            position: fixed; 
            top: 30px; 
            left: 50%; 
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #000; 
            padding: 18px 40px;
            border-radius: 50px; 
            font-weight: 800; 
            z-index: 9999;
            display: none; 
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.4);
            letter-spacing: 1px;
        }

        /* ПАНЕЛЬ РЕГЕНЕРАЦИИ */
        .regen-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
            font-size: 24px;
        }

        .regen-panel:hover {
            transform: scale(1.1) rotate(180deg);
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.6);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }

        .stat-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.1);
        }

        .stat-number {
            font-size: 28px;
            font-weight: 800;
            color: var(--gold);
            display: block;
        }
    </style>
</head>
<body>

    <!-- УЛУЧШЕННЫЙ ПРЕЛОАДЕР -->
    <div id="preloader">
        <div class="loader-logo">S-MARKET</div>
        <div class="loader-bar">
            <div class="loader-progress" id="progress"></div>
        </div>
        <p class="text-[11px] text-gray-500 mt-6 uppercase tracking-[4px] animate-pulse">Генерация премиум номеров...</p>
    </div>

    <div id="toast" class="animate__animated">✅ ЗАКАЗ ПРИНЯТ! 👑</div>

    <!-- FAB КНОПКА РЕГЕНЕРАЦИИ -->
    <div class="regen-panel" onclick="showRegenPanel()" title="Регенерация номеров">
        🔄
    </div>

    <!-- ПАНЕЛЬ РЕГЕНЕРАЦИИ -->
    <div id="regenPanel" class="fixed bottom-24 right-8 glass-card p-6 w-80 max-w-sm opacity-0 invisible translate-x-10 transition-all duration-300 z-[999]" style="display: none;">
        <h3 class="text-xl font-black gold-text mb-4 flex items-center gap-2">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            Регенерация номеров
        </h3>
        
        <div class="stats-grid mb-6">
            <div class="stat-card">
                <span class="stat-number" id="totalCount">0</span>
                <span class="text-xs text-gray-500 uppercase tracking-wider">Всего</span>
            </div>
            <div class="stat-card">
                <span class="stat-number text-green-500" id="availableCount">0</span>
                <span class="text-xs text-gray-500 uppercase tracking-wider">Доступно</span>
            </div>
            <div class="stat-card">
                <span class="stat-number text-red-500" id="soldCount">0</span>
                <span class="text-xs text-gray-500 uppercase tracking-wider">Продано</span>
            </div>
        </div>

        <div class="flex gap-3">
            <button onclick="regenNumbers(10)" class="flex-1 btn-regen text-xs py-3">+10 номеров</button>
            <button onclick="regenNumbers(50)" class="flex-1 btn-regen text-xs py-3">+50 номеров</button>
        </div>
        <button onclick="hideRegenPanel()" class="text-gray-500 text-xs mt-4 uppercase font-bold tracking-wider hover:text-white">Закрыть</button>
    </div>

    <!-- МОДАЛКА ЗАКАЗА -->
    <div id="orderModal" class="modal-overlay">
        <div class="glass-card p-10 w-full max-w-md text-center animate__animated animate__zoomIn">
            <div class="w-16 h-16 bg-gradient-to-r from-gold/20 to-gold/10 rounded-3xl flex items-center justify-center mx-auto mb-8 border border-gold/20">
                <svg class="w-8 h-8 text-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                </svg>
            </div>
            <h2 class="text-3xl font-black gold-text mb-3">ОФОРМЛЕНИЕ ЗАКАЗА</h2>
            <p id="orderInfo" class="text-gray-400 text-sm mb-10 uppercase tracking-wider font-medium"></p>
            
            <div class="space-y-4 mb-8">
                <input type="text" id="userName" placeholder="👤 Ваше Имя">
                <input type="tel" id="userPhone" placeholder="📞 Телефон для связи">
                <input type="text" id="userComment" placeholder="💬 Комментарий (необязательно)">
            </div>

            <button onclick="confirmOrder()" class="w-full btn-buy text-lg py-5 mb-4 shadow-2xl">ПОДТВЕРДИТЬ ЗАКАЗ 👑</button>
            <button onclick="closeModal()" class="text-gray-500 text-sm uppercase font-bold tracking-wider hover:text-gold transition-all">Отмена</button>
        </div>
    </div>

    <header class="p-8">
        <div class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-4xl md:text-5xl font-black gold-text italic tracking-tighter leading-none">S-MARKET</h1>
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-[0.4em] mt-2">Elite Digital Assets • 24/7</p>
            </div>
            <div class="bg-gradient-to-r from-green-500/20 to-green-600/20 px-5 py-3 rounded-2xl border border-green-500/30 flex items-center gap-3 backdrop-blur-sm">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-ping"></div>
                <span class="text-[11px] font-black uppercase tracking-widest">Онлайн</span>
            </div>
        </div>

        <!-- УЛУЧШЕННЫЙ БАННЕР -->
        <div class="relative overflow-hidden rounded-[40px] p-12 mb-12 bg-gradient-to-br from-[#1a1a1a] via-[#111] to-[#050505] border border-white/10 glass-card">
            <div class="absolute inset-0 bg-gradient-to-r from-gold/5 via-transparent to-gold/5"></div>
            <div class="relative z-10">
                <h2 id="bTitle" class="text-4xl md:text-5xl font-black mb-4 leading-tight gold-text">Загрузка...</h2>
                <p id="bSub" class="text-gray-400 text-lg font-medium max-w-md"></p>
            </div>
            <div class="absolute -right-24 -bottom-24 w-80 h-80 bg-gold/3 rounded-full blur-[120px]"></div>
            <div class="absolute -left-20 top-20 w-60 h-60 bg-purple-500/5 rounded-full blur-[80px]"></div>
        </div>

        <div class="relative mb-8">
            <input type="text" id="search" placeholder="🔍 Поиск эксклюзивного номера..." 
                   class="pl-16 py-6 bg-white/8 border border-white/20 rounded-3xl text-lg w-full focus:border-gold focus:bg-white/12">
            <svg class="absolute left-6 top-1/2 -translate-y-1/2 w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </div>
    </header>

    <main id="list" class="px-8 space-y-6 pb-32"></main>

    <script>
        const TG_TOKEN = '8624578892:AAEr7CLID8dkEM0zCPAoIOkn6anZff
