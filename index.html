<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | КРАСИВЫЕ НОМЕРА</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;900&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #050505; color: #fff; }
        .gold-text { color: #bf953f; }
        .gold-bg { background: #bf953f; color: #000; }
        .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; }
        .num-card { border-left: 4px solid #bf953f; transition: 0.3s; }
    </style>
</head>
<body>

    <header class="p-5 border-b border-white/5 bg-[#050505]">
        <h1 class="text-xl font-black italic gold-text">SIM<span class="text-white">MARKET</span></h1>
    </header>

    <section class="py-10 px-5 max-w-6xl mx-auto">
        <h3 class="text-2xl font-black uppercase mb-6 italic">Номера в наличии</h3>
        
        <div id="numbers-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <p class="opacity-20 text-sm">Загрузка номеров...</p>
        </div>
    </section>

    <section id="order" class="py-10 px-5 max-w-md mx-auto">
        <div class="glass p-6 space-y-4">
            <h3 class="text-xl font-black uppercase text-center">Оформить заказ</h3>
            <input type="text" id="order-num" placeholder="Номер телефона" class="w-full bg-[#111] border border-white/10 p-4 rounded-xl text-[#bf953f] font-bold outline-none">
            <input type="text" id="order-name" placeholder="Ваше имя" class="w-full bg-[#111] border border-white/10 p-4 rounded-xl text-white outline-none">
            <input type="tel" id="order-phone" placeholder="Ваш контактный телефон" class="w-full bg-[#111] border border-white/10 p-4 rounded-xl text-white outline-none">
            <button onclick="sendOrder()" class="gold-bg w-full py-4 rounded-xl font-black uppercase">Заказать номер</button>
        </div>
    </section>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
        databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ЗАГРУЗКА НОМЕРОВ
    function loadNumbers() {
        // Мы обращаемся к ветке 'inventory', где лежат твои номера
        db.ref('inventory').on('value', snap => {
            const grid = document.getElementById('numbers-grid');
            grid.innerHTML = "";
            
            if(!snap.exists()) {
                grid.innerHTML = "<p class='opacity-40'>База номеров пуста. Добавьте их в админке.</p>";
                return;
            }

            snap.forEach(child => {
                const data = child.val();
                // child.key — это сам номер (например 9287777777)
                const phoneDigit = child.key; 
                const price = data.price || "Договорная";
                const category = data.category || "VIP";

                grid.innerHTML += `
                    <div class="glass p-5 num-card flex justify-between items-center cursor-pointer active:scale-95 transition" onclick="selectNum('${phoneDigit}')">
                        <div>
                            <p class="text-2xl font-black tracking-tight text-white">${phoneDigit}</p>
                            <p class="text-[10px] font-bold gold-text uppercase">${category}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-lg font-black">${price} ₽</p>
                            <p class="text-[9px] text-green-500 font-bold">ВЫБРАТЬ</p>
                        </div>
                    </div>`;
            });
        });
    }

    function selectNum(num) {
        document.getElementById('order-num').value = num;
        window.scrollTo({ top: document.getElementById('order').offsetTop - 50, behavior: 'smooth' });
    }

    function sendOrder() {
        const num = document.getElementById('order-num').value;
        const name = document.getElementById('order-name').value;
        const phone = document.getElementById('order-phone').value;

        if(!name || !phone || !num) return alert("Заполните все поля!");

        db.ref('orders').push({
            wantedNum: num,
            clientName: name,
            clientPhone: phone,
            date: new Date().toLocaleString('ru-RU')
        }).then(() => {
            alert("Заявка отправлена!");
            document.getElementById('order-name').value = "";
            document.getElementById('order-phone').value = "";
        });
    }

    window.onload = loadNumbers;
</script>
</body>
</html>
