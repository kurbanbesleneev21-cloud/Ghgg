<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | КАТАЛОГ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #09090b; color: #f4f4f5; font-family: 'Manrope', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { transition: 0.2s; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; }
        .card:active { transform: scale(0.97); background: rgba(255,255,255,0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tab-active { background: #f59e0b !important; color: #000 !important; border-color: #f59e0b !important; }
    </style>
</head>
<body class="pb-10">

    <header class="p-6 sticky top-0 z-50 glass border-b border-white/5 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-extrabold tracking-tighter uppercase leading-none">SIM <span class="gold-text">MARKET</span></h1>
            <p class="text-[8px] font-bold text-zinc-500 uppercase tracking-[0.3em] mt-1">Premium SIM Dagestan</p>
        </div>
        <button onclick="location.reload()" class="w-10 h-10 rounded-full bg-zinc-900 border border-white/5 flex items-center justify-center text-xs">🔄</button>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <input type="text" id="q" oninput="draw()" placeholder="Поиск номера..." 
               class="w-full p-5 mb-6 rounded-2xl bg-zinc-900 border border-zinc-800 outline-none focus:border-amber-500 text-sm">

        <div class="flex gap-2 overflow-x-auto no-scrollbar mb-8 pb-2">
            <button onclick="setF('all', this)" class="tab-btn tab-active px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase border border-white/5 whitespace-nowrap">Все</button>
            <button onclick="setF('vip', this)" class="tab-btn px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase border border-white/5 text-amber-500 whitespace-nowrap">VIP</button>
            <button onclick="setF('mts', this)" class="tab-btn px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase border border-white/5 whitespace-nowrap">МТС</button>
            <button onclick="setF('megafon', this)" class="tab-btn px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase border border-white/5 whitespace-nowrap">Мегафон</button>
            <button onclick="setF('beeline', this)" class="tab-btn px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase border border-white/5 whitespace-nowrap">Билайн</button>
            <button onclick="setF('yota', this)" class="tab-btn px-6 py-2.5 rounded-full bg-zinc-900 text-[10px] font-black uppercase border border-white/5 whitespace-nowrap text-cyan-400">Yota</button>
        </div>

        <div id="list" class="space-y-4">
            <div class="p-20 text-center opacity-20 text-[10px] font-black uppercase tracking-widest">Загрузка данных...</div>
        </div>
    </main>

    <script>
        const BIN_ID = "69c9d640aaba882197a65742"; 
        const KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW"; 

        let db = [];
        let currentFilter = 'all';

        async function init() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { 
                    headers: {'X-Master-Key': KEY} 
                });
                const data = await res.json();
                
                // ВАЖНО: берем массив из record.record (так как мы добавили чат)
                db = data.record.record || data.record; 
                
                draw();
            } catch (e) { 
                document.getElementById('list').innerHTML = "Ошибка связи с сервером"; 
            }
        }

        function draw() {
            const list = document.getElementById('list');
            const q = document.getElementById('q').value.toLowerCase();
            
            // Фильтрация
            let items = db.filter(i => {
                const num = String(i.n || "").toLowerCase();
                const opName = String(i.o || i.op || "").toLowerCase();
                return num.includes(q) || opName.includes(q);
            });
            
            if(currentFilter === 'vip') items = items.filter(i => i.cat === 'vip');
            else if(currentFilter !== 'all') items = items.filter(i => String(i.op || i.o).toLowerCase() === currentFilter);

            if(items.length === 0) { 
                list.innerHTML = `<div class="p-10 text-center opacity-20 text-[10px]">НОМЕРА НЕ НАЙДЕНЫ</div>`; 
                return; 
            }

            list.innerHTML = items.map(item => `
                <div class="card p-6 flex justify-between items-center ${item.cat === 'vip' ? 'border-amber-500/20 shadow-lg shadow-amber-500/5' : ''}">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-2xl font-black text-white tracking-tighter">${item.n}</span>
                            ${item.cat === 'vip' ? '<span class="bg-amber-500 text-black text-[7px] px-1.5 py-0.5 rounded font-black uppercase">VIP</span>' : ''}
                        </div>
                        <div class="text-[9px] font-bold text-zinc-500 uppercase mt-1 tracking-widest">${item.op || item.o || 'SIM'} • ${item.tarif || 'Базовый'}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xl font-black text-amber-500">${item.t} ₽</div>
                        <button onclick="window.open('https://wa.me/79999993834')" class="text-[8px] font-black text-zinc-600 uppercase mt-1">КУПИТЬ →</button>
                    </div>
                </div>
            `).reverse().join('');
        }

        function setF(val, btn) {
            currentFilter = val;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            btn.classList.add('tab-active');
            draw();
        }

        init();
    </script>
</body>
</html>
