<!DOCTYPE html>
<html lang="ru" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #000; color: #fff; margin: 0; overflow-x: hidden; }
        
        .gold-text { 
            background: linear-gradient(to right, #bf953f 20%, #fcf6ba 40%, #b38728 60%, #bf953f 80%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .premium-card {
            position: relative;
            background: #0d0d0d;
            border-radius: 24px;
            padding: 2px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .premium-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent 70%, #bf953f 100%);
            animation: border-crawl 3s linear infinite;
        }
        @keyframes border-crawl { 100% { transform: rotate(360deg); } }
        
        .card-content {
            background: #0d0d0d;
            border-radius: 22px;
            padding: 20px;
            z-index: 1;
            position: relative;
            display: flex; justify-content: space-between; align-items: center;
        }

        .op-tag { font-size: 9px; padding: 4px 12px; border-radius: 8px; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; display: inline-block; }
        .tag-МТС { background: #E30613; color: #fff; }
        .tag-БИЛАЙН { background: #FFD800; color: #000; }
        .tag-МЕГАФОН { background: #00B956; color: #fff; }
        .tag-ТЕЛЕ2 { background: #fff; color: #000; }

        .filter-tab { padding: 10px 20px; border-radius: 12px; font-size: 11px; font-weight: 800; text-transform: uppercase; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        .filter-tab.active { background: #bf953f; color: #000; border-color: #bf953f; }

        .btn-buy { 
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728);
            color: #000 !important; 
            font-weight: 900; 
            padding: 14px 24px; 
            border-radius: 16px; 
            font-size: 12px; 
            text-transform: uppercase;
            border: none;
            cursor: pointer;
        }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        
        .auth-input { background: #111!important; border: 1px solid rgba(255,255,255,0.1)!important; color: #fff!important; padding: 20px; border-radius: 20px; width: 100%; outline: none; font-size: 16px; }

        #toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: #111; border: 1px solid #bf953f; color: #fff;
            padding: 16px 24px; border-radius: 20px; z-index: 2000;
            width: 90%; max-width: 350px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #toast.show { top: 30px; }
    </style>
</head>
<body>

    <div id="toast" class="notranslate">
        <p id="toast-title" class="text-[10px] text-[#bf953f] font-black uppercase mb-1">Успешно</p>
        <p id="toast-msg" class="text-xs font-bold leading-tight"></p>
    </div>

    <header class="p-6 flex justify-between items-center sticky top-0 bg-black/95 backdrop-blur-md z-50 border-b border-white/5">
        <h1 class="text-2xl font-black italic gold-text notranslate">SIM MARKET</h1>
        <div id="auth-section">
            <button onclick="openM('auth-m')" class="text-[9px] font-black uppercase bg-white text-black px-5 py-2.5 rounded-full">Вход</button>
        </div>
        <div id="user-info" class="hidden flex items-center gap-3">
            <div class="text-right">
                <p id="u-name" class="text-[10px] font-black uppercase text-white"></p>
                <p id="u-phone" class="text-[9px] text-[#bf953f] font-bold"></p>
            </div>
            <button onclick="logout()" class="text-[18px] opacity-40">✕</button>
        </div>
    </header>

    <div id="promo-box" class="hidden mx-4 my-4 p-4 rounded-2xl border border-[#bf953f]/30 bg-gradient-to-br from-[#bf953f]/10 to-transparent">
        <p class="text-[9px] font-black text-[#bf953f] uppercase mb-1 tracking-widest">Акция</p>
        <h2 id="promo-title" class="text-sm font-bold mb-1"></h2>
        <p id="promo-text" class="text-xs opacity-60"></p>
    </div>

    <div class="flex gap-2 p-4 overflow-x-auto no-scrollbar notranslate">
        <button onclick="filterOp('ВСЕ')" class="filter-tab active" id="btn-all">Все</button>
        <button onclick="filterOp('МЕГАФОН')" class="filter-tab">Мегафон</button>
        <button onclick="filterOp('БИЛАЙН')" class="filter-tab">Билайн</button>
        <button onclick="filterOp('МТС')" class="filter-tab">МТС</button>
        <button onclick="filterOp('ТЕЛЕ2')" class="filter-tab">Tele2</button>
    </div>

    <main class="p-4 pb-20">
        <div id="numbers-grid" class="space-y-1"></div>
    </main>

    <div id="auth-m" class="modal">
        <div class="bg-black/90 p-8 rounded-[40px] w-full max-w-sm border border-white/5 text-center backdrop-blur-xl">
            <h3 id="auth-title" class="text-3xl font-black text-[#bf953f] mb-8 uppercase tracking-widest italic">Вход</h3>
            <div class="space-y-4">
                <input type="tel" id="reg-phone" placeholder="Номер телефона" class="auth-input">
                <input type="text" id="reg-name" placeholder="Имя клиента" class="auth-input hidden">
                <input type="password" id="reg-pass" placeholder="Пароль" class="auth-input">
                <button onclick="handleAuth()" id="auth-main-btn" class="w-full py-5 rounded-full bg-gradient-to-r from-[#bf953f] via-[#fcf6ba] to-[#b38728] text-black font-black text-sm mt-4">Войти</button>
                <div class="mt-6 flex flex-col gap-4">
                    <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-[10px] text-[#bf953f] font-bold uppercase tracking-widest">Нет аккаунта? Регистрация</button>
                    <button onclick="closeM()" class="text-[10px] text-gray-600 font-bold uppercase tracking-widest">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const conf = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(conf);
        const db = firebase.database();

        let currentFilter = "ВСЕ";
        let isRegisterMode = false;

        function showToast(title, msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;
            t.classList.add('show');
            setTimeout(() => { t.classList.remove('show'); }, 4000);
        }

        function openM(id) { document.getElementById(id).classList.add('active'); }
        function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('auth-title');
            const nameInput = document.getElementById('reg-name');
            const mainBtn = document.getElementById('auth-main-btn');
            const toggleBtn = document.getElementById('auth-toggle-btn');
            if (isRegisterMode) {
                title.innerText = "Регистрация"; nameInput.classList.remove('hidden');
                mainBtn.innerText = "Создать аккаунт"; toggleBtn.innerText = "Уже есть аккаунт? Вход";
            } else {
                title.innerText = "Вход"; nameInput.classList.add('hidden');
                mainBtn.innerText = "Войти"; toggleBtn.innerText = "Нет аккаунта? Регистрация";
            }
        }

        function loadPromo() {
            db.ref('blog').limitToLast(1).on('value', snap => {
                const box = document.getElementById('promo-box');
                if(snap.exists()) {
                    box.classList.remove('hidden');
                    snap.forEach(p => {
                        const d = p.val();
                        document.getElementById('promo-title').innerText = d.title;
                        document.getElementById('promo-text').innerText = d.text;
                    });
                }
            });
        }

        function handleAuth() {
            const phone = document.getElementById('reg-phone').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const cleanPhone = phone.replace(/\D/g, "");
            if (!phone || !pass || (isRegisterMode && !name)) return alert("Заполните все поля!");
            const userRef = db.ref('users/' + cleanPhone);
            userRef.once('value', snap => {
                if (isRegisterMode) {
                    if (snap.exists()) alert("Этот номер уже зарегистрирован!");
                    else userRef.set({ name: name, pass: pass, role: 'user', regDate: new Date().toLocaleString() }).then(() => login(cleanPhone, name));
                } else {
                    const u = snap.val();
                    if (u && u.pass === pass) login(cleanPhone, u.name);
                    else alert("Неверные данные!");
                }
            });
        }

        function login(p, n) { localStorage.setItem('user', p); localStorage.setItem('userName', n); location.reload(); }

        function filterOp(op) {
            currentFilter = op;
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toUpperCase() === op) btn.classList.add('active');
            });
            loadNumbers();
        }

        function loadNumbers() {
            db.ref('inventory').on('value', snap => {
                const grid = document.getElementById('numbers-grid');
                grid.innerHTML = "";
                snap.forEach(c => {
                    const i = c.val();
                    const op = (i.op || 'МЕГАФОН').toUpperCase();
                    if(currentFilter !== "ВСЕ" && op !== currentFilter) return;
                    grid.innerHTML += `
                        <div class="premium-card">
                            <div class="card-content">
                                <div>
                                    <span class="op-tag tag-${op}">${op}</span>
                                    <h4 class="text-2xl font-black italic tracking-tighter text-white">+7 ${i.num}</h4>
                                    <p class="text-[#bf953f] font-black text-lg mt-1">${i.price} ₽</p>
                                </div>
                                <button onclick="buy('${i.num}', '${op}')" class="btn-buy notranslate">КУПИТЬ</button>
                            </div>
                        </div>`;
                });
            });
        }

        function buy(num, op) {
            const uPhone = localStorage.getItem('user');
            const uName = localStorage.getItem('userName');
            if(!uPhone) return openM('auth-m');

            db.ref('orders').orderByChild('wantedNum').equalTo(num).once('value', snap => {
                let alreadyExists = false;
                snap.forEach(s => { if(s.val().clientPhone === uPhone) alreadyExists = true; });

                if(alreadyExists) {
                    showToast("Внимание", "Вы уже отправили заявку на этот номер. Ожидайте звонка.");
                } else {
                    db.ref('orders/' + Date.now()).set({
                        clientName: uName, clientPhone: uPhone, wantedNum: num, operator: op, date: new Date().toLocaleString(), status: 'new'
                    }).then(() => { 
                        showToast("Успешно", "Заявка в обработке, оператор свяжется с вами в ближайшее время.");
                    });
                }
            });
        }

        function logout() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            const u = localStorage.getItem('user');
            if(u) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('u-phone').innerText = "+7 " + u;
                document.getElementById('u-name').innerText = localStorage.getItem('userName');
            }
            loadPromo(); loadNumbers();
        };
    </script>
</body>
</html>
