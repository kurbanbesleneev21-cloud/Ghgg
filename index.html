<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0A0E27">
    <title>SimMarket — Премиум Маркетплейс</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0A0E27 0%, #1a1f3a 50%, #0d1928 100%);
            color: #E8EAED;
            padding-bottom: 70px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px 20px 24px;
            border-top: 1px solid rgba(59, 130, 246, 0.2);
            z-index: 100;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #94A3B8;
            cursor: pointer;
            background: none;
            border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            padding: 8px 12px;
        }

        .nav-item i {
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: #3B82F6;
            transform: scale(1.1);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 3px;
            background: linear-gradient(90deg, #3B82F6, #8B5CF6);
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        /* Header */
        .header {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.7) 100%);
            backdrop-filter: blur(20px);
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 99;
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: white;
            font-family: 'Poppins', sans-serif;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo span {
            color: #3B82F6;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
        }

        .search-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 16px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 50px;
            font-size: 14px;
            background: rgba(30, 41, 59, 0.6);
            color: white;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-wrapper input:focus {
            background: rgba(30, 41, 59, 0.9);
            border-color: #3B82F6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .search-wrapper input::placeholder {
            color: #64748B;
        }

        .search-wrapper i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #3B82F6;
        }

        .header-icons {
            display: flex;
            gap: 16px;
        }

        .header-icons i {
            font-size: 20px;
            color: white;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .header-icons i:hover {
            color: #3B82F6;
            transform: scale(1.15);
        }

        .badge-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: linear-gradient(135deg, #F59E0B, #F97316);
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 7px;
            border-radius: 20px;
            min-width: 18px;
            text-align: center;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Categories */
        .categories-wrapper {
            overflow-x: auto;
            padding: 16px;
            background: transparent;
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
            position: relative;
            z-index: 2;
        }

        .categories {
            display: flex;
            gap: 12px;
        }

        .cat-btn {
            padding: 10px 22px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #94A3B8;
            backdrop-filter: blur(10px);
        }

        .cat-btn:hover {
            border-color: #3B82F6;
            color: #3B82F6;
            transform: translateY(-2px);
        }

        .cat-btn.active {
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            padding: 0 16px 20px;
            position: relative;
            z-index: 2;
        }

        .product-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6), rgba(30, 41, 59, 0.3));
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: #3B82F6;
            box-shadow: 0 20px 50px rgba(59, 130, 246, 0.2);
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
            pointer-events: none;
        }

        .product-card:hover::before {
            opacity: 1;
        }

        .product-img {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
            padding: 16px;
            text-align: center;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .product-img img {
            max-width: 100%;
            max-height: 110px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-img img {
            transform: scale(1.1);
        }

        .product-info {
            padding: 14px;
            position: relative;
            z-index: 2;
        }

        .product-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #E8EAED;
        }

        .price {
            font-size: 16px;
            font-weight: 800;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .old-price {
            font-size: 11px;
            text-decoration: line-through;
            color: #64748B;
            margin-left: 6px;
        }

        .badge-sale {
            position: absolute;
            top: 12px;
            left: 12px;
            background: linear-gradient(135deg, #F59E0B, #F97316);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            color: white;
            z-index: 3;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        /* Admin Panel */
        .admin-panel {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(30, 41, 59, 0.5));
            margin: 16px;
            padding: 24px;
            border-radius: 24px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 2;
        }

        .admin-panel h3 {
            margin-bottom: 20px;
            font-size: 20px;
            color: #E8EAED;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-input, .admin-select {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            font-size: 14px;
            background: rgba(30, 41, 59, 0.6);
            color: #E8EAED;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .admin-input:focus, .admin-select:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
            background: rgba(30, 41, 59, 0.9);
        }

        .admin-input::placeholder {
            color: #64748B;
        }

        .spec-group {
            display: flex;
            gap: 8px;
            margin: 10px 0;
            flex-wrap: wrap;
        }

        .spec-group input {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.6);
            color: #E8EAED;
            transition: all 0.3s ease;
        }

        .spec-group input:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-weight: 600;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
            font-size: 16px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 48px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(30, 41, 59, 0.6);
            color: #3B82F6;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 12px;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: #3B82F6;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 300;
            align-items: flex-end;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: linear-gradient(135deg, #0A0E27 0%, #1a1f3a 100%);
            width: 100%;
            max-height: 85vh;
            border-radius: 32px 32px 0 0;
            overflow-y: auto;
            padding: 24px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 -10px 50px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 22px;
            font-weight: bold;
            color: #E8EAED;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
            color: #E8EAED;
        }

        .auth-input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            font-size: 14px;
            background: rgba(30, 41, 59, 0.6);
            color: #E8EAED;
            transition: all 0.3s ease;
        }

        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: white;
            padding: 14px 24px;
            border-radius: 50px;
            z-index: 400;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.4);
            animation: slideInUp 0.3s ease;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748B;
            font-size: 16px;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            color: #3B82F6;
            opacity: 0.5;
        }

        .product-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0A0E27 0%, #1a1f3a 100%);
            z-index: 200;
            overflow-y: auto;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .product-page-header {
            position: sticky;
            top: 0;
            background: rgba(10, 14, 39, 0.95);
            padding: 16px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
            z-index: 201;
            backdrop-filter: blur(10px);
        }

        .filter-btn {
            position: fixed;
            bottom: 90px;
            right: 16px;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            color: white;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.4);
            z-index: 90;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
        }

        .filter-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 48px rgba(59, 130, 246, 0.5);
        }

        .filters-drawer {
            position: fixed;
            left: -100%;
            top: 0;
            width: 80%;
            height: 100%;
            background: linear-gradient(135deg, #0A0E27 0%, #1a1f3a 100%);
            z-index: 301;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 24px;
            border-right: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 10px 0 40px rgba(0, 0, 0, 0.5);
        }

        .filters-drawer.open {
            left: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 300;
            display: none;
            backdrop-filter: blur(5px);
        }

        .filter-group {
            margin-bottom: 24px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 12px;
            color: #E8EAED;
            font-weight: 600;
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.6);
            color: #E8EAED;
        }

        .profile-section {
            background: rgba(59, 130, 246, 0.1);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .profile-info {
            margin-bottom: 15px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
        }

        .profile-label {
            font-size: 12px;
            color: #94A3B8;
            margin-bottom: 5px;
        }

        .profile-value {
            font-size: 16px;
            font-weight: 600;
            color: #3B82F6;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-top">
        <div class="logo">Sim<span>Market</span></div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Поиск...">
            <i class="fas fa-search"></i>
        </div>
        <div class="header-icons">
            <i class="far fa-user" id="userIconBtn"></i>
            <i class="fas fa-shopping-cart" id="cartHeaderBtn"><span id="cartBadge" class="badge-count">0</span></i>
        </div>
    </div>
</div>

<div class="categories-wrapper">
    <div class="categories" id="categoriesList"></div>
</div>

<!-- Admin Panel -->
<div class="admin-panel" id="adminPanel" style="display: none;">
    <h3><i class="fas fa-plus-circle"></i> Добавить товар</h3>
    <input type="text" id="prodName" class="admin-input" placeholder="Название товара">
    <input type="number" id="prodPrice" class="admin-input" placeholder="Цена">
    <input type="number" id="prodOldPrice" class="admin-input" placeholder="Старая цена (опционально)">
    <input type="text" id="prodImage" class="admin-input" placeholder="URL фото">
    <select id="prodCategory" class="admin-select">
        <option value="Смартфоны">📱 Смартфоны</option>
        <option value="Наушники">🎧 Наушники</option>
        <option value="Зарядки">🔋 Зарядки</option>
        <option value="Power Bank">🔌 Power Bank</option>
        <option value="Гаджеты">⌚ Гаджеты</option>
    </select>
    <input type="text" id="prodBrand" class="admin-input" placeholder="Бренд">
    <div id="specsContainer">
        <div class="spec-group">
            <input type="text" placeholder="Характеристика" class="spec-key">
            <input type="text" placeholder="Значение" class="spec-value">
            <button type="button" class="remove-spec" style="background:rgba(239, 68, 68, 0.2); border:1px solid rgba(239, 68, 68, 0.5); border-radius:12px; padding:0 12px; color:#F87171; cursor:pointer;">✕</button>
        </div>
    </div>
    <button id="addSpecBtn" class="btn-secondary" style="margin:12px 0; width:100%;">+ Добавить характеристику</button>
    <button id="submitProductBtn" class="btn-primary"><i class="fas fa-save"></i> Сохранить товар</button>
</div>

<div id="productsContainer" class="products-grid"></div>

<div class="bottom-nav">
    <button class="nav-item active" data-nav="home"><i class="fas fa-home"></i><span>Главная</span></button>
    <button class="nav-item" data-nav="cart"><i class="fas fa-shopping-cart"></i><span>Корзина</span></button>
    <button class="nav-item" data-nav="profile"><i class="fas fa-user"></i><span>Профиль</span></button>
</div>

<button class="filter-btn" id="filterBtn"><i class="fas fa-sliders-h"></i></button>

<div class="filters-drawer" id="filtersDrawer">
    <div style="display: flex; justify-content: space-between; margin-bottom: 24px; align-items: center;">
        <h3 style="color: #E8EAED; font-size: 22px;">Фильтры</h3>
        <button id="closeFilters" style="background:none; border:none; font-size:28px; color:#3B82F6; cursor:pointer; transition:all 0.3s ease;">✕</button>
    </div>
    <div class="filter-group">
        <label>Цена (₽)</label>
        <input type="number" id="minPrice" placeholder="от" value="0">
        <input type="number" id="maxPrice" placeholder="до" value="200000">
    </div>
    <div class="filter-group">
        <label>Бренд</label>
        <select id="brandFilter"><option value="">Все бренды</option></select>
    </div>
    <button id="applyFiltersBtn" class="btn-primary">Применить фильтры</button>
</div>
<div id="overlay" class="overlay"></div>

<!-- Modals -->
<div id="cartModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><span>🛒 Ваша корзина</span><span class="closeModal" style="cursor:pointer;">✕</span></div>
        <div id="cartItemsList"></div>
        <div id="cartTotal" style="font-size: 18px; font-weight: bold; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(59, 130, 246, 0.2); color: #E8EAED;"></div>
        <button id="checkoutBtn" class="btn-primary" style="margin-top: 20px;">Оформить заказ</button>
    </div>
</div>

<div id="authModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><span>🔐 Вход / Регистрация</span><span class="closeModal" style="cursor:pointer;">✕</span></div>
        <div style="margin-bottom: 20px;">
            <input type="text" id="authName" class="auth-input" placeholder="Ваше имя" style="display:none;">
            <input type="tel" id="authPhone" class="auth-input" placeholder="+7 (999) 999-99-99">
            <input type="password" id="authPassword" class="auth-input" placeholder="Пароль">
            <button id="loginBtn" class="btn-primary">Войти</button>
            <button id="registerBtn" class="btn-secondary" style="width: 100%; margin-top: 12px;">Зарегистрироваться</button>
        </div>
    </div>
</div>

<div id="profileModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><span>👤 Мой профиль</span><span class="closeModal" style="cursor:pointer;">✕</span></div>
        <div id="profileContent"></div>
    </div>
</div>

<div id="adminAuthModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><span>🔐 Доступ в админ</span><span class="closeModal" style="cursor:pointer;">✕</span></div>
        <div style="margin-bottom: 20px;">
            <p style="color: #94A3B8; margin-bottom: 15px;">Введите номер администратора:</p>
            <input type="tel" id="adminPhone" class="auth-input" placeholder="+7 (999) 999-99-99">
            <button id="adminAccessBtn" class="btn-primary">Войти в админ</button>
        </div>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><span>📦 Оформление заказа</span><span class="closeModal" style="cursor:pointer;">✕</span></div>
        <form id="orderForm">
            <input type="text" id="orderName" class="auth-input" placeholder="Ваше имя" required>
            <input type="email" id="orderEmail" class="auth-input" placeholder="Email" required>
            <input type="tel" id="orderPhone" class="auth-input" placeholder="Телефон" required>
            <input type="text" id="orderAddress" class="auth-input" placeholder="Адрес доставки" required>
            <button type="submit" class="btn-primary">Заказать</button>
        </form>
    </div>
</div>

<div id="productPage" class="product-page">
    <div class="product-page-header">
        <i class="fas fa-arrow-left" id="closeProductPage" style="font-size:24px; cursor:pointer; color:#3B82F6;"></i>
        <span style="color:#E8EAED; font-weight:600;">Детали товара</span>
        <div style="width:24px;"></div>
    </div>
    <div id="productPageContent"></div>
</div>

<script>
    const ADMIN_PHONE = '89999993834';
    
    let products = JSON.parse(localStorage.getItem('sim_products')) || [];
    let cart = JSON.parse(localStorage.getItem('sim_cart')) || [];
    let currentUser = JSON.parse(localStorage.getItem('sim_user')) || null;
    let users = JSON.parse(localStorage.getItem('sim_users')) || [];
    let currentCategory = "Все";
    let searchQuery = "";
    let currentProduct = null;

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function saveAll() {
        localStorage.setItem('sim_products', JSON.stringify(products));
        localStorage.setItem('sim_cart', JSON.stringify(cart));
        localStorage.setItem('sim_user', JSON.stringify(currentUser));
        localStorage.setItem('sim_users', JSON.stringify(users));
        updateBadges();
        renderBrandFilter();
    }

    function updateBadges() {
        let cartCount = cart.reduce((s,i)=> s + i.qty, 0);
        document.getElementById('cartBadge').innerText = cartCount;
    }

    function renderBrandFilter() {
        let brands = [...new Set(products.map(p => p.brand).filter(b => b))];
        let select = document.getElementById('brandFilter');
        select.innerHTML = '<option value="">Все бренды</option>' + brands.map(b => `<option>${b}</option>`).join('');
    }

    function isAuthenticated() {
        if(!currentUser) { showModal('authModal'); return false; }
        return true;
    }

    function getFilteredProducts() {
        let filtered = products.filter(p => currentCategory === "Все" || p.category === currentCategory);
        if(searchQuery) filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery));
        let min = parseInt(document.getElementById('minPrice').value) || 0;
        let max = parseInt(document.getElementById('maxPrice').value) || 999999;
        filtered = filtered.filter(p => p.price >= min && p.price <= max);
        let brand = document.getElementById('brandFilter').value;
        if(brand) filtered = filtered.filter(p => p.brand === brand);
        return filtered;
    }

    function renderProducts() {
        let filtered = getFilteredProducts();
        let container = document.getElementById('productsContainer');
        if(filtered.length === 0) {
            container.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-box-open"></i><p>Нет товаров. Добавьте первый товар через админ панель</p></div>';
            return;
        }
        container.innerHTML = filtered.map(p => `
            <div class="product-card" onclick="openProductPage(${p.id})">
                ${p.oldPrice ? '<div class="badge-sale">Акция</div>' : ''}
                <div class="product-img"><img src="${p.image}" onerror="this.src='https://placehold.co/200x150?text=No+Image'"></div>
                <div class="product-info">
                    <div class="product-title">${escapeHtml(p.name)}</div>
                    <div class="price">${p.price.toLocaleString()} ₽${p.oldPrice ? `<span class="old-price">${p.oldPrice.toLocaleString()} ₽</span>` : ''}</div>
                </div>
            </div>
        `).join('');
    }

    function openProductPage(id) {
        currentProduct = products.find(p => p.id === id);
        if(!currentProduct) return;
        document.getElementById('productPage').style.display = 'block';
        document.body.style.overflow = 'hidden';
        let specsHtml = '';
        if(currentProduct.specs && currentProduct.specs.length) {
            specsHtml = currentProduct.specs.map(s => `<div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid rgba(59, 130, 246, 0.1); color:#E8EAED;"><span style="font-weight:600;">${escapeHtml(s.key)}</span><span>${escapeHtml(s.value)}</span></div>`).join('');
        }
        document.getElementById('productPageContent').innerHTML = `
            <div style="text-align:center; padding:24px; background:rgba(59, 130, 246, 0.1);"><img src="${currentProduct.image}" style="max-width:100%; max-height:300px; object-fit:contain;"></div>
            <div style="padding:20px;">
                <h2 style="font-size:26px; color:#E8EAED; margin-bottom:12px;">${escapeHtml(currentProduct.name)}</h2>
                <div class="price" style="font-size:32px; margin:16px 0;">${currentProduct.price.toLocaleString()} ₽${currentProduct.oldPrice ? ` <span style="font-size:18px; text-decoration:line-through; color:#64748B;">${currentProduct.oldPrice.toLocaleString()}</span>` : ''}</div>
                <button class="btn-primary" onclick="addToCartAndClose(${currentProduct.id})"><i class="fas fa-cart-plus"></i> Добавить в корзину</button>
                <div style="background:rgba(59, 130, 246, 0.1); padding:18px; border-radius:16px; margin:20px 0; border: 1px solid rgba(59, 130, 246, 0.2);"><h4 style="color:#E8EAED; margin-bottom:12px;">📋 Характеристики</h4>${specsHtml || '<p style="color:#94A3B8;">Нет характеристик</p>'}</div>
            </div>
        `;
    }

    function addToCartAndClose(id) {
        if(!isAuthenticated()) return;
        let item = cart.find(i => i.id === id);
        if(item) item.qty++;
        else cart.push({ id, qty: 1 });
        saveAll();
        showToast("✅ Товар добавлен в корзину");
        document.getElementById('productPage').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function showModal(modalId) {
        let modal = document.getElementById(modalId);
        modal.style.display = 'flex';
        modal.querySelectorAll('.closeModal').forEach(btn => btn.onclick = () => modal.style.display = 'none');
        modal.onclick = (e) => { if(e.target === modal) modal.style.display = 'none'; };
    }

    function showCartModal() {
        showModal('cartModal');
        let div = document.getElementById('cartItemsList');
        if(cart.length === 0) div.innerHTML = '<div class="empty-state">Корзина пуста</div>';
        else {
            div.innerHTML = cart.map(item => {
                let p = products.find(pr => pr.id === item.id);
                if(!p) return '';
                return `<div class="cart-item"><span><b>${escapeHtml(p.name)}</b> x${item.qty}</span><span>${(p.price*item.qty).toLocaleString()} ₽ <button onclick="removeFromCart(${item.id})" style="background:rgba(239, 68, 68, 0.2); border:1px solid rgba(239, 68, 68, 0.5); color:#F87171; padding:6px 12px; border-radius:8px; cursor:pointer;">✕</button></span></div>`;
            }).join('');
            let total = cart.reduce((s,i)=> s + (products.find(p=>p.id===i.id)?.price || 0) * i.qty,0);
            document.getElementById('cartTotal').innerHTML = `💰 Итого: <span style="color:#3B82F6;">${total.toLocaleString()} ₽</span>`;
        }
    }

    function showProfileModal() {
        if (!currentUser) {
            showModal('authModal');
            return;
        }
        showModal('profileModal');
        let profileContent = document.getElementById('profileContent');
        profileContent.innerHTML = `
            <div class="profile-section">
                <div class="profile-info">
                    <div class="profile-label">📱 Телефон:</div>
                    <div class="profile-value">${escapeHtml(currentUser.phone)}</div>
                </div>
                <div class="profile-info">
                    <div class="profile-label">👤 Имя:</div>
                    <div class="profile-value">${escapeHtml(currentUser.name)}</div>
                </div>
                <div class="profile-info">
                    <div class="profile-label">🆔 ID:</div>
                    <div class="profile-value">${currentUser.id}</div>
                </div>
            </div>
            <button class="btn-secondary" style="width:100%; margin-bottom:10px;" onclick="showAdminAuthModal()">🔐 Доступ в админ</button>
            <button class="btn-secondary" style="width:100%; background:rgba(239, 68, 68, 0.2); color:#F87171;" onclick="logoutUser()">Выход</button>
        `;
    }

    function showAdminAuthModal() {
        document.getElementById('profileModal').style.display = 'none';
        showModal('adminAuthModal');
    }

    function logoutUser() {
        currentUser = null;
        saveAll();
        document.getElementById('profileModal').style.display = 'none';
        showToast("👋 Вы вышли из аккаунта");
        renderProducts();
    }

    function removeFromCart(id) { cart = cart.filter(i => i.id !== id); saveAll(); showCartModal(); renderProducts(); }

    function showToast(msg) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    document.getElementById('submitProductBtn').onclick = () => {
        let name = document.getElementById('prodName').value.trim();
        let price = parseFloat(document.getElementById('prodPrice').value);
        let oldPrice = parseFloat(document.getElementById('prodOldPrice').value) || null;
        let image = document.getElementById('prodImage').value.trim();
        let category = document.getElementById('prodCategory').value;
        let brand = document.getElementById('prodBrand').value.trim();
        if(!name || !price || !image || !brand) { showToast("⚠️ Заполните название, цену, фото и бренд"); return; }
        let specs = [];
        document.querySelectorAll('#specsContainer .spec-group').forEach(group => {
            let key = group.querySelector('.spec-key').value.trim();
            let val = group.querySelector('.spec-value').value.trim();
            if(key && val) specs.push({ key, value: val });
        });
        let newProduct = { id: Date.now(), name, price, oldPrice, image, category, brand, specs };
        products.push(newProduct);
        saveAll();
        renderProducts();
        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodOldPrice').value = '';
        document.getElementById('prodImage').value = '';
        document.getElementById('prodBrand').value = '';
        document.querySelectorAll('#specsContainer .spec-group').forEach((g,i) => { if(i>0) g.remove(); else { g.querySelector('.spec-key').value = ''; g.querySelector('.spec-value').value = ''; } });
        showToast("✅ Товар добавлен!");
    };

    document.getElementById('addSpecBtn').onclick = () => {
        let div = document.createElement('div');
        div.className = 'spec-group';
        div.innerHTML = `<input type="text" placeholder="Характеристика" class="spec-key"><input type="text" placeholder="Значение" class="spec-value"><button type="button" class="remove-spec" style="background:rgba(239, 68, 68, 0.2); border:1px solid rgba(239, 68, 68, 0.5); border-radius:12px; padding:0 12px; color:#F87171; cursor:pointer;">✕</button>`;
        document.getElementById('specsContainer').appendChild(div);
        div.querySelector('.remove-spec').onclick = () => div.remove();
    };
    document.querySelectorAll('.remove-spec').forEach(btn => btn.onclick = function() { this.closest('.spec-group').remove(); });

    document.getElementById('loginBtn').onclick = () => {
        let phone = document.getElementById('authPhone').value;
        let pass = document.getElementById('authPassword').value;
        let user = users.find(u => u.phone === phone && u.password === pass);
        if(user) { currentUser = user; saveAll(); document.getElementById('authModal').style.display = 'none'; showToast(`👋 Добро пожаловать, ${user.name}!`); renderProducts(); }
        else showToast("❌ Неверный телефон или пароль");
    };

    document.getElementById('registerBtn').onclick = () => {
        document.getElementById('authName').style.display = 'block';
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('registerBtn').innerText = 'Создать аккаунт';
        document.getElementById('registerBtn').onclick = () => {
            let name = document.getElementById('authName').value.trim();
            let phone = document.getElementById('authPhone').value.trim();
            let pass = document.getElementById('authPassword').value;
            if(!name || !phone || !pass) { showToast("⚠️ Заполните все поля"); return; }
            if(users.find(u => u.phone === phone)) { showToast("❌ Этот номер уже зарегистрирован"); return; }
            let newUser = { id: Date.now(), name, phone, password: pass };
            users.push(newUser);
            currentUser = newUser;
            saveAll();
            document.getElementById('authModal').style.display = 'none';
            showToast(`🎉 Регистрация успешна! Добро пожаловать, ${name}!`);
            renderProducts();
        };
    };

    document.getElementById('adminAccessBtn').onclick = () => {
        let phone = document.getElementById('adminPhone').value.trim();
        if (phone === ADMIN_PHONE) {
            document.getElementById('adminAuthModal').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            showToast("✅ Добро пожаловать в админ панель!");
        } else {
            showToast("❌ Неверный номер администратора");
        }
    };

    document.getElementById('checkoutBtn').onclick = () => {
        if(!isAuthenticated()) return;
        document.getElementById('cartModal').style.display = 'none';
        showModal('orderModal');
    };

    document.getElementById('orderForm').onsubmit = (e) => {
        e.preventDefault();
        showToast("✅ Заказ успешно оформлен!");
        document.getElementById('orderModal').style.display = 'none';
        cart = [];
        saveAll();
        renderProducts();
    };

    document.getElementById('cartHeaderBtn').onclick = showCartModal;
    document.getElementById('filterBtn').onclick = () => {
        document.getElementById('filtersDrawer').classList.toggle('open');
        document.getElementById('overlay').style.display = document.getElementById('filtersDrawer').classList.contains('open') ? 'block' : 'none';
    };
    document.getElementById('closeFilters').onclick = () => {
        document.getElementById('filtersDrawer').classList.remove('open');
        document.getElementById('overlay').style.display = 'none';
    };
    document.getElementById('overlay').onclick = () => {
        document.getElementById('filtersDrawer').classList.remove('open');
        document.getElementById('overlay').style.display = 'none';
    };
    document.getElementById('applyFiltersBtn').onclick = () => {
        renderProducts();
        document.getElementById('filtersDrawer').classList.remove('open');
        document.getElementById('overlay').style.display = 'none';
    };

    document.getElementById('searchInput').oninput = (e) => {
        searchQuery = e.target.value.toLowerCase();
        renderProducts();
    };

    document.getElementById('closeProductPage').onclick = () => {
        document.getElementById('productPage').style.display = 'none';
        document.body.style.overflow = 'auto';
    };

    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            let nav = btn.dataset.nav;
            if(nav === 'home') {
                document.getElementById('productsContainer').style.display = 'grid';
                document.getElementById('adminPanel').style.display = 'none';
            } else if(nav === 'cart') {
                showCartModal();
            } else if(nav === 'profile') {
                showProfileModal();
            }
        };
    });

    // Инициализация
    function renderCategories() {
        let categories = ["Все", "Смартфоны", "Наушники", "Зарядки", "Power Bank", "Гаджеты"];
        document.getElementById('categoriesList').innerHTML = categories.map(c => 
            `<button class="cat-btn ${c === 'Все' ? 'active' : ''}" onclick="currentCategory='${c}'; renderProducts(); document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active')); this.classList.add('active');">${c}</button>`
        ).join('');
    }

    renderCategories();
    renderProducts();
    updateBadges();

    document.getElementById('userIconBtn').onclick = () => {
        if(currentUser) showProfileModal();
        else showModal('authModal');
    };
</script>

</body>
        </html>
