<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="site-title">SIM MARKET | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #000; color: #fff; margin: 0; }
        .gold-text { color: #bf953f; }
        
        /* Твой золотой ободок */
        .premium-card {
            position: relative;
            background: #0d0d0d;
            border-radius: 22px;
            padding: 2px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .premium-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, transparent, transparent, #bf953f);
            animation: rotate 4s linear infinite;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        
        .card-content {
            background: #0d0d0d;
            border-radius: 20px;
            padding: 20px;
            z-index: 1;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Новый стиль для Новостей из админки */
        #blog-container {
            margin: 10px 15px 25px 15px;
            padding: 15px;
            background: linear-gradient(135deg, #111 0%, #050505 100%);
            border-left: 3px solid #bf953f;
            border-radius: 12px;
        }

        .op-badge { font-size: 8px; padding: 2px 8px; border-radius: 6px; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; display: inline-block; }
        .op-МТС { background: #ff0000; color: white; }
        .op-БИЛАЙН { background: #ffcc00; color: black; }
        .op-МЕГАФОН { background: #00b956; color: white; }

        .btn-buy { background: #bf953f; color: #000; font-weight: 800; padding: 12px 18px; border-radius: 14px; font-size: 10px; text-transform: uppercase; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        input { background: #151515!important; border: 1px solid #222!important; color: #fff!important; padding: 16px; border-radius: 16px; width: 100%; outline: none; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header class="p-6 flex justify-between items-center sticky top-0 bg-black/90 backdrop-blur-md z-50 border-b border-white/5">
        <h1 class="text-xl font-black italic gold-text" id="logo-text">SIM <span class="text-white">MARKET</span></h1>
        <div id="auth-section">
            <button onclick="openM('auth-m')" class="text-[9px] font-black uppercase bg-white text-black px-5 py-2.5 rounded-full shadow-lg shadow-white/10">Вход / Рег</button>
        </div>
        <div id="user-info" class="hidden flex items-center gap-3">
            <div class="text-right">
                <p id="u-name" class="text-[10px] font-black uppercase white"></p>
                <p id="u-phone" class="text-[9px] gold-text font-bold"></p>
                <p class="text-[7px] text-green-500 font-bold uppercase tracking-widest">Онлайн</p>
            </div>
            <button onclick="logout()" class="text-[18px] opacity-30">✕</button>
        </div>
    </header>

    <!-- СЕКЦИЯ НОВОСТЕЙ (ИЗ АДМИНКИ) -->
    <div id="blog-container" class="hidden">
        <p class="text-[9px] font-black gold-text uppercase mb-2 tracking-[0.2em]">Объявление от админа:</p>
        <div id="blog-content" class="text-sm font-medium leading-relaxed opacity-90"></div>
    </div>

    <main class="p-4">
        <div id="numbers-grid" class="space-y-1"></div>
    </main>

    <div id="auth-m" class="modal">
        <div class="bg-[#0d0d0d] p-8 rounded-3xl w-full max-w-sm border border-white/10 shadow-2xl">
            <h3 class="text-xl font-black gold-text mb-2 uppercase italic">Личный кабинет</h3>
            <p class="text-[10px] text-gray-500 mb-6 uppercase">Введите данные для входа или регистрации</p>
            <div id="auth-form" class="space-y-2">
                <input type="text" id="l-phone" placeholder="Ваш номер (928...)">
                <input type="text" id="l-name" placeholder="Ваше Имя (для новых)">
                <input type="password" id="l-pass" placeholder="Пароль">
                <button onclick="doAuth()" class="btn-buy w-full py-4 text-xs mt-4">Продолжить</button>
                <button onclick="closeM()" class="w-full text-[9px] opacity-20 uppercase mt-4">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        const conf = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(conf);
        const db = firebase.database();

        function openM(id) { document.getElementById(id).classList.add('active'); }
        function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }

        // СИНХРОНИЗАЦИЯ SEO И НАЗВАНИЯ
        function syncAdminSettings() {
            db.ref('settings/seo').on('value', snap => {
                const s = snap.val();
                if(s && s.title) {
                    document.getElementById('site-title').innerText = s.title;
                    document.getElementById('logo-text').innerHTML = s.title.split(' ')[0] + " <span class='text-white'>" + (s.title.split(' ')[1] || '') + "</span>";
                }
            });
        }

        // ЗАГРУЗКА НОВОСТЕЙ ИЗ АДМИНКИ
        function loadAdminBlog() {
            db.ref('blog').limitToLast(1).on('value', snap => {
                const box = document.getElementById('blog-container');
                const content = document.getElementById('blog-content');
                if(snap.exists()) {
                    box.classList.remove('hidden');
                    snap.forEach(post => {
                        const d = post.val();
                        content.innerHTML = `<span class="font-bold">${d.title}</span><br>${d.text}`;
                    });
                }
            });
        }

        function doAuth() {
            const p = document.getElementById('l-phone').value.replace(/\D/g, "");
            const pass = document.getElementById('l-pass').value;
            const name = document.getElementById('l-name').value;

            if(p.length < 10 || pass.length < 3) return alert("Заполните данные корректно");

            db.ref('users/' + p).once('value', snap => {
                const u = snap.val();
                if(u) {
                    if(u.banned && (u.banned === 'forever' || Date.now() < u.banned)) return alert("ВЫ ЗАБАНЕНЫ");
                    if(u.pass === pass) {
                        localStorage.setItem('user', p);
                        localStorage.setItem('userName', u.name || "Клиент");
                        db.ref('users/' + p).update({ status: "Online", lastSeen: new Date().toLocaleString() });
                        location.reload();
                    } else alert("Неверный пароль");
                } else {
                    if(!name) return alert("Введите имя для регистрации!");
                    db.ref('users/' + p).set({ 
                        name: name, pass: pass, role: 'user', regDate: Date.now(), status: "Online"
                    }).then(() => {
                        localStorage.setItem('user', p);
                        localStorage.setItem('userName', name);
                        location.reload();
                    });
                }
            });
        }

        function loadNumbers() {
            db.ref('inventory').on('value', snap => {
                const grid = document.getElementById('numbers-grid');
                grid.innerHTML = "";
                snap.forEach(c => {
                    const i = c.val();
                    grid.innerHTML += `
                        <div class="premium-card">
                            <div class="card-content">
                                <div>
                                    <span class="op-badge op-${i.op}">${i.op}</span>
                                    <h4 class="text-2xl font-black italic tracking-tighter">+7 ${i.num}</h4>
                                    <p class="gold-text font-black text-lg">${i.price} ₽</p>
                                </div>
                                <button onclick="buy('${i.num}', '${i.op}')" class="btn-buy">Купить</button>
                            </div>
                        </div>`;
                });
            });
        }

        function buy(num, op) {
            const uPhone = localStorage.getItem('user');
            const uName = localStorage.getItem('userName');
            if(!uPhone) return openM('auth-m');
            db.ref('orders/' + Date.now()).set({
                clientName: uName, clientPhone: uPhone, wantedNum: num, operator: op, date: new Date().toLocaleString(), status: 'new'
            }).then(() => alert(uName + ", заявка принята!"));
        }

        function logout() { 
            const u = localStorage.getItem('user');
            if(u) db.ref('users/' + u).update({ status: "Offline" });
            localStorage.clear(); 
            location.reload(); 
        }

        window.onload = () => {
            syncAdminSettings();
            loadAdminBlog();
            const u = localStorage.getItem('user');
            if(u) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('u-phone').innerText = "+7 " + u;
                document.getElementById('u-name').innerText = localStorage.getItem('userName');
            }
            loadNumbers();
        };
    </script>
</body>
</html>
