<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #050505; color: #fff; margin: 0; }
        .gold-grad { background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .buy-btn { background: linear-gradient(135deg, #bf953f, #fcf6ba); color: #000; font-weight: 900; padding: 16px; border-radius: 20px; width: 100%; text-transform: uppercase; font-size: 11px; }
        .input-dark { width: 100%; background: #111; border: 1px solid #333; padding: 16px; border-radius: 20px; color: #fff; outline: none; font-size: 16px; text-align: center; }
        .neon-card { position: relative; background: rgba(191,149,63,0.1); border-radius: 28px; padding: 1.5px; overflow: hidden; margin-bottom: 20px; }
        .neon-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, #bf953f, transparent, #fcf6ba, transparent); animation: rotate 4s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .card-inner { position: relative; background: #0d0d0d; border-radius: 27px; padding: 25px; z-index: 1; text-align: center; }
    </style>
</head>
<body class="p-4">

    <header class="flex justify-between items-center mb-8 pt-4 px-2">
        <h1 class="text-2xl font-black italic gold-grad uppercase">SIM MARKET</h1>
        <button onclick="openAuth()" id="login-btn" class="text-[10px] font-bold border border-[#bf953f]/40 px-6 py-2.5 rounded-full uppercase gold-grad">Вход</button>
    </header>

    <div id="list" class="max-w-md mx-auto"></div>

    <div id="auth-modal" class="fixed inset-0 bg-black/95 z-[9999] hidden items-center justify-center p-8 backdrop-blur-md">
        <div class="w-full max-w-xs space-y-6">
            <h2 id="modal-title" class="text-3xl font-black text-center gold-grad uppercase">Регистрация</h2>
            
            <div id="inputs-area" class="space-y-4">
                <input type="tel" id="u-phone" placeholder="8928..." class="input-dark">
                <input type="password" id="u-pass" placeholder="Пароль" class="input-dark">
            </div>

            <div id="code-area" class="hidden text-center space-y-4">
                <p class="text-[10px] font-black text-[#bf953f] uppercase">Введите 4 цифры звонка</p>
                <input type="number" id="u-code" placeholder="0000" class="input-dark text-2xl tracking-[10px] font-black">
            </div>

            <button id="main-btn" onclick="startAction()" class="buy-btn">Продолжить</button>
            <p onclick="closeAuth()" class="text-center text-[9px] opacity-20 uppercase font-black cursor-pointer">Отмена</p>
        </div>
    </div>

    <script>
        const API_ID = "C1E31980-AF45-CDCF-0DE2-F6B278C69D76";
        const fbCfg = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            authDomain: "nnnmb-a0b52.firebaseapp.com", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com", 
            projectId: "nnnmb-a0b52" 
        };
        firebase.initializeApp(fbCfg);
        const db = firebase.database();

        let correctCode = null;

        function openAuth() { document.getElementById('auth-modal').style.display = 'flex'; }
        function closeAuth() { document.getElementById('auth-modal').style.display = 'none'; }

        // Эту функцию вызовет SMS.RU
        window.onSmsReady = function(data) {
            const btn = document.getElementById('main-btn');
            btn.disabled = false;
            if(data.status === "OK") {
                correctCode = data.code;
                document.getElementById('code-area').classList.remove('hidden');
                document.getElementById('inputs-area').classList.add('hidden');
                btn.innerText = "Подтвердить";
            } else {
                alert("Ошибка: " + data.status_text);
                btn.innerText = "Продолжить";
            }
        };

        function startAction() {
            const phone = document.getElementById('u-phone').value.trim();
            const pass = document.getElementById('u-pass').value.trim();
            const btn = document.getElementById('main-btn');
            const cleanPhone = phone.replace(/\D/g, '');

            if(!phone || !pass) return alert("Заполните поля!");

            if(!correctCode) {
                btn.innerText = "ЗВОНИМ...";
                btn.disabled = true;

                // Создаем скрипт вручную (JSONP)
                const script = document.createElement('script');
                script.src = `https://sms.ru/code/call?phone=${cleanPhone}&api_id=${API_ID}&format=json&callback=onSmsReady`;
                
                // Если скрипт не загрузится за 5 секунд - принудительно сбросим зависание
                setTimeout(() => {
                    if(btn.disabled && !correctCode) {
                        btn.disabled = false;
                        btn.innerText = "Продолжить";
                        alert("Сервер SMS.RU не отвечает. Проверьте баланс или попробуйте позже.");
                    }
                }, 7000);

                document.body.appendChild(script);
            } else {
                // Если код уже пришел, проверяем его
                if(document.getElementById('u-code').value == correctCode) {
                    db.ref('users/' + cleanPhone).set({phone, pass}).then(() => {
                        alert("Успешно!");
                        location.reload();
                    });
                } else {
                    alert("Неверный код!");
                }
            }
        }

        // Загрузка
        db.ref('inventory').on('value', s => {
            const list = document.getElementById('list'); list.innerHTML = "";
            const items = s.val() || {};
            Object.keys(items).reverse().forEach(id => {
                const i = items[id];
                list.innerHTML += `<div class="neon-card"><div class="card-inner">
                    <div class="text-3xl font-black italic text-white mb-2">+7 ${i.num}</div>
                    <div class="text-xl font-bold gold-grad mb-6">${i.price} ₽</div>
                    <button class="buy-btn" onclick="openAuth()">Купить</button>
                </div></div>`;
            });
        });
    </script>
</body>
</html>
