<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #050505; color: #fff; margin:0; }

        /* ТА САМАЯ ЛОГО-АНИМАЦИЯ */
        .logo-shine {
            font-weight: 800; font-size: 32px; text-transform: uppercase;
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite; font-style: italic;
        }
        @keyframes shine { to { background-position: 200% center; } }

        /* ВОЗВРАЩАЕМ ЗОЛОТУЮ ВРАЩАЮЩУЮСЯ РАМКУ */
        .neon-card {
            position: relative; background: rgba(191, 149, 63, 0.1);
            border-radius: 24px; padding: 1.5px; overflow: hidden; margin-bottom: 25px;
        }
        .neon-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, #bf953f, #fcf6ba, #bf953f, transparent);
            animation: rotate 3s linear infinite;
        }
        .card-content {
            position: relative; background: #0a0a0a; border-radius: 22.5px;
            padding: 24px 20px; z-index: 1; display: flex; flex-direction: column; align-items: center;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .buy-btn { background: #bf953f; color: #fff; font-weight: 800; font-size: 11px; text-transform: uppercase; padding: 16px; border-radius: 14px; width: 100%; border: none; cursor: pointer; margin-top: 16px; transition: 0.3s; }
    </style>
</head>
<body class="p-6">

    <header class="flex flex-col items-center py-10">
        <h1 class="logo-shine">SIM MARKET</h1>
        <p class="text-[10px] font-bold opacity-30 tracking-[5px] mt-2 uppercase">Elite Stock</p>
    </header>

    <div id="list" class="max-w-md mx-auto pb-20">
        <p class="text-center opacity-20 py-10">Загрузка витрины...</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44",
            authDomain: "nnnmb-a0b52.firebaseapp.com",
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com",
            projectId: "nnnmb-a0b52"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // СЛУШАЕМ БАЗУ (СКЛАД)
        db.ref('inventory').on('value', s => {
            const list = document.getElementById('list');
            const data = s.val();
            if(!data) {
                list.innerHTML = '<p class="text-center opacity-20 py-10">Добавьте номера в админ-панели</p>';
                return;
            }
            list.innerHTML = "";
            Object.keys(data).reverse().forEach(k => {
                const item = data[k];
                list.innerHTML += `
                    <div class="neon-card">
                        <div class="card-content">
                            <div class="w-full flex justify-between items-center opacity-40 px-1 text-[9px] font-bold uppercase tracking-widest mb-3">
                                <span>${item.op.toUpperCase()}</span><span style="color:#bf953f italic">Elite</span>
                            </div>
                            <div class="text-3xl font-black italic tracking-tighter mb-1">+7 ${item.num}</div>
                            <div class="text-2xl font-bold" style="color: #bf953f">${item.price} ₽</div>
                            <button onclick="sendOrder('${item.num}')" class="buy-btn">Заказать номер</button>
                        </div>
                    </div>`;
            });
        });

        function sendOrder(n) {
            const name = prompt("Ваше имя:");
            const tel = prompt("Ваш телефон:");
            if(name && tel) {
                db.ref('leads').push({ num: n, fio: name, contact: tel, ts: Date.now() })
                .then(() => alert("Заявка отправлена!"));
            }
        }
    </script>
</body>
</html>
