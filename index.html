<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | OMNI-PLATFORM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap');
        
        :root { --gold: #bf953f; --gold-light: #fcf6ba; }
        body { font-family: 'Manrope', sans-serif; background: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }

        /* ГРАДИЕНТЫ */
        .gold-text { background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200%; animation: shine 3s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }

        /* КАРТОЧКА */
        .glass-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(191,149,63,0.2); border-radius: 24px; backdrop-filter: blur(10px); transition: 0.3s; }
        .glass-card:hover { border-color: var(--gold); transform: translateY(-3px); }

        /* КОЛЕСО ФОРТУНЫ */
        #wheel-container { position: relative; width: 260px; height: 260px; margin: 0 auto; }
        #wheel { width: 100%; height: 100%; border-radius: 50%; border: 5px solid var(--gold); transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); background: conic-gradient(#111 0deg 60deg, #222 60deg 120deg, #111 120deg 180deg, #222 180deg 240deg, #111 240deg 300deg, #222 300deg 360deg); }

        /* ЧАТ */
        #chat-window { display: none; position: fixed; bottom: 90px; right: 20px; width: 320px; height: 400px; background: #0a0a0a; border: 1px solid var(--gold); border-radius: 20px; z-index: 2000; flex-direction: column; overflow: hidden; }
        .msg { padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 13px; max-width: 80%; }
        .msg-bot { background: rgba(191,149,63,0.15); align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-user { background: var(--gold); color: #000; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: bold; }

        /* АНИМАЦИИ */
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 pb-32">

    <header class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-black italic gold-text uppercase leading-none">SIM MARKET</h1>
            <p class="text-[8px] tracking-[4px] opacity-40 uppercase">Omni Platform v1.0</p>
        </div>
        <div id="profile-trigger" onclick="openProfile()" class="hidden flex items-center gap-3 bg-white/5 p-1 pr-4 rounded-full border border-white/10">
            <div class="w-9 h-9 bg-gradient-to-tr from-[#bf953f] to-[#fcf6ba] rounded-full flex items-center justify-center text-black font-black">К</div>
            <div>
                <p id="user-points" class="text-xs font-black leading-none">0 XP</p>
                <p id="user-rank" class="text-[7px] uppercase font-bold text-[#bf953f]">BRONZE</p>
            </div>
        </div>
        <button id="login-btn" onclick="openModal('auth-modal')" class="bg-white/5 border border-white/10 px-6 py-2 rounded-full text-[10px] font-black uppercase gold-text">Вход</button>
    </header>

    <div class="space-y-4 mb-8">
        <div class="relative">
            <input type="text" id="search" oninput="filterItems()" placeholder="Умный поиск (777, 05, VIP)..." class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-[#bf953f] transition">
        </div>
        <div class="flex gap-2 overflow-x-auto no-scrollbar">
            <button class="bg-[#bf953f] text-black px-5 py-2 rounded-full text-[10px] font-black uppercase">Все</button>
            <button class="bg-white/5 px-5 py-2 rounded-full text-[10px] font-black uppercase opacity-60">VIP</button>
            <button class="bg-white/5 px-5 py-2 rounded-full text-[10px] font-black uppercase opacity-60">Мегафон</button>
            <button class="bg-white/5 px-5 py-2 rounded-full text-[10px] font-black uppercase opacity-60">❤️ Избранное</button>
        </div>
    </div>

    <div id="numbers-grid" class="grid gap-4 mb-12"></div>

    <section class="mb-12 glass-card p-6 text-center">
        <h2 class="text-lg font-black gold-text mb-4 uppercase italic">Колесо фортуны</h2>
        <div id="wheel-container">
            <div id="wheel"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <button onclick="spinWheel()" id="spin-btn" class="bg-white text-black w-12 h-12 rounded-full font-black text-[10px] shadow-xl border-4 border-black">GO</button>
            </div>
            <div class="absolute -top-2 left-1/2 -translate-x-1/2 text-xl">🔻</div>
        </div>
        <p class="text-[10px] opacity-40 mt-4 uppercase font-bold">Выигрывай до 500 бонусов ежедневно</p>
    </section>

    <section class="mb-12">
        <div class="flex justify-between items-end mb-4">
            <h2 class="text-lg font-black uppercase italic gold-text">Отзывы</h2>
            <p class="text-[10px] opacity-30">4.9 ⭐ (120+)</p>
        </div>
        <div id="reviews" class="space-y-3"></div>
    </section>

    <div id="chat-window">
        <div class="bg-[#bf953f] p-4 flex justify-between items-center">
            <span class="text-black font-black text-xs uppercase italic">AI Консультант</span>
            <span onclick="toggleChat()" class="text-black cursor-pointer">✕</span>
        </div>
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col">
            <div class="msg msg-bot">Привет! Я помогу выбрать номер. Спроси "Сколько стоит?" или "Какие есть VIP?"</div>
        </div>
        <div class="p-3 bg-white/5 border-t border-white/10 flex gap-2">
            <input type="text" id="chat-input" placeholder="Ваш вопрос..." class="flex-1 bg-transparent outline-none text-xs">
            <button onclick="sendMessage()" class="text-[#bf953f] font-black text-xs uppercase">Отправить</button>
        </div>
    </div>

    <div class="fixed bottom-6 right-6 flex flex-col gap-3">
        <div onclick="toggleChat()" class="w-14 h-14 bg-white text-black rounded-full flex items-center justify-center text-xl shadow-2xl cursor-pointer">🤖</div>
        <a href="https://t.me/kurban_sim" class="w-14 h-14 bg-[#0088cc] text-white rounded-full flex items-center justify-center text-xl shadow-2xl">✈️</a>
    </div>

    <div id="profile-modal" class="fixed inset-0 bg-black z-[3000] hidden flex-col p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-black gold-text italic">КАБИНЕТ</h2>
            <span onclick="closeModals()" class="text-3xl">✕</span>
        </div>
        <div class="glass-card p-6 mb-6 text-center">
            <p class="text-[10px] opacity-50 uppercase font-bold mb-2">Ваш баланс</p>
            <h3 id="modal-points" class="text-5xl font-black gold-text">0 XP</h3>
            <p id="modal-rank" class="text-xs font-bold text-[#bf953f] mt-2 uppercase">Уровень: Bronze</p>
        </div>
        <div class="space-y-4">
            <button class="w-full bg-white/5 p-5 rounded-2xl text-left border border-white/10 flex justify-between items-center">
                <span>Мои покупки</span>
                <span class="opacity-20">→</span>
            </button>
            <button class="w-full bg-white/5 p-5 rounded-2xl text-left border border-white/10 flex justify-between items-center">
                <span>Реферальная система</span>
                <span class="text-[#bf953f] text-xs font-bold">+50 XP за друга</span>
            </button>
            <button onclick="logout()" class="w-full p-5 text-red-500 font-bold uppercase text-xs tracking-widest">Выйти</button>
        </div>
    </div>

    <script>
        // ИНИЦИАЛИЗАЦИЯ (Замени ключи на свои)
        const fbCfg = { apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com" };
        firebase.initializeApp(fbCfg);
        const db = firebase.database();

        let user = JSON.parse(localStorage.getItem('sim_user_omni')) || null;
        let inventory = {};

        if(user) updateUI();

        // КОЛЕСО ФОРТУНЫ
        function spinWheel() {
            if(!user) return alert("Войдите, чтобы играть!");
            const btn = document.getElementById('spin-btn');
            const wheel = document.getElementById('wheel');
            const deg = Math.floor(5000 + Math.random() * 5000);
            
            btn.disabled = true;
            wheel.style.transform = `rotate(${deg}deg)`;
            
            setTimeout(() => {
                const prize = 100; // Упрощенно
                user.points += prize;
                saveUser();
                alert(`Поздравляем! Вы выиграли ${prize} XP!`);
            }, 4000);
        }

        // AI ЧАТ-БОТ
        function toggleChat() {
            const win = document.getElementById('chat-window');
            win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendMessage() {
            const inp = document.getElementById('chat-input');
            const box = document.getElementById('chat-messages');
            if(!inp.value) return;

            box.innerHTML += `<div class="msg msg-user">${inp.value}</div>`;
            
            // Логика бота
            let reply = "Интересный вопрос! Напишите Курбану в Телеграм для точного расчета.";
            const v = inp.value.toLowerCase();
            if(v.includes("цен")) reply = "Цены на VIP номера начинаются от 5 000 ₽. Посмотрите список выше!";
            if(v.includes("мтс")) reply = "Да, у нас отличный выбор МТС. Красивые семерки в наличии.";
            
            setTimeout(() => {
                box.innerHTML += `<div class="msg msg-bot">${reply}</div>`;
                box.scrollTop = box.scrollHeight;
            }, 600);
            inp.value = "";
        }

        // ОБНОВЛЕНИЕ ДАННЫХ
        function updateUI() {
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('profile-trigger').style.display = 'flex';
            document.getElementById('user-points').innerText = `${user.points} XP`;
            document.getElementById('modal-points').innerText = `${user.points} XP`;
            
            let rank = "BRONZE";
            if(user.points > 500) rank = "SILVER";
            if(user.points > 1500) rank = "GOLD";
            document.getElementById('user-rank').innerText = rank;
            document.getElementById('modal-rank').innerText = "Уровень: " + rank;
        }

        function saveUser() {
            localStorage.setItem('sim_user_omni', JSON.stringify(user));
            updateUI();
        }

        function openProfile() { document.getElementById('profile-modal').style.display = 'flex'; }
        function closeModals() { document.getElementById('profile-modal').style.display = 'none'; }
        function logout() { localStorage.removeItem('sim_user_omni'); location.reload(); }

        // РЕНДЕР ИНВЕНТАРЯ
        db.ref('inventory').on('value', s => {
            inventory = s.val() || {};
            const grid = document.getElementById('numbers-grid');
            grid.innerHTML = "";
            Object.values(inventory).reverse().forEach(i => {
                grid.innerHTML += `
                    <div class="glass-card p-5 fade-in">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[9px] font-black opacity-30 uppercase tracking-widest">${i.op || 'BEAUTIFUL'}</span>
                            <span class="text-xs opacity-50">❤️</span>
                        </div>
                        <h3 class="text-3xl font-black italic tracking-tighter mb-1">+7 ${i.num}</h3>
                        <div class="flex justify-between items-center mt-4">
                            <span class="text-xl font-black gold-text">${i.price} ₽</span>
                            <button onclick="alert('Оформление...') " class="bg-white text-black px-4 py-2 rounded-xl text-[10px] font-black uppercase">Купить</button>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
