<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #050505; color: #fff; margin: 0; }
        
        .gold-grad { 
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-size: 200% auto; animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .buy-btn { background: linear-gradient(135deg, #bf953f, #fcf6ba); color: #000; font-weight: 900; padding: 14px; border-radius: 18px; width: 100%; text-transform: uppercase; font-size: 11px; }
        .input-dark { width: 100%; background: #111; border: 1px solid #333; padding: 14px; border-radius: 18px; color: #fff; outline: none; text-align: center; }
        
        /* Вкладки */
        .tab { padding: 8px 18px; border-radius: 100px; font-size: 10px; font-weight: 800; border: 1px solid rgba(191,149,63,0.2); color: rgba(191,149,63,0.5); cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .tab.active { background: #bf953f; color: #000; border-color: #bf953f; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .neon-card { position: relative; background: rgba(191,149,63,0.1); border-radius: 28px; padding: 1.5px; overflow: hidden; margin-bottom: 15px; cursor: pointer; }
        .neon-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, #bf953f, transparent, #fcf6ba, transparent); animation: rotate 4s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .card-inner { position: relative; background: #0d0d0d; border-radius: 27px; padding: 20px; z-index: 1; text-align: center; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-blur: 15px; }
    </style>
</head>
<body class="p-4 pb-32">

    <header class="flex justify-between items-center mb-6 pt-2 px-2">
        <h1 class="text-2xl font-black italic gold-grad uppercase">SIM MARKET</h1>
        <div id="user-info" onclick="openProfile()" class="hidden bg-[#bf953f]/10 px-4 py-2 rounded-full border border-[#bf953f]/20 cursor-pointer flex items-center gap-2">
            <span id="user-phone-top" class="text-[10px] font-black text-[#bf953f]">Профиль</span>
        </div>
        <button id="login-btn" onclick="openAuth()" class="text-[10px] font-bold border border-[#bf953f]/30 px-5 py-2 rounded-full uppercase gold-grad">Вход</button>
    </header>

    <div class="flex gap-2 overflow-x-auto mb-6 no-scrollbar px-2">
        <div class="tab active" onclick="filterOp('ALL', this)">Все</div>
        <div class="tab" onclick="filterOp('МТС', this)">МТС</div>
        <div class="tab" onclick="filterOp('БИЛАЙН', this)">Билайн</div>
        <div class="tab" onclick="filterOp('МЕГАФОН', this)">Мегафон</div>
        <div class="tab" onclick="filterOp('ТЕЛЕ2', this)">Tele2</div>
    </div>

    <div id="list" class="max-w-md mx-auto space-y-4"></div>

    <div id="number-menu" class="modal">
        <div class="w-full max-w-xs space-y-4">
            <h3 id="menu-num" class="text-3xl font-black text-center text-white italic"></h3>
            <button onclick="startOrder()" class="buy-btn">Оформить покупку</button>
            <p onclick="closeModals()" class="text-center text-[9px] opacity-30 uppercase font-black cursor-pointer py-2">Назад</p>
        </div>
    </div>

    <div id="order-modal" class="modal">
        <div class="w-full max-w-xs space-y-4 bg-[#0d0d0d] p-6 rounded-[30px] border border-white/5">
            <h2 class="text-xl font-black text-center gold-grad uppercase">Оформление</h2>
            <input type="text" id="order-name" placeholder="Ваше имя" class="input-dark">
            <input type="tel" id="order-contact" placeholder="Ваш телефон для связи" class="input-dark">
            <button id="confirm-btn" onclick="confirmPurchase()" class="buy-btn">Подтвердить заказ</button>
            <p onclick="closeModals()" class="text-center text-[9px] opacity-30 uppercase font-black cursor-pointer">Отмена</p>
        </div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="w-full max-w-sm h-[80vh] overflow-y-auto px-4 py-8 text-center">
            <h2 class="text-3xl font-black gold-grad mb-6">КАБИНЕТ</h2>
            <div id="history-list" class="space-y-3 mb-8 text-left"></div>
            <button onclick="logout()" class="w-full py-4 text-red-500 text-[10px] font-black uppercase opacity-50">Выход</button>
            <p onclick="closeModals()" class="mt-6 text-[9px] opacity-30 font-black cursor-pointer uppercase">Закрыть</p>
        </div>
    </div>

    <div id="auth-modal" class="modal">
        <div class="w-full max-w-xs space-y-4">
            <h2 id="auth-title" class="text-2xl font-black text-center gold-grad">РЕГИСТРАЦИЯ</h2>
            <input type="tel" id="u-phone" placeholder="Ваш номер" class="input-dark">
            <input type="password" id="u-pass" placeholder="Пароль" class="input-dark">
            <input type="text" id="u-word" placeholder="Кодовое слово" class="input-dark">
            <button onclick="handleAuth()" class="buy-btn">Продолжить</button>
            <p onclick="toggleAuthMode()" id="auth-toggle" class="text-center text-[10px] opacity-40 uppercase font-black cursor-pointer">Уже есть аккаунт? Войти</p>
        </div>
    </div>

    <script>
        const fbCfg = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            authDomain: "nnnmb-a0b52.firebaseapp.com", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com", 
            projectId: "nnnmb-a0b52" 
        };
        firebase.initializeApp(fbCfg);
        const db = firebase.database();

        const TG_TOKEN = "7936166446:AAGZ752S6LqZ8C_v-m3_zU6WfXnE1wA0z6U";
        const TG_CHAT_ID = "6102604856";

        let user = JSON.parse(localStorage.getItem('sim_user_v3'));
        let selectedNum = null;
        let isLogin = false;
        let currentFilter = 'ALL';
        let allNumbers = {};

        if(user) showUserUI();

        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
        function openAuth() { document.getElementById('auth-modal').style.display = 'flex'; }
        function openProfile() { document.getElementById('profile-modal').style.display = 'flex'; loadHistory(); }

        function toggleAuthMode() {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "ВХОД" : "РЕГИСТРАЦИЯ";
            document.getElementById('auth-toggle').innerText = isLogin ? "Создать аккаунт" : "Уже есть аккаунт? Войти";
        }

        function handleAuth() {
            const ph = document.getElementById('u-phone').value.trim();
            const ps = document.getElementById('u-pass').value.trim();
            const wd = document.getElementById('u-word').value.trim();
            const clean = ph.replace(/\D/g, '');
            if(!ph || !ps || !wd) return alert("Заполните все поля!");

            if(isLogin) {
                db.ref('users/'+clean).once('value', s => {
                    const d = s.val();
                    if(d && d.pass === ps && d.word === wd) { user = d; saveUser(); }
                    else alert("Данные неверны!");
                });
            } else {
                const newData = {phone: ph, pass: ps, word: wd, clean: clean};
                db.ref('users/'+clean).set(newData).then(() => { user = newData; saveUser(); });
            }
        }

        function saveUser() { localStorage.setItem('sim_user_v3', JSON.stringify(user)); showUserUI(); closeModals(); }
        function showUserUI() { document.getElementById('login-btn').classList.add('hidden'); document.getElementById('user-info').classList.remove('hidden'); }
        function logout() { localStorage.removeItem('sim_user_v3'); location.reload(); }

        // ФИЛЬТРАЦИЯ
        function filterOp(op, el) {
            currentFilter = op.toUpperCase();
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderItems();
        }

        // ЗАГРУЗКА И ПОКУПКА
        function openNumMenu(num, price) {
            selectedNum = {num, price};
            document.getElementById('menu-num').innerText = "+7 " + num;
            document.getElementById('number-menu').style.display = 'flex';
        }

        function startOrder() {
            if(!user) return openAuth();
            document.getElementById('number-menu').style.display = 'none';
            document.getElementById('order-modal').style.display = 'flex';
        }

        async function confirmPurchase() {
            const name = document.getElementById('order-name').value;
            const contact = document.getElementById('order-contact').value;
            const btn = document.getElementById('confirm-btn');
            if(!name || !contact) return alert("Введите имя и телефон!");

            btn.disabled = true; btn.innerText = "ОТПРАВЛЯЕМ...";

            const order = {
                clientPhone: user.phone, clientName: name, clientContact: contact,
                number: selectedNum.num, price: selectedNum.price,
                date: new Date().toLocaleString(), status: 'Новый'
            };

            try {
                await db.ref('orders').push(order);
                await db.ref('user_history/' + user.clean).push(order);
                const text = `🚀 ЗАКАЗ!\n\nНомер: +7 ${order.number}\nЦена: ${order.price} ₽\nИмя: ${name}\nТел: ${contact}`;
                await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent(text)}`);
                alert("Готово! Мы скоро позвоним.");
                closeModals();
            } catch (e) { alert("Ошибка!"); } 
            finally { btn.disabled = false; btn.innerText = "Подтвердить заказ"; }
        }

        function loadHistory() {
            const hList = document.getElementById('history-list');
            db.ref('user_history/' + user.clean).on('value', s => {
                hList.innerHTML = "";
                const data = s.val();
                if(!data) hList.innerHTML = '<p class="opacity-20 text-[10px] text-center">Нет истории</p>';
                else {
                    Object.values(data).reverse().forEach(h => {
                        hList.innerHTML += `<div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex justify-between items-center mb-2">
                            <div><div class="text-xs font-bold">+7 ${h.number}</div><div class="text-[7px] opacity-30">${h.date}</div></div>
                            <div class="text-[9px] gold-grad font-black uppercase">${h.status}</div>
                        </div>`;
                    });
                }
            });
        }

        db.ref('inventory').on('value', s => { allNumbers = s.val() || {}; renderItems(); });

        function renderItems() {
            const list = document.getElementById('list');
            list.innerHTML = "";
            Object.values(allNumbers).reverse().forEach(i => {
                if(currentFilter !== 'ALL' && i.op.toUpperCase() !== currentFilter) return;
                list.innerHTML += `<div class="neon-card" onclick="openNumMenu('${i.num}', '${i.price}')">
                    <div class="card-inner">
                        <div class="text-[8px] font-black opacity-20 uppercase tracking-[2px] mb-2">${i.op}</div>
                        <div class="text-3xl font-black italic mb-1 text-white">+7 ${i.num}</div>
                        <div class="text-xl font-bold gold-grad">${i.price} ₽</div>
                    </div>
                </div>`;
            });
        }
    </script>
</body>
</html>
