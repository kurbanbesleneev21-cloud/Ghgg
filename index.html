<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | LUXURY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap');
        
        body { background: #050505; color: #fff; font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }

        /* ЕДИНЫЙ ЗОЛОТОЙ ПЕРЕЛИВАЮЩИЙСЯ ЛОГОТИП */
        .logo-gold {
            font-weight: 800;
            font-size: 28px;
            letter-spacing: -1px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fcf6ba, #bf953f);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldFlow 3s linear infinite;
        }

        @keyframes goldFlow {
            to { background-position: 200% center; }
        }

        /* ДИЗАЙН КАРТОЧЕК */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            transition: 0.3s ease;
        }

        .tab-btn {
            font-size: 11px; font-weight: 800; text-transform: uppercase;
            color: #71717a; padding: 12px 24px; border-radius: 14px; transition: 0.3s;
        }
        .tab-active { background: #fff; color: #000; }

        .input-luxury {
            background: #0f0f0f; border: 1px solid #1a1a1a; border-radius: 18px;
            padding: 18px; width: 100%; color: #fff; outline: none;
        }

        /* КАСТОМНЫЕ КНОПКИ ЗАГРУЗКИ ФАЙЛОВ */
        .file-label {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; p: 20px; border: 2px dashed rgba(255,255,255,0.1);
            border-radius: 20px; background: rgba(255,255,255,0.02);
            cursor: pointer; transition: 0.3s;
        }
        .file-label:hover { border-color: #fbbf24; background: rgba(251, 191, 36, 0.05); }
        .file-text { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #fbbf24; letter-spacing: 1px; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>

        <div class="logo-gold">SIM MARKET</div>
        <div class="flex items-center gap-2 opacity-30 mt-1">
            <span class="text-[8px] font-bold uppercase tracking-[4px]">Premium Numbers</span>
        </div>
    </header>
