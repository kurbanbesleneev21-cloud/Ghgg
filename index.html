<header class="px-6 py-10 flex flex-col items-center border-b border-white/5">
    <h1 class="logo-shine italic">SIM MARKET</h1>
    <div class="flex items-center gap-2 mt-2 opacity-30">
        <div class="w-1 h-1 rounded-full bg-amber-500 animate-pulse"></div>
        <span class="text-[9px] font-bold uppercase tracking-[4px]">Premium Store</span>
    </div>
</header>

<div id="order-modal" class="items-center justify-center p-5">
    <div class="glass-card w-full max-w-md p-8 relative border-white/10 shadow-2xl">
        <button onclick="closeModal()" class="absolute top-6 right-6 text-zinc-500 text-xl">✕</button>
        
        <h3 class="text-[10px] font-bold text-amber-500 uppercase tracking-[3px] mb-2 text-center">Оформление заказа</h3>
        <p id="selected-num" class="text-3xl font-black mb-8 tracking-tighter text-center italic"></p>

        <form id="tg-form" class="space-y-4">
            <input type="text" id="fio" placeholder="Ваше полное ФИО" class="input-luxury text-sm" required>
            <input type="tel" id="contact" placeholder="Ваш номер для связи" class="input-luxury text-sm" required>
            
            <div class="space-y-3">
                <label class="flex flex-col items-center justify-center p-5 border-2 border-dashed border-white/10 rounded-2xl bg-white/5 cursor-pointer hover:border-amber-500/50 transition-all group">
                    <span class="text-[11px] font-black uppercase text-amber-500 group-hover:scale-105 transition-transform">Выбрать фото паспорта</span>
                    <span id="p1-info" class="text-[8px] opacity-40 mt-1 uppercase font-bold tracking-widest">Лицевая сторона</span>
                    <input type="file" id="p1" accept="image/*" class="hidden" required onchange="showFile('p1', 'p1-info')">
                </label>

                <label class="flex flex-col items-center justify-center p-5 border-2 border-dashed border-white/10 rounded-2xl bg-white/5 cursor-pointer hover:border-amber-500/50 transition-all group">
                    <span class="text-[11px] font-black uppercase text-amber-500 group-hover:scale-105 transition-transform">Выбрать фото прописки</span>
                    <span id="p2-info" class="text-[8px] opacity-40 mt-1 uppercase font-bold tracking-widest">Страница с адресом</span>
                    <input type="file" id="p2" accept="image/*" class="hidden" required onchange="showFile('p2', 'p2-info')">
                </label>
            </div>

            <button type="submit" id="sub-btn" class="w-full btn-order py-5 text-[11px] uppercase tracking-[4px] mt-2 active:scale-95 transition-all">
                Отправить заявку
            </button>
        </form>
    </div>
</div>
