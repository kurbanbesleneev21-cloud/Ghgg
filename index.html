 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Загрузка...</title>
    <meta name="description" id="meta-desc" content="">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #050505; color: #fff; }
        .gold-text { color: #bf953f; }
        .gold-bg { background: #bf953f; color: #000; }
        .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; }
        input { background: #111; border: 1px solid #222; padding: 15px; border-radius: 12px; width: 100%; color: #fff; outline: none; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header class="p-6 flex justify-between items-center max-w-6xl mx-auto">
        <h1 class="text-2xl font-black italic gold-text">SIM<span class="text-white">MARKET</span></h1>
        <nav class="hidden md:flex gap-8 text-sm font-bold uppercase tracking-widest">
            <a href="#numbers" class="hover:gold-text transition">Номера</a>
            <a href="#blog" class="hover:gold-text transition">Новости</a>
            <a href="admin.html" class="opacity-30">Вход</a>
        </nav>
    </header>

    <!-- Главный блок (Hero) -->
    <section class="py-20 px-6 text-center max-w-4xl mx-auto">
        <h2 id="hero-title" class="text-5xl md:text-7xl font-black mb-6 uppercase">КРАСИВЫЕ НОМЕРА</h2>
        <p id="hero-desc" class="text-gray-400 text-lg mb-10">Загрузка информации...</p>
        <a href="#order" class="gold-bg px-10 py-4 rounded-full font-black uppercase inline-block">Оставить заявку</a>
    </section>

    <!-- Блог (Новости из Админки) -->
    <section id="blog" class="py-20 px-6 max-w-6xl mx-auto">
        <h3 class="text-3xl font-black mb-10 italic uppercase">Новости и Акции</h3>
        <div id="blog-container" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Сюда придут посты из админки -->
            <p class="opacity-20">Загрузка новостей...</p>
        </div>
    </section>

    <!-- Форма заказа (Леды) -->
    <section id="order" class="py-20 px-6 max-w-xl mx-auto">
        <div class="glass p-8 space-y-6">
            <h3 class="text-2xl font-black text-center uppercase">Заказать номер</h3>
            <input type="text" id="order-name" placeholder="Ваше имя">
            <input type="tel" id="order-phone" placeholder="Ваш телефон (+7)">
            <input type="text" id="order-num" placeholder="Желаемый номер или маска (напр. *777*)">
            <button onclick="sendOrder()" class="gold-bg w-full py-4 rounded-xl font-black uppercase">Отправить в SIM CORE</button>
        </div>
    </section>

<script>
    // ТВОЙ FIREBASE (Тот же, что в админке)
    const firebaseConfig = { 
        apiKey: "AIzaSyCRjRJkH4dPxvyYD-37emejFvK11g6hZ44", 
        databaseURL: "https://nnnmb-a0b52-default-rtdb.firebaseio.com" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. СИНХРОНИЗАЦИЯ НАСТРОЕК (SEO и Тексты)
    function loadSettings() {
        db.ref('settings').on('value', snap => {
            const data = snap.val();
            if (data) {
                document.title = data.siteName || "SIM MARKET";
                document.getElementById('page-title').innerText = data.siteName || "SIM MARKET";
                document.getElementById('meta-desc').content = data.seoDesc || "";
                document.getElementById('hero-title').innerText = data.siteName || "КРАСИВЫЕ НОМЕРА";
                document.getElementById('hero-desc').innerText = data.seoDesc || "Лучшие предложения в регионе.";
            }
        });
    }

    // 2. ЗАГРУЗКА БЛОГА (Из админки)
    function loadBlog() {
        db.ref('blog').on('value', snap => {
            const container = document.getElementById('blog-container');
            container.innerHTML = "";
            snap.forEach(post => {
                const d = post.val();
                container.innerHTML += `
                    <div class="glass p-6 hover:border-[#bf953f] transition duration-500">
                        <p class="text-[10px] gold-text font-bold mb-2 uppercase">${d.date}</p>
                        <h4 class="text-xl font-bold mb-3">${d.title}</h4>
                        <p class="text-sm text-gray-400 leading-relaxed">${d.text}</p>
                    </div>`;
            });
        });
    }

    // 3. ОТПРАВКА ЗАЯВКИ (В админку)
    function sendOrder() {
        const name = document.getElementById('order-name').value;
        const phone = document.getElementById('order-phone').value;
        const num = document.getElementById('order-num').value;

        if(!name || !phone) return alert("Пожалуйста, заполни имя и телефон!");

        db.ref('orders').push({
            clientName: name,
            clientPhone: phone,
            wantedNum: num,
            date: new Date().toLocaleString('ru-RU'),
            read: false
        }).then(() => {
            alert("Заявка успешно отправлена! Мы свяжемся с вами.");
            document.getElementById('order-name').value = "";
            document.getElementById('order-phone').value = "";
            document.getElementById('order-num').value = "";
        });
    }

    window.onload = () => {
        loadSettings();
        loadBlog();
    };
</script>
</body>
</html>
