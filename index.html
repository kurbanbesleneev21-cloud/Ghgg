<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIM MARKET | КАТАЛОГ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #09090b; color: #f4f4f5; font-family: 'Manrope', sans-serif; }
        .glass { background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; transition: 0.2s; }
        .card:active { transform: scale(0.98); }
        #toast { position: fixed; bottom: 20px; left: 20px; right: 20px; transform: translateY(150%); transition: 0.4s; z-index: 100; }
        #toast.active { transform: translateY(0); }
    </style>
</head>
<body class="pb-10">

    <header class="p-6 sticky top-0 z-50 glass border-b border-white/5 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-extrabold tracking-tighter uppercase">SIM <span class="gold-text">MARKET</span></h1>
            <p class="text-[8px] font-bold text-zinc-500 uppercase tracking-widest mt-1">Premium SIM Dagestan</p>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <input type="text" id="q" oninput="draw()" placeholder="Поиск номера..." class="w-full p-5 mb-6 rounded-2xl bg-zinc-900 border border-zinc-800 outline-none focus:border-amber-500 text-sm">
        <div id="list" class="space-y-4"><div class="text-center py-20 opacity-20 text-xs">ЗАГРУЗКА...</div></div>
    </main>

    <div id="toast" class="glass p-4 rounded-2xl border-amber-500/50 text-center text-xs font-bold text-amber-500 uppercase">
        ✅ Заявка отправлена! Мы свяжемся с вами.
    </div>

    <script>
        const TOKEN = "8279695581:AAGuQgQhmgq9QaTX4rULywq6o18MeT3XIUw";
        const MY_ID = "8768514374"; 

        const BIN = "69c9d640aaba882197a65742"; 
        const KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW"; 
        let db = [];

        async function init() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN}/latest`, { headers: {'X-Master-Key': KEY} });
                const data = await res.json();
                db = data.record.record || data.record;
                draw();
            } catch(e) { console.error("Load error"); }
        }

        function draw() {
            const q = document.getElementById('q').value.toLowerCase();
            const filtered = db.filter(i => String(i.n).includes(q));
            document.getElementById('list').innerHTML = filtered.map(i => `
                <div class="card p-6 flex justify-between items-center">
                    <div>
                        <div class="text-2xl font-black tracking-tighter">${i.n}</div>
                        <div class="text-[9px] font-bold text-zinc-500 uppercase mt-1 tracking-widest">${i.op || 'SIM'} • ${i.t} ₽</div>
                    </div>
                    <button onclick="buy('${i.n}', '${i.t}')" class="bg-amber-500 text-black text-[10px] font-black px-6 py-3 rounded-xl uppercase active:scale-95 transition-all">Купить</button>
                </div>
            `).reverse().join('');
        }

        async function buy(num, price) {
            const msg = `🚀 *НОВАЯ ЗАЯВКА*\n\n📱 Номер: \`${num}\` \n💰 Цена: ${price} ₽`;
            
            try {
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: MY_ID, text: msg, parse_mode: 'Markdown' })
                });
                
                const t = document.getElementById('toast');
                t.classList.add('active');
                setTimeout(() => t.classList.remove('active'), 3000);
            } catch (e) {
                alert("Ошибка отправки в Telegram");
            }
        }
        init();
    </script>
</body>
</html>
