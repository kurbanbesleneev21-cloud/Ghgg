<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM ADMIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #09090b; color: #f4f4f5; font-family: 'Manrope', sans-serif; margin: 0; }
        .glass { background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-dark { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 14px; outline: none; width: 100%; color: white; }
        .btn-gold { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #000; font-weight: 800; border-radius: 12px; width: 100%; padding: 16px; text-transform: uppercase; cursor: pointer; border: none; }
    </style>
</head>
<body class="p-4">

    <div id="login-box" class="fixed inset-0 z-50 flex items-center justify-center bg-[#09090b]">
        <div class="max-w-xs w-full p-8 glass rounded-[2rem] text-center">
            <h1 class="text-xl font-black mb-6 uppercase tracking-tighter">SIM <span class="gold-text">ADMIN</span></h1>
            <input type="email" id="user-email" placeholder="Gmail" class="input-dark mb-3 text-center">
            <input type="password" id="user-pass" placeholder="Пароль" class="input-dark mb-6 text-center">
            <button onclick="tryLogin()" class="btn-gold">Войти</button>
            <p id="err" class="text-red-500 text-[10px] mt-4 font-bold hidden uppercase">Ошибка данных</p>
        </div>
    </div>

    <div id="admin-ui" class="hidden max-w-xl mx-auto space-y-6 py-6">
        <div class="flex justify-between items-center">
            <h2 class="font-black uppercase tracking-tighter">SIM <span class="gold-text">MARKET</span></h2>
            <button onclick="exit()" class="text-[9px] font-black text-red-500 uppercase bg-red-500/10 px-3 py-1 rounded-lg">Выход</button>
        </div>

        <div class="glass p-5 rounded-[1.5rem]">
            <form id="num-form" class="space-y-3">
                <input type="text" id="num-val" placeholder="Номер телефона" class="input-dark" required>
                <div class="grid grid-cols-2 gap-3">
                    <select id="op-val" class="input-dark">
                        <option value="megafon">Мегафон</option>
                        <option value="mts">МТС</option>
                        <option value="beeline">Билайн</option>
                        <option value="yota">Yota</option>
                    </select>
                    <select id="cat-val" class="input-dark">
                        <option value="standard">Обычный</option>
                        <option value="vip">VIP</option>
                    </select>
                </div>
                <input type="text" id="tar-val" placeholder="Тариф" class="input-dark">
                <input type="number" id="price-val" placeholder="Цена" class="input-dark" required>
                <button type="submit" id="sub-btn" class="btn-gold">Добавить</button>
            </form>
        </div>

        <div id="list-container" class="glass p-5 rounded-[1.5rem] space-y-3">
            <p class="text-[10px] uppercase opacity-30 font-bold tracking-widest text-center">Загрузка номеров...</p>
        </div>
    </div>

    <script>
        const LOGIN = "kurban@gmail.com";
        const PASS = "777";
        const B_ID = "69c9d640aaba882197a65742";
        const B_KEY = "$2a$10$BIVZfOXmYVaG9NpPRW61Le//5yePRuieGl/ph3o6UYlHw4uOJQKtW";

        let dataStore = { record: [] };

        // Проверка при открытии
        if(localStorage.getItem('auth_ok') === 'yes') { openAdmin(); }

        function tryLogin() {
            const m = document.getElementById('user-email').value;
            const p = document.getElementById('user-pass').value;
            if(m === LOGIN && p === PASS) {
                localStorage.setItem('auth_ok', 'yes');
                openAdmin();
            } else {
                document.getElementById('err').classList.remove('hidden');
            }
        }

        function openAdmin() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('admin-ui').classList.remove('hidden');
            sync();
        }

        function exit() {
            localStorage.removeItem('auth_ok');
            location.reload();
        }

        async function sync() {
            const r = await fetch(`https://api.jsonbin.io/v3/b/${B_ID}/latest`, { headers: {'X-Master-Key': B_KEY} });
            const d = await r.json();
            dataStore = d.record.record ? d.record : { record: d.record };
            renderList();
