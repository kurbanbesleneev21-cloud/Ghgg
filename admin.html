<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM MARKET | АДМИН-ПАНЕЛЬ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { background: #09090b; color: #f4f4f5; font-family: 'Manrope', sans-serif; }
        .glass { background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-dark { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 12px; font-size: 14px; outline: none; transition: 0.3s; }
        .input-dark:focus { border-color: #f59e0b; }
        .btn-gold { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #000; font-weight: 800; border-radius: 12px; transition: 0.3s; }
        .btn-gold:active { transform: scale(0.95); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-black uppercase tracking-tighter">ADMIN <span class="gold-text">PANEL</span></h1>
            <button onclick="location.reload()" class="bg-zinc-900 p-3 rounded-full border border-white/5">🔄 Обновить</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <section class="glass p-8 rounded-[2.5rem]">
                <h2 class="text-xl font-bold mb-6 gold-text uppercase tracking-widest">Добавить номер</h2>
                <form id="add-form" class="space-y-4">
                    <input type="text" id="n" placeholder="Номер (например, +7 999 999 99 99)" class="w-full input-dark" required>
                    <div class="grid grid-cols-2 gap-4">
                        <select id="op" class="input-dark">
                            <option value="megafon">Мегафон</option>
                            <option value="mts">МТС</option>
                            <option value="beeline">Билайн</option>
                            <option value="yota">Yota</option>
                        </select>
                        <select id="cat" class="input-dark">
                            <option value="standard">Обычный</option>
                            <option value="vip">VIP / Gold</option>
                        </select>
                    </div>
                    <input type="text" id="tarif" placeholder="Тариф (напр. Безлимит)" class="w-full input-dark">
                    <input type="number" id="t" placeholder="Цена (руб)" class="w-full input-dark" required>
                    <button type="submit" class="w-full btn-gold py-4 uppercase tracking-widest text-sm">Опубликовать номер</button>
                </form>
            </section>

            <section class="glass p-8 rounded-[2.5rem] flex flex-col h-[500px]">
                <h2 class="text-xl font-bold mb-6 gold-text uppercase tracking-widest">Поддержка (Чат)</h2>
                
                <div class="flex-1
