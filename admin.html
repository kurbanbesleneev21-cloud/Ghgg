<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM MARKET | OMNI CONTROL 50+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background: #050505; color: #fff; scroll-behavior: smooth; }
        .glass { background: rgba(15, 15, 20, 0.95); border: 1px solid rgba(191, 149, 63, 0.15); backdrop-filter: blur(25px); }
        .gold-text { background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-main { background: linear-gradient(90deg, #bf953f, #aa8332); color: #000; font-weight: 800; transition: 0.3s; }
        .btn-main:active { transform: scale(0.95); }
        .input-alt { background: #111; border: 1px solid #222; border-radius: 12px; padding: 12px; color: #fff; width: 100%; outline: none; }
        .tab-active { border-bottom: 2px solid #bf953f; color: #bf953f; font-weight: 800; }
        .badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 900; }
    </style>
</head>
<body class="p-2 md:p-6">

    <div id="auth-gate" class="fixed inset-0 z-[200] bg-black flex items-center justify-center p-6">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-sm border-amber-500/30 text-center">
            <h1 class="text-3xl font-black italic gold-text mb-8">SIM ADMIN PRO</h1>
            <input type="password" id="m-pass" placeholder="Код доступа" class="input-alt text-center mb-6">
            <button onclick="checkPass()" class="btn-main w-full py-4 rounded-2xl">ВОЙТИ</button>
        </div>
    </div>

    <div id="app" class="hidden">
        
        <header class="flex justify-between items-center mb-8 px-4">
            <div>
                <h2 class="text-2xl font-black italic">DATABASE <span class="gold-text">V2</span></h2>
                <p class="text-[9px] opacity-40 uppercase tracking-[3px]">Global Management System</p>
            </div>
            <div class="flex gap-4">
                <button onclick="location.reload()" class="opacity-30 text-xl">🔄</button>
            </div>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
            <div class="glass p-4 rounded-2xl border-l-4 border-amber-500">
                <p class="text-[9px] opacity-40 uppercase font-bold">Заявки (Лиды)</p>
                <p id="cnt-leads" class="text-2xl font-black">0</p>
            </div>
            <div class="glass p-4 rounded-2xl border-l-4 border-blue-500">
                <p class="text-[9px] opacity-40 uppercase font-bold">В наличии</p>
                <p id="cnt-stock" class="text-2xl font-black">0</p>
            </div>
            <div class="glass p-4 rounded-2xl border-l-4 border-green-500">
                <p class="text-[9px] opacity-40 uppercase font-bold">Выручка</p>
                <p id="cnt-cash" class="text-2xl font-black gold-text">0</p>
            </div>
            <div class="glass p-4 rounded-2xl border-l-4 border-purple-500">
                <p class="text-[9px] opacity-40 uppercase font-bold">Продано</p>
                <p id="cnt-sold" class="text-2xl font-black">0</p>
            </div>
        </div>

        <div class="flex gap-6 border-b border-white/5 mb-8 px-4 overflow-x-auto no-scrollbar">
            <button onclick="setView('nums')" id="t-nums" class="pb-3 text-xs font-bold uppercase tab-active">Номера</button>
            <button onclick="setView('leads')" id="t-leads" class="pb-3 text-xs font-bold uppercase opacity-40">Заявки</button>
            <button onclick="setView('tools')" id="t-tools" class="pb-3 text-xs font-bold uppercase opacity-40">Инструменты</button>
        </header>

        <div id="view-nums" class="space-y-6">
            <div class="glass p-6 rounded-3xl">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="add-n" placeholder="Номер (999-000...)" class="input-alt">
                    <select id="add-o" class="input-alt">
                        <option value="mts">МТС</option><option value="beeline">Билайн</option>
                        <option value="megafon">Мегафон</option><option value="tele2">Tele2</option>
                    </select>
                    <button onclick="pushNum()" class="btn-main rounded-xl">ДОБАВИТЬ</button>
                </div>
            </div>
            <div id="list-main" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <div id="view-leads" class="hidden space-y-4">
            <div class="flex justify-between items-center px-4">
                <h3 class="font-bold">ИСТОРИЯ ЗАЯВОК</h3>
                <button onclick="clearLeads()" class="text-[9px] text-red-500 font-bold uppercase">Очистить все</button>
            </div>
            <div id="list-leads" class="space-y-3"></div>
        </div>

        <div id="view-tools" class="hidden grid grid-cols-2 gap-3">
            <button onclick="massPrice()" class="glass p-6 rounded-2xl text-xs font-bold">Массовая цена</button>
            <button onclick="exportCSV()" class="glass p-6 rounded-2xl text-xs font-bold">Экспорт в Excel</button>
            <button onclick="changeTheme()" class="glass p-6 rounded-2xl text-xs font-bold">Смена темы</button>
            <button onclick="alert('Скоро!')" class="glass p-6 rounded-2xl text-xs font-bold opacity-30">Рассылка (SMS)</button>
            <button onclick="alert('Скоро!')" class="glass p-6 rounded-2xl text-xs font-bold opacity-30">Чат с клиентом</button>
            <button onclick="alert('Скоро!')" class="glass p-6 rounded-2xl text-xs font-bold opacity-30">Графики продаж</button>
        </div>

    </div>

    <script>
        // ИНИЦИАЛИЗАЦИЯ (Вставь свои ключи Firebase)
        const firebaseConfig = { apiKey: "...", databaseURL: "..." };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function checkPass() {
            if(document.getElementById('m-pass').value === "7777") {
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                syncAll();
            }
        }

        function setView(v) {
            ['nums', 'leads', 'tools'].forEach(i => {
                document.getElementById('view-'+i).classList.add('hidden');
                document.getElementById('t-'+i).classList.remove('tab-active', 'opacity-100');
                document.getElementById('t-'+i).classList.add('opacity-40');
            });
            document.getElementById('view-'+v).classList.remove('hidden');
            document.getElementById('t-'+v).classList.add('tab-active', 'opacity-100');
        }

        function syncAll() {
            // Синхронизация номеров
            db.ref('numbers').on('value', s => {
                const data = s.val() || {};
                const list = document.getElementById('list-main');
                list.innerHTML = "";
                let stock = 0, sold = 0, cash = 0;
                
                Object.keys(data).reverse().forEach(k => {
                    const i = data[k];
                    if(i.status === 'sold') sold++; else stock++;
                    cash += parseInt(i.price || 0);
                    
                    list.innerHTML += `
                        <div class="glass p-4 rounded-2xl flex justify-between items-center border border-white/5">
                            <div>
                                <div class="font-black italic text-lg">+7 ${i.n}</div>
                                <div class="text-[9px] font-bold opacity-30 uppercase">${i.op} | ${i.price} ₽</div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="db.ref('numbers/${k}').update({status:'sold'})" class="text-[10px] bg-white/5 p-2 rounded-lg">✅</button>
                                <button onclick="db.ref('numbers/${k}').remove()" class="text-[10px] bg-red-500/10 p-2 rounded-lg text-red-500">✕</button>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('cnt-stock').innerText = stock;
                document.getElementById('cnt-sold').innerText = sold;
                document.getElementById('cnt-cash').innerText = cash.toLocaleString() + ' ₽';
            });

            // Синхронизация заявок (СЧЕТЧИК)
            db.ref('leads').on('value', s => {
                const data = s.val() || {};
                const list = document.getElementById('list-leads');
                const count = Object.keys(data).length;
                document.getElementById('cnt-leads').innerText = count;
                
                list.innerHTML = Object.keys(data).reverse().map(k => {
                    const l = data[k];
                    return `
                        <div class="glass p-4 rounded-2xl border border-amber-500/20">
                            <div class="flex justify-between mb-2">
                                <span class="badge bg-amber-500 text-black">НОВАЯ ЗАЯВКА</span>
                                <span class="text-[8px] opacity-30">${new Date(l.ts).toLocaleString()}</span>
                            </div>
                            <div class="font-bold text-sm mb-1">${l.num}</div>
                            <div class="text-xs opacity-60">${l.name} | ${l.phone}</div>
                        </div>
                    `;
                }).join('');
            });
        }

        function pushNum() {
            const n = document.getElementById('add-n').value;
            const o = document.getElementById('add-o').value;
            if(n) db.ref('numbers').push({ n, op: o, price: 1000, status: 'active' });
        }

        // ПРИМЕР ФУНКЦИИ ИЗ "50+"
        function massPrice() {
            const p = prompt("Установить новую цену для всей базы:");
            if(p) db.ref('numbers').once('value', s => {
                const up = {}; s.forEach(c => { up[c.key+'/price'] = p; });
                db.ref('numbers').update(up);
            });
        }

        function clearLeads() { if(confirm('Удалить историю всех заявок?')) db.ref('leads').remove(); }
    </script>
</body>
</html>
